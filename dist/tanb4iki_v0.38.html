  <script>
'use strict';
// =====================================================================
//  What makes each season its own, besides the look (seasons.js): a twist in the rules and an enemy found nowhere else.
//    SPRING   SHOWERS   now and then it rains; puddles of mud form on open ground and dry up a while after
//             HOPPER    a light tank on springs: when a thin wall or water blocks it, it jumps over
//    SUMMER   WILDFIRE  explosions set trees ablaze (and the heat starts the odd fire by itself); fire spreads from
//                       tree to tree, burns them away and burns any tank inside
//             FIREBUG   its shells set fire to trees and ground where they land; it doesn't burn itself
//    AUTUMN   GUSTS     a gust of wind every so often shoves every tank one way for a few seconds
//             GUSTER    a big fan up front: blows you backwards when you're in front of it
//    WINTER   BLIZZARD  now and then a whiteout: you see only what is close (and so do they, they fire less)
//             FROST     its shells freeze you solid for a moment instead of destroying you; a second hit
//                       while frozen shatters you. They freeze water they fly over, too
//    NUCLEAR  HOT SPOTS glowing radioactive patches: stay in one and your Geiger counter fills; when it's
//                       full your tank is gone. Out of them it clicks back down
//             GHOUL     destroyed, it leaves a glowing wreck that rises again 4 s later, unless you shoot it
//    DESERT   MIRAGES   phantom tanks shimmer into view: their shells can't hurt, a shot or a touch and
//                       they're gone (no points)
//             BURROWER  dives under the sand (shells pass over it), runs, and surfaces somewhere else to fire
//  Settings -> GAME -> SEASON EFFECTS turns the twists off; the enemies each have APPEARS in ENEMY TYPES.
// =====================================================================

const SEASON_ENEMY = { spring: 18, summer: 19, autumn: 20, winter: 21, nuclear: 22, desert: 23 };
const SEASON_FX_NAME = { spring: 'SHOWERS', summer: 'WILDFIRE', autumn: 'GUSTS', winter: 'BLIZZARDS', nuclear: 'HOT SPOTS', desert: 'MIRAGES' };
const HOP_TIME = 24, FROST_TIME = 150, GHOUL_RISE = 240, GUST_RANGE = 96, RAD_MAX = 180, MIRAGE_LIFE = 900;
const SHOWER_TIME = 720, BLIZZARD_TIME = 600, GUST_TIME = 240;
// easier skills are gentler with you: how long the Geiger counter takes to fill, how long you can stand in flames
const RAD_SKILL = [2, 1.6, 1.25, 1, 0.85], BURN_GRACE = [60, 40, 25, 15, 8];
const seasonSkill = () => { const s = Config.get('skill'); return s === AUTO_SKILL ? Math.max(0, Math.min(4, Math.round(AutoSkill.rating))) : s; };

// ------------------------------------------------------------------ the six tanks
Object.assign(PALS, {
  hopper: [null, '#F8B8F8', '#58D854', '#004800'],
  firebug: [null, '#F8D878', '#E45C10', '#300800'],
  guster: [null, '#F8D8A8', '#AC7C00', '#3C1800'],
  frost: [null, '#F8F8F8', '#7CC8F8', '#00287C'],
  ghoul: [null, '#B8F818', '#4C6C3C', '#101810'],
  ghoulDead: [null, '#38581C', '#1C2C14', '#080C08'],
  burrower: [null, '#FCE0A8', '#C8903C', '#4C2C00'],
});
// HOPPER: a light frame on big coil springs
TANK_GRIDS.e18 = canvasEnemyGrids(['........', '.......1', '.......1', '111...11', '131.1122', '111.1222', '131.1232', '111.1222',
  '131.1222', '111.1232', '131.1222', '111.1122', '131..111', '111.....', '........', '........']);
// FIREBUG: a beetle shell with feelers, no tracks
TANK_GRIDS.e19 = canvasEnemyGrids(['.....1..', '......1.', '.......1', '...11111', '..122222', '.1223333', '11222322', '12222222',
  '12233222', '12222222', '11222322', '.1222222', '..122222', '...11111', '........', '........'], false);
// GUSTER: a great round fan in front of the hull
TANK_GRIDS.e20 = canvasEnemyGrids(['..111111', '.1233333', '.1232222', '.1233333', '..111111', '111..1..', '13111111', '11112222',
  '13112222', '11112332', '13112222', '11112222', '13111111', '111.....', '........', '........']);
// FROST: angular, icicles hanging off the back
TANK_GRIDS.e21 = canvasEnemyGrids(['.......3', '.......1', '.......1', '1.1....1', '131.1111', '11112222', '13112333', '11112322',
  '13112333', '11112222', '13111111', '111.1.1.', '1.1.....', '........', '........', '........']);
// GHOUL: a skull for a turret
TANK_GRIDS.e22 = canvasEnemyGrids(['.......1', '.......1', '111.1111', '13112222', '11122222', '13123322', '11122222', '13122222',
  '11112121', '13111111', '11112222', '13112222', '11111111', '111.....', '........', '........']);
// BURROWER: a drill for a nose
TANK_GRIDS.e23 = canvasEnemyGrids(['.......1', '......11', '......12', '.....122', '....1222', '111.1232', '13111222', '11112222',
  '13112332', '11112222', '13112222', '11111111', '13111111', '111.....', '........', '........']);

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ set-up
  setupSeason(opts) {
    this.fires = new Map(); this.puddles = []; this.wrecks = []; this.zones = [];
    this.wind = null; this.blizzard = 0; this.shower = 0;
    // the twist: in the normal game and the modes, not in boss fights or the editor
    this.seasonFx = Config.on('seasonFx') && !opts.boss && !opts.editor && !opts.snapshot && THEMES[this.theme] && SEASON_FX_NAME[this.theme] ? this.theme : null;
    const s = this.seasonFx;
    this.seaT = 600 + rnd(600);   // the first shower, gust, blizzard, mirage or summer fire
    if (s === 'nuclear') this.placeHotSpots();
    if (!opts.snapshot && !this.seasoned) this.seasonEnemies(this.queue);
  },

  // the season's own enemy takes some places in a line-up (from the 3rd tank on)
  seasonEnemies(queue) {
    const type = SEASON_ENEMY[this.theme];
    if (type === undefined || !queue || queue.length < 4 || Config.get('e' + type + 'On') === 'OFF') return;
    const mult = { OFF: 0, FEW: 0.5, NORMAL: 1, MANY: 1.8 }[Config.get('newEnemies')] || 0;
    const n = Math.min(8, queue.length - 2, Math.round((3 + Math.floor(this.num / 8)) * mult));
    for (let k = 0; k < n; k++) queue[2 + Math.floor((k + 0.5) * (queue.length - 2) / n)].type = type;
  },

  // one enemy arriving one at a time (corridor, maze reinforcements): sometimes the season's own
  seasonSwap(q, chance = 0.08) {
    const type = SEASON_ENEMY[this.theme];
    if (type !== undefined && Config.get('e' + type + 'On') !== 'OFF' && Config.get('newEnemies') !== 'OFF' && Math.random() < chance) q.type = type;
    return q;
  },

  placeHotSpots() {
    const n = Math.max(3, Math.min(12, Math.round(3 * FW * FH / (208 * 208))));
    const away = (x, y, list, d) => list.every(([px, py]) => Math.abs(px + 8 - x) + Math.abs(py + 8 - y) > d);
    for (let k = 0, tries = 0; k < n && tries < 400; tries++) {
      const x = 24 + rnd((FW - 48) / 8) * 8, y = 24 + rnd((FH - 48) / 8) * 8;
      if (!away(x, y, PLAYER_SPAWN.concat(this.vsSpawn || []), 64) || !away(x, y, ENEMY_SPAWNS, 40) || !away(x, y, [[BASE_X, BASE_Y]], 64)) continue;
      if (this.zones.some(z => Math.hypot(z.x - x, z.y - y) < 56)) continue;
      if (this.get(x >> 2, y >> 2) === T_STEEL || this.get(x >> 2, y >> 2) === T_WATER) continue;
      this.zones.push({ x, y, r: 18 + rnd(3) * 3 });
      k++;
    }
  },

  // ------------------------------------------------------------ every frame
  updateSeason() {
    const s = this.seasonFx;
    if (s && !this.over && !this.clearTimer && this.freezeE <= 0 && --this.seaT <= 0) this.seasonEvent(s);
    if (this.shower > 0) this.updateShower();
    for (const pd of this.puddles) if (this.frame >= pd.dry) for (const i of pd.cells) if (this.terrain[i] === T_MUD) this.set(i % GW, (i / GW) | 0, T_EMPTY);
    this.puddles = this.puddles.filter(pd => this.frame < pd.dry);
    if (this.wind && --this.wind.t <= 0) this.wind = null;
    if (this.wind) this.updateWind();
    if (this.blizzard > 0) this.blizzard--;
    if (this.fires.size && this.frame % 4 === 0) this.updateFires();
    if (this.zones.length) this.updateRadiation();
    if (this.wrecks.length) this.updateWrecks();
    for (const t of this.tanks) {
      if (!t.alive || t.isPlayer) continue;
      if (t.mirage) { this.updateMirage(t); continue; }
      const kind = kindOf(t);
      if (kind === 'burrower') this.updateBurrower(t);
      else if (kind === 'guster' && this.freezeE <= 0) this.gusterBlow(t);
    }
  },

  // the season's next event, and when the one after it comes
  seasonEvent(s) {
    if (s === 'spring') { this.shower = SHOWER_TIME; this.seaT = SHOWER_TIME + 1500 + rnd(1200); this.seasonNote('SHOWER!', '#7CB8F8'); }
    else if (s === 'summer') {
      // the heat: a tree somewhere catches fire
      const trees = [];
      for (let i = 0; i < this.terrain.length; i += 7) if (this.terrain[i] === T_FOREST) trees.push(i);
      if (trees.length) { const i = trees[rnd(trees.length)]; this.ignite(i, false); this.seasonNote('WILDFIRE!', '#F87830', (i % GW) * 4, ((i / GW) | 0) * 4); }
      this.seaT = 1500 + rnd(1200);
    } else if (s === 'autumn') {
      const dir = Math.random() < 0.65 ? (Math.random() < 0.5 ? 1 : 3) : (Math.random() < 0.5 ? 0 : 2);
      this.wind = { dir, t: GUST_TIME };
      this.seaT = GUST_TIME + 1200 + rnd(900);
      this.seasonNote('GUST ' + ['^^^', '>>>', 'VVV', '<<<'][dir], '#F8B800');
    } else if (s === 'winter') { this.blizzard = BLIZZARD_TIME; this.seaT = BLIZZARD_TIME + 1500 + rnd(1200); this.seasonNote('BLIZZARD!', '#F8F8F8'); }
    else if (s === 'desert') {
      if (this.tanks.filter(t => t.mirage).length < 2) this.spawnMirage();
      this.seaT = 900 + rnd(700);
    } else this.seaT = 1e9;
  },

  seasonNote(text, color, x, y) {
    this.popups.push({ x: x !== undefined ? x : (this.camX || 0) + VIEW_W / 2, y: y !== undefined ? y : (this.camY || 0) + 48, text, label: true, color, t: 0, delay: 0, life: 110 });
  },

  // ------------------------------------------------------------ spring: showers and puddles
  updateShower() {
    this.shower--;
    if (this.shower % 40 !== 0 || this.puddles.length >= 8) return;
    for (let k = 0; k < 20; k++) {
      const x = rnd((FW - 16) / 8 + 1) * 8, y = rnd((FH - 16) / 8 + 1) * 8, cells = [];
      if (Math.abs(x - BASE_X) < 40 && Math.abs(y - BASE_Y) < 40) continue;
      let ok = true;
      for (let cy = y >> 2; cy < (y + 16) >> 2 && ok; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
        if (this.get(cx, cy) !== T_EMPTY) { ok = false; break; }
        cells.push(cy * GW + cx);
      }
      if (!ok) continue;
      // a rounded puddle: leave the corners dry
      const keep = cells.filter((i, n) => ![0, 3, 12, 15].includes(n));
      for (const i of keep) this.set(i % GW, (i / GW) | 0, T_MUD);
      this.puddles.push({ cells: keep, dry: this.frame + this.shower + 600 + rnd(600) });
      return;
    }
  },

  // ------------------------------------------------------------ summer: fire
  // set a 4px cell burning (trees burn longer and spread; open ground only flickers a moment)
  ignite(i, ground, safe) {
    if (this.fires.has(i) || this.fires.size > 500) return;
    const v = this.terrain[i];
    // safe: started by your own napalm tower, it doesn't burn you (fortress.js)
    if (v === T_FOREST) this.fires.set(i, { life: 150, tree: true, safe });
    else if (ground && (v === T_EMPTY || v === T_ICE || v === T_MUD)) this.fires.set(i, { life: 90, tree: false, safe });
  },

  igniteAt(x, y, r, ground, safe) {
    for (let cy = Math.floor((y - r) / 4); cy <= Math.floor((y + r) / 4); cy++) {
      for (let cx = Math.floor((x - r) / 4); cx <= Math.floor((x + r) / 4); cx++) {
        if (cx < 0 || cy < 0 || cx >= GW || cy >= GH || Math.hypot(cx * 4 + 2 - x, cy * 4 + 2 - y) > r) continue;
        this.ignite(cy * GW + cx, ground, safe);
      }
    }
  },

  // an explosion: in summer the trees around it catch
  explosionHeat(x, y, r) { if (this.seasonFx === 'summer') this.igniteAt(x, y, r, false); },

  updateFires() {
    const spread = [];
    for (const [i, f] of this.fires) {
      f.life -= 4;
      if (f.tree && f.life > 30 && Math.random() < 0.25) {
        const cx = i % GW, cy = (i / GW) | 0;
        const [dx, dy] = DXY[rnd(4)], nx = cx + dx, ny = cy + dy;
        if (nx >= 0 && ny >= 0 && nx < GW && ny < GH) spread.push(ny * GW + nx);
      }
      if (f.life <= 0) {
        this.fires.delete(i);
        if (f.tree && this.terrain[i] === T_FOREST) this.set(i % GW, (i / GW) | 0, T_EMPTY);   // burnt away
      }
    }
    for (const i of spread) this.ignite(i, false);
    if (!this.fires.size) return;
    // tanks in the flames get burnt (firebugs don't; something underground or in the air is safe)
    for (const t of this.tanks.slice()) {
      if (!t.alive || t.burrow > 0 || t.hopT > 0 || t.mirage || (!t.isPlayer && kindOf(t) === 'firebug')) continue;
      let hot = false;
      for (let cy = (t.y + 2) >> 2; cy <= (t.y + 13) >> 2 && !hot; cy++) for (let cx = (t.x + 2) >> 2; cx <= (t.x + 13) >> 2; cx++) { const f = this.fires.get(cy * GW + cx); if (f && !(f.safe && t.isPlayer)) { hot = true; break; } }
      if (!hot) { t.heat = 0; continue; }
      if ((t.burnAt || 0) > this.frame) continue;
      // you get a moment to drive out (longer on easier skills); enemies burn at once
      if (t.isPlayer && (t.heat = (t.heat || 0) + 4) < BURN_GRACE[seasonSkill()]) continue;
      t.burnAt = this.frame + 45; t.heat = 0;
      if (t.isPlayer) this.hitPlayer(t); else this.hitEnemy(t, null);
    }
  },

  // ------------------------------------------------------------ autumn: wind
  // push a tank one pixel in direction d, if there's room
  shove(t, d) {
    if (!this.canStep(t, d)) return false;
    t.x += DXY[d][0]; t.y += DXY[d][1];
    return true;
  },

  updateWind() {
    const w = this.wind, k = Math.min(1, w.t / 30, (GUST_TIME - w.t) / 30);   // eases in and out
    for (const t of this.tanks) {
      if (!t.alive || t.burrow > 0 || t.hopT > 0) continue;
      t.windAcc = (t.windAcc || 0) + 0.45 * k;
      while (t.windAcc >= 1) { t.windAcc--; this.shove(t, w.dir); }
    }
  },

  gusterBlow(t) {
    t.blowing = false;
    for (const o of this.tanks) {
      if (!o.alive || !o.isPlayer) continue;
      const dx = o.x - t.x, dy = o.y - t.y;
      const ahead = [-dy, dx, dy, -dx][t.dir], side = Math.abs((t.dir & 1) ? dy : dx);
      if (ahead <= 0 || ahead > GUST_RANGE || side > 10 || !this.sightLine(t.x + 8, t.y + 8, o.x + 8, o.y + 8)) continue;
      t.blowing = true;
      o.blowAcc = (o.blowAcc || 0) + 0.9;
      while (o.blowAcc >= 1) { o.blowAcc--; this.shove(o, t.dir); }
    }
  },

  // ------------------------------------------------------------ hopper
  // blocked by a thin wall (or water): jump over it, if there's room to land
  tryHop(t) {
    if (t.hopT > 0) return false;
    const [dx, dy] = DXY[t.dir], x1 = Math.round((t.x + dx * 32) / 8) * 8, y1 = Math.round((t.y + dy * 32) / 8) * 8;
    if (x1 < 0 || y1 < 0 || x1 > FW - 16 || y1 > FH - 16) return false;
    for (let cy = y1 >> 2; cy < (y1 + 16) >> 2; cy++) for (let cx = x1 >> 2; cx < (x1 + 16) >> 2; cx++) {
      const v = this.get(cx, cy);
      if (v === T_BRICK || v === T_STEEL || v === T_WATER) return false;
    }
    if (this.tanks.some(o => o.alive && o !== t && overlap(o.x, o.y, 16, 16, x1, y1, 16, 16))) return false;
    if (!this.noBase && overlap(x1, y1, 16, 16, BASE_X, BASE_Y, 16, 16)) return false;
    t.hop = [t.x, t.y, x1, y1];
    t.hopT = HOP_TIME;
    Sound.play('skid');
    return true;
  },

  hopStep(t) {
    const [x0, y0, x1, y1] = t.hop, k = 1 - --t.hopT / HOP_TIME;
    t.x = Math.round(x0 + (x1 - x0) * k); t.y = Math.round(y0 + (y1 - y0) * k);
    if (t.hopT <= 0) { t.x = x1; t.y = y1; t.hop = null; }
  },

  // ------------------------------------------------------------ frost
  frostHit(t) {
    if (t.shield > 0) return;
    if (t.frozen > 0) { this.hitPlayer(t); return; }   // frozen solid: this one shatters you
    t.frozen = FROST_TIME;
    t.iced = FROST_TIME;
    this.popups.push({ x: t.x + 8, y: t.y - 4, text: 'FROZEN!', label: true, color: '#7CC8F8', t: 0, delay: 0, life: 70 });
    Sound.play('armor');
  },

  // a frost shell freezes the water under it; a firebug's shell sets trees on fire as it passes
  specialShell(b) {
    const x0 = Math.floor(b.x / 4), y0 = Math.floor(b.y / 4);
    for (let cy = y0; cy <= y0 + 1; cy++) for (let cx = x0; cx <= x0 + 1; cx++) {
      const v = this.get(cx, cy);
      if (b.frost && v === T_WATER) this.set(cx, cy, T_ICE);
      if (b.fire && v === T_FOREST) this.ignite(cy * GW + cx, false);
    }
  },

  // ------------------------------------------------------------ ghoul
  ghoulDown(t) {
    if (t.risen || this.over || !this.wrecks) return;
    this.wrecks.push({ x: t.x, y: t.y, dir: t.dir, t: GHOUL_RISE, vet: t.vet });
  },

  updateWrecks() {
    for (const w of this.wrecks) {
      if (this.freezeE > 0 || --w.t > 0) continue;
      if (this.tanks.some(o => o.alive && overlap(o.x, o.y, 16, 16, w.x, w.y, 16, 16))) { w.t = 10; continue; }
      const st = Config.enemy(22), vr = ENEMY_RANKS[w.vet] || { hp: 0, shell: 1, speed: 1 };
      const g = new Tank({ x: w.x, y: w.y, dir: w.dir, type: 22, hp: st.hp + vr.hp, vet: w.vet, speed: st.speed * vr.speed * Config.skill().speed,
        bulletSpeed: st.bullet * vr.shell * Config.skill().shell, maxBullets: 1, ai: AI.HUNT });
      g.risen = true;
      this.tanks.push(g);
      this.enemySpawned(g);
      this.addFx(w.x + 8, w.y + 8, [Sprites.sparkle[0], Sprites.sparkle[1], Sprites.sparkle[2]], 5);
      this.popups.push({ x: w.x + 8, y: w.y - 4, text: 'IT RISES!', label: true, color: '#B8F818', t: 0, delay: 0, life: 70 });
      Sound.play('teleport');
      w.done = true;
    }
    this.wrecks = this.wrecks.filter(w => !w.done);
  },

  // a player's shell on a ghoul's wreck puts it down for good
  bulletWreck(b) {
    const w = this.wrecks.find(q => overlap(b.x, b.y, 4, 4, q.x, q.y, 16, 16));
    if (!w) return false;
    this.killBullet(b, true);
    this.wrecks.splice(this.wrecks.indexOf(w), 1);
    this.addFx(w.x + 8, w.y + 8, BIG_EXPLOSION(), 4);
    Sound.play('explode');
    if (b.owner && b.owner.player) { this.addScore(b.owner.player, 100); this.popups.push({ x: w.x + 8, y: w.y + 8, text: '100', t: 0, delay: 0 }); }
    return true;
  },

  // ------------------------------------------------------------ burrower
  updateBurrower(t) {
    if (this.freezeE > 0) return;
    if (t.burrow > 0) {
      if (--t.burrow > 0) return;
      // back up, unless someone is standing there
      if (this.tanks.some(o => o.alive && o !== t && !(o.burrow > 0) && overlap(o.x, o.y, 16, 16, t.x, t.y, 16, 16))) { t.burrow = 10; return; }
      t.speed = t.landSpeed || t.speed;
      t.cd = 200 + rnd(120);
      t.reveal = 60;
      this.addFx(t.x + 8, t.y + 8, Sprites.smallExp, 3);
      Sound.play('burrow');
      return;
    }
    if (t.cd === undefined || t.cd > 400) t.cd = 150 + rnd(120);
    if (--t.cd <= 0) {
      t.burrow = 150 + rnd(60);
      t.landSpeed = t.speed;
      t.speed *= 1.6;
      Sound.play('burrow');
    }
  },

  // ------------------------------------------------------------ desert: mirages
  spawnMirage() {
    for (let k = 0; k < 30; k++) {
      const x = rnd((FW - 16) / 16 + 1) * 16, y = rnd((FH - 16) / 16 + 1) * 16;
      if (this.tanks.some(o => o.alive && Math.abs(o.x - x) + Math.abs(o.y - y) < (o.isPlayer ? 80 : 24))) continue;
      let bad = false;
      for (let cy = y >> 2; cy < (y + 16) >> 2 && !bad; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
        const v = this.get(cx, cy);
        if (v === T_BRICK || v === T_STEEL || v === T_WATER) { bad = true; break; }
      }
      if (bad) continue;
      const type = rnd(4), st = Config.enemy(type);
      const m = new Tank({ x, y, dir: rnd(4), type, hp: 1, speed: st.speed, bulletSpeed: st.bullet, maxBullets: 1, ai: AI.HUNT });
      m.mirage = MIRAGE_LIFE;
      this.tanks.push(m);
      return;
    }
  },

  updateMirage(t) {
    if (--t.mirage <= 0) { this.vanishMirage(t, false); return; }
    // a touch and it's gone
    if (this.tanks.some(o => o.alive && o.isPlayer && overlap(o.x - 2, o.y - 2, 20, 20, t.x, t.y, 16, 16))) this.vanishMirage(t, true);
  },

  vanishMirage(t, seen) {
    if (!t.alive) return;
    t.alive = false;
    this.addFx(t.x + 8, t.y + 8, [Sprites.sparkle[2], Sprites.sparkle[1], Sprites.sparkle[0]], 4);
    if (seen) { this.popups.push({ x: t.x + 8, y: t.y, text: 'MIRAGE', label: true, color: '#F8D878', t: 0, delay: 0, life: 60 }); Sound.play('teleport'); }
  },

  // a mirage's shell is nothing: it fades when it meets anything
  mirageShell(b) {
    const v = this.get(Math.floor((b.x + 2) / 4), Math.floor((b.y + 2) / 4));
    if (v === T_BRICK || v === T_STEEL || this.tanks.some(t => t.alive && t.isPlayer && overlap(b.x, b.y, 4, 4, t.x, t.y, 16, 16))) b.alive = false;
    if (!b.alive && !b.free) b.owner.bullets = Math.max(0, b.owner.bullets - 1);
  },

  // ------------------------------------------------------------ nuclear: hot spots
  updateRadiation() {
    for (const t of this.tanks) {
      if (!t.alive || !t.isPlayer || t.ally) continue;
      const p = t.player, inside = this.zones.some(z => Math.hypot(t.x + 8 - z.x, t.y + 8 - z.y) < z.r);
      if (inside && t.shield <= 0) {
        p.rad = (p.rad || 0) + 1;
        if (this.frame % Math.max(4, 18 - Math.floor(p.rad / RAD_SKILL[seasonSkill()] / 12)) === 0) Sound.play('tick');
        if (p.rad >= RAD_MAX * RAD_SKILL[seasonSkill()]) {
          p.rad = 0;
          this.popups.push({ x: t.x + 8, y: t.y - 4, text: 'RADIATION!', label: true, color: '#B8F818', t: 0, delay: 0, life: 80 });
          this.hitPlayer(t);
        }
      } else if (p.rad > 0) p.rad = Math.max(0, p.rad - 0.5);
    }
  },

  // ------------------------------------------------------------ drawing
  // on the ground, under the tanks: hot spots, wrecks
  renderSeasonUnder(ctx) {
    for (const z of this.zones || []) {
      const pulse = (this.frame >> 3) & 1;
      for (let dy = -z.r; dy <= z.r; dy += 2) for (let dx = -z.r; dx <= z.r; dx += 2) {
        const d = Math.hypot(dx, dy);
        if (d > z.r || ((dx + dy) >> 1) & 1) continue;
        ctx.fillStyle = d > z.r - 3 ? (pulse ? '#B8F818' : '#58A800') : d < 5 ? '#D8F878' : 'rgba(120,220,40,0.45)';
        ctx.fillRect(z.x + dx, z.y + dy, 2, 2);
      }
    }
    for (const w of this.wrecks || []) {
      ctx.drawImage(Sprites.tank('e22', 0, w.dir, 'ghoulDead'), w.x, w.y);
      if (w.t < 90 ? (this.frame >> 1) & 1 : (this.frame >> 4) & 1) ctx.drawImage(Sprites.outline(Sprites.tank('e22', 0, w.dir, 'ghoulDead'), '#B8F818'), w.x - 1, w.y - 1);
    }
  },

  // a tank as the season sees it: up in the air, under the sand, a shimmer of heat (false: draw it as usual)
  drawSeasonTank(ctx, t) {
    if (t.burrow > 0) {
      // a mound of sand moving along
      const f = this.frame;
      ctx.fillStyle = '#A07838'; ctx.fillRect(t.x + 3, t.y + 7, 10, 5);
      ctx.fillStyle = '#C8A060'; ctx.fillRect(t.x + 5, t.y + 5, 6, 3);
      ctx.fillStyle = '#E0C080';
      for (let k = 0; k < 3; k++) ctx.fillRect(t.x + 2 + ((f + k * 5) % 12), t.y + 11 + (k & 1), 1, 1);
      return true;
    }
    if (t.hopT > 0) {
      const lift = Math.round(Math.sin(Math.PI * (1 - t.hopT / HOP_TIME)) * 10);
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(t.x + 3, t.y + 10, 10, 4);
      ctx.save(); ctx.translate(0, -lift); this.drawTank(ctx, t); ctx.restore();
      return true;
    }
    if (t.mirage) {
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(this.frame / 6 + t.x);
      ctx.translate(Math.round(Math.sin(this.frame / 3 + t.y) * 1.2), 0);
      this.drawTank(ctx, t);
      ctx.restore();
      return true;
    }
    return false;
  },

  // over everything on the ground: flames, frost, the guster's wind, Geiger counters, rain and whiteout
  renderSeasonOver(ctx, camX, camY) {
    const f = this.frame, fire = ['#F8F8F8', '#F8D878', '#F87830', '#D82800'];
    for (const [i, fl] of this.fires || []) {
      const cx = i % GW, cy = (i / GW) | 0, x = cx * 4, y = cy * 4, h = cx * 7 + cy * 13;
      // a red base, an orange body, a flickering yellow-white tip
      ctx.fillStyle = '#D82800'; ctx.fillRect(x, y + 2, 4, 2);
      ctx.fillStyle = fire[2 - ((h + (f >> 2)) & 1)]; ctx.fillRect(x + ((h + (f >> 1)) & 1), y + 1, 3, 2);
      if (fl.tree && ((h + (f >> 1)) % 3)) { ctx.fillStyle = fire[(h + (f >> 2)) & 1]; ctx.fillRect(x + 1 + ((h >> 1) & 1), y - ((f + h) & 1), 1, 2); }
    }
    for (const t of this.tanks) {
      if (!t.alive) continue;
      if (t.isPlayer && t.iced > 0) { t.iced--; ctx.drawImage(Sprites.outline(Sprites.rankTank('p' + t.player.level, 0, t.dir, Config.playerPal(t.player.i), 1, 0), '#7CC8F8'), t.x - 1, t.y - 1); }
      if (t.blowing) {
        ctx.fillStyle = 'rgba(248,248,248,0.7)';
        for (let k = 0; k < 6; k++) {
          const d = (f * 3 + k * 16) % GUST_RANGE, s = ((k * 5) % 12) - 6;
          const [x, y] = [[t.x + 8 + s, t.y - d], [t.x + 16 + d, t.y + 8 + s], [t.x + 8 + s, t.y + 16 + d], [t.x - d, t.y + 8 + s]][t.dir];
          ctx.fillRect(x, y, (t.dir & 1) ? 4 : 1, (t.dir & 1) ? 1 : 4);
        }
      }
      if (t.isPlayer && t.player && t.player.rad > 0) {
        const full = RAD_MAX * RAD_SKILL[seasonSkill()], w = Math.round(14 * Math.min(1, t.player.rad / full));
        ctx.fillStyle = COL.black; ctx.fillRect(t.x, t.y - 4, 16, 3);
        ctx.fillStyle = t.player.rad > full * 0.66 ? '#F83800' : '#B8F818'; ctx.fillRect(t.x + 1, t.y - 3, w, 1);
      }
    }
    if (this.shower > 0) {
      ctx.fillStyle = 'rgba(0,0,30,0.12)'; ctx.fillRect(camX, camY, VIEW_W, VIEW_H);
      ctx.fillStyle = 'rgba(160,200,248,0.7)';
      for (let k = 0; k < 70; k++) {
        const x = camX + ((k * 47 + f * 2) % (VIEW_W + 20)) - 10, y = camY + ((k * 83 + f * 7) % (VIEW_H + 20)) - 10;
        ctx.fillRect(Math.round(x), Math.round(y), 1, 4);
      }
    }
    if (this.wind) {
      ctx.fillStyle = 'rgba(248,184,0,0.8)';
      const [dx, dy] = DXY[this.wind.dir];
      for (let k = 0; k < 24; k++) {
        const along = (k * 61 + f * 5) % (dx ? VIEW_W : VIEW_H), across = (k * 97) % (dx ? VIEW_H : VIEW_W);
        const pos = dx > 0 || dy > 0 ? along : (dx ? VIEW_W : VIEW_H) - along;
        ctx.fillRect(camX + (dx ? pos : across), camY + (dx ? across : pos), dx ? 3 : 1, dx ? 1 : 3);
      }
    }
    if (this.blizzard > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let k = 0; k < 90; k++) {
        const x = camX + ((k * 53 + f * 4) % VIEW_W), y = camY + ((k * 71 + f * 2) % VIEW_H);
        ctx.fillRect(x, y, 2, 1);
      }
    }
  },

  // the blizzard's whiteout: how thick it is now (0-1), easing in and out
  whiteout() { return this.blizzard > 0 ? Math.min(1, this.blizzard / 60, (BLIZZARD_TIME - this.blizzard) / 60) : 0; },

  // the corridor moved everything down S pixels: the season's things go with it (and the new section gets hot spots)
  seasonShift(S) {
    const rows = S / 4, fires = new Map();
    for (const [i, f] of this.fires) if (i + rows * GW < GW * GH) fires.set(i + rows * GW, f);
    this.fires = fires;
    for (const pd of this.puddles) pd.cells = pd.cells.map(i => i + rows * GW).filter(i => i < GW * GH);
    for (const z of this.zones) z.y += S;
    this.zones = this.zones.filter(z => z.y < FH);
    for (const w of this.wrecks) w.y += S;
    this.wrecks = this.wrecks.filter(w => w.y < FH);
    if (this.seasonFx === 'nuclear') {
      for (let k = 0, tries = 0; k < 3 && tries < 100; tries++) {
        const x = 24 + rnd((FW - 48) / 8) * 8, y = 16 + rnd((S - 32) / 8) * 8;
        if (this.zones.some(z => Math.hypot(z.x - x, z.y - y) < 56) || this.get(x >> 2, y >> 2) === T_STEEL || this.get(x >> 2, y >> 2) === T_WATER) continue;
        this.zones.push({ x, y, r: 18 + rnd(3) * 3 });
        k++;
      }
    }
  },

  // anything still to come before the stage can be clear (a ghoul's wreck)
  seasonPending() { return (this.wrecks || []).length > 0; },
});

  <script>
'use strict';
// =====================================================================
//  Secrets, the way an old platformer hides them
//    HIDDEN POWER-UPS  a few brick blocks on a stage hide a power-up: break most of the block and it pops out.
//                      Watch for the odd glint on a wall.
//    ? BLOCKS          a golden question block takes the place of a brick block now and then. It's solid; shoot it:
//                      COIN      every hit pops a coin (200 points), up to 8, then it's an empty block
//                      MUSHROOM  one hit and a mushroom grows out, walks to your eagle and stands guard there until
//                                the end of the stage, bouncing every shell aimed at the eagle
//  In the modes where they make sense: the classic game, any side, big maps, survival, time attack, maze, kill race,
//  custom levels and VS CPU (no mushrooms where there's no eagle). Not in versus, fortress or boss stages.
//  Settings -> GAME -> SECRETS.
// =====================================================================

const QB_COINS = 8, QB_COIN_PTS = 200, MUSH_SPEED = 0.5;
// the ? block (16 x 16): gold with a darker rim and the question mark; the used block is plain brown
const QBLOCK_ROWS = ['DDDDDDDDDDDDDDDD', 'DGGGGGGGGGGGGGGD', 'DGRGGGGGGGGGGRGD', 'DGGGGWWWWWGGGGGD', 'DGGGWWDDDWWGGGGD', 'DGGGWWDGGWWDGGGD',
  'DGGGGDDGGWWDGGGD', 'DGGGGGGGWWDDGGGD', 'DGGGGGGWWDDGGGGD', 'DGGGGGGWWDGGGGGD', 'DGGGGGGGDDGGGGGD', 'DGGGGGGWWGGGGGGD',
  'DGGGGGGWWDGGGGGD', 'DGRGGGGGDDGGGGRD', 'DGGGGGGGGGGGGGGD', 'DDDDDDDDDDDDDDDD'];
const MUSHROOM_ROWS = ['.....RRRRRR.....', '...RRWWRRRRRR...', '..RWWWWRRRWWRR..', '.RWWWWRRRRWWWRR.', '.RRWWRRRRRRWWRR.', 'RRRRRRRWWRRRRRRR',
  'RRWWRRWWWWRRRWWR', 'RWWWWRRWWRRRWWWR', 'RWWWWRRRRRRRWWWR', '.RRRDDDDDDDDRRR.', '...DWWWWWWWWD...', '...DWWDWWDWWD...',
  '...DWWDWWDWWD...', '...DWWWWWWWWD...', '....DWWWWWWD....', '.....DDDDDD.....'];
const COIN_ROWS = ['..DDDD..', '.DYYYYD.', 'DYYWYYYD', 'DYWYYYYD', 'DYWYYYYD', 'DYYYYYYD', '.DYYYYD.', '..DDDD..'];

let secretSprites = null;
function secretSprite(name) {
  if (!secretSprites) {
    const pal = { D: '#7C3C00', G: '#F8B800', R: '#7C3C00', W: '#F8F8F8', Y: '#F8D040' };
    secretSprites = {
      qblock: [0, 1].map(f => paintRows(QBLOCK_ROWS, Object.assign({}, pal, { W: f ? '#F8D878' : '#F8F8F8' }))),
      // the used block: plain brown with its four rivets
      used: paintRows(QBLOCK_ROWS.map((r, j) => r.split('').map((c, i) => (i === 0 || j === 0 || i === 15 || j === 15 ? 'D' : (i === 2 || i === 13) && (j === 2 || j === 13) ? 'D' : 'G')).join('')), { D: '#3C1C00', G: '#9C5C1C' }),
      mushroom: paintRows(MUSHROOM_ROWS, { R: '#D82800', W: '#F8F8F8', D: '#3C1C00' }),
      coin: [0, 1, 2, 3].map(f => {
        // a spinning coin: full, narrower, edge-on, narrower
        const w = [8, 6, 2, 6][f], c = makeCanvas(8, 8), x = c.getContext('2d');
        x.drawImage(paintRows(COIN_ROWS, { D: '#A86C00', Y: '#F8D040', W: '#F8F8F8' }), 0, 0, 8, 8, (8 - w) / 2, 0, w, 8);
        return c;
      }),
    };
  }
  return secretSprites[name];
}

Object.assign(Stage.prototype, {
  setupSecrets(opts) {
    this.secrets = []; this.qblocks = []; this.coinPops = []; this.mushroom = null;
    const m = Game.mode, allowed = ['classic', 'sides', 'bigmaps', 'survival', 'timeattack', 'maze', 'race', 'custom', 'cpu'];
    if (Net.role === 'client' || !Config.on('secrets') || opts.boss || opts.editor || opts.snapshot || opts.vs || opts.fortress || opts.corridor || !allowed.includes(m)) return;
    // brick blocks (16px, all brick) away from the eagle and the entry points
    const near = (x, y, list, d) => list.some(([px, py]) => Math.abs(px - x) < d && Math.abs(py - y) < d);
    const cands = [];
    for (let y = 0; y <= FH - 16; y += 16) for (let x = 0; x <= FW - 16; x += 16) {
      let brick = true;
      for (let cy = y >> 2; cy < (y + 16) >> 2 && brick; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) if (this.get(cx, cy) !== T_BRICK) { brick = false; break; }
      if (!brick || near(x, y, [[BASE_X, BASE_Y]], 40) || near(x, y, PLAYER_SPAWN.concat(ENEMY_SPAWNS, this.vsSpawn || []), 24)) continue;
      cands.push([x, y]);
    }
    for (let i = cands.length - 1; i > 0; i--) { const j = rnd(i + 1); [cands[i], cands[j]] = [cands[j], cands[i]]; }
    const area = Math.max(1, FW * FH / (208 * 208));
    const hidden = Math.min(cands.length, Math.round((1 + rnd(3)) * Math.sqrt(area)));
    for (let k = 0; k < hidden; k++) { const [x, y] = cands.shift(); this.secrets.push({ x, y, found: false, glint: rnd(300) }); }
    // question blocks: none, one or two (more on big maps)
    const r = Math.random(), nq = Math.min(cands.length, Math.round((r < 0.62 ? 0 : r < 0.92 ? 1 : 2) * Math.sqrt(area)));
    let mush = 0;
    for (let k = 0; k < nq; k++) {
      const [x, y] = cands.shift();
      for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) this.set(cx, cy, T_EMPTY);
      const kind = !this.noBase && !mush && Math.random() < 0.3 ? 'mushroom' : 'coin';
      if (kind === 'mushroom') mush++;
      this.qblocks.push({ x, y, kind, left: kind === 'coin' ? QB_COINS : 1, bump: 0 });
    }
    if (this.qblocks.length) { this.origTerrain = this.terrain.slice(); this.navCost = {}; this.navBaseF = {}; }
  },

  updateSecrets() {
    // a hidden power-up comes out once most of its block is gone
    for (const s of this.secrets) {
      if (s.found || this.frame % 6) continue;
      let left = 0;
      for (let cy = s.y >> 2; cy < (s.y + 16) >> 2; cy++) for (let cx = s.x >> 2; cx < (s.x + 16) >> 2; cx++) if (this.get(cx, cy) === T_BRICK) left++;
      if (left > 6) continue;
      s.found = true;
      this.spawnPowerup();
      if (this.powerup) { this.powerup.x = s.x; this.powerup.y = s.y; }
      this.popups.push({ x: s.x + 8, y: s.y - 2, text: 'SECRET!', label: true, color: COL.gold, t: 0, delay: 0, life: 70 });
      Sound.play('secret');
    }
    for (const q of this.qblocks) if (q.bump > 0) q.bump--;
    for (const c of this.coinPops) c.t++;
    this.coinPops = this.coinPops.filter(c => c.t < 30);
    if (this.mushroom) this.updateMushroom();
  },

  // a shell meets a ? block (true: it stopped there)
  bulletQBlock(b) {
    const q = this.qblocks.find(o => overlap(b.x, b.y, 4, 4, o.x, o.y, 16, 16));
    if (!q) return false;
    this.killBullet(b, false);
    if (!b.isPlayer || q.left <= 0) { Sound.play('steel'); return true; }
    q.bump = 8;
    q.left--;
    Sound.play('bump');
    if (q.kind === 'coin') {
      this.coinPops.push({ x: q.x + 4, y: q.y - 8, t: 0 });
      const p = b.owner && b.owner.player;
      if (p) { this.addScore(p, QB_COIN_PTS); this.popups.push({ x: q.x + 8, y: q.y - 6, text: String(QB_COIN_PTS), t: 0, delay: 12 }); }
      Sound.play('coin');
    } else {
      this.mushroom = { x: q.x, y: q.y, rise: 16, state: 'rise', dir: 0, hop: 0, bounce: 0 };
      Sound.play('mushroom');
    }
    return true;
  },

  qblockAt(x, y, w, h) { return this.qblocks.length && this.qblocks.some(q => overlap(x, y, w, h, q.x, q.y, 16, 16)); },

  // the mushroom: grows out of its block, walks the route to the eagle, then stands guard beside it
  updateMushroom() {
    const m = this.mushroom;
    if (m.bounce > 0) m.bounce--;
    if (m.state === 'rise') {
      if (--m.rise <= 0) { m.state = 'walk'; m.y -= 16; this.popups.push({ x: m.x + 8, y: m.y - 4, text: 'TO THE EAGLE!', label: true, color: '#F83800', t: 0, delay: 0, life: 70 }); }
      return;
    }
    if (m.state !== 'walk' || !this.baseAlive) return;
    const ex = BASE_X, ey = BASE_Y;
    if (Math.abs(m.x - ex) + Math.abs(m.y - ey) <= 20) {
      // in place beside the eagle (on whichever side is clear)
      m.state = 'guard';
      this.popups.push({ x: ex + 8, y: ey - 12, text: 'EAGLE GUARDED', label: true, color: COL.gold, t: 0, delay: 0, life: 90 });
      Sound.play('pickup');
      return;
    }
    // follow the route field downhill, a node at a time
    if (!m.to || (Math.abs(m.x - m.to[0]) < MUSH_SPEED && Math.abs(m.y - m.to[1]) < MUSH_SPEED)) {
      if (m.to) { m.x = m.to[0]; m.y = m.to[1]; }
      const dist = this.navBase(''), NX = COLS * 2 - 1, NY = ROWS * 2 - 1;
      const bx = Math.max(0, Math.min(NX - 1, Math.round(m.x / 8))), by = Math.max(0, Math.min(NY - 1, Math.round(m.y / 8)));
      let best = null, bv = dist[by * NX + bx];
      for (let d = 0; d < 4; d++) {
        const nx = bx + DXY[d][0], ny = by + DXY[d][1];
        if (nx < 0 || ny < 0 || nx >= NX || ny >= NY) continue;
        const v = dist[ny * NX + nx];
        if (v < bv) { bv = v; best = [nx * 8, ny * 8, d]; }
      }
      // no way along the field (walled off): just head for the eagle
      if (!best) { const dx = ex - m.x, dy = ey - m.y; best = Math.abs(dx) > Math.abs(dy) ? [m.x + Math.sign(dx) * 8, m.y, dx > 0 ? 1 : 3] : [m.x, m.y + Math.sign(dy) * 8, dy > 0 ? 2 : 0]; }
      m.to = best; m.dir = best[2];
    }
    m.x += Math.sign(m.to[0] - m.x) * Math.min(MUSH_SPEED, Math.abs(m.to[0] - m.x));
    m.y += Math.sign(m.to[1] - m.y) * Math.min(MUSH_SPEED, Math.abs(m.to[1] - m.y));
    m.hop = (m.hop + 1) % 16;
  },

  // the mushroom on guard catches a hit on the eagle (true: caught)
  mushroomGuards() {
    const m = this.mushroom;
    if (!m || m.state !== 'guard') return false;
    m.bounce = 12;
    Sound.play('boing');
    return true;
  },

  // ------------------------------------------------------------ drawing
  renderSecrets(ctx) {
    const f = this.frame;
    // a glint now and then on a wall hiding something
    for (const s of this.secrets || []) {
      if (s.found || (f + s.glint) % 300 > 10) continue;
      const k = (f + s.glint) % 300;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(s.x + 4 + k, s.y + 4, 1, 1);
      if (k > 3 && k < 8) ctx.fillRect(s.x + 3 + k, s.y + 5, 3, 1);
    }
    for (const q of this.qblocks || []) {
      const lift = q.bump > 0 ? Math.round(Math.sin(Math.PI * q.bump / 8) * 4) : 0;
      ctx.drawImage(q.left > 0 ? secretSprite('qblock')[(f >> 4) % 3 === 2 ? 1 : 0] : secretSprite('used'), q.x, q.y - lift);
    }
    const m = this.mushroom;
    if (m) {
      if (m.state === 'rise') {
        // growing up out of the top of its block
        const h = 16 - m.rise;
        ctx.drawImage(secretSprite('mushroom'), 0, 0, 16, h, m.x, m.y - h, 16, h);
      } else {
        const squash = m.bounce > 0 ? Math.round(Math.sin(Math.PI * m.bounce / 12) * 3) : 0, hop = m.state === 'walk' && m.hop < 8 ? 1 : 0;
        ctx.drawImage(secretSprite('mushroom'), m.x - squash, m.y + squash - hop, 16 + squash * 2, 16 - squash);
        if (m.state === 'guard' && (f >> 4) & 1) { ctx.fillStyle = COL.gold; ctx.fillRect(m.x + 7, m.y - 4, 2, 2); }
      }
    }
    for (const c of this.coinPops || []) {
      const y = c.y - Math.sin(Math.PI * c.t / 30) * 20;
      ctx.drawImage(secretSprite('coin')[(c.t >> 2) % 4], c.x, Math.round(y));
    }
  },
});

  <script>
'use strict';
// =====================================================================
//  Player weapons. Every tank starts with the CANNON (the classic shell, made better by stars). Six more, each with
//  four levels (MK I - IV), come from WEAPON crates (the letter on the crate says which) or from the shop:
//    M  MACHINE GUN   hold fire: a stream of light bullets (half a hit each at first); MK III a twin stream
//    L  LASER         an instant beam that goes through every tank in line and burns shells in its way; cuts brick
//                     from MK II, wide and endless at MK IV
//    F  FLAMETHROWER  hold fire: a short cone of fire that burns tanks, trees and shells
//    G  MORTAR        lobs a shell over walls onto the first tank ahead (or as far as it reaches); a blast that
//                     breaks brick, and steel at MK IV
//    T  TESLA         lightning to the nearest enemy in reach (no need to aim, walls don't stop it), jumping on
//                     to more of them at higher levels
//    H  MISSILES      homing missiles that fly over walls and pick their own targets; 2 at MK III, 3 at MK IV
//  A crate with the weapon you have raises its level; another weapon swaps to it (each one remembers its level).
//  Losing a tank costs a level of the weapon in hand (at MK I, back to the cannon) unless KEEP STARS ON DEATH is on.
//  Balance: measured with a bot that holds fire through whole stages, each MK I does about as well as the bare cannon
//  (a sidegrade with its own trick) and each MK IV about as well as a 3-star cannon, so the difficulty curve holds.
// =====================================================================

const WEAPON_MAX = 4, MK = ['I', 'II', 'III', 'IV'];
const WEAPONS = {
  cannon: { name: 'CANNON', letter: 'C', color: '#ADADAD' },
  mg: { name: 'MACHINE GUN', letter: 'M', color: '#F8B800', desc: 'HOLD FIRE: A STREAM OF BULLETS',
    lv: [{ cd: 8, dmg: 0.5, max: 4 }, { cd: 6, dmg: 0.5, max: 5 }, { cd: 7, dmg: 0.4, max: 6, twin: true }, { cd: 6, dmg: 0.45, max: 8, twin: true }] },
  laser: { name: 'LASER', letter: 'L', color: '#F83800', desc: 'A BEAM THROUGH TANKS IN LINE',
    lv: [{ cd: 30, dmg: 1, len: 96 }, { cd: 28, dmg: 1, len: 128, cut: true }, { cd: 30, dmg: 1.5, len: 160, cut: true }, { cd: 22, dmg: 2, len: 999, cut: true, wide: true }] },
  flame: { name: 'FLAMETHROWER', letter: 'F', color: '#F87830', desc: 'HOLD FIRE: A BURNING CONE',
    lv: [{ len: 24, dmg: 0.25 }, { len: 30, dmg: 0.3 }, { len: 36, dmg: 0.38 }, { len: 44, dmg: 0.48 }] },
  mortar: { name: 'MORTAR', letter: 'G', color: '#BCBCBC', desc: 'SHELLS OVER WALLS, A BLAST',
    lv: [{ cd: 40, dist: 72, r: 12, dmg: 2 }, { cd: 36, dist: 88, r: 14, dmg: 2 }, { cd: 34, dist: 104, r: 16, dmg: 3 }, { cd: 32, dist: 120, r: 18, dmg: 3, steel: true }] },
  tesla: { name: 'TESLA', letter: 'T', color: '#7CB8F8', desc: 'LIGHTNING FINDS THE NEAREST',
    lv: [{ cd: 45, range: 60, chain: 0, dmg: 1 }, { cd: 44, range: 68, chain: 1, dmg: 1 }, { cd: 44, range: 76, chain: 2, dmg: 1.5 }, { cd: 50, range: 84, chain: 3, dmg: 2 }] },
  missile: { name: 'MISSILES', letter: 'H', color: '#58D854', desc: 'HOMING, OVER WALLS',
    lv: [{ cd: 60, n: 1, dmg: 1 }, { cd: 64, n: 1, dmg: 2 }, { cd: 72, n: 2, dmg: 1 }, { cd: 90, n: 3, dmg: 1 }] },
};
const WEAPON_KEYS = ['mg', 'laser', 'flame', 'mortar', 'tesla', 'missile'];
// shop prices for MK I - IV
const WEAPON_PRICES = { mg: [2000, 1500, 2500, 3500], laser: [3000, 2000, 3000, 4500], flame: [2000, 1500, 2500, 3500],
  mortar: [2500, 2000, 3000, 4000], tesla: [3000, 2000, 3000, 4500], missile: [3500, 2500, 3500, 5000] };

const randomWeapon = () => WEAPON_KEYS[rnd(WEAPON_KEYS.length)];
const weaponLevel = (p, key = p && p.weapon) => (!p || !key || key === 'cannon' ? 0 : Math.max(1, (p.wlv || {})[key] || 1));

// a power-up icon; a weapon crate shows its weapon's letter (key: the weapon, '?' when not known yet)
function drawPowerup(ctx, pu, x, y) {
  ctx.drawImage(Sprites.powerups[pu.type], x, y);
  if (pu.type !== PU.WEAPON) return;
  const W = WEAPONS[pu.weapon];
  ctx.fillStyle = COL.black; ctx.fillRect(x + 3, y + 4, 10, 9);
  Font.draw(ctx, W ? W.letter : '?', x + 5, y + 5, W ? W.color : COL.white);
}

Object.assign(Stage.prototype, {
  // a crate (or the shop): this weapon, or its next level if you have it in hand
  giveWeapon(p, key, show = true) {
    p.wlv = p.wlv || {};
    if (p.weapon === key) p.wlv[key] = Math.min(WEAPON_MAX, (p.wlv[key] || 1) + 1);
    else { p.weapon = key; p.wlv[key] = Math.max(1, p.wlv[key] || 1); }
    const t = p.tank || this.tanks.find(o => o.isPlayer && o.player === p && o.alive);
    if (show && t) this.popups.push({ x: t.x + 8, y: t.y - 4, text: WEAPONS[key].name + ' MK ' + MK[p.wlv[key] - 1], label: true, color: WEAPONS[key].color, t: 0, delay: 0, life: 90 });
  },

  // which weapon a crate holds: half the time one a player has in hand (so it can level up), else any
  crateWeapon() {
    const held = this.players.filter(p => !p.out && p.weapon && p.weapon !== 'cannon' && weaponLevel(p) < WEAPON_MAX).map(p => p.weapon);
    return held.length && Math.random() < 0.5 ? held[rnd(held.length)] : randomWeapon();
  },

  // a lost tank costs a level of the weapon in hand
  weaponOnDeath(p) {
    if (!p.weapon || p.weapon === 'cannon' || Config.on('keepStars')) return;
    const lv = weaponLevel(p) - 1;
    if (lv <= 0) { p.wlv[p.weapon] = 1; p.weapon = 'cannon'; } else p.wlv[p.weapon] = lv;
  },

  // who a player's weapon can hurt: enemy tanks, and in versus the other players
  weaponFoes(att) {
    return this.tanks.filter(o => o.alive && o !== att && !(o.burrow > 0) && !(o.hopT > 0)
      && (!o.isPlayer || (this.vs && !o.ally && o.player !== att.player)));
  },

  // damage from a weapon (fractions add up; a shield plate takes most of a hit from the front)
  weaponHit(att, foe, dmg, o = {}) {
    if (!foe.alive) return;
    if (foe.isPlayer) {
      foe.pAcc = (foe.pAcc || 0) + dmg;
      if (foe.pAcc >= 1) { foe.pAcc = 0; this.hitPlayer(foe, att); }
      return;
    }
    if (foe.mirage) { this.vanishMirage(foe, true); return; }
    if (foe.frontShield && !o.pierce && o.dir !== undefined && foe.dir === (o.dir + 2) % 4) dmg *= 0.25;
    foe.wAcc = (foe.wAcc || 0) + dmg;
    let n = Math.floor(foe.wAcc);
    foe.wAcc -= n;
    foe.reveal = 90;
    while (n-- > 0 && foe.alive) this.hitEnemy(foe, att, o.blast);
  },

  // enemy shells caught in a beam or a cone of fire are gone
  weaponStopsShells(att, x, y, w, h) {
    for (const b of this.bullets) {
      if (!b.alive || b.owner === att || (b.isPlayer && !(this.vs && b.owner && b.owner.player !== att.player))) continue;
      if (overlap(x, y, w, h, b.x, b.y, 4, 4)) this.killBullet(b, true);
    }
  },

  // bosses caught in a rectangle take damage too (fractions add up per boss)
  weaponBosses(att, x, y, w, h, dmg, only) {
    for (const bo of this.bosses) {
      if ((only && bo !== only) || !this.bossTangible(bo) || !overlap(x, y, w, h, bo.x, bo.y, bo.w, bo.h)) continue;
      bo.wAcc = (bo.wAcc || 0) + dmg;
      const n = Math.floor(bo.wAcc);
      if (n > 0) { bo.wAcc -= n; this.bossHit(bo, n, att, x + w / 2); }
    }
  },

  // ------------------------------------------------------------ firing (instead of the cannon)
  fireWeapon(t, p, pressed, held) {
    const key = p.weapon, s = WEAPONS[key].lv[weaponLevel(p) - 1];
    if (t.wcool > 0) t.wcool--;
    if (key === 'flame') { if (held) this.flameOn(t, s); return; }
    if (!(pressed || held) || t.wcool > 0) return;
    if (key === 'mg') this.mgFire(t, s);
    else if (key === 'laser') this.laserFire(t, s, weaponLevel(p));
    else if (key === 'mortar') this.mortarFire(t, s);
    else if (key === 'tesla') this.teslaFire(t, s);
    else if (key === 'missile') this.missileFire(t, s);
    t.reveal = 60;
  },

  mgFire(t, s) {
    if (t.bullets >= s.max) return;
    const [ox, oy] = [[6, 0], [12, 6], [6, 12], [0, 6]][t.dir], side = (t.dir & 1) ? [0, 1] : [1, 0];
    const shot = (dx, dy, free) => this.bullets.push({ x: t.x + ox + dx, y: t.y + oy + dy, dir: t.dir, speed: 5 * Config.scale('pShell'), owner: t, free,
      isPlayer: true, power: false, cutter: false, alive: true, pierce: false, rocket: false, dmg: s.dmg, light: true });
    if (s.twin) { shot(-side[0] * 3, -side[1] * 3, false); shot(side[0] * 3, side[1] * 3, true); } else shot(0, 0, false);
    t.bullets++;
    t.wcool = s.cd;
    if ((this.frame >> 1) & 1) Sound.play('shot');
  },

  laserFire(t, s, lv) {
    const [dx, dy] = DXY[t.dir], w = s.wide ? 8 : 4, cx = t.x + 8, cy = t.y + 8;
    let x = cx + dx * 8, y = cy + dy * 8, dist = 0;
    // run along until steel, the eagle, a block or the edge; brick is cut (MK II+) or stops it
    while (dist < s.len) {
      const nx = x + dx * 4, ny = y + dy * 4;
      if (nx < 0 || ny < 0 || nx > FW || ny > FH) break;
      let stop = false;
      for (let k = -w / 2; k < w / 2 && !stop; k += 4) {
        const qx = Math.floor((nx + (dy ? k : 0)) / 4), qy = Math.floor((ny + (dx ? k : 0)) / 4), v = this.get(qx, qy);
        if (v === T_STEEL) stop = true;
        else if (v === T_BRICK) { if (s.cut) this.set(qx, qy, T_EMPTY); else stop = true; }
      }
      if (!stop && !this.noBase && overlap(nx - 2, ny - 2, 4, 4, BASE_X, BASE_Y, 16, 16)) stop = true;
      if (!stop && this.qblocks && this.qblocks.length && this.qblockAt(nx - 2, ny - 2, 4, 4)) { this.bulletQBlock({ x: nx - 2, y: ny - 2, isPlayer: true, owner: t, alive: true, free: true }); stop = true; }
      if (stop) break;
      x = nx; y = ny; dist += 4;
    }
    // the beam's box: every tank in it is hit once
    const bx = Math.min(cx + dx * 8, x) - (dy ? w / 2 : 0), by = Math.min(cy + dy * 8, y) - (dx ? w / 2 : 0);
    const bw = dy ? w : Math.max(4, Math.abs(x - cx - dx * 8)), bh = dx ? w : Math.max(4, Math.abs(y - cy - dy * 8));
    for (const foe of this.weaponFoes(t)) if (overlap(bx, by, bw, bh, foe.x, foe.y, 16, 16)) this.weaponHit(t, foe, s.dmg, { pierce: lv >= 3, dir: t.dir });
    this.weaponBosses(t, bx, by, bw, bh, s.dmg);
    this.weaponStopsShells(t, bx, by, bw, bh);
    if (this.cpu && this.cpu.alive && overlap(bx, by, bw, bh, this.cpu.x, this.cpu.y, 16, 16)) this.cpuHit(t);
    for (const f of this.factories || []) if (f.hp > 0 && overlap(bx, by, bw, bh, f.x, f.y, 32, 32)) this.hitFactory(f, 1, t);
    this.wfx.push({ kind: 'beam', pts: [[cx + dx * 8, cy + dy * 8], [x, y]], t: 10, color: WEAPONS.laser.color, w, box: [bx, by, bw, bh], owner: t });
    t.wcool = s.cd;
    Sound.play('laser');
  },

  flameOn(t, s) {
    const len = s.len, w = 14;
    const [x, y, fw, fh] = [[t.x + 1, t.y - len, w, len], [t.x + 16, t.y + 1, len, w], [t.x + 1, t.y + 16, w, len], [t.x - len, t.y + 1, len, w]][t.dir];
    t.flame = { x, y, w: fw, h: fh, t: 3 };
    this.weaponStopsShells(t, x, y, fw, fh);
    if (this.frame % 6) return;
    for (const foe of this.weaponFoes(t)) if (overlap(x, y, fw, fh, foe.x, foe.y, 16, 16)) this.weaponHit(t, foe, s.dmg, { dir: t.dir });
    this.weaponBosses(t, x, y, fw, fh, s.dmg);
    // it burns trees away (and sets them alight in summer)
    for (let cy = Math.max(0, y >> 2); cy <= (y + fh - 1) >> 2; cy++) for (let cx = Math.max(0, x >> 2); cx <= (x + fw - 1) >> 2; cx++) {
      if (this.get(cx, cy) !== T_FOREST) continue;
      if (this.seasonFx === 'summer' && this.fires) this.ignite(cy * GW + cx, false, true); else this.set(cx, cy, T_EMPTY);
    }
    if (this.frame % 24 === 0) Sound.play('flame');
  },

  mortarFire(t, s) {
    if ((this.wshots || []).filter(m => m.owner === t && m.kind === 'mortar').length >= 2) return;
    const [dx, dy] = DXY[t.dir], cx = t.x + 8, cy = t.y + 8;
    // the first tank lined up ahead within reach, or as far as it goes
    let d = s.dist;
    for (const foe of this.weaponFoes(t)) {
      const fx = foe.x + 8 - cx, fy = foe.y + 8 - cy, ahead = fx * dx + fy * dy, side = Math.abs(dx ? fy : fx);
      if (ahead > 12 && ahead < d && side < 10) d = ahead;
    }
    const tx = Math.max(4, Math.min(FW - 4, cx + dx * d)), ty = Math.max(4, Math.min(FH - 4, cy + dy * d));
    this.wshots.push({ kind: 'mortar', owner: t, x0: cx, y0: cy, x: cx, y: cy, tx, ty, p: 0, dp: 1 / Math.round(12 + Math.hypot(tx - cx, ty - cy) / 5), s });
    t.wcool = s.cd;
    Sound.play('mortar');
  },

  teslaFire(t, s) {
    const cx = t.x + 8, cy = t.y + 8, foes = this.weaponFoes(t);
    let first = null, bd = s.range;
    for (const foe of foes) { const d = Math.hypot(foe.x + 8 - cx, foe.y + 8 - cy); if (d < bd) { bd = d; first = foe; } }
    if (!first) {
      const bo = this.bosses.find(b => this.bossTangible(b) && Math.hypot(b.x + b.w / 2 - cx, b.y + b.h / 2 - cy) < s.range + b.w / 2);
      if (bo) { this.weaponBosses(t, bo.x, bo.y, bo.w, bo.h, s.dmg); this.wfx.push({ kind: 'beam', pts: [[cx, cy], [bo.x + bo.w / 2, bo.y + bo.h / 2]], t: 10, color: WEAPONS.tesla.color, w: 1, zig: true }); t.wcool = s.cd; Sound.play('zap'); }
      else t.wcool = 10;
      return;
    }
    const hit = [first], pts = [[cx, cy], [first.x + 8, first.y + 8]];
    while (hit.length <= s.chain) {
      const last = hit[hit.length - 1];
      let next = null, nd = 44;
      for (const foe of foes) { if (hit.includes(foe)) continue; const d = Math.hypot(foe.x - last.x, foe.y - last.y); if (d < nd) { nd = d; next = foe; } }
      if (!next) break;
      hit.push(next); pts.push([next.x + 8, next.y + 8]);
    }
    for (const foe of hit) this.weaponHit(t, foe, s.dmg, { pierce: true });
    this.wfx.push({ kind: 'beam', pts, t: 10, color: WEAPONS.tesla.color, w: 1, zig: true });
    t.wcool = s.cd;
    Sound.play('zap');
  },

  missileFire(t, s) {
    const [dx, dy] = DXY[t.dir], cx = t.x + 8, cy = t.y + 8;
    // targets: the nearest tanks, those ahead first
    const foes = this.weaponFoes(t).map(f => { const fx = f.x + 8 - cx, fy = f.y + 8 - cy; return [f, Math.hypot(fx, fy) - (fx * dx + fy * dy > 0 ? 60 : 0)]; })
      .filter(q => q[1] < 160).sort((a, b) => a[1] - b[1]).map(q => q[0]);
    for (let k = 0; k < s.n; k++) {
      const a = Math.atan2(dy, dx) + (k - (s.n - 1) / 2) * 0.5;
      this.wshots.push({ kind: 'missile', owner: t, x: cx + dx * 8, y: cy + dy * 8, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2, target: foes.length ? foes[k % foes.length] : null, life: 150, s });
    }
    t.wcool = s.cd;
    Sound.play('mortar');
  },

  // ------------------------------------------------------------ every frame: shells in flight, effects
  updateWeapons() {
    for (const f of this.wfx) { f.t--; if (f.box) this.weaponStopsShells(f.owner, ...f.box); }   // a beam burns shells while it shows
    this.wfx = this.wfx.filter(f => f.t > 0);
    for (const t of this.tanks) if (t.flame && --t.flame.t <= 0) t.flame = null;
    for (const m of this.wshots) {
      const att = m.owner;
      if (m.kind === 'mortar') {
        m.p += m.dp;
        m.x = m.x0 + (m.tx - m.x0) * m.p; m.y = m.y0 + (m.ty - m.y0) * m.p;
        if (m.p < 1) continue;
        m.done = true;
        this.blast(m.tx, m.ty, m.s.r, true, att, !!m.s.steel);
        for (const foe of this.weaponFoes(att)) if (Math.hypot(foe.x + 8 - m.tx, foe.y + 8 - m.ty) < m.s.r + 6) this.weaponHit(att, foe, m.s.dmg - 1, { blast: true });
        continue;
      }
      // a missile: turns towards its target (a new one if it's gone), speeds up, flies over walls
      if (!m.target || !m.target.alive) {
        let best = null, bd = 140;
        for (const foe of this.weaponFoes(att)) { const d = Math.hypot(foe.x + 8 - m.x, foe.y + 8 - m.y); if (d < bd) { bd = d; best = foe; } }
        m.target = best;
      }
      const sp = Math.min(3.2, Math.hypot(m.vx, m.vy) + 0.1);
      if (m.target) {
        const ddx = m.target.x + 8 - m.x, ddy = m.target.y + 8 - m.y, d = Math.hypot(ddx, ddy) || 1;
        m.vx += ddx / d * 0.45; m.vy += ddy / d * 0.45;
      }
      const k = sp / (Math.hypot(m.vx, m.vy) || 1);
      m.vx *= k; m.vy *= k;
      m.x += m.vx; m.y += m.vy;
      if (this.frame % 2 === 0) this.wfx.push({ kind: 'smoke', x: m.x, y: m.y, t: 10 });
      const hit = m.target && Math.hypot(m.target.x + 8 - m.x, m.target.y + 8 - m.y) < 7;
      if (hit || --m.life <= 0 || m.x < 0 || m.y < 0 || m.x > FW || m.y > FH) {
        m.done = true;
        const tgt = hit ? m.target : null;
        this.blast(Math.max(2, Math.min(FW - 2, m.x)), Math.max(2, Math.min(FH - 2, m.y)), 8, true, att, false);
        if (tgt) this.weaponHit(att, tgt, m.s.dmg - 1, { blast: true });
      }

  // ------------------------------------------------------------ drawing
  renderWeapons(ctx) {
    const f = this.frame;
    for (const fl of this.netFlames || this.tanks.filter(t => t.flame && t.alive).map(t => t.flame)) {
      const fire = ['#F8F8F8', '#F8D878', '#F87830', '#D82800'];
      for (let k = 0; k < 16; k++) {
        ctx.fillStyle = fire[(k + (f >> 1)) & 3];
        ctx.fillRect(fl.x + ((k * 37 + f * 13) % Math.max(1, fl.w)) - 1, fl.y + ((k * 53 + f * 7) % Math.max(1, fl.h)) - 1, 3, 3);
      }
    }
    for (const fx of this.wfx) {
      if (fx.kind === 'smoke') { ctx.fillStyle = 'rgba(180,180,180,' + (fx.t / 14) + ')'; ctx.fillRect(Math.round(fx.x) - 1, Math.round(fx.y) - 1, 2, 2); continue; }
      ctx.fillStyle = (fx.t >> 1) & 1 ? '#FFFFFF' : fx.color;
      for (let k = 1; k < fx.pts.length; k++) {
        const [x0, y0] = fx.pts[k - 1], [x1, y1] = fx.pts[k];
        if (fx.zig) {
          const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 2));
          for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n + (Math.random() - 0.5) * 3), Math.round(y0 + (y1 - y0) * i / n + (Math.random() - 0.5) * 3), 1, 1);
        } else {
          const w = Math.max(1, Math.round(fx.w * fx.t / 10));
          ctx.fillRect(Math.round(Math.min(x0, x1) - (y1 !== y0 ? w / 2 : 0)), Math.round(Math.min(y0, y1) - (x1 !== x0 ? w / 2 : 0)), Math.max(w, Math.abs(x1 - x0)), Math.max(w, Math.abs(y1 - y0)));
        }
      }
    }
    for (const m of this.wshots) {
      if (m.kind === 'mortar') {
        const h = Math.sin(Math.PI * m.p) * 18;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(Math.round(m.x) - 1, Math.round(m.y), 3, 2);
        ctx.fillStyle = '#7C7C7C'; ctx.fillRect(Math.round(m.x) - 2, Math.round(m.y - h) - 2, 4, 4);
        ctx.fillStyle = '#F8F8F8'; ctx.fillRect(Math.round(m.x) - 1, Math.round(m.y - h) - 1, 2, 1);
        if ((f >> 2) & 1) { ctx.fillStyle = '#F83800'; ctx.fillRect(Math.round(m.tx) - 3, Math.round(m.ty), 7, 1); ctx.fillRect(Math.round(m.tx), Math.round(m.ty) - 3, 1, 7); }
      } else { ctx.fillStyle = (f >> 1) & 1 ? '#58D854' : '#F8F8F8'; ctx.fillRect(Math.round(m.x) - 1, Math.round(m.y) - 1, 3, 3); }
    }
  },

  // each player's weapon in the left border: a bar in the player's colour, the weapon's letter, level pips
  renderWeaponBadges(ctx) {
    this.players.forEach((p, i) => {
      if (!p.weapon || p.weapon === 'cannon' || p.out) return;
      const W = WEAPONS[p.weapon], lv = weaponLevel(p), y = FY + 8 + i * 30;
      ctx.fillStyle = PALS[Config.playerPal(p.i)][2]; ctx.fillRect(2, y, 12, 2);
      ctx.fillStyle = COL.black; ctx.fillRect(2, y + 3, 12, 10);
      Font.draw(ctx, W.letter, 4, y + 5, W.color);
      for (let k = 0; k < WEAPON_MAX; k++) { ctx.fillStyle = k < lv ? W.color : '#3C3C3C'; ctx.fillRect(2 + k * 3, y + 15, 2, 3); }
    });
  },
});

  <script>
'use strict';
// =====================================================================
//  Game modes (picked on the title screen's MODE row)
//    CLASSIC      the game as always
//    SURVIVAL     endless waves on one map, each bigger and stronger; a breather between waves
//    TIME ATTACK  clear stages 1-5 as fast as you can (the clock runs from the first stage)
//    BIG MAPS     every stage is a big scrolling map with outposts to hold or factories to destroy (bigmap.js)
//    VS EAGLES    2-4 players, each with an eagle: defend yours, destroy theirs; best of 3 rounds
//    DEATHMATCH   2-4 players, no eagles: first to 10 kills, or the most kills after 3 minutes
//    FLAGS        capture the flag: bring another player's flag home to your own; first to 3
// =====================================================================

const MODES = [
  { key: 'classic', name: 'CLASSIC', desc: 'THE GAME AS ALWAYS' },
  { key: 'custom', name: 'CUSTOM LEVELS', desc: 'YOUR OWN LEVELS, IN TURN' },   // editor.js
  { key: 'survival', name: 'SURVIVAL', desc: 'ENDLESS WAVES, HOW LONG?' },
  { key: 'timeattack', name: 'TIME ATTACK', desc: 'CLEAR 5 STAGES FAST' },
  { key: 'bigmaps', name: 'BIG MAPS', desc: 'HUGE SCROLLING BATTLEFIELDS' },
  { key: 'sides', name: 'ANY SIDE', desc: 'YOUR EAGLE ON ANOTHER EDGE' },   // the map turned: eagle left, right or top
  { key: 'corridor', name: 'CORRIDOR', desc: 'ENDLESS CLIMB, HOW FAR?' },
  { key: 'maze', name: 'MAZE', desc: 'FIND THE ONE WAY OUT' },   // maze.js
  { key: 'fortress', name: 'FORTRESS', desc: 'BUILD TOWERS, HOLD 30 WAVES' },   // fortress.js: tower defense
  { key: 'race', name: 'KILL RACE', cpu: true, desc: 'MOST KILLS WINS THE ROUND' },   // race.js; 1 player races bots
  { key: 'coop', name: 'CO-OP VS CPU', desc: 'TEAM UP AGAINST THE CPU' },   // VS CPU (cpuvs.js) for 1-4 players together
  { key: 'eagles', name: 'VS EAGLES', vs: true, cpu: true, desc: 'GUARD YOURS, HIT THEIRS' },   // cpu: 1 player plays the computer
  { key: 'dm', name: 'DEATHMATCH', vs: true, cpu: true, desc: 'FIRST TO 10 KILLS' },   // 1 player: against bots
  { key: 'ctf', name: 'FLAGS', vs: true, desc: 'BRING THEIR FLAG HOME' },
  // not on the MODE row: VS EAGLES with one player becomes this (cpuvs.js)
  { key: 'cpu', name: 'VS CPU', desc: 'DESTROY THE ENEMY HQ' },
];
const modeInfo = key => MODES.find(m => m.key === key) || MODES[0];
const TA_STAGES = 5, VS_ROUNDS = 2, DM_FRAGS = 10, DM_TIME = 3 * 60 * 60, CTF_CAPS = 3;
const VS_RESPAWN = 90, VS_PU_EVERY = 900, WAVE_BREAK = 240;
// power-ups that make sense between players
const VS_POWERUPS = [PU.HELMET, PU.STAR, PU.SHIP, PU.TURBO, PU.RAPID, PU.SPREAD, PU.PIERCE, PU.ROCKET, PU.MINES, PU.GHOST, PU.SMOKE, PU.GUN, PU.WEAPON];

// survival: what wave w brings
function waveQueue(w) {
  return buildQueue(Math.min(60, w * 2), Math.min(60, 6 + w * 2));
}

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ survival
  setupSurvival() {
    this.survival = true;
    this.wave = 1;
    this.queue = waveQueue(1);
    this.total = this.queue.length;
    this.waveBreak = 0;
  },

  // called instead of "stage clear" when a wave is beaten
  nextWave() {
    if (this.waveBreak > 0) {
      if (--this.waveBreak === 0) {
        this.wave++;
        this.queue = waveQueue(this.wave);
        this.seasonEnemies(this.queue);
        this.total += this.queue.length;
        this.spawnTimer = 0;
      }
      return;
    }
    this.waveBreak = WAVE_BREAK;
    // a breather: the fortress is patched, every 5 waves a tank for everyone
    this.setBaseWalls(T_BRICK);
    if ((this.wave + 1) % 5 === 0) for (const p of this.players) if (!p.out && !Config.infiniteLives()) p.lives++;
    for (const p of this.players) if (!p.out) this.addXp(p, 10 + this.wave * 2);
    Sound.play('bonus');
  },

  // ------------------------------------------------------------ versus
  setupVersus(kind) {
    this.vs = kind;
    this.queue = [];
    this.total = 0;
    this.noBase = true;
    const midY = Math.round((FH / 2 - 8) / 16) * 16;
    const homes = [[BASE_X, BASE_Y], [BASE_X, 0], [0, midY], [FW - 16, midY]];
    this.vsSpawn = kind === 'dm'
      ? [[0, FH - 16], [FW - 16, 0], [0, 0], [FW - 16, FH - 16]]
      : [[BASE_X - 32, BASE_Y], [BASE_X + 32, 0], [0, midY - 32], [FW - 16, midY + 32]];
    // clear room around everyone's home and entry point; the classic fortress goes (rebuilt below if needed)
    this.setBaseWalls(T_EMPTY);
    const clear = (x, y, r) => {
      for (let cy = (y >> 2) - r; cy < (y >> 2) + 4 + r; cy++) for (let cx = (x >> 2) - r; cx < (x >> 2) + 4 + r; cx++) {
        const t = this.get(cx, cy);
        if (t !== -1 && t !== T_EMPTY) this.set(cx, cy, T_EMPTY);
      }
    };
    this.players.forEach((p, i) => { clear(...this.vsSpawn[i], 1); if (kind !== 'dm') clear(...homes[i], 3); });
    this.pads = this.pads.filter(pd => !this.players.some((p, i) => overlap(pd.x, pd.y, 16, 16, this.vsSpawn[i][0] - 8, this.vsSpawn[i][1] - 8, 32, 32)));
    if (kind === 'eagles') {
      this.vsEagles = this.players.map((p, i) => ({ x: homes[i][0], y: homes[i][1], i, alive: true }));
      for (const e of this.vsEagles) this.fortressAround(e.x, e.y);
    }
    if (kind === 'ctf') {
      this.flags = this.players.map((p, i) => ({ i, hx: homes[i][0], hy: homes[i][1], x: homes[i][0], y: homes[i][1], carrier: null }));
    }
    for (const p of this.players) { p.vsKills = p.vsKills || 0; p.caps = 0; p.out = false; }
    this.vsTime = 0;
    this.vsPu = VS_PU_EVERY / 2;
    this.vsEnd = 0;
  },

  // a ring of 8px brick blocks around a 16px eagle (inside the field)
  fortressAround(x, y) {
    const bx = x / 8, by = y / 8;
    for (let yy = by - 1; yy <= by + 2; yy++) for (let xx = bx - 1; xx <= bx + 2; xx++) {
      const inside = xx >= bx && xx <= bx + 1 && yy >= by && yy <= by + 1;
      if (!inside && xx >= 0 && yy >= 0 && xx < COLS * 2 && yy < ROWS * 2) this.setBlock(xx, yy, T_BRICK);
    }
  },

  vsPlayerOf(tank) { return tank && tank.player ? tank.player : null; },

  // a player tank was destroyed in a versus game
  vsDeath(t, by) {
    const p = t.player, killer = this.vsPlayerOf(by);
    if (killer && killer !== p) {
      killer.vsKills++;
      this.addScore(killer, 100);
      this.popups.push({ x: t.x + 8, y: t.y, text: ROMAN[killer.i] + ' +1', label: true, color: PALS[Config.playerPal(killer.i)][2], t: 0, delay: 0 });
    }
    // a flag carrier drops the flag where it fell
    for (const f of this.flags || []) if (f.carrier === p) { f.carrier = null; f.x = t.x; f.y = t.y; }
    const eagleGone = this.vs === 'eagles' && !this.vsEagles[p.i].alive;
    if (eagleGone) p.out = true; else this.spawnPlayer(p, VS_RESPAWN);
  },

  // a shell meets an eagle (true if it stopped there)
  vsBulletEagle(b) {
    for (const e of this.vsEagles || []) {
      if (!e.alive || !overlap(b.x, b.y, 4, 4, e.x, e.y, 16, 16)) continue;
      this.killBullet(b, true);
      const owner = this.vsPlayerOf(b.owner);
      if (!owner || owner.i !== e.i) this.vsEagleDown(e);   // your own shells can't hurt your eagle
      return true;
    }
    return false;
  },

  vsEagleDown(e) {
    if (!e.alive) return;
    e.alive = false;
    this.addFx(e.x + 8, e.y + 8, BIG_EXPLOSION(), 6);
    Sound.play('baseDie');
    const p = this.players[e.i];
    p.out = true;
    if (p.tank) { p.tank.alive = false; this.addFx(p.tank.x + 8, p.tank.y + 8, BIG_EXPLOSION(), 5); p.tank = null; }
    this.spawns = this.spawns.filter(s => s.player !== p);
    this.popups.push({ x: e.x + 8, y: e.y, text: ROMAN[e.i] + ' IS OUT', label: true, color: COL.red, t: 0, delay: 0, life: 120 });
  },

  updateVersus() {
    this.vsTime++;
    // power-ups drop now and then (no bonus tanks here)
    if (!this.powerup && --this.vsPu <= 0) {
      this.vsPu = VS_PU_EVERY;
      this.spawnPowerup(VS_POWERUPS);
    }
    if (this.vs === 'ctf') this.updateFlags();
    if (this.vsEnd > 0) { if (--this.vsEnd === 0) this.result = 'vsRound'; return; }
    // has anyone won?
    let winner = null;
    if (this.vs === 'eagles') {
      const alive = this.vsEagles.filter(e => e.alive);
      if (alive.length <= 1) winner = alive.length ? alive[0].i : -1;
    } else if (this.vs === 'dm') {
      const top = this.players.find(p => p.vsKills >= DM_FRAGS);
      if (top) winner = top.i;
      else if (this.vsTime >= DM_TIME) winner = this.leader(p => p.vsKills);
    } else if (this.vs === 'ctf') {
      const top = this.players.find(p => p.caps >= CTF_CAPS);
      if (top) winner = top.i;
    }
    if (winner !== null) { this.vsWinner = winner; this.vsEnd = 150; Sound.play(winner >= 0 ? 'bonus' : 'gameover'); }
  },

  // the single best player by some count, or -1 on a tie
  leader(f) {
    const best = Math.max(...this.players.map(f));

    return top.length === 1 ? top[0].i : -1;
  },

  updateFlags() {
    for (const f of this.flags) {
      if (f.carrier) {
        const t = f.carrier.tank;
        if (t) { f.x = t.x; f.y = t.y; }
        continue;
      }
      for (const t of this.tanks) {
        if (!t.alive || !t.isPlayer || t.ally || !overlap(t.x + 2, t.y + 2, 12, 12, f.x + 2, f.y + 2, 12, 12)) continue;
        const p = t.player;
        if (p.i === f.i) {
          // your own flag: a dropped one goes home; at home, bring a captured flag to it
          if (f.x !== f.hx || f.y !== f.hy) { f.x = f.hx; f.y = f.hy; Sound.play('pickup'); }
          const carried = this.flags.find(g => g.carrier === p);
          if (carried) {
            carried.carrier = null; carried.x = carried.hx; carried.y = carried.hy;
            p.caps++;
            this.addScore(p, 500);
            this.popups.push({ x: t.x + 8, y: t.y, text: 'CAPTURE!', label: true, color: COL.gold, t: 0, delay: 0, life: 90 });
            Sound.play('life');
          }
        } else if (!this.flags.some(g => g.carrier === p)) {
          f.carrier = p;   // grabbed someone else's flag
          Sound.play('bonus');
        }
        break;
      }
    }
  },

  // ------------------------------------------------------------ drawing
  renderVs(ctx) {
    for (const e of this.vsEagles || []) {
      if (!e.alive) { ctx.drawImage(Sprites.eagleDead, e.x, e.y); continue; }
      ctx.drawImage(Sprites.outline(Sprites.eagle, PALS[Config.playerPal(e.i)][2]), e.x - 1, e.y - 1);
      ctx.drawImage(Sprites.eagle, e.x, e.y);
    }
    for (const f of this.flags || []) {
      // home marker, then the flag itself in its owner's colour
      ctx.strokeStyle = PALS[Config.playerPal(f.i)][2];
      ctx.strokeRect(f.hx + 0.5, f.hy + 0.5, 15, 15);
      ctx.drawImage(Sprites.vsFlag(Config.playerPal(f.i)), f.x, f.y - (f.carrier ? 6 : 0));
    }
  },

  renderVsHud(ctx, H) {
    const val = p => (this.vs === 'eagles' ? (Game.vsWins[p.i] || 0) : this.vs === 'dm' ? p.vsKills : p.caps);
    Font.draw(ctx, this.vs === 'eagles' ? 'WIN' : this.vs === 'dm' ? 'KIL' : 'CAP', H - 4, 24, COL.black);
    this.players.forEach((p, i) => {
      const y = 40 + i * 20;
      ctx.drawImage(Sprites.playerIcon(Config.playerPal(i)), H, y);
      Font.draw(ctx, String(Math.min(99, val(p))), H + 8, y, p.out ? '#3C3C3C' : COL.black);
      if (this.vs === 'eagles' && !this.vsEagles[i].alive) { ctx.fillStyle = COL.red; ctx.fillRect(H, y + 3, 16, 1); }
    });
    if (this.vs === 'dm') {
      const left = Math.max(0, Math.ceil((DM_TIME - this.vsTime) / 60));
      Font.drawCenter(ctx, Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'), H + 8, 130, COL.black);
    }
  },

  renderModeBanner(ctx) {
    if (this.survival && this.waveBreak > 0 && (this.waveBreak >> 4) & 1) {
      Font.drawCenter(ctx, 'WAVE ' + (this.wave + 1), VIEW_W / 2, VIEW_H / 2 - 4, COL.gold);
    }
    if (this.vs && this.vsEnd > 0) {
      const w = this.vsWinner;
      Font.drawCenter(ctx, w >= 0 ? playerName(this.players.find(p => p.i === w)) + ' WINS!' : 'DRAW!', VIEW_W / 2, VIEW_H / 2 - 4, COL.gold);
    }
  },
});

  <script>
'use strict';
// =====================================================================
//  Big scrolling maps (BIG MAPS mode, or every 4th stage with BIG MAP STAGES on)
//  The world is several classic maps stitched together (3 x 2 or more); the screen shows the usual field size and
//  follows your tanks. Each big stage has an objective:
//    OUTPOSTS   two more eagles with their own fortresses beside your HQ. Enemies go for the nearest one. Only losing
//               the HQ ends the game; every outpost still standing at the end is worth 2000 to each player.
//    FACTORIES  three enemy factories in the far half keep turning out tanks until destroyed (8 hits each, 1000
//               points). The stage is clear when every factory is down and the last tank is gone.
// =====================================================================

const SECTOR = 13, OUTPOST_BONUS = 2000, FACTORY_HP = 8, FACTORY_EVERY = 720;

// the stitched world: SX x SY classic maps, as one big block map
function bigWorldBlocks(num, SX, SY) {
  const rows = [];
  for (let sy = 0; sy < SY; sy++) {
    const sectorRows = [];
    for (let sx = 0; sx < SX; sx++) sectorRows.push(mapToBlocks(LEVELS[(num * 5 + sx * 3 + sy * 7) % LEVELS.length]));
    for (let r = 0; r < 26; r++) rows.push(sectorRows.map(b => b[r]).join(''));
  }
  return rows;
}

// world size for a screen of vc x vr tiles
function bigWorldSize(vc, vr) {
  const SX = Math.max(3, Math.ceil(vc * 2 / SECTOR)), SY = Math.max(2, Math.ceil(vr * 1.5 / SECTOR));
  return [SX, SY];
}

Object.assign(Stage.prototype, {
  setupBigMap(kind) {
    this.big = kind;
    this.outposts = [];
    this.factories = [];
    const SX = COLS / SECTOR, hq = Math.floor(SX / 2);
    if (kind === 'outposts') {
      for (const sx of [hq - 1, hq + 1]) {
        if (sx < 0 || sx >= SX) continue;
        const x = sx * SECTOR * 16 + 96, y = FH - 16;
        this.clearArea(x - 16, y - 16, 48, 32);
        this.fortressAround(x, y);
        this.outposts.push({ x, y, alive: true });
      }
    } else {
      // three factories spread across the far half
      const n = 3;
      for (let k = 0; k < n; k++) {
        const sx = Math.min(SX - 1, Math.floor((k + 0.5) * SX / n));
        const spot = this.freeSpot32(sx * SECTOR * 16 + 88, 72 + (k & 1) * 48);
        if (!spot) continue;
        this.clearArea(spot[0], spot[1], 32, 40);
        this.factories.push({ x: spot[0], y: spot[1], hp: FACTORY_HP, cd: 240 + k * 120, flash: 0 });
      }
    }
  },

  clearArea(x, y, w, h) {
    for (let cy = Math.max(0, y >> 2); cy < Math.min(GH, (y + h) >> 2); cy++) {
      for (let cx = Math.max(0, x >> 2); cx < Math.min(GW, (x + w) >> 2); cx++) if (this.get(cx, cy) !== T_EMPTY) this.set(cx, cy, T_EMPTY);
    }
  },

  // a 32px spot near (x, y) clear of steel and water, the entry row and the player area
  freeSpot32(x0, y0) {
    for (let r = 0; r < 10; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = Math.round((x0 + dx * 16) / 16) * 16, y = Math.round((y0 + dy * 16) / 16) * 16;
      if (x < 0 || y < 32 || x > FW - 32 || y > FH / 2) continue;
      let bad = false;
      for (let cy = y >> 2; cy < (y + 40) >> 2 && !bad; cy++) for (let cx = x >> 2; cx < (x + 32) >> 2; cx++) {
        const t = this.get(cx, cy);
        if (t === T_STEEL || t === T_WATER) { bad = true; break; }
      }
      if (!bad && !this.factories.some(f => overlap(x, y, 32, 40, f.x - 16, f.y - 16, 64, 72))) return [x, y];
    }
    return null;
  },

  // every eagle the enemy may go for: the HQ and any outposts still standing
  baseGoals() {
    if (this.decoy) return [{ x: this.decoy.x, y: this.decoy.y }];
    const g = this.noBase ? [] : [{ x: BASE_X, y: BASE_Y }];
    for (const o of this.outposts || []) if (o.alive) g.push({ x: o.x, y: o.y });
    return g;
  },

  factoriesAlive() { return (this.factories || []).some(f => f.hp > 0); },

  updateBigMap() {
    for (const f of this.factories) {
      if (f.hp <= 0) continue;
      if (f.flash > 0) f.flash--;
      if (this.freezeE > 0 || this.over || --f.cd > 0) continue;
      f.cd = Math.round(FACTORY_EVERY / Config.scale('spawnRate') / Config.skill().spawn);
      const onField = this.tanks.filter(t => !t.isPlayer).length + this.spawns.filter(s => s.enemy).length;
      if (onField >= this.maxEnemies + 2) continue;
      // the new tank rolls out of the door, just below the factory
      const x = f.x + 8, y = f.y + 32;
      if (this.tanks.some(t => overlap(t.x, t.y, 16, 16, x, y, 16, 16))) continue;
      const type = buildQueue(this.num, 1)[0].type;
      this.spawns.push({ x, y, t: SPARKLE_TIME, enemy: { type } });
      this.total++;
    }
  },

  // shells and blasts against outposts and factories (true if the shell stopped)
  bulletBigMap(b) {
    for (const o of this.outposts) {
      if (!o.alive || !overlap(b.x, b.y, 4, 4, o.x, o.y, 16, 16)) continue;
      this.killBullet(b, true);

    Sound.play('bossDie');

  },

  bigMapBonus() {

    this.popups.push({ x: BASE_X + 8, y: BASE_Y - 24, text: 'OUTPOSTS +' + n * OUTPOST_BONUS, label: true, color: COL.gold, t: 0, delay: 0, life: 120 });
  },

  // ------------------------------------------------------------ camera and drawing
  // where the screen's window onto the field starts (it follows your tanks; an online guest's follows its own)
  camera() {
    if (VIEW_W >= FW && VIEW_H >= FH) return [0, 0];
    const mine = Net.role === 'client' ? this.tanks.filter(t => t.isPlayer && !t.ally && t.player && t.player.i === Net.slot) : [];
    const ps = mine.length ? mine : this.tanks.filter(t => t.isPlayer && !t.ally && t.alive);
    // the corridor holds still while everyone is between tanks (respawns come in near the bottom of the screen)

    let fx = this.maze ? this.maze.sx + 16 : BASE_X + 8, fy = this.maze ? this.maze.sy + 16 : BASE_Y + 8;
    if (ps.length) { fx = ps.reduce((a, t) => a + t.x + 8, 0) / ps.length; fy = ps.reduce((a, t) => a + t.y + 8, 0) / ps.length; }

    this.camX += (tx - this.camX) * 0.2;
    this.camY += (ty - this.camY) * 0.2;
    return [Math.round(this.camX), Math.round(this.camY)];
  },

  renderBigMap(ctx) {
    for (const o of this.outposts || []) {
      if (!o.alive) { ctx.drawImage(Sprites.eagleDead, o.x, o.y); continue; }
      ctx.drawImage(Sprites.outline(Sprites.eagle, '#58F8F8'), o.x - 1, o.y - 1);
      ctx.drawImage(Sprites.eagle, o.x, o.y);
    }
    for (const f of this.factories || []) {
      if (f.hp <= 0) { ctx.fillStyle = '#3C3C3C'; ctx.fillRect(f.x + 2, f.y + 18, 28, 14); continue; }
      ctx.drawImage(f.flash > 0 && (f.flash >> 1) & 1 ? Sprites.factory[1] : Sprites.factory[0], f.x, f.y);
      // smoke from the chimney and a working light
      ctx.fillStyle = (this.frame >> 4) & 1 ? '#F83800' : '#7C0800';
      ctx.fillRect(f.x + 14, f.y + 20, 4, 2);
      ctx.fillStyle = 'rgba(160,160,160,0.6)';
      const s = (this.frame >> 2) % 8;
      ctx.fillRect(f.x + 24 + (s >> 2), f.y - 2 - s, 4, 3);
    }
  },

  // arrows at the edge of the screen pointing to objectives you can't see
  renderObjectiveArrows(ctx, camX, camY) {
    if (VIEW_W >= FW && VIEW_H >= FH) return;
    const marks = [];
    if (!this.noBase && this.baseAlive) marks.push([BASE_X + 8, BASE_Y + 8, COL.gold]);
    for (const o of this.outposts || []) if (o.alive) marks.push([o.x + 8, o.y + 8, '#58F8F8']);
    for (const f of this.factories || []) if (f.hp > 0) marks.push([f.x + 16, f.y + 16, '#F83800']);
    if (this.maze && !this.maze.escaped && this.frame >= this.maze.hintAt) marks.push([this.maze.ex + 16, this.maze.ey + 16, '#58F898']);   // the exit signal

      const sx = wx - camX, sy = wy - camY;
      if (sx >= 0 && sy >= 0 && sx < VIEW_W && sy < VIEW_H) continue;
      const x = Math.max(4, Math.min(VIEW_W - 5, sx)), y = Math.max(4, Math.min(VIEW_H - 5, sy));

      ctx.fillRect(x - 2, y - 2, 5, 5);
      ctx.fillStyle = COL.black;
      ctx.fillRect(x, y, 1, 1);
    }
  },

  // objective line in the border above the field
  renderObjectiveLine(ctx) {
    if (!this.big) return;
    const text = this.big === 'outposts'
      ? 'OUTPOSTS ' + this.outposts.filter(o => o.alive).length + '/' + this.outposts.length
      : 'FACTORIES LEFT ' + this.factories.filter(f => f.hp > 0).length;
    Font.drawCenter(ctx, text, FX + VIEW_W / 2, 0, COL.black);
  },
});
