'use strict';
// =====================================================================
//  CORRIDOR mode: the usual width, endless height. Climb as far as you can.
//  The world is three map sections stacked (13 tiles high each). When the whole team has climbed out of the bottom
//  section it is dropped, everything moves down one section, and a fresh section is added on top, so the climb
//  never ends. Enemies keep arriving just above the screen; the higher you get, the more kinds join in (slowly, one
//  at a time) and the tougher they get; ones left far
//  behind drop out. No eagle: it's over when everyone is out of tanks. Every 5 sections: a tank for everyone.
// =====================================================================

const CORRIDOR_SECTIONS = 3, CORRIDOR_SECTION = 13;

// How the enemy grows as you climb (heights in tiles climbed). The four classic tanks join first, then the newer
// types one by one, in the order they reach the normal stages; each starts rare and takes 40 tiles to reach its
// full share. Veterans and then elites creep in higher up.
const CORRIDOR_CLASSIC = [[0, 4], [10, 3], [26, 2.5], [45, 2]];   // [joins at, weight] for basic, fast, power, armor
const CORRIDOR_NEW_AT = 52, CORRIDOR_NEW_STEP = 20, CORRIDOR_RAMP = 40;

// which types are in the mix at height h, with their weights ([type, weight] pairs)
function corridorMix(h) {
  const sk = Config.skill(), mult = ({ OFF: 0, FEW: 0.5, NORMAL: 1, MANY: 1.8 }[Config.get('newEnemies')] || 0) * sk.newMult;
  const ramp = at => 0.25 + 0.75 * Math.min(1, (h - at) / CORRIDOR_RAMP);
  const mix = [];
  CORRIDOR_CLASSIC.forEach(([at, w], type) => {
    if (h < at) return;
    // the basic tank thins out as the climb goes on
    mix.push([type, (type === 0 ? Math.max(1, w - h / 60) : w) * ramp(at)]);
  });
  if (!mult) return mix;
  const order = NEW_TYPES.slice().sort((a, b) => ENEMY[a].from - ENEMY[b].from);
  order.forEach((type, k) => {
    const at = corridorUnlock(k);
    if (h < at || Config.get('e' + type + 'On') === 'OFF') return;
    mix.push([type, 1.5 * mult * (ENEMY[type].kind === 'snake' ? 0.4 : 1) * ramp(at)]);
  });
  return mix;
}

// height the k-th newer type joins at (easier skills bring them later)
function corridorUnlock(k) { return CORRIDOR_NEW_AT + k * CORRIDOR_NEW_STEP + Math.max(0, Config.skill().newShift) * 4; }

// one enemy for height h: a type from the mix, maybe a veteran or an elite
function corridorEnemy(h) {
  const mix = corridorMix(h), total = mix.reduce((a, m) => a + m[1], 0);
  let r = Math.random() * total, type = 0;
  for (const [t, w] of mix) { if (r < w) { type = t; break; } r -= w; }
  let rank = 0;
  if (Config.on('enemyGrowth')) {
    const v = h + Config.skill().vet * 6;
    const vet = Math.min(0.45, Math.max(0, (v - 100) / 600)), elite = Math.min(0.35, Math.max(0, (v - 230) / 700));
    const x = Math.random();
    rank = x < elite ? 2 : x < elite + vet ? 1 : 0;
  }
  return { type, rank };
}

// one section's block rows, as wide as the field (a classic 26-block map, mirrored outwards when wider)
function corridorSection(map) {
  const b = mapToBlocks(map), TW = COLS * 2, offX = 2 * Math.floor((COLS - 13) / 2);
  const mirror = (i, n) => { const p = 2 * n, m = ((i % p) + p) % p; return m < n ? m : p - 1 - m; };
  return b.map(row => { let r = ''; for (let x = 0; x < TW; x++) r += row[mirror(x - offX, 26)]; return r; });
}

function corridorMap() { return LEVELS[Math.floor(Math.random() * LEVELS.length)]; }

// the starting world: sections stacked top to bottom
function corridorBlocks(n) {
  let rows = [];
  for (let k = 0; k < n; k++) rows = rows.concat(corridorSection(corridorMap()));
  return rows;
}

Object.assign(Stage.prototype, {
  setupCorridor() {
    this.corridor = { shifts: 0, climbed: 0, startY: PLAYER_SPAWN[0][1], spawnCd: 120, spawned: 0, lifeAt: 5, kinds: [] };
    this.noBase = true;
    this.queue = [];
    this.total = 0;
    // a clear runway at the bottom where everyone starts
    this.clearArea(0, FH - 48, FW, 48);
  },

  sectionPx() { return CORRIDOR_SECTION * 16; },

  // how far the team has climbed, in tiles (the front-runner counts)
  corridorClimb() {
    const c = this.corridor, ps = this.tanks.filter(t => t.isPlayer && !t.ally && t.alive);
    if (ps.length) {
      const top = Math.min(...ps.map(t => t.y));
      c.climbed = Math.max(c.climbed, Math.floor((c.shifts * this.sectionPx() + c.startY - top) / 16));
    }
    return c.climbed;
  },

  // "stage" the enemies are drawn from: one up every section climbed
  corridorLevel() { return 1 + Math.floor(this.corridorClimb() / CORRIDOR_SECTION); },

  // a destroyed player comes back near the bottom of the screen
  corridorSpawnPoint(p) {
    if (this.camY === undefined) return PLAYER_SPAWN[p.i];
    const y = Math.min(FH - 16, Math.floor((this.camY + VIEW_H - 16) / 16) * 16);
    const x = Math.max(0, Math.min(FW - 16, PLAYER_SPAWN[p.i][0]));
    this.clearArea(x, y, 16, 16);
    return [x, y];
  },

  updateCorridor() {
    const c = this.corridor, lvl = this.corridorLevel(), S = this.sectionPx();
    const cam = this.camY === undefined ? FH - VIEW_H : this.camY;
    // enemies arrive just above the screen
    if (--c.spawnCd <= 0 && this.freezeE <= 0) {
      c.spawnCd = Math.round(Math.max(45, 160 - lvl * 5) / Config.scale('spawnRate') / Config.skill().spawn);
      const onField = this.tanks.filter(t => !t.isPlayer).length + this.spawns.filter(s => s.enemy).length;
      if (onField < this.maxEnemies) {
        for (let k = 0; k < 20; k++) {
          const x = Math.floor(Math.random() * (COLS - 1)) * 16;
          const y = Math.max(0, Math.floor((cam - 32 - Math.random() * 64) / 16) * 16);
          if (this.tanks.some(t => overlap(t.x, t.y, 16, 16, x, y, 16, 16))) continue;
          let solid = false;
          for (let cy = y >> 2; cy < (y + 16) >> 2 && !solid; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
            const v = this.get(cx, cy);
            if (v === T_STEEL || v === T_WATER || v === T_BRICK) { solid = true; break; }
          }
          if (solid) continue;
          const q = this.seasonSwap(corridorEnemy(this.corridorClimb()));
          q.ai = noBasePersonality();
          q.bonus = Config.on('bonusTanks') && c.spawned % 7 === 3;
          c.spawned++;
          this.spawns.push({ x, y, t: SPARKLE_TIME, enemy: q });
          this.total++;
          break;
        }
      }
    }
    // a new kind of enemy joins the climb
    const kinds = corridorMix(this.corridorClimb()).map(m => m[0]);
    for (const k of kinds) {
      if (c.kinds.includes(k)) continue;
      c.kinds.push(k);
      if (c.kinds.length > 1) this.popups.push({ x: FW / 2, y: cam + 56, text: ENEMY[k].name + ' AHEAD!', label: true, color: COL.gold, t: 0, delay: 0, life: 120 });
    }
    // enemies left far behind drop out
    for (const t of this.tanks) if (!t.isPlayer && t.y > cam + VIEW_H + 96) t.alive = false;
    // a tank for everyone every 5 sections
    if (this.corridorClimb() >= c.lifeAt * CORRIDOR_SECTION) {
      c.lifeAt += 5;
      for (const p of this.players) if (!p.out && !Config.infiniteLives()) p.lives++;
      Sound.play('life');
      this.popups.push({ x: FW / 2, y: cam + 40, text: '+1 TANK', label: true, color: COL.gold, t: 0, delay: 0, life: 90 });
    }
    // once nobody is left in the bottom section, the world moves down one section
    const ps = this.tanks.filter(t => t.isPlayer && !t.ally && t.alive);
    if (ps.length && Math.max(...ps.map(t => t.y)) < FH - S - 16 && !this.spawns.some(s => s.player)) this.corridorShift();
  },

  corridorShift() {
    const S = this.sectionPx(), rows = S / 4, c = this.corridor;
    // terrain: everything moves down `rows` cells, a new section on top
    const fresh = corridorSection(corridorMap()), t = new Uint8Array(GW * GH);
    t.set(this.terrain.subarray(0, (GH - rows) * GW), rows * GW);
    for (let by = 0; by < fresh.length; by++) for (let bx = 0; bx < COLS * 2; bx++) {
      const v = BLOCK_TYPE[fresh[by][bx]] || T_EMPTY;
      for (let k = 0; k < 4; k++) t[(by * 2 + (k >> 1)) * GW + bx * 2 + (k & 1)] = v;
    }
    this.terrain = t;
    this.origTerrain = t.slice();
    this.dirty = true;
    this.terrainVer = (this.terrainVer || 0) + 1;
    this.navCost = {}; this.navBaseF = {}; this.navPlayerF = new Map();
    this.netDiff = []; this.netFull = true;
    // everything else moves down with it; what falls off the bottom is gone
    const down = o => { o.y += S; return o.y < FH; };
    for (const tk of this.tanks) { tk.y += S; if (tk.trail) for (const p of tk.trail) p[1] += S; if (tk.nav) tk.nav = null; }
    this.tanks = this.tanks.filter(tk => tk.y < FH);
    // shells that drop off the bottom go back to their tank (or it could never fire again)
    for (const b of this.bullets) if (b.y + S >= FH) this.killBullet(b, false);
    for (const k of ['bullets', 'spawns', 'mines', 'turrets', 'claudes', 'strikes', 'shells', 'pads']) this[k] = this[k].filter(down);
    for (const f of this.fx) f.y += S;
    for (const p of this.popups) p.y += S;
    for (const h of this.heals) { h.y1 += S; h.y2 += S; }
    if (this.powerup && !down(this.powerup)) this.powerup = null;
    this.pads.forEach((p, i) => { p.pair = this.pads[p.pair] ? p.pair : -1; });
    this.pads = this.pads.filter(p => p.pair >= 0);
    if (this.camY !== undefined) this.camY += S;
    this.seasonShift(S);   // fires, puddles, hot spots, wrecks (seasonal.js)
    c.shifts++;
  },

  renderCorridorLine(ctx) {
    const best = (STORE.get(MODE_KEY, {}).corridor || {}).dist || 0;
    Font.drawCenter(ctx, 'CLIMBED ' + this.corridorClimb() + ' M' + (best ? '  BEST ' + best : ''), FX + VIEW_W / 2, 0, COL.black);
  },
});

  <script>
'use strict';
// =====================================================================
//  MAZE mode: a huge labyrinth, a new one every stage and bigger each time. You start in the bottom-left corner; there
//  is exactly one way out, the EXIT gate, as far from the start as the maze allows. Find it. The walls are steel,
//  with the odd stretch of brick that can be shot through for a shortcut; trees and ice fill some passages.
//  Enemy tanks wait along the way: they patrol where they are until you come close, then they come for you, and
//  more turn up out of sight as you go (the side panel counts them down). Get lost for too long and the exit sends
//  a signal: a blinking marker at the edge of the screen points the way (sooner on easier skills).
//  Reach the exit and every enemy left in the maze goes up in smoke; the tally and the shop, then the next maze.
//  Destroyed players come back where they were a few seconds before. Game over when everyone is out of tanks.
// =====================================================================

const MAZE_PITCH = 3;                                   // tiles per cell: a 2-tile passage and a 1-tile wall
const MAZE_HINT = [60, 90, 120, 150, 180];              // seconds before the exit signal, per skill
const MAZE_WAKE = 112;                                  // a patrolling enemy comes for you inside this range (px)
const MAZE_BONUS = 2000;                                // for getting out, plus a time bonus

// maze size (in cells) for stage n: bigger every time, never smaller than 1.5 screens either way
function mazeCells(n, vc, vr) {
  const w = Math.min(34, 14 + 3 * n), h = Math.min(22, 9 + 2 * n);
  return [Math.max(w, Math.ceil(vc * 1.5 / MAZE_PITCH)), Math.max(h, Math.ceil(vr * 1.5 / MAZE_PITCH))];
}

// a random maze of MW x MH cells, as a block map, with its start, exit and the way between them
function mazeLayout(MW, MH, rand = Math.random) {
  const right = [], down = [];
  for (let j = 0; j < MH; j++) { right.push(new Array(MW).fill(true)); down.push(new Array(MW).fill(true)); }
  const open = (i, j, k) => {   // knock down the wall between cell (i, j) and its neighbour in direction k
    if (k === 0) down[j - 1][i] = false; else if (k === 1) right[j][i] = false;
    else if (k === 2) down[j][i] = false; else right[j][i - 1] = false;
  };
  const wallTo = (i, j, k) => (k === 0 ? j > 0 && down[j - 1][i] : k === 1 ? i < MW - 1 && right[j][i] : k === 2 ? j < MH - 1 && down[j][i] : i > 0 && right[j][i - 1]);
  // depth-first carving from the start corner: long winding passages
  const start = [0, MH - 1], seen = new Uint8Array(MW * MH), stack = [start];
  seen[start[1] * MW + start[0]] = 1;
  while (stack.length) {
    const [i, j] = stack[stack.length - 1];
    const next = [];
    for (let k = 0; k < 4; k++) {
      const x = i + DXY[k][0], y = j + DXY[k][1];
      if (x >= 0 && y >= 0 && x < MW && y < MH && !seen[y * MW + x]) next.push([x, y, k]);
    }
    if (!next.length) { stack.pop(); continue; }
    const [x, y, k] = next[Math.floor(rand() * next.length)];
    open(i, j, k);
    seen[y * MW + x] = 1;
    stack.push([x, y]);
  }
  // a few extra openings, so there's more than one way round (and fewer endless dead ends)
  for (let n = Math.floor(MW * MH * 0.05); n > 0; n--) {
    const i = Math.floor(rand() * MW), j = Math.floor(rand() * MH), k = Math.floor(rand() * 4);
    if (wallTo(i, j, k)) open(i, j, k);
  }
  // distances from the start; the exit is the farthest cell on the outer edge
  const dist = new Int32Array(MW * MH).fill(-1), from = new Int32Array(MW * MH).fill(-1), q = [start[1] * MW + start[0]];
  dist[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], i = c % MW, j = (c / MW) | 0;
    for (let k = 0; k < 4; k++) {
      if (wallTo(i, j, k)) continue;
      const x = i + DXY[k][0], y = j + DXY[k][1];
      if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
      const n = y * MW + x;
      if (dist[n] >= 0) continue;
      dist[n] = dist[c] + 1; from[n] = c; q.push(n);
    }
  }
  let exit = null, best = -1;
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    if (i && j && i < MW - 1 && j < MH - 1) continue;
    if (dist[j * MW + i] > best) { best = dist[j * MW + i]; exit = [i, j]; }
  }
  const path = [];
  for (let c = exit[1] * MW + exit[0]; c >= 0; c = from[c]) path.push([c % MW, (c / MW) | 0]);
  path.reverse();
  // the blocks (8px): steel walls and pillars, a little brick, trees and ice in some passages
  const BW = (MW * MAZE_PITCH + 1) * 2, BH = (MH * MAZE_PITCH + 1) * 2;
  const g = [];
  for (let y = 0; y < BH; y++) g.push(new Array(BW).fill('.'));
  const fill = (tx, ty, tw, th, ch) => { for (let y = ty * 2; y < (ty + th) * 2; y++) for (let x = tx * 2; x < (tx + tw) * 2; x++) g[y][x] = ch; };
  const wall = (tx, ty, tw, th, outer) => fill(tx, ty, tw, th, !outer && rand() < 0.1 ? '#' : '@');
  for (let j = 0; j <= MH; j++) for (let i = 0; i <= MW; i++) fill(i * 3, j * 3, 1, 1, '@');   // pillars
  for (let i = 0; i < MW; i++) { wall(i * 3 + 1, 0, 2, 1, true); wall(i * 3 + 1, MH * 3, 2, 1, true); }
  for (let j = 0; j < MH; j++) { wall(0, j * 3 + 1, 1, 2, true); wall(MW * 3, j * 3 + 1, 1, 2, true); }
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    if (i < MW - 1 && right[j][i]) wall(i * 3 + 3, j * 3 + 1, 1, 2);
    if (j < MH - 1 && down[j][i]) wall(i * 3 + 1, j * 3 + 3, 2, 1);
    const key = (i === start[0] && j === start[1]) || (i === exit[0] && j === exit[1]);
    const r = rand();
    if (!key && r < 0.07) fill(i * 3 + 1, j * 3 + 1, 2, 2, '%');
    else if (!key && r < 0.1) fill(i * 3 + 1, j * 3 + 1, 2, 2, '_');
  }
  return { MW, MH, start, exit, path, dist: Array.from(dist), blocks: g.map(r => r.join('')) };

// a cell's top-left corner in pixels (its passage is 32 x 32)

    for (let j = 0; j < w / 10; j++) bosses.push({ type: 17, hp: Math.round(16 * mult), extra: { speedMul } });

    bosses.forEach((b, j) => list.splice(Math.floor(list.length * (j + 1) / (bosses.length + 1)), 0, b));
  }
  return { list, gap, kind };
}

Object.assign(Stage.prototype, {
  setupFortress(o) {
    const lv = tdSkill(), mp = TD_MAPS.find(m => m.key === o.map) || TD_MAPS[0];
    this.td = { map: o.map, waves: mp.waves, k: mp.k, spawns: o.spawns, wave: 0, phase: 'build', timer: TD_FIRST_BUILD, gold: TD_START_GOLD[lv], list: [], gap: 55, spawnT: 0,
      kind: '', won: false, wonT: 0, cool: { strike: 0, wing: 0 }, lv, maxHp: TD_EAGLE_HP[lv], season: SEASON_ENEMY[this.theme] };
    this.td.next = tdWave(1, lv, this.td.season, mp.k);
    this.towers = []; this.tdShots = []; this.tdBeams = []; this.tdSparks = [];
    this.queue = []; this.total = 0;
    this.eagleArmor = this.td.maxHp - 1;   // the eagle's HP: each hit costs 1
    this.vsSpawn = null;
  },

  // ------------------------------------------------------------ every frame
  updateFortress() {
    const td = this.td;
    if (td.won) { if (++td.wonT > 300) this.result = 'tdwin'; return; }
    for (const k in td.cool) if (td.cool[k] > 0) td.cool[k]--;
    if (Input.anyJust(['Tab']) && td.phase === 'build') this.tdSendWave();
    if (td.phase === 'build' && (!this.tdSave || this.tdSave.wave !== td.wave)) this.tdCheckpoint();
    if (td.phase === 'build') {
      if (--td.timer <= 0) this.tdStartWave();
    } else {
      // release the wave, a tank at a time from the entry points in turn
      if (td.list.length && --td.spawnT <= 0 && this.freezeE <= 0) {
        const open = this.tdOpen(), [x, y] = open[(td.spawned++) % open.length];
        if (!this.tanks.some(t => t.alive && overlap(t.x, t.y, 16, 16, x, y, 16, 16)) && !this.spawns.some(s => s.enemy && s.x === x && s.y === y)) {
          const e = td.list.shift();
          this.spawns.push({ x, y, t: SPARKLE_TIME, enemy: { type: e.type, hp: e.hp, ai: AI.RUSH, extra: e.extra } });
          this.total++;
          td.spawnT = Math.round(td.gap / Config.skill().spawn);
        } else td.spawnT = 10;
      }
      if (!td.list.length && !this.spawns.some(s => s.enemy) && !this.tanks.some(t => t.alive && !t.isPlayer && !t.mirage)) this.tdWaveCleared();
    }
    this.tdSiege();
    this.updateTowers();
    this.updateTdShots();
    for (const b of this.tdBeams) b.t--;
    this.tdBeams = this.tdBeams.filter(b => b.t > 0);
    for (const s of this.tdSparks) { s.x += s.vx; s.y += s.vy; s.t--; }
    this.tdSparks = this.tdSparks.filter(s => s.t > 0);
  },

  // RESTART WAVE (pause menu): the state at the start of each build phase, and going back to it
  tdCheckpoint() {
    const clone = o => JSON.parse(JSON.stringify(o));
    this.tdSave = {
      wave: this.td.wave, td: clone(this.td), eagleArmor: this.eagleArmor, terrain: this.terrain.slice(), built: [...(this.tdBuilt || [])],
      towers: this.towers.map(tw => Object.assign(clone(Object.assign({}, tw, { owner: null })), { owner: tw.owner })),
      turrets: this.turrets.map(tu => Object.assign({}, tu)),
      players: this.players.map(p => clone(Object.assign({}, p, { tank: null, tdMenu: null }))),
    };
  },

  tdRestartWave() {
    const sv = this.tdSave;
    if (!sv) return false;
    this.td = JSON.parse(JSON.stringify(sv.td));
    this.td.timer = TD_BUILD;
    this.eagleArmor = sv.eagleArmor; this.eagleFlash = 0; this.eagleInv = 0;
    this.terrain.set(sv.terrain); this.dirty = true;
    this.tdBuilt = new Set(sv.built);
    this.towers = sv.towers.map(tw => Object.assign({}, tw, { cd: 30, flash: 0, busy: false }));
    this.turrets = sv.turrets.map(tu => Object.assign({}, tu));
    this.tanks = []; this.bullets = []; this.spawns = []; this.mines = []; this.fx = []; this.popups = [];
    this.tdShots = []; this.tdBeams = []; this.tdSparks = []; this.wfx = []; this.wshots = [];
    this.flames = []; this.shells = []; this.heals = []; this.strikes = []; this.claudes = [];
    this.powerup = null; this.freezeE = 0; this.freezeP = 0; this.mark = null;
    this.baseAlive = true; this.over = false; this.overTimer = 0; this.result = null;
    if (this.fires) this.fires.clear();
    this.players.forEach((p, i) => {
      Object.assign(p, JSON.parse(JSON.stringify(sv.players[i])), { tank: null, tdMenu: null });
      if (!p.out) this.spawnPlayer(p, 0);
    });
    this.popups.push({ x: (this.camX || 0) + VIEW_W / 2, y: (this.camY || 0) + 40, text: 'WAVE ' + (this.td.wave + 1) + ' AGAIN', label: true, color: COL.gold, t: 0, delay: 0, life: 120 });
    return true;
  },

  // the enemy fights back: heavy tanks stop and shell a tower lined up with them; anything that reaches the fortress
  // rams it and blows up, costing the eagle HP
  tdSiege() {
    const ex = BASE_X + 8, ey = BASE_Y + 8;
    for (const t of this.tanks) {
      if (!t.alive || t.isPlayer || t.mirage || t.burrow > 0) continue;
      if (t.siege === undefined) t.siege = !!t.titan || [2, 3, 4, 5, 9].includes(t.type) || Math.random() < 0.3;
      if (Math.hypot(t.x + 8 - ex, t.y + 8 - ey) < TD_BREACH_RANGE) { this.tdBreach(t); continue; }
      // a tank that hasn't got anywhere for 20 s (wedged somewhere) goes back to an entry point, so a wave can't stall
      if (!t.tdLast || Math.abs(t.x - t.tdLast[0]) + Math.abs(t.y - t.tdLast[1]) > 8) t.tdLast = [t.x, t.y, this.frame];
      else if (this.frame - t.tdLast[2] > 1200 && !(t.stun > 0)) {
        const [sx, sy] = this.tdOpen()[rnd(this.tdOpen().length)];
        if (!this.tanks.some(o => o !== t && o.alive && overlap(o.x, o.y, 16, 16, sx, sy, 16, 16))) { t.x = sx; t.y = sy; t.hold = 0; t.nav = null; }
        t.tdLast = [t.x, t.y, this.frame];
      }
      if (!t.siege || t.stun > 0 || t.cool > 0 || t.bullets > 0 || this.freezeE > 0 || (this.frame + t.x) % 15) continue;
      let best = null, bd = TD_SIEGE_RANGE;
      for (const tw of this.towers) {
        const dx = tw.x - t.x, dy = tw.y - t.y, d = Math.abs(dx) + Math.abs(dy);
        if (d >= bd || (Math.abs(dx) >= 8 && Math.abs(dy) >= 8) || !this.clearLine(t.x + 8, t.y + 8, tw.x + 8, tw.y + 8)) continue;
        best = Math.abs(dx) < 8 ? (dy < 0 ? 0 : 2) : (dx < 0 ? 3 : 1); bd = d;
      }
      if (best === null) continue;
      this.turn(t, best);
      t.hold = 24;
      this.fire(t);
      t.cool = t.titan ? 30 : 50;
    }
  },

  tdBreach(t) {
    const n = t.titan ? 6 : TD_BREACH[t.type] || 1;
    this.popups.push({ x: BASE_X + 8, y: BASE_Y - 8, text: '-' + n, label: true, color: COL.red, t: 0, delay: 0, life: 70 });
    this.killEnemy(t, null, false);
    const left = this.eagleArmor - n;   // eagleArmor is HP - 1
    if (left < 0) { this.eagleArmor = 0; this.eagleInv = 0; this.destroyBase(); return; }
    this.eagleArmor = left; this.eagleFlash = 30;
    this.addFx(BASE_X + 8, BASE_Y + 8, Sprites.smallExp, 3);
    Sound.play('armor');
  },

  // the entry points in use: a map with several opens them one at a time, a new one every 5 waves
  tdOpen(wave = this.td.wave) { return this.td.spawns.slice(0, Math.max(1, Math.min(this.td.spawns.length, 1 + Math.floor((wave - 1) / 5)))); },

  tdStartWave() {
    const td = this.td;
    td.wave++;
    if (td.wave > 1 && this.tdOpen().length > this.tdOpen(td.wave - 1).length) {
      const [x, y] = this.tdOpen()[this.tdOpen().length - 1];
      this.popups.push({ x: x + 8, y: y + 20, text: 'NEW ENTRY OPEN!', label: true, color: '#F83800', t: 0, delay: 0, life: 150 });
    }
    const w = td.next;
    td.list = w.list.slice(); td.gap = w.gap; td.kind = w.kind; td.spawnT = 30; td.spawned = 0;
    td.phase = 'wave';
    td.next = td.wave < td.waves ? tdWave(td.wave + 1, td.lv, td.season, td.k) : null;
    this.popups.push({ x: (this.camX || 0) + VIEW_W / 2, y: (this.camY || 0) + 40, text: 'WAVE ' + td.wave + (w.kind !== 'MIXED' ? ': ' + w.kind : ''), label: true, color: w.kind === 'BOSS' ? '#F83800' : COL.gold, t: 0, delay: 0, life: 120 });
    Sound.play(w.kind === 'BOSS' ? 'bossWarn' : 'puAppear');
  },

  // call the next wave now: gold for the time left
  tdSendWave() {
    const td = this.td;
    if (td.phase !== 'build') return;
    const bonus = Math.ceil(td.timer / 60) * 2;
    if (bonus > 0) { td.gold += bonus; this.popups.push({ x: (this.camX || 0) + VIEW_W / 2, y: (this.camY || 0) + 56, text: 'EARLY +' + bonus, label: true, color: COL.gold, t: 0, delay: 0, life: 90 }); }
    this.tdStartWave();
  },

  tdWaveCleared() {
    const td = this.td;
    const gold = 20 + 2 * td.wave;
    const interest = Math.min(TD_INTEREST_MAX, Math.floor(td.gold * TD_INTEREST));
    const mines = this.towers.filter(t => t.kind === 'mine').reduce((a, t) => a + this.towerStat(t).income, 0);
    td.gold += gold + interest + mines;
    for (const t of this.towers) if (t.kind === 'mine') this.popups.push({ x: t.x + 8, y: t.y, text: '+' + this.towerStat(t).income, label: true, color: COL.gold, t: 0, delay: 0, life: 70 });
    this.popups.push({ x: (this.camX || 0) + VIEW_W / 2, y: (this.camY || 0) + 40, text: 'WAVE ' + td.wave + ' HELD +' + gold + (interest ? '  INTEREST +' + interest : ''), label: true, color: COL.gold, t: 0, delay: 0, life: 150 });
    for (const p of this.players) if (!p.out) this.addXp(p, 10 + td.wave);
    Sound.play('bonus');
    if (td.wave >= td.waves) {
      td.won = true;
      const f = (this.eagleArmor + 1) / td.maxHp;
      td.stars = f >= 0.9 ? 3 : f >= 0.5 ? 2 : 1;
      this.popups.push({ x: (this.camX || 0) + VIEW_W / 2, y: (this.camY || 0) + 70, text: 'VICTORY! ' + '*'.repeat(td.stars), label: true, color: COL.gold, t: 0, delay: 0, life: 300 });
      Sound.play('levelUp');
      return;
    }
    td.phase = 'build'; td.timer = TD_BUILD;
  },

  // ------------------------------------------------------------ towers
  towerStat(tw) {
    const T = TOWERS[tw.kind], s = Object.assign({}, T.lv[Math.min(tw.lv, T.lv.length) - 1]);
    if (tw.spec !== undefined) {
      const sp = T.specs[tw.spec], k = TD_TIER[tw.stier || 1];
      for (const key in sp) if (!['key', 'name', 'desc', 'cost', 't3', 't3desc'].includes(key)) s[key] = sp[key];
      if (s.dmg) s.dmg *= k.dmg;
      if (s.dps) s.dps *= k.dmg;
      if (s.range) s.range += k.range;
      if (s.cd) s.cd = Math.round(s.cd * k.cd);
      if (s.slow) s.slow *= k.slow;
      if (s.splash) s.splash += k.splash;
      if (s.chain) s.chain += k.chain;
      if (tw.stier >= 3) Object.assign(s, sp.t3);
    }
    // a radar nearby stretches the range
    let boost = 0;
    for (const r of this.towers) if (r.kind === 'radar' && r !== tw && Math.hypot(r.x - tw.x, r.y - tw.y) <= TD_BUFF_RANGE) boost = Math.max(boost, TOWERS.radar.lv[r.lv - 1].boost);
    if (s.range && tw.kind !== 'radar') s.range = Math.round(s.range * (1 + boost));
    return s;
  },

  towerAt(x, y) { return (this.towers || []).find(t => t.x === x && t.y === y); },

  // what a tower can see: enemies in range (stealthy ones only when revealed, underground or airborne never)
  tdTargets(tw, s, cx, cy) {
    const out = [];
    for (const t of this.tanks) {
      if (!t.alive || t.isPlayer || t.burrow > 0 || t.hopT > 0) continue;
      if (t.stealth && !(t.reveal > 0) && !s.seeStealth) continue;
      const d = Math.hypot(t.x + 8 - cx, t.y + 8 - cy);
      if (d <= s.range && !(s.min && d < s.min)) out.push([t, d]);
    }
    return out;
  },

  tdPick(tw, list) {
    if (!list.length) return null;
    const mode = TD_TARGETS[tw.target || 0];
    if (mode === 'CLOSE') return list.reduce((a, b) => (b[1] < a[1] ? b : a))[0];
    if (mode === 'STRONG') return list.reduce((a, b) => (b[0].hp > a[0].hp ? b : a))[0];
    // first / last: along the way to the eagle
    const dist = this.navBase(''), NX = COLS * 2 - 1, NY = ROWS * 2 - 1;
    const left = t => { const v = dist[Math.max(0, Math.min(NY - 1, Math.round(t.y / 8))) * NX + Math.max(0, Math.min(NX - 1, Math.round(t.x / 8)))]; return v === Infinity ? 1e6 : v; };
    return list.reduce((a, b) => ((mode === 'FIRST' ? left(b[0]) < left(a[0]) : left(b[0]) > left(a[0])) ? b : a))[0];
  },

  updateTowers() {
    for (const t of this.tanks) {
      if (t.isPlayer) continue;
      t.chill = 1; t.brittle = 0;
      if (t.shred > 0) t.shred--;
      // afterburn (inferno III)
      if (t.burn > 0 && t.alive) { t.burn--; if (this.frame % 6 === 0) this.tdHit(t, 0.35, t.burnBy, true); }
    }
    // radars first (they reveal), frost auras next (they slow and make brittle), then the guns
    const order = this.towers.slice().sort((a, b) => (a.kind === 'radar' ? 0 : a.kind === 'frost' ? 1 : 2) - (b.kind === 'radar' ? 0 : b.kind === 'frost' ? 1 : 2));
    for (const tw of order) {
      if (tw.flash > 0) tw.flash--;
      if (tw.cd > 0) tw.cd--;
      if (this.freezeP > 0) continue;
      const s = this.towerStat(tw), cx = tw.x + 8, cy = tw.y + 8;
      if (tw.kind === 'mine') continue;
      if (tw.kind === 'radar') {
        for (const t of this.tanks) if (t.alive && !t.isPlayer && Math.hypot(t.x + 8 - cx, t.y + 8 - cy) <= s.range) t.reveal = Math.max(t.reveal || 0, 8);
        tw.ang = (tw.ang || 0) + 0.08;
        continue;
      }
      const list = this.tdTargets(tw, s, cx, cy);
      if (tw.kind === 'frost') {
        for (const [t] of list) {
          t.chill = Math.min(t.chill || 1, t.titan ? Math.max(0.7, s.slow) : s.slow);
          if (s.brittle) t.brittle = Math.max(t.brittle || 0, s.brittle);
          if (s.freeze && !t.titan && this.frame % 60 === 0 && Math.random() < 0.25) t.stun = 40;   // blizzard III
          if (s.dps && this.frame % 6 === 0) this.tdHit(t, s.dps * 0.1, tw, true);
        }
        tw.busy = list.length > 0;
        continue;
      }
      const target = this.tdPick(tw, list);
      tw.busy = !!target;
      if (!target) continue;
      tw.ang = Math.atan2(target.y + 8 - cy, target.x + 8 - cx);
      if (tw.kind === 'flame') {
        if (this.frame % 6 === 0) {
          for (const [t, d] of list) {
            const a = Math.atan2(t.y + 8 - cy, t.x + 8 - cx), diff = Math.abs(((a - tw.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
            if (diff < 0.5 || d < 12) { this.tdHit(t, s.dps * 0.1, tw, true); if (s.afterburn) { t.burn = 120; t.burnBy = tw; } }
          }
          if (s.napalm && this.fires) this.igniteAt(target.x + 8, target.y + 8, s.napalm, true, true);
        }
        for (let k = 0; k < 2; k++) {
          const a = tw.ang + (Math.random() - 0.5) * 0.8, v = 1.5 + Math.random() * 1.5;
          this.tdSparks.push({ x: cx + Math.cos(tw.ang) * 6, y: cy + Math.sin(tw.ang) * 6, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: Math.round(s.range / v), fire: true });
        }
        if (this.frame % 24 === 0) Sound.play('flame');
        continue;
      }
      if (tw.cd > 0) continue;
      tw.cd = s.cd;
      if (tw.kind === 'tesla') {
        const hit = [target], pts = [[cx, cy - 6], [target.x + 8, target.y + 8]];
        while (hit.length < s.chain) {
          const last = hit[hit.length - 1];
          let best = null, bd = 44;
          for (const t of this.tanks) {
            if (!t.alive || t.isPlayer || hit.includes(t) || t.burrow > 0 || (t.stealth && !(t.reveal > 0))) continue;
            const d = Math.hypot(t.x - last.x, t.y - last.y);
            if (d < bd) { bd = d; best = t; }
          }
          if (!best) break;
          hit.push(best); pts.push([best.x + 8, best.y + 8]);
        }
        for (const t of hit) { this.tdHit(t, s.dmg, tw, false); if (s.stun && !t.titan) t.stun = s.stun; }
        this.tdBeams.push({ pts, t: 10, color: s.stun ? '#7CB8F8' : '#F8F8A0' });
        Sound.play('zap');
      } else if (tw.kind === 'cannon') {
        const lead = (target.speed || 0.5) * 20, tx = target.x + 8 + DXY[target.dir][0] * lead, ty = target.y + 8 + DXY[target.dir][1] * lead;
        this.tdShots.push({ kind: 'shell', x: cx, y: cy, x0: cx, y0: cy, tx, ty, p: 0, dp: 2.2 / Math.max(20, Math.hypot(tx - cx, ty - cy)), dmg: s.dmg, splash: s.splash, cluster: s.cluster, stun: s.stunBoom, tw });
        Sound.play('mortar');
      } else if (tw.kind === 'rocket') {
        const targets = s.salvo ? list.map(q => q[0]).sort(() => Math.random() - 0.5).slice(0, s.salvo) : [target];
        while (s.salvo && targets.length < s.salvo) targets.push(target);
        targets.forEach((t, k) => this.tdShots.push({ kind: 'rocket', x: cx, y: cy - 4, vx: Math.cos(tw.ang + (k - 1.5) * 0.4) * 0.8, vy: Math.sin(tw.ang + (k - 1.5) * 0.4) * 0.8, target: t, dmg: s.dmg, splash: s.blast || 8, pierce: s.pierce, tw, life: 240 }));
        Sound.play('mortar');
      } else {
        // gun, gatling, sniper
        const crit = s.crit && Math.random() < s.crit;
        this.tdShots.push({ kind: 'bullet', x: cx + Math.cos(tw.ang) * 7, y: cy + Math.sin(tw.ang) * 7, target, speed: s.fast ? 9 : 5, dmg: s.dmg * (crit ? 4 : 1), shred: s.shred, crit, tw, life: 90 });
        if (tw.spec !== 0 || this.frame % 3 === 0) Sound.play('shot');
      }
    }
  },

  updateTdShots() {
    for (const s of this.tdShots) {
      if (s.kind === 'shell') {
        s.p += s.dp;
        s.x = s.x0 + (s.tx - s.x0) * s.p; s.y = s.y0 + (s.ty - s.y0) * s.p;
        if (s.p >= 1) { s.done = true; this.tdBoom(s.tx, s.ty, s.splash, s.dmg, s.tw, null, s.stun); if (s.cluster) for (let k = 0; k < s.cluster; k++) { const a = k * Math.PI * 2 / s.cluster + 0.6; this.tdShots.push({ kind: 'shell', bomblet: true, x: s.tx, y: s.ty, x0: s.tx, y0: s.ty, tx: s.tx + Math.cos(a) * 16, ty: s.ty + Math.sin(a) * 16, p: 0, dp: 0.08, dmg: s.dmg * 0.5, splash: 10, tw: s.tw }); } }
        continue;
      }
      if (--s.life <= 0) { s.done = true; continue; }
      const t = s.target, alive = t && t.alive && !(t.burrow > 0);
      if (alive) { s.tx = t.x + 8; s.ty = t.y + 8; }
      if (s.tx === undefined) { s.done = true; continue; }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
      if (s.kind === 'rocket') {
        // a rocket turns towards its target and speeds up
        const sp = Math.min(4, Math.hypot(s.vx, s.vy) + 0.12);
        s.vx += (dx / Math.max(1, d)) * 0.5; s.vy += (dy / Math.max(1, d)) * 0.5;
        const k = sp / Math.max(0.01, Math.hypot(s.vx, s.vy));
        s.vx *= k; s.vy *= k;
        if (this.frame % 2 === 0) this.tdSparks.push({ x: s.x, y: s.y, vx: 0, vy: 0, t: 12, smoke: true });
        s.x += s.vx; s.y += s.vy;
        if (Math.hypot(s.tx - s.x, s.ty - s.y) < 5) { s.done = true; if (alive) this.tdHit(t, s.dmg, s.tw, false, s.pierce); this.tdBoom(s.tx, s.ty, s.splash, s.dmg * 0.4, s.tw, t); }
        continue;
      }
      if (d <= s.speed + 2) {
        s.done = true;
        if (alive) { this.tdHit(t, s.dmg, s.tw, false); if (s.shred) t.shred = 120; }
        if (alive && s.crit) this.popups.push({ x: t.x + 8, y: t.y, text: 'CRIT', label: true, color: COL.gold, t: 0, delay: 0, life: 30 });
        continue;
      }
      s.x += dx / d * s.speed; s.y += dy / d * s.speed;
    }
    this.tdShots = this.tdShots.filter(s => !s.done);
  },

  // a blast at (x, y): everything within r takes dmg (except skip)
  tdBoom(x, y, r, dmg, tw, skip, stun) {
    this.addFx(x, y, r >= 20 ? BIG_EXPLOSION() : Sprites.smallExp, r >= 20 ? 4 : 3);
    for (const t of this.tanks.slice()) {
      if (!t.alive || t.isPlayer || t === skip || t.burrow > 0 || t.hopT > 0) continue;
      if (Math.hypot(t.x + 8 - x, t.y + 8 - y) <= r + 6) { this.tdHit(t, dmg, tw, true); if (stun && !t.titan) t.stun = Math.max(t.stun || 0, stun); }
    }
    this.explosionHeat(x, y, r);
  },

  // a tower's damage on an enemy (fractions add up; a shield plate takes most of a hit from the front)
  tdHit(t, dmg, tw, splash, pierce) {
    if (!t.alive) return;
    if (t.mirage) { this.vanishMirage(t, true); return; }
    if (t.frontShield && !pierce && tw) {
      const [fx, fy] = DXY[t.dir], ax = tw.x - t.x, ay = tw.y - t.y, d = Math.hypot(ax, ay) || 1;
      if ((ax * fx + ay * fy) / d > 0.7) dmg *= 0.25;
    }
    if (t.brittle) dmg *= t.brittle;   // shatter: 2x (3x at tier III)
    if (t.shred > 0) dmg *= 1.3;       // gatling III
    t.reveal = Math.max(t.reveal || 0, 20);
    t.tdAcc = (t.tdAcc || 0) + dmg;
    let n = Math.floor(t.tdAcc);
    t.tdAcc -= n;
    if (n <= 0 || t.shield > 0) return;
    while (n-- > 0 && t.alive) {
      if (t.bonus) { t.bonus = false; this.spawnPowerup(); }
      t.hp--;
      if (t.hp <= 0) {
        this.killEnemy(t, gunner(tw && tw.owner), true);
        if (kindOf(t) === 'splitter' && !splash) this.split(t);
      }
    }
  },

  // gold for a kill
  tdKillGold(t) { if (this.td && !t.mirage) this.td.gold += Math.round(((t.titan ? 40 : Math.ceil(ENEMY[t.type].pts / 80)) + Math.floor(this.td.wave / 6)) * TD_GOLD_MULT[this.td.lv]); },

  // enemy shells on towers (true if the shell stopped there)
  bulletTower(b) {
    const tw = this.towers.find(q => overlap(b.x, b.y, 4, 4, q.x, q.y, 16, 16));
    if (!tw) return false;
    this.killBullet(b, true);
    this.damageTower(tw, b.power ? 2 : 1);
    return true;
  },

  damageTower(tw, n) {
    tw.hp -= n; tw.flash = 10;
    if (tw.hp > 0) { Sound.play('armor'); return; }
    this.towers.splice(this.towers.indexOf(tw), 1);
    this.terrainVer++;
    this.addFx(tw.x + 8, tw.y + 8, BIG_EXPLOSION(), 5);
    this.popups.push({ x: tw.x + 8, y: tw.y, text: TOWERS[tw.kind].name + ' LOST', label: true, color: COL.red, t: 0, delay: 0, life: 90 });
    Sound.play('explode');
  },

  // ------------------------------------------------------------ building
  // the tile in front of a tank (where it builds)
  tdSpot(t) {
    const x = Math.floor((t.x + 8 + DXY[t.dir][0] * 16) / 16) * 16, y = Math.floor((t.y + 8 + DXY[t.dir][1] * 16) / 16) * 16;
    return [x, y];
  },

  tdSpotKind(x, y) {
    if (x < 0 || y < 0 || x > FW - 16 || y > FH - 16) return 'off';
    if (this.towerAt(x, y)) return 'tower';
    let brick = 0, steel = 0, bad = 0;
    for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
      const v = this.get(cx, cy);
      if (v === T_BRICK) brick++; else if (v === T_STEEL) steel++; else if (v === T_WATER || isBelt(v)) bad++;
    }
    if (bad) return 'off';
    if (steel === 16 && this.tdBuilt && this.tdBuilt.has(x + ',' + y)) return 'wall';
    if (brick === 16 && this.tdBuilt && this.tdBuilt.has(x + ',' + y)) return 'wall';
    if (brick || steel) return 'off';
    if (overlap(x, y, 16, 16, BASE_X - 16, BASE_Y - 16, 48, 32)) return 'off';
    if (this.td.spawns.some(([sx, sy]) => overlap(x, y, 16, 16, sx, sy, 16, 16))) return 'off';
    if (this.tanks.some(t => t.alive && overlap(x, y, 16, 16, t.x, t.y, 16, 16))) return 'busy';
    return 'free';
  },

  // would this (tower or steel) still leave the enemy a way to the eagle from every entry point?
  tdLeavesPath(place, undo) {
    place();
    this.terrainVer++; this.navCost = {}; this.navBaseF = {};
    const dist = this.navBase(''), NX = COLS * 2 - 1;
    const ok = this.td.spawns.every(([x, y]) => dist[(y >> 3) * NX + (x >> 3)] < Infinity);
    if (!ok) { undo(); this.terrainVer++; this.navCost = {}; this.navBaseF = {}; }
    return ok;
  },

  // the menu for the spot in front of a player's tank
  tdMenuItems(p, x, y) {
    const td = this.td, kind = this.tdSpotKind(x, y), items = [], g = td.gold;
    const tw = kind === 'tower' && this.towerAt(x, y);
    if (td.phase === 'build') items.push({ key: 'send', label: 'SEND WAVE ' + (td.wave + 1), desc: 'NOW: +' + Math.ceil(td.timer / 60) * 2 + ' GOLD', price: 0, icon: '>>' });
    if (tw) {
      const T = TOWERS[tw.kind];
      if (tw.spec === undefined && tw.lv < T.lv.length) items.push({ key: 'up', label: 'LEVEL ' + (tw.lv + 1) + '/' + T.lv.length, desc: T.name, price: T.cost[tw.lv], icon: '^' });
      if (tw.spec === undefined && tw.lv === T.lv.length) T.specs.forEach((s, i) => items.push({ key: 'spec' + i, label: s.name + ' I', desc: s.desc, price: s.cost[0], icon: tw.kind, spec: i }));
      if (tw.spec !== undefined && (tw.stier || 1) < 3) {
        const sp = T.specs[tw.spec], k = tw.stier || 1;
        items.push({ key: 'sup', label: sp.name + ' ' + TD_TIER_NAMES[k], desc: k === 2 ? sp.t3desc : 'STRONGER, FARTHER, FASTER', price: sp.cost[k], icon: '^' });
      }
      if (tw.kind !== 'mine' && tw.kind !== 'radar' && tw.kind !== 'frost') items.push({ key: 'target', label: 'AIM: ' + TD_TARGETS[tw.target || 0], desc: 'FIRE: CHANGE', price: 0, icon: '+' });
      if (tw.hp < tw.max) items.push({ key: 'repair', label: 'REPAIR', desc: 'BACK TO FULL STRENGTH', price: Math.ceil((tw.max - tw.hp) / tw.max * tw.spent * 0.3), icon: 'R' });
      items.push({ key: 'sell', label: 'SELL +' + Math.floor(tw.spent * TD_SELL), desc: tw.spec !== undefined ? T.specs[tw.spec].name + ' ' + TD_TIER_NAMES[(tw.stier || 1) - 1] : T.name + ' L' + tw.lv, price: 0, icon: 'coin' });
    } else if (kind === 'wall') {
      items.push({ key: 'remove', label: 'REMOVE WALL', desc: 'GIVES BACK HALF', price: 0, icon: 'X' });
    } else if (kind === 'free' || kind === 'busy') {
      for (const k of TOWER_KINDS) items.push({ key: 'build', tower: k, label: TOWERS[k].name, desc: TOWERS[k].desc, price: TOWERS[k].cost[0], icon: k });
      items.push({ key: 'wall', wall: 'brick', label: TD_WALLS.brick.name, desc: TD_WALLS.brick.desc, price: TD_WALLS.brick.cost, icon: 'brick' });
      items.push({ key: 'wall', wall: 'steel', label: TD_WALLS.steel.name, desc: TD_WALLS.steel.desc, price: TD_WALLS.steel.cost, icon: 'steel' });
    }
    for (const a in TD_ABILITIES) {
      const A = TD_ABILITIES[a], c = td.cool[a];
      items.push({ key: 'ability', ability: a, label: A.name + (c > 0 ? ' ' + Math.ceil(c / 60) + 'S' : ''), desc: A.desc, price: A.cost, icon: a, wait: c > 0 });
    }
    items.push({ key: 'close', label: 'CLOSE', desc: kind === 'off' ? "CAN'T BUILD HERE" : kind === 'busy' ? 'A TANK IS IN THE WAY' : '', price: 0, icon: 'X' });
    for (const it of items) it.ok = !it.wait && it.price <= g && !(it.key === 'build' || it.key === 'wall' ? kind !== 'free' : false);
    return items;
  },

  // a player's B button and menu (true: the tank does nothing else this frame)
  fortressInput(t, p, inp) {
    const pressed = inp.dir >= 0 && inp.dir !== p.tdDir;
    p.tdDir = inp.dir;
    const m = p.tdMenu;
    if (!m) {
      if (inp.altPressed) { const [x, y] = this.tdSpot(t); p.tdMenu = { x, y, idx: 0 }; Sound.play('select'); t.moving = false; return true; }
      return false;
    }
    t.moving = false;
    const items = this.tdMenuItems(p, m.x, m.y);
    m.idx = Math.min(m.idx, items.length - 1);
    if (pressed && (inp.dir === 1 || inp.dir === 0)) { m.idx = (m.idx + 1) % items.length; Sound.play('select'); }
    if (pressed && (inp.dir === 3 || inp.dir === 2)) { m.idx = (m.idx + items.length - 1) % items.length; Sound.play('select'); }
    if (inp.altPressed) { p.tdMenu = null; return true; }
    if (inp.firePressed) this.tdChoose(p, t, items[m.idx]);
    return true;
  },

  tdChoose(p, t, it) {
    const td = this.td, m = p.tdMenu, x = m.x, y = m.y;
    if (it.key === 'close') { p.tdMenu = null; return; }
    if (it.key === 'target') { const tw = this.towerAt(x, y); tw.target = ((tw.target || 0) + 1) % TD_TARGETS.length; Sound.play('select'); return; }
    if (!it.ok) { this.tdMsg(p, it.wait ? 'NOT READY YET' : it.price > td.gold ? 'NOT ENOUGH GOLD' : "CAN'T BUILD HERE"); Sound.play('steel'); return; }
    if (it.key === 'send') { this.tdSendWave(); p.tdMenu = null; return; }
    if (it.key === 'ability') {
      td.gold -= it.price; td.cool[it.ability] = TD_ABILITIES[it.ability].cool;
      if (it.ability === 'strike') this.callAirstrike(true, gunner(p)); else this.spawnWingman(p);
      p.tdMenu = null; return;
    }
    if (it.key === 'build') {
      const T = TOWERS[it.tower], tw = { x, y, kind: it.tower, lv: 1, hp: T.hp, max: T.hp, cd: 30, target: 0, owner: p, spent: it.price, flash: 0, ang: -Math.PI / 2 };
      if (!this.tdLeavesPath(() => this.towers.push(tw), () => this.towers.splice(this.towers.indexOf(tw), 1))) { this.tdMsg(p, 'THAT WOULD SHUT THE WAY'); Sound.play('steel'); return; }
      td.gold -= it.price;
      this.addFx(x + 8, y + 8, [Sprites.sparkle[0], Sprites.sparkle[1], Sprites.sparkle[2]], 4);
      Sound.play('build');
      return;
    }
    if (it.key === 'wall') {
      const v = it.wall === 'steel' ? T_STEEL : T_BRICK, set = val => { for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) this.set(cx, cy, val); };
      if (v === T_STEEL && !this.tdLeavesPath(() => set(T_STEEL), () => set(T_EMPTY))) { this.tdMsg(p, 'THAT WOULD SHUT THE WAY'); Sound.play('steel'); return; }
      if (v === T_BRICK) set(T_BRICK);
      (this.tdBuilt || (this.tdBuilt = new Set())).add(x + ',' + y);
      this.origTerrain = this.terrain.slice();
      td.gold -= it.price;
      Sound.play('build');
      return;
    }
    if (it.key === 'remove') {
      const brick = this.get(x >> 2, y >> 2) === T_BRICK;
      for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) this.set(cx, cy, T_EMPTY);
      this.tdBuilt.delete(x + ',' + y);
      td.gold += Math.floor((brick ? TD_WALLS.brick.cost : TD_WALLS.steel.cost) / 2);
      Sound.play('brick');
      return;
    }
    const tw = this.towerAt(x, y);
    if (!tw) return;
    if (it.key === 'up') { td.gold -= it.price; tw.spent += it.price; tw.lv++; tw.max += 3; tw.hp = tw.max; Sound.play('levelUp'); this.addFx(x + 8, y + 8, [Sprites.sparkle[0], Sprites.sparkle[1]], 4); }
    else if (it.key === 'sup') { td.gold -= it.price; tw.spent += it.price; tw.stier = (tw.stier || 1) + 1; tw.max += 4; tw.hp = tw.max; Sound.play('levelUp'); this.addFx(x + 8, y + 8, [Sprites.sparkle[0], Sprites.sparkle[1], Sprites.sparkle[2]], 5); }
    else if (it.key.startsWith('spec')) { td.gold -= it.price; tw.spent += it.price; tw.spec = it.spec; tw.stier = 1; tw.max += 6; tw.hp = tw.max; Sound.play('levelUp'); this.addFx(x + 8, y + 8, [Sprites.sparkle[0], Sprites.sparkle[1], Sprites.sparkle[2]], 5); }
    else if (it.key === 'repair') { td.gold -= it.price; tw.hp = tw.max; Sound.play('heal'); }
    else if (it.key === 'sell') {
      td.gold += Math.floor(tw.spent * TD_SELL);
      this.towers.splice(this.towers.indexOf(tw), 1);
      this.terrainVer++;
      Sound.play('pickup');
      p.tdMenu = null;
    }
  },

  tdMsg(p, text) { if (p.tank) this.popups.push({ x: p.tank.x + 8, y: p.tank.y - 4, text, label: true, color: COL.red, t: 0, delay: 0, life: 60 }); },

  // ------------------------------------------------------------ drawing
  // a tower: a steel plate with its kind on top, level pips, a spec star, an HP bar when damaged
  drawTower(ctx, tw, x = tw.x, y = tw.y, ghost) {
    const f = this.frame, a = tw.ang === undefined ? -Math.PI / 2 : tw.ang, cx = x + 8, cy = y + 8, sp = tw.spec !== undefined;
    const lvCol = ['#ADADAD', '#F0BC3C', '#58D854', '#3CBCFC', '#F878F8'][Math.max(0, Math.min(4, (tw.lv || 1) - 1))];
    if (ghost) ctx.globalAlpha = 0.55;
    ctx.drawImage(Sprites.turretBase, x, y);
    const R = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(cx + dx), Math.round(cy + dy), w, h); };
    const barrel = (len, w, c) => { for (let k = 2; k <= len; k++) R(Math.cos(a) * k - w / 2, Math.sin(a) * k - w / 2, w, w, c); };
    switch (tw.kind) {
      case 'gun':
        R(-4, -4, 8, 8, '#3C3C3C'); R(-3, -3, 6, 6, sp ? (tw.spec ? '#3878C8' : '#C83C20') : lvCol);
        barrel(tw.spec === 1 ? 9 : 7, tw.spec === 0 ? 3 : 2, '#F8F8F8'); break;
      case 'cannon':
        R(-5, -4, 10, 9, '#1C1C1C'); R(-4, -3, 8, 7, sp ? (tw.spec ? '#C87C28' : '#7C7C7C') : '#5C5C5C'); R(-2, -2, 3, 2, lvCol);
        barrel(tw.spec === 0 ? 9 : 7, 3, '#ADADAD'); break;
      case 'tesla': {
        R(-3, -1, 6, 6, '#3C3C50'); for (let k = 0; k < 3; k++) R(-4 + (k & 1), 3 - k * 3, 8 - 2 * (k & 1), 1, '#C87C28');
        R(-2, -7, 4, 4, (f >> 2) & 1 ? '#F8F8A0' : (tw.spec === 1 ? '#7CB8F8' : lvCol)); break;
      }
      case 'frost':
        R(-1, -6, 2, 12, '#B8E8F8'); R(-6, -1, 12, 2, '#B8E8F8'); R(-4, -4, 2, 2, '#7CC8F8'); R(2, -4, 2, 2, '#7CC8F8'); R(-4, 2, 2, 2, '#7CC8F8'); R(2, 2, 2, 2, '#7CC8F8');
        R(-2, -2, 4, 4, tw.spec === 1 ? '#F8F8F8' : tw.spec === 0 ? '#3C78F8' : lvCol); break;
      case 'flame':
        R(-4, -3, 8, 8, '#7C1C00'); R(-3, -2, 6, 6, tw.spec === 0 ? '#F8D878' : '#D82800'); R(-1, -1, 2, 2, lvCol);
        barrel(7, 2, '#3C3C3C'); if (tw.busy && (f >> 1) & 1) R(Math.cos(a) * 8 - 1, Math.sin(a) * 8 - 1, 3, 3, '#F8B800'); break;
      case 'rocket':
        R(-5, -4, 10, 9, '#2C3C1C'); R(-4, -3, 8, 7, '#587C38');
        for (let k = 0; k < (tw.spec === 0 ? 4 : 2); k++) R(-3 + (k % 2) * 4, -3 + (k >> 1) * 4, 2, 2, tw.spec === 1 ? '#F83800' : '#F8F8F8');
        R(-1, 3, 2, 1, lvCol); break;
      case 'radar': {
        R(-1, -2, 2, 7, '#7C7C7C');
        const r = tw.ang || 0;
        for (let k = -4; k <= 4; k++) R(Math.cos(r) * k - 0.5, -3 + Math.sin(r) * k * 0.4, 1, 1, '#F8F8F8');
        R(-1, -4, 2, 2, (f >> 3) & 1 ? '#F83800' : lvCol); break;
      }
      case 'mine':
        R(-5, 0, 10, 5, '#5C3C1C'); R(-4, -3, 8, 4, '#F8B800'); R(-2, -5, 4, 2, '#F8D878');
        if ((f + x) % 60 < 6) R(1, -4, 1, 1, '#F8F8F8'); R(-1, 2, 2, 1, lvCol); break;
    }
    if (ghost) { ctx.globalAlpha = 1; return; }
    for (let k = 0; k < (tw.lv || 1); k++) R(-7 + k * 3, 5, 2, 2, lvCol);
    if (sp) { R(4, 4, 3, 3, (f >> 3) & 1 ? '#F8F8F8' : COL.gold); for (let k = 0; k < (tw.stier || 1); k++) R(6, 2 - k * 3, 2, 2, COL.gold); }
    if (tw.flash > 0 && (tw.flash >> 1) & 1) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x, y, 16, 16); }
    if (tw.hp < tw.max) {
      ctx.fillStyle = COL.black; ctx.fillRect(x, y - 4, 16, 3);
      ctx.fillStyle = tw.hp / tw.max > 0.4 ? '#58D854' : '#F83800'; ctx.fillRect(x + 1, y - 3, Math.max(1, Math.round(14 * tw.hp / tw.max)), 1);
    }
  },

  ring(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    const n = Math.max(24, Math.round(r));
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + this.frame * 0.01; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1); }
  },

  renderTowers(ctx) {
    if (!this.td) return;
    // titans glow red
    for (const t of this.tanks) if (t.alive && t.titan) ctx.drawImage(Sprites.outline(Sprites.tank('e3', t.anim || 0, t.dir, 'green'), (this.frame >> 2) & 1 ? '#F83800' : '#F8B800'), t.x - 1, t.y - 1);
    // the entry points: open ones blink red, the ones still closed are grey (and say when they open)
    const open = this.td.spawns.length && this.td.wave >= 0 ? this.tdOpen(Math.max(1, this.td.wave + (this.td.phase === 'build' ? 1 : 0))).length : 1;
    this.td.spawns.forEach(([x, y], i) => {
      const on = i < open;
      ctx.fillStyle = on ? ((this.frame >> 3) & 1 ? '#F83800' : '#7C0800') : '#5C5C5C';
      for (const [dx, dy] of [[0, 0], [14, 0], [0, 14], [14, 14]]) ctx.fillRect(x + dx, y + dy, 2, 2);
      if (!on) ctx.drawImage(Sprites.mini(String(i * 5 + 1)), x + 5, y + 5);
    });
    for (const tw of this.towers) {
      if (tw.kind === 'frost' && tw.busy) this.ring(ctx, tw.x + 8, tw.y + 8, this.towerStat(tw).range, 'rgba(124,200,248,0.6)');
      this.drawTower(ctx, tw);
    }
    // each player's build spot (and the range of what's being chosen there)
    for (const p of this.players) {
      const t = this.tanks.find(o => o.alive && o.isPlayer && o.player === p);
      if (!t || p.out) continue;
      const m = p.tdMenu, [x, y] = m ? [m.x, m.y] : this.tdSpot(t), k = this.tdSpotKind(x, y);
      const col = k === 'free' || k === 'tower' || k === 'wall' ? ((this.frame >> 4) & 1 ? '#F8F8F8' : '#ADADAD') : '#7C2C2C';
      ctx.fillStyle = col;
      for (const [dx, dy, w, h] of [[0, 0, 4, 1], [0, 0, 1, 4], [12, 0, 4, 1], [15, 0, 1, 4], [0, 15, 4, 1], [0, 12, 1, 4], [12, 15, 4, 1], [15, 12, 1, 4]]) ctx.fillRect(x + dx, y + dy, w, h);
      if (!m) continue;
      const items = this.tdMenuItems(p, x, y), it = items[Math.min(m.idx, items.length - 1)];
      if (it && it.key === 'build') { this.drawTower(ctx, { kind: it.tower, lv: 1, ang: -Math.PI / 2 }, x, y, true); const r = TOWERS[it.tower].lv[0].range; if (r) this.ring(ctx, x + 8, y + 8, r, '#F8F8F8'); }
      const tw = this.towerAt(x, y);
      if (tw && tw.kind !== 'mine') {
        const next = it && it.key === 'up' ? { lv: tw.lv + 1 } : it && it.spec !== undefined ? { spec: it.spec, stier: 1 } : it && it.key === 'sup' ? { stier: (tw.stier || 1) + 1 } : {};
        const s = this.towerStat(Object.assign({}, tw, next));
        if (s.range) this.ring(ctx, x + 8, y + 8, s.range, '#F8F8F8');
        if (tw.kind === 'radar') this.ring(ctx, x + 8, y + 8, TD_BUFF_RANGE, '#F8B800');
      }
    }
  },

  renderTdOver(ctx) {
    if (!this.td) return;
    for (const s of this.tdSparks) {
      ctx.fillStyle = s.smoke ? 'rgba(160,160,160,' + (s.t / 16) + ')' : ['#F8F8F8', '#F8D878', '#F87830', '#D82800'][(s.t + (this.frame >> 1)) & 3];
      ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - 1, s.smoke ? 2 : 3, s.smoke ? 2 : 3);
    }
    for (const s of this.tdShots) {
      if (s.kind === 'shell') {
        const h = Math.sin(Math.PI * s.p) * (s.bomblet ? 6 : 14);
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y), 3, 2);
        ctx.fillStyle = s.bomblet ? '#F8B800' : '#3C3C3C'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y - h) - 1, 3, 3);
      } else if (s.kind === 'rocket') { ctx.fillStyle = '#F87830'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - 1, 3, 3); }
      else { ctx.fillStyle = '#F8F8F8'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - 1, 2, 2); }

  // the build menus (screen space, at the bottom of the field) and the wave countdown
  renderFortressUI(ctx) {
    if (!this.td) return;
    const td = this.td;
    if (td.phase === 'build' && !td.won) {
      const kind = td.next && td.next.kind !== 'MIXED' ? ': ' + td.next.kind : '';
      Font.drawCenter(ctx, 'WAVE ' + (td.wave + 1) + ' IN ' + Math.ceil(td.timer / 60) + kind, VIEW_W / 2, 4, (td.timer >> 4) & 1 || td.timer > 300 ? (kind === ': BOSS' ? COL.red : COL.white) : COL.red);

  },

  // the border above the field and the side panel: wave, gold, eagle HP, the next wave
  renderFortressHud(ctx, H) {

      for (const e of td.next.list) counts.set(e.type, (counts.get(e.type) || 0) + 1);

    }
    tdCoin(ctx, H + 4, 152, 1);
    Font.drawCenter(ctx, String(Math.min(9999, td.gold)), H + 8, 164, COL.black);
  },

// a gold coin, s pixels per dot (8 x 8 at s = 1)
function tdCoin(ctx, x, y, s = 1) {
  const rows = ['..XXXX..', '.XYYYYX.', 'XYYXYYYX', 'XYXXXYYX', 'XYYXYYYX', 'XYYYYYYX', '.XYYYYX.', '..XXXX..'];

  <script>
'use strict';
// =====================================================================
//  First-meet cards: the first time you meet each enemy, boss and power-up, a one-line card slides up at the
//  top of the field: "NEW: JAMMER - SLOWS YOUR SHELLS NEARBY". What you have met is remembered between games
//  (Settings -> FIRST-MEET CARDS turns them off; SHOW ALL CARDS AGAIN forgets). A line too long for the field
//  scrolls along once.
// =====================================================================

const SEEN_KEY = 'tank1990_seen', CARD_HOLD = 240, CARD_LEAD = 50, CARD_TAIL = 80, CARD_SPEED = 1.5;

const Seen = {
  keys: null,
  load() { if (!this.keys) this.keys = new Set(STORE.get(SEEN_KEY, [])); return this.keys; },
  has(k) { return this.load().has(k); },
  add(k) { this.load().add(k); STORE.set(SEEN_KEY, [...this.keys]); },
  reset() { this.keys = new Set(); STORE.set(SEEN_KEY, []); },
};

// "NEW: <name> - <what it does>" for e<type>, b<boss>, p<power-up>
function cardText(key) {
  const i = +key.slice(1);
  const src = key[0] === 'e' ? ENEMY[i] : key[0] === 'b' ? BOSSES[i] : POWERUPS[i];
  if (!src) return null;
  const name = key[0] === 'e' && i < 4 ? src.name + ' TANK' : key[0] === 'b' ? 'BOSS ' + src.name : src.name;
  return 'NEW: ' + name + (src.desc ? ' - ' + src.desc : '');
}

// frames a card stays up: a short one holds still, a long one waits, scrolls to its end and waits again
function cardLife(text) {
  const over = text.length * 8 - (VIEW_W - 12);
  return over <= 0 ? CARD_HOLD : CARD_LEAD + Math.ceil(over / CARD_SPEED) + CARD_TAIL;
}

Object.assign(Stage.prototype, {
  // something appeared: a card for it, if it's the first time ever (the online host decides)
  encounter(key) {
    if (Net.role === 'client' || !Config.on('newCards') || Seen.has(key)) return;
    const text = cardText(key);
    if (!text) return;
    Seen.add(key);
    (this.cardQueue || (this.cardQueue = [])).push(text);
  },

  updateCards() {
    if (this.card && ++this.card.t >= this.card.life) this.card = null;
    if (!this.card && this.cardQueue && this.cardQueue.length) {
      const text = this.cardQueue.shift();
      this.card = { text, t: 0, life: cardLife(text) };
    }
  },

  // a dark strip sliding down from the top of the field window (screen coordinates); the eagle stays in view
  renderCard(ctx) {
    const c = this.card;
    if (!c) return;
    const h = 12, rise = Math.min(1, c.t / 8, (c.life - c.t) / 8), y = Math.round(h * rise) - h + 2;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, y - 2, VIEW_W, h + 2);
    ctx.beginPath();
    ctx.rect(4, y - 2, VIEW_W - 8, h + 2);
    ctx.clip();
    const w = c.text.length * 8, over = w - (VIEW_W - 12);
    const x = over <= 0 ? Math.round((VIEW_W - w) / 2) : 6 - Math.round(Math.min(over, Math.max(0, c.t - CARD_LEAD) * CARD_SPEED));
    // "NEW:" in gold, the rest in white
    Font.draw(ctx, 'NEW:', x, y, COL.gold);
    Font.draw(ctx, c.text.slice(4), x + 32, y, COL.white);
    ctx.restore();
  },
});

  <script>
'use strict';
// =====================================================================
//  VS EAGLES against the computer (VS EAGLES with 1 player)
//  The enemy has a headquarters too: an eagle in a fortress at the top centre. Its tanks keep coming and go for your
//  eagle (or you); destroy their eagle to win the round. Then the usual tally and shop, and on to the next round on a
//  new map, where the enemy HQ is a little stronger: one upgrade after another, the way you build up your own base.
//    round 2 repair crew · 3 walls, armor · 4 eagle gun · 5 minefield · 6 tesla coil · 7 tank traps, then each grows
//  The straight way in from below always stays brick, so plain shells can always get through.
// =====================================================================

const CPU_UPGRADES = [
  ['walls', 'WALLS'], ['repair', 'REPAIR CREW'], ['armor', 'ARMOR'], ['gun', 'EAGLE GUN'],
  ['field', 'MINEFIELD'], ['tesla', 'TESLA COIL'], ['traps', 'TANK TRAPS'],
];
const CPU_HQ_PTS = 2000, CPU_HQ_ROUND_PTS = 500;
// the enemy HQ's gun keeps its own pace (your eagle gun was toned down in 0.29; theirs wasn't)
const CPU_GUN_EVERY = [0, 110, 80, 60, 45, 35], CPU_GUN_RANGE = [0, 96, 128, 160, 192, 240];

// the enemy HQ's upgrade levels (0-5) in round r
function cpuBase(r) {
  const c = (v, from) => (r >= from ? Math.max(1, Math.min(5, v)) : 0);
  return {
    walls: c(Math.floor((r - 1) / 2), 3),
    repair: c(Math.floor(r / 2), 2),
    armor: c(Math.floor((r - 1) / 2), 3),
    gun: c(Math.floor((r - 2) / 2), 4),
    field: c(r - 4, 5),
    tesla: c(Math.floor((r - 4) / 2), 6),
    traps: c(r - 6, 7),
  };
}

// the upgrade step reached in round r: easier skills climb the table more slowly (SKILLS hqPace)
function cpuStep(r) { return 1 + Math.floor((r - 1) * Config.skill().hqPace); }

// what's new in round r: ["EAGLE GUN L1", "ARMOR L2", ...]
function cpuNews(r) {
  if (r <= 1) return [];
  const a = cpuBase(cpuStep(r - 1)), b = cpuBase(cpuStep(r));
  return CPU_UPGRADES.filter(([k]) => b[k] > a[k]).map(([k, name]) => name + ' L' + b[k]);
}

Object.assign(Stage.prototype, {
  setupCpu(round) {
    const base = cpuBase(cpuStep(round));
    this.cpu = {
      round, x: BASE_X, y: 0, alive: true, base, armor: base.armor, inv: 0, flash: 0,
      repairT: 0, gunT: 120, gunDir: 2, teslaT: 120, zaps: [],
    };
    // their tanks come in at the other entry points (the middle one is the HQ now)
    this.spawnXs = ENEMY_SPAWN_X.filter(x => Math.abs(x - BASE_X) >= 48);
    if (!this.spawnXs.length) this.spawnXs = [0, FW - 16];
    this.clearArea(BASE_X - 24, 0, 64, 40);
    // no teleporter pair with a pad inside the HQ (pads come in pairs: i and i ^ 1)
    const inHq = p => overlap(p.x, p.y, 16, 16, BASE_X - 24, 0, 64, 40);
    const keep = [];
    for (let i = 0; i + 1 < this.pads.length; i += 2) if (!inHq(this.pads[i]) && !inHq(this.pads[i + 1])) keep.push(this.pads[i], this.pads[i + 1]);
    keep.forEach((p, i) => { p.pair = i ^ 1; });
    this.pads = keep;
    for (const [x, y, t] of this.cpuWalls()) this.setBlock(x, y, t);
    // a minefield below their fortress (enemy mines: they go off under you)
    let n = base.field * 2;
    for (const dy of [56, 80]) for (const dx of [0, -24, 24, -48, 48, -72, 72]) {
      const x = BASE_X + 8 + dx, y = 8 + dy;
      if (n <= 0 || x < 8 || x > FW - 8) continue;
      const t = this.get(x >> 2, y >> 2);
      if (t !== T_EMPTY && t !== T_FOREST) continue;
      this.mines.push({ x, y, byPlayer: false, owner: null, t: MINE_ARM_TIME });
      n--;
    }
    this.navBaseF = {};
  },

  // the HQ fortress: an inner ring of 8 blocks round the eagle, an outer ring of 12 from WALLS 1; [bx, by, type]
  cpuWalls() {
    const w = this.cpu.base.walls, bx = BASE_X / 8, out = [];
    const door = x => x === bx || x === bx + 1;   // the way in from below always stays brick
    for (let y = 0; y <= 2; y++) for (let x = bx - 1; x <= bx + 2; x++) {
      if (!(x === bx - 1 || x === bx + 2 || y === 2)) continue;
      const corner = y === 2 && !door(x);
      out.push([x, y, (corner && w >= 2) || (!door(x) && w >= 3) ? T_STEEL : T_BRICK]);
    }
    if (w >= 1) {
      for (let y = 0; y <= 3; y++) for (let x = bx - 2; x <= bx + 3; x++) {
        if (!(x === bx - 2 || x === bx + 3 || y === 3) || x < 0 || x >= COLS * 2) continue;
        const corner = y === 3 && (x === bx - 2 || x === bx + 3);
        out.push([x, y, (corner && w >= 4) || (!door(x) && w >= 5) ? T_STEEL : T_BRICK]);
      }
    }
    return out;
  },

  // every frame while the HQ stands
  updateCpu() {
    const c = this.cpu;
    if (!c.alive || this.over) return;
    // the enemy never runs out of tanks while its HQ stands
    if (this.queue.length < 3) {
      const more = buildQueue(this.num, 20).sort(() => Math.random() - 0.5).slice(0, 4);
      this.queue.push(...more);
      this.total += more.length;
    }
    if (c.inv > 0) c.inv--;
    if (c.flash > 0) c.flash--;
    const b = c.base;
    if (b.repair && ++c.repairT >= REPAIR_EVERY[b.repair]) { c.repairT = 0; this.cpuRepair(); }
    if (b.gun && this.freezeE <= 0 && --c.gunT <= 0) this.cpuShoot(b.gun);
    if (b.tesla && this.freezeE <= 0 && --c.teslaT <= 0) this.cpuZap(b.tesla);
    for (const z of c.zaps) z.t--;
    c.zaps = c.zaps.filter(z => z.t > 0);
  },

  cpuRepair() {
    for (const [x, y, type] of this.cpuWalls()) {
      let missing = false;
      for (let k = 0; k < 4; k++) if (this.get(x * 2 + (k & 1), y * 2 + (k >> 1)) === T_EMPTY) missing = true;
      if (!missing || this.tanks.some(o => o.alive && overlap(o.x, o.y, 16, 16, x * 8, y * 8, 8, 8))) continue;
      for (let k = 0; k < 4; k++) {
        const cx = x * 2 + (k & 1), cy = y * 2 + (k >> 1);
        if (this.get(cx, cy) === T_EMPTY) this.set(cx, cy, type);
      }
      this.addFx(x * 8 + 4, y * 8 + 4, [Sprites.sparkle[0], Sprites.sparkle[1]], 4);
      return;
    }
  },

  // their eagle shoots at you when you line up with it (down, left or right)
  cpuShoot(g) {
    const c = this.cpu, ex = c.x + 8, ey = c.y + 8;
    c.gunT = 12;
    let best = null, bd = CPU_GUN_RANGE[g];
    for (const t of this.tanks) {
      if (!t.alive || !t.isPlayer || t.boost.smoke) continue;
      const dx = t.x + 8 - ex, dy = t.y + 8 - ey;
      let dir = -1;
      if (Math.abs(dx) < 8 && dy > 0) dir = 2;
      else if (Math.abs(dy) < 8) dir = dx > 0 ? 1 : 3;
      const d = Math.abs(dx) + Math.abs(dy);
      if (dir >= 0 && d < bd) { bd = d; best = dir; }
    }
    if (best === null) return;
    // the shell starts outside the fortress so it never breaks its own walls
    const off = 8 + (c.base.walls >= 1 ? 16 : 8) + 2;
    this.bullets.push({
      x: ex - 2 + DXY[best][0] * off, y: ey - 2 + DXY[best][1] * off, dir: best, speed: 3.5, free: true,
      owner: { isPlayer: false, bullets: 0 }, isPlayer: false, power: g >= 4, cutter: false, alive: true, pierce: false, rocket: g >= 5,
    });
    c.gunDir = best;
    c.gunT = CPU_GUN_EVERY[g];
    Sound.play('shot');
  },

  cpuZap(z) {
    const c = this.cpu, ex = c.x + 8, ey = c.y + 8;
    c.teslaT = 20;
    const hit = this.tanks.filter(t => t.alive && t.isPlayer && !t.ally && Math.hypot(t.x + 8 - ex, t.y + 8 - ey) < TESLA_RANGE[z] + 8);
    if (!hit.length) return;
    for (const t of hit) { c.zaps.push({ x: t.x + 8, y: t.y + 8, t: 10 }); this.hitPlayer(t); }
    c.teslaT = TESLA_EVERY[z];
    Sound.play('zap');
  },

  // their tank traps slow you near their HQ
  cpuTrap(t) {
    const c = this.cpu, lv = c && c.alive ? c.base.traps : 0;
    if (!lv) return 1;
    return Math.hypot(t.x - c.x, t.y - c.y) < TRAP_RANGE[lv] ? TRAP_SLOW[lv] : 1;
  },

  // a shell meets their eagle (true if it stopped there); their own shells can't hurt it
  cpuBullet(b) {
    const c = this.cpu;
    if (!c.alive || !overlap(b.x, b.y, 4, 4, c.x, c.y, 16, 16)) return false;
    this.killBullet(b, true);
    if (b.isPlayer) this.cpuHit(b.owner);
    return true;
  },

  cpuHit(by) {
    const c = this.cpu;
    if (!c.alive || c.inv > 0) return;
    if (c.armor > 0) {
      c.armor--; c.inv = 40; c.flash = 30;
      this.addFx(c.x + 8, c.y + 8, Sprites.smallExp, 3);
      Sound.play('armor');
      return;
    }
    this.cpuDown(by);
  },

  // their HQ falls: the round is won, and every tank of theirs goes up with it
  cpuDown(by) {
    const c = this.cpu;
    c.alive = false;
    this.addFx(c.x + 8, c.y + 8, BIG_EXPLOSION(), 6);
    Sound.play('baseDie');
    const p = by && by.player, pts = CPU_HQ_PTS + CPU_HQ_ROUND_PTS * c.round;
    if (p) { this.addScore(p, pts); this.addXp(p, 50); }
    else for (const q of this.players) if (!q.out) this.addScore(q, Math.round(pts / this.players.length));
    this.popups.push({ x: c.x + 8, y: c.y + 24, text: 'ENEMY HQ DOWN +' + pts, label: true, color: COL.gold, t: 0, delay: 0, life: 150 });
    this.queue = [];
    this.spawns = this.spawns.filter(s => !s.enemy);
    for (const t of this.tanks) if (t.alive && !t.isPlayer) this.killEnemy(t, null, false, true);
    for (const m of this.mines) if (!m.byPlayer) m.done = true;
    this.mines = this.mines.filter(m => !m.done);
  },

  renderCpu(ctx) {
    const c = this.cpu;
    if (!c) return;
    const b = c.base, ex = c.x + 8, ey = c.y + 8;
    if (c.alive && b.traps) {
      ctx.fillStyle = '#7C5800';
      const r = TRAP_RANGE[b.traps];
      for (let a = 0; a < 28; a++) { const ang = (a / 27) * Math.PI; ctx.fillRect(Math.round(ex + Math.cos(ang) * r), Math.round(ey + Math.sin(ang) * r), 1, 1); }
    }
    for (const z of c.zaps) {
      ctx.fillStyle = (z.t >> 1) & 1 ? '#F8F8F8' : '#F83800';
      for (let i = 0; i <= 8; i++) {
        const j = i === 0 || i === 8 ? 0 : ((i * 7 + z.t) % 5) - 2;
        ctx.fillRect(Math.round(ex + (z.x - ex) * i / 8) + j, Math.round(ey + 6 + (z.y - ey - 6) * i / 8) - j, 2, 2);
      }
    }
    if (!c.alive) { ctx.drawImage(Sprites.eagleDead, c.x, c.y); return; }
    // the enemy's eagle glows red (white when hit); armour pips underneath
    ctx.drawImage(Sprites.outline(Sprites.eagle, c.flash > 0 && (c.flash >> 2) & 1 ? COL.white : '#F83800'), c.x - 1, c.y - 1);
    ctx.drawImage(Sprites.eagle, c.x, c.y);
    ctx.fillStyle = COL.gold;
    for (let k = 0; k < c.armor; k++) ctx.fillRect(c.x + 8 - c.armor + k * 2, c.y + 17, 1, 1);
    if (b.tesla) {
      ctx.fillStyle = '#B87000'; ctx.fillRect(c.x + 13, c.y + 1, 2, 6);
      ctx.fillStyle = c.teslaT < 12 ? '#F8F8F8' : '#F83800'; ctx.fillRect(c.x + 12, c.y + 6, 4, 3);
    }
    if (b.gun) {
      const cx = c.x + 8, cy = c.y + 11;
      ctx.fillStyle = '#505050';
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      ctx.fillStyle = b.gun >= 5 ? '#F87830' : b.gun >= 4 ? COL.gold : '#ADADAD';
      ctx.fillRect(cx - 1, cy - 1, 2, 2);
      const [dx, dy] = DXY[c.gunDir || 2];
      ctx.fillStyle = '#505050';
      for (let k = 2; k <= 4; k++) ctx.fillRect(cx - (dx ? 0 : 1) + dx * k - (dx < 0 ? 1 : 0), cy - (dy ? 0 : 1) + dy * k - (dy < 0 ? 1 : 0), dx ? 1 : 2, dy ? 1 : 2);
    }
  },

  // the border above the field: round and what's left of their armour

  <script>
'use strict';
// =====================================================================
//  Computer bots for DEATHMATCH with one player: players II-IV are driven by the computer instead of a keyboard.
//  A bot heads for the nearest rival along the route field, lines up and fires once it has had a moment to aim
//  (quicker on harder skills), grabs a power-up when one lands close by, shoots bricks in its way, and backs out of
//  dead ends. Bots play the same rules as you: same tanks, frags, power-ups and respawns. In KILL RACE they go
//  after the enemy tanks instead, racing you for kills.
// =====================================================================

const DM_BOTS = 3, BOT_RANGE = 176, BOT_PU_RANGE = 80;

Object.assign(Stage.prototype, {
  // what a bot "presses" this frame (same shape as Input.player)
  botInput(t) {
    const b = t.botAi || (t.botAi = { dir: rnd(4), stuck: 0, lx: t.x, ly: t.y, wander: 0, aim: 0 });
    const idle = { dir: -1, fire: false, firePressed: false, alt: false, altPressed: false };
    // stuck against something: drive off somewhere else for a bit
    if (t.x === b.lx && t.y === b.ly) b.stuck++; else { b.stuck = 0; b.lx = t.x; b.ly = t.y; }
    if (b.stuck > 24) { b.wander = 30 + rnd(30); b.dir = rnd(4); b.stuck = 0; }
    // the nearest rival you can see (smoke hides you from bots too); in KILL RACE the rivals are the enemy tanks
    const rival = o => (this.race ? !o.isPlayer : o.isPlayer && !o.ally && o.player !== t.player);
    let tgt = null, bd = Infinity;
    for (const o of this.tanks) {
      if (!o.alive || o === t || !rival(o) || (o.boost && o.boost.smoke)) continue;
      const d = Math.abs(o.x - t.x) + Math.abs(o.y - t.y);
      if (d < bd) { bd = d; tgt = o; }
    }
    let fire = false, aimDir = -1;
    if (tgt) {
      const dx = tgt.x - t.x, dy = tgt.y - t.y;
      const lined = (Math.abs(dx) < 6 || Math.abs(dy) < 6) && bd < BOT_RANGE && this.clearLine(t.x + 8, t.y + 8, tgt.x + 8, tgt.y + 8);
      if (lined) {
        // take aim, then fire
        const want = Math.abs(dx) < 6 ? (dy > 0 ? 2 : 0) : (dx > 0 ? 1 : 3);
        if (++b.aim > Math.round(24 / Math.max(0.3, Config.skill().aggr))) { aimDir = want; fire = t.dir === want; }
      } else b.aim = 0;
    }
    // where to: a power-up close by, else the rival
    const pu = this.powerup;
    const goal = pu && Math.abs(pu.x - t.x) + Math.abs(pu.y - t.y) < BOT_PU_RANGE ? { x: pu.x, y: pu.y, pu: true } : tgt;
    if (b.wander > 0) b.wander--;
    else if (goal && (t.x & 7) === 0 && (t.y & 7) === 0) {
      const NX = COLS * 2 - 1, node = (x, y) => Math.max(0, Math.min(ROWS * 2 - 2, Math.round(y / 8))) * NX + Math.max(0, Math.min(NX - 1, Math.round(x / 8)));
      const dist = goal.pu ? this.navField([node(goal.x, goal.y)]) : this.navPlayer(goal);
      const bx = t.x >> 3, by = t.y >> 3;
      let best = -1, bv = Infinity;
      for (let d = 0; d < 4; d++) {
        const ux = bx + DXY[d][0], uy = by + DXY[d][1];
        if (ux < 0 || uy < 0 || ux >= NX || uy * NX >= dist.length) continue;
        const v = dist[uy * NX + ux] + (d === b.dir ? -0.01 : 0);
        if (v < bv) { bv = v; best = d; }
      }
      if (best >= 0 && bv < Infinity) b.dir = best;
      else if (Math.random() < 0.1) b.dir = rnd(4);
    }
    // lined up: face the rival and shoot (and keep coming)
    if (aimDir >= 0) {
      if (fire && !this.noBase && this.eagleInLine(t.x + 8, t.y + 8, tgt.x + 8, tgt.y + 8)) fire = false;
      b.dir = aimDir;
      return Object.assign(idle, { dir: aimDir, fire });
    }
    // bricks in the way: shoot through (but not your own eagle's fortress)
    const nearHome = !this.noBase && Math.abs(t.x - BASE_X) < 40 && Math.abs(t.y - BASE_Y) < 40;
    if (t.dir === b.dir && !nearHome && this.brickAhead(t) && Math.random() < 0.1) fire = true;
    // never towards your own eagle
    if (fire && !this.noBase && this.eagleInLine(t.x + 8, t.y + 8, t.x + 8 + DXY[t.dir][0] * FW, t.y + 8 + DXY[t.dir][1] * FH)) fire = false;
    return Object.assign(idle, { dir: b.dir, fire });
  },
});

// "II-PLAYER" or "BOT II"
function playerName(p) { return p && p.bot ? 'BOT ' + ROMAN[p.i] : ROMAN[p ? p.i : 0] + '-PLAYER'; }

  <script>
'use strict';
// =====================================================================
//  KILL RACE: no eagles, just the enemy. Each round is a normal stage of enemy tanks; whoever destroys the most of
//  them wins the round and scores 1 point (a tie on kills goes to whoever scored more points with them; still tied,
//  nobody scores). First to the target wins the game; the target is picked on the first round's curtain (or in
//  Settings -> GAME). Destroyed players come back after a moment instead of losing lives. Alone, you race 3 bots.
//  Enemy tanks appear at random free spots all over the map (never right next to a player), not just along the top.
// =====================================================================

const RACE_TARGETS = [1, 2, 3, 5, 7, 10], RACE_RESPAWN = 90, RACE_SPAWN_GAP = 64;

// one player's round: kills, and the points they were worth (the tie-break)
function raceTally(p) {
  const kills = p.kills.reduce((a, n) => a + n, 0);
  const pts = p.kills.reduce((a, n, k) => a + n * (ENEMY[k] ? ENEMY[k].pts : 0), 0);
  return { kills, pts };
}

// the round's winner (index into players), or -1 for a draw / nobody scored
function raceWinner(players) {
  const rows = players.map(raceTally);
  const best = Math.max(...rows.map(r => r.kills));
  if (best <= 0) return -1;
  let lead = rows.map((r, i) => i).filter(i => rows[i].kills === best);
  if (lead.length > 1) {
    const top = Math.max(...lead.map(i => rows[i].pts));
    lead = lead.filter(i => rows[i].pts === top);
  }
  return lead.length === 1 ? lead[0] : -1;
}

Object.assign(Stage.prototype, {
  setupRace(target, round) {
    this.race = { target, round };
    this.noBase = true;
    this.setBaseWalls(T_EMPTY);
    this.clearArea(BASE_X - 8, BASE_Y - 8, 32, 24);
  },

  // a random 16px spot an enemy can appear on: open ground (trees, ice, mud, bridges are fine), nobody there or
  // about to be, no teleporter pad, and at least 4 tiles from every player
  raceSpawnSpot() {
    const busy = (x, y) => this.tanks.some(t => t.alive && overlap(t.x, t.y, 16, 16, x, y, 16, 16))
      || this.spawns.some(s => overlap(s.x, s.y, 16, 16, x, y, 16, 16))
      || (this.pads || []).some(p => overlap(p.x, p.y, 16, 16, x, y, 16, 16))
      || this.tanks.some(t => t.alive && t.isPlayer && Math.abs(t.x - x) < RACE_SPAWN_GAP && Math.abs(t.y - y) < RACE_SPAWN_GAP)
      || this.spawns.some(s => s.player && Math.abs(s.x - x) < RACE_SPAWN_GAP && Math.abs(s.y - y) < RACE_SPAWN_GAP);
    for (let k = 0; k < 40; k++) {
      const x = rnd(COLS * 2 - 1) * 8, y = rnd(ROWS * 2 - 1) * 8;
      let solid = false;
      for (let cy = y >> 2; cy < (y + 16) >> 2 && !solid; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
        const v = this.get(cx, cy);
        if (v === T_BRICK || v === T_STEEL || v === T_WATER) { solid = true; break; }
      }
      if (!solid && !busy(x, y)) return [x, y];
    }
    return null;
  },

  // the side panel: per player, kills this round and points (gold pips out of the target)
  renderRaceHud(ctx, H) {
    const n = Math.min(20, this.queue.length);
    for (let i = 0; i < n; i++) ctx.drawImage(Sprites.enemyIcon, H + (i % 2) * 8, 24 + (i >> 1) * 8);
    const target = this.race.target;
    this.players.forEach((p, i) => {
      const y = 112 + i * 22;
      ctx.drawImage(Sprites.playerIcon(Config.playerPal(p.i)), H, y);
      Font.draw(ctx, String(Math.min(99, raceTally(p).kills)), H + 8, y, COL.black);
      for (let k = 0; k < Math.min(10, target); k++) {
        ctx.fillStyle = k < (p.racePts || 0) ? COL.gold : '#3C3C3C';
        ctx.fillRect(H + (k % 5) * 3, y + 9 + (k >= 5 ? 3 : 0), 2, 2);
      }
    });
  },

  renderRaceLine(ctx) {
    Font.drawCenter(ctx, 'ROUND ' + this.race.round + '  FIRST TO ' + this.race.target, FX + VIEW_W / 2, 0, COL.black);
  },
});

function bossPainter(w, h) {

  const P = {
    g,
    px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; },
    rect(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) P.px(x, y, c); },
    line(x0, y0, x1, y1, c) {

      for (let i = 0; i <= n; i++) P.px(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);
    },
    disc(cx, cy, r, c) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= r) P.px(x, y, c); },
    ring(cx, cy, r, c) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (Math.abs(Math.hypot(x + 0.5 - cx, y + 0.5 - cy) - r) < 0.5) P.px(x, y, c); },
    box(x0, y0, x1, y1) {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {

        if (x === x0 || y === y0) c = 1;
        if (x === x1 || y === y1) c = 3;

    },
    circle(cx, cy, r) { P.ellipse(cx, cy, r, r); },
    // a shaded ellipse: lit from the top left
    ellipse(cx, cy, rx, ry) {

      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
