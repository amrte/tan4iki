  // ---------------------------------------------------------------- construction: see editor.js

  // ---------------------------------------------------------------- shop
  toShop() {
    Sound.setEngine(0);
    // fallen players get a turn too, to buy themselves back in
    this.shop = { order: this.players.filter(p => !p.out || reviveCost()), turn: 0, idx: 0, scroll: 0, rep: 0, msg: '', msgT: 0 };
    this.setState('shop');
  },

  shopMove(dir) {
    const sh = this.shop, n = SHOP_ITEMS.length;
    sh.idx = (sh.idx + dir + n) % n;
    if (sh.idx < sh.scroll) sh.scroll = sh.idx;
    if (sh.idx >= sh.scroll + SHOP_ROWS) sh.scroll = sh.idx - SHOP_ROWS + 1;
  },

  shopBuy() {
    const sh = this.shop, p = sh.order[sh.turn], item = SHOP_ITEMS[sh.idx];
    if (item.id === 'done') { this.shopNext(); return; }
    const price = shopPrice(item, p), st = shopStatus(item, p);
    if (st.max) {
      sh.msg = item.id === 'revive' ? (reviveCost() ? 'NOBODY TO REVIVE' : 'REVIVE IS OFF') : p.out ? 'REVIVE FIRST' : st.text === 'N/A' ? 'NO EAGLE IN THE MAZE' : 'YOU ALREADY HAVE IT';
      sh.msgT = 90; Sound.play('steel'); return;
    }
    if (wallet(p) < price) { sh.msg = 'NOT ENOUGH POINTS'; sh.msgT = 90; Sound.play('steel'); return; }
    spend(p, price);
    shopApply(item, p);
    sh.msg = 'BOUGHT ' + item.name + (item.weapon && item.weapon !== 'cannon' ? ' MK ' + MK[p.wlv[item.weapon] - 1] : '');
    sh.msgT = 60;
    Sound.play(item.id === 'life' || item.id === 'revive' ? 'life' : 'pickup');
  },

  // next player's turn, or on to the stage
  shopNext() {
    const sh = this.shop;
    sh.turn++;
    sh.idx = 0; sh.scroll = 0; sh.msgT = 0;
    if (sh.turn >= sh.order.length) {
      this.shopDiscount = false;
      this.lastScores = this.players.map(p => p.score);
      this.toCurtain(false);
    } else Sound.play('select');
  },

  updateShop() {
    const sh = this.shop, cur = sh.order[sh.turn];
    // an online guest picks their own items; the host can skip their turn with Esc
    const guest = Input.remote[cur.i];
    if (guest && Input.anyJust(['Escape'])) { this.shopNext(); return; }
    const m = guest ? Object.assign({}, guest.menu || {}) : Input.menu();
    if (sh.msgT > 0) sh.msgT--;
    let d = 0;
    if (m.up) { d = -1; sh.rep = 16; } else if (m.down) { d = 1; sh.rep = 16; }
    else {
      const held = Input.heldDir();
      if ((held === 0 || held === 2) && --sh.rep <= 0) { d = held === 0 ? -1 : 1; sh.rep = 4; }
    }
    if (d) { this.shopMove(d); Sound.play('select'); }
    if (m.ok) this.shopBuy();
    else if (m.back) this.shopNext();
  },

  renderShop(ctx) {
    const sh = this.shop, p = sh.order[sh.turn];
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, SW, SH);
    Font.drawCenter(ctx, this.shopDiscount ? 'SHOP  BOSS BONUS -25%' : 'SHOP', SW / 2, 6, COL.red);
    ctx.drawImage(Sprites.rankTank('p' + p.level, (this.t >> 3) & 1, 1, Config.playerPal(p.i), Config.xpOn() ? p.rank : 1, true), 6, 15);
    Font.draw(ctx, ROMAN[p.i] + '-PLAYER', 26, 20, COL.red);
    Font.drawRight(ctx, wallet(p), 214, 20, COL.gold);
    Font.draw(ctx, 'PTS', 220, 20, COL.white);
    for (let r = 0; r < SHOP_ROWS; r++) {
      const i = sh.scroll + r, item = SHOP_ITEMS[i];
      if (!item) break;
      const y = SHOP_TOP + r * SHOP_ROW_H;
      if (i === sh.idx) { ctx.fillStyle = '#20206C'; ctx.fillRect(4, y - 4, SW - 8, SHOP_ROW_H); }
      if (item.id === 'done') {
        Font.draw(ctx, item.name + ' ' + this.stageNum, 34, y, COL.white);
        continue;
      }
      if (item.base) ctx.drawImage(Sprites.baseIcons[item.bicon], 12, y - 4); else drawPowerup(ctx, { type: item.icon, weapon: item.weapon }, 12, y - 4);
      const price = shopPrice(item, p), st = shopStatus(item, p);
      Font.draw(ctx, item.name, 34, y, st.max ? COL.lgrey : COL.white);
      if (!st.max) Font.drawRight(ctx, price, 190, y, wallet(p) >= price ? COL.gold : '#7C3C3C');
      Font.drawRight(ctx, st.text, 250, y, COL.lgrey);
    }
    ctx.fillStyle = COL.lgrey;
    if (sh.scroll > 0) for (let k = 0; k < 4; k++) ctx.fillRect(SW / 2 - k, 30 + k, 1 + 2 * k, 1);
    if (sh.scroll + SHOP_ROWS < SHOP_ITEMS.length) for (let k = 0; k < 4; k++) ctx.fillRect(SW / 2 - 3 + k, SHOP_TOP + SHOP_ROWS * SHOP_ROW_H - 3 + k, 7 - 2 * k, 1);
    const item = SHOP_ITEMS[sh.idx];
    if (sh.msgT > 0) Font.drawCenter(ctx, sh.msg, SW / 2, 192, sh.msg.startsWith('BOUGHT') ? COL.gold : COL.red);
    else if (item.base) {
      const lv = Game.base[item.base] || 0;
      Font.drawCenter(ctx, Config.on('baseShop') ? (lv >= item.prices.length ? 'FULLY UPGRADED' : 'BASE: ' + item.descs[lv]) : 'BASE UPGRADES ARE OFF', SW / 2, 192, COL.gold);
    } else if (item.up) {
      const lv = Game.base[item.up] || 0;
      Font.drawCenter(ctx, lv >= item.prices.length ? 'FULLY UPGRADED' : 'L' + (lv + 1) + ': ' + item.descs[lv], SW / 2, 192, COL.gold);
    } else if (item.desc) {
      const desc = item.id === 'mines' ? '+' + Config.get('mineCount') + ' ' + item.desc : item.desc;
      Font.drawCenter(ctx, desc, SW / 2, 192, COL.white);
    }
    Font.drawCenter(ctx, 'A BUY   ESC DONE', SW / 2, 208, COL.lgrey);
  },

  // ---------------------------------------------------------------- key setup
  // rows: player picker, 6 keyboard actions (2 keys each), 4 gamepad actions (2 buttons each), buttons
  keyRows() {
    const rows = [{ type: 'player' }];
    for (const a of ACTIONS) rows.push({ type: 'key', a });
    for (const a of PAD_ACTIONS) rows.push({ type: 'pad', a });
    rows.push({ type: 'btn', act: 'resetP', label: 'RESET THIS PLAYER' });
    rows.push({ type: 'btn', act: 'resetAll', label: 'RESET ALL KEYS AND PADS' });
    rows.push({ type: 'btn', act: 'back', label: 'BACK' });
    return rows;
  },

  toKeys() {
    this.ks = { player: 0, idx: 1, col: 0, capture: null, msg: '', msgT: 0 };
    this.setState('keys');
  },

  keysActivate() {
    const ks = this.ks, row = this.keyRows()[ks.idx];
    if (row.type === 'player') { ks.player = (ks.player + 1) % 4; Sound.play('select'); return; }
    if (row.type === 'btn') {
      if (row.act === 'resetP') { Keymap.resetPlayer(ks.player); ks.msg = 'PLAYER ' + ROMAN[ks.player] + ' KEYS RESET'; }
      else if (row.act === 'resetAll') { Keymap.resetAll(); ks.msg = 'ALL KEYS AND PADS RESET'; }
      else { this.setState('settings'); return; }
      ks.msgT = 90; Sound.play('pickup');
      return;
    }
    // wait for the next key / pad button
    ks.capture = { row: ks.idx, col: ks.col, kind: row.type };
    Input.capture = ev => {
      ks.capture = null;
      if (ev.kind === 'key' && ev.code === 'Escape') { Sound.play('select'); return; }
      if (row.type === 'key' && ev.kind === 'key') Keymap.setKey(ks.player, row.a, ks.col, ev.code);
      else if (row.type === 'pad' && ev.kind === 'pad') Keymap.setPad(row.a, ks.col, ev.button);
      else { ks.msg = row.type === 'pad' ? 'PRESS A GAMEPAD BUTTON' : 'PRESS A KEYBOARD KEY'; ks.msgT = 90; Sound.play('steel'); return; }
      Sound.play('pickup');
    };
  },

  updateKeys() {
    const ks = this.ks, rows = this.keyRows();
    if (ks.msgT > 0) ks.msgT--;
    if (ks.capture) return; // keys go to the capture handler
    const m = Input.menu(), row = rows[ks.idx];
    if (m.up) { ks.idx = (ks.idx + rows.length - 1) % rows.length; Sound.play('select'); }
    if (m.down) { ks.idx = (ks.idx + 1) % rows.length; Sound.play('select'); }
    const cur = rows[ks.idx];
    if (m.left || m.right) {
      if (cur.type === 'player') ks.player = (ks.player + (m.right ? 1 : 3)) % 4;
      else ks.col = ks.col ? 0 : 1;
      Sound.play('select');
    }
    if (Input.anyJust(['Delete', 'Backspace']) && (row.type === 'key' || row.type === 'pad')) {
      if (row.type === 'key') Keymap.clearKey(ks.player, row.a, ks.col); else Keymap.clearPad(row.a, ks.col);
      Sound.play('build');
      return;
    }
    if (m.ok) this.keysActivate();
    else if (Input.anyJust(['Escape']) || Input.pads.some(p => p.justBack)) this.setState('settings');
  },

  renderKeys(ctx) {
    const ks = this.ks, rows = this.keyRows();
    const LABEL = { up: 'UP', down: 'DOWN', left: 'LEFT', right: 'RIGHT', fire: 'FIRE', alt: 'B / MINES', start: 'PAUSE', back: 'BACK' };
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, SW, SH);
    Font.drawCenter(ctx, 'KEYS AND PADS', SW / 2, 6, COL.red);
    let y = 22;
    rows.forEach((row, i) => {
      if (row.type === 'pad' && rows[i - 1].type !== 'pad') {
        Font.draw(ctx, 'GAMEPAD - ALL PADS', 8, y + 2, COL.orange);
        y += 13;
      }
      if (row.type === 'btn' && rows[i - 1].type !== 'btn') y += 4;
      const sel = i === ks.idx;
      if (sel) { ctx.fillStyle = '#20206C'; ctx.fillRect(4, y - 2, SW - 8, 11); }
      if (row.type === 'player') {
        const name = 'PLAYER ' + ROMAN[ks.player];
        ctx.drawImage(Sprites.playerIcon(Config.playerPal(ks.player)), 16, y);
        Font.drawCenter(ctx, (sel ? '< ' : '') + name + (sel ? ' >' : ''), SW / 2, y, COL.white);
        Font.drawRight(ctx, Keymap.custom(ks.player) ? 'CUSTOM' : 'DEFAULT', 250, y, Keymap.custom(ks.player) ? COL.gold : COL.lgrey);
        y += 13;
        Font.draw(ctx, 'KEYBOARD', 8, y + 2, COL.orange);
        Font.draw(ctx, 'KEY 1', 120, y + 2, COL.lgrey);
        Font.draw(ctx, 'KEY 2', 184, y + 2, COL.lgrey);
        y += 13;
        return;
      }
      if (row.type === 'btn') {
        Font.draw(ctx, row.label, 16, y, row.act === 'back' ? COL.white : COL.gold);
        y += 11;
        return;
      }
      Font.draw(ctx, LABEL[row.a], 16, y, COL.white);
      const list = row.type === 'key' ? Keymap.get(ks.player)[row.a] : Keymap.padMap()[row.a];
      for (let c = 0; c < 2; c++) {
        const x = c ? 184 : 120;
        const waiting = ks.capture && ks.capture.row === i && ks.capture.col === c;
        const text = waiting ? ((this.t >> 3) & 1 ? '?' : '') : (row.type === 'key' ? keyLabel(list[c]) : padLabel(list[c]));
        if (sel && ks.col === c) { ctx.fillStyle = COL.gold; ctx.fillRect(x - 3, y - 2, 60, 1); ctx.fillRect(x - 3, y + 8, 60, 1); }
        Font.draw(ctx, text, x, y, list[c] === undefined && !waiting ? '#505050' : COL.white);
      }
      y += 11;
    });
    let foot = 'A CHANGE  DEL CLEAR  ESC BACK';
    if (ks.capture) foot = ks.capture.kind === 'pad' ? 'PRESS A PAD BUTTON  ESC CANCEL' : 'PRESS A KEY  ESC CANCEL';
    else if (ks.msgT > 0) foot = ks.msg;
    else if (rows[ks.idx].type === 'player') foot = '<> CHOOSE PLAYER';
    Font.drawCenter(ctx, foot, SW / 2, 214, ks.msgT > 0 && !ks.capture ? COL.gold : COL.lgrey);
  },

  // short message over any screen (gamepad connected, ...)
  toast(text) { this.toastText = text; this.toastT = 150; },

  // ---------------------------------------------------------------- settings
  // A menu tree built from SETTINGS_DEF (settingsTree): the top level lists the sections, each opens as a page;
  // st.stack holds the pages you came through, each with its own cursor.
  toSettings() {
    this.st = { stack: [{ node: settingsTree(), idx: 0, scroll: 0 }], rep: 0 };
    this.setState('settings');
  },

  settingsPage() { return this.st.stack[this.st.stack.length - 1]; },
  settingsItem() { const f = this.settingsPage(); return f.node.items[f.idx]; },

  // jump straight to a setting (its page, cursor on it)
  settingsOpen(key) {
    const find = (node, path) => {
      for (let i = 0; i < node.items.length; i++) {
        const it = node.items[i];
        if (it.key === key) return path.concat([{ node, idx: i }]);
        if (it.node) { const r = find(it.node, path.concat([{ node, idx: i }])); if (r) return r; }
      }
      return null;
    };
    this.toSettings();
    const path = find(this.st.stack[0].node, []);
    if (!path) return;
    this.st.stack = path.map(f => ({ node: f.node, idx: f.idx, scroll: Math.max(0, f.idx - SETTINGS_ROWS + 1) }));
  },

  settingsMove(dir) {
    const f = this.settingsPage(), n = f.node.items.length;
    f.idx = (f.idx + dir + n) % n;
    if (f.idx < f.scroll) f.scroll = f.idx;
    if (f.idx >= f.scroll + SETTINGS_ROWS) f.scroll = f.idx - SETTINGS_ROWS + 1;
  },

  // one level up (or out of the settings from the top)
  settingsBack() {
    if (this.st.stack.length > 1) { this.st.stack.pop(); Sound.play('select'); } else this.leaveSettings();
  },

  settingsActivate(dir) {
    const row = this.settingsItem();
    if (row.node) {
      this.st.stack.push({ node: row.node, idx: 0, scroll: 0 });
      Sound.play('select');
    } else if (row.action === 'up') {
      this.settingsBack();
    } else if (row.key) {
      Config.step(row.key, dir);
      Sound.play('select');
    } else if (row.action === 'reset') {
      Config.reset();
      Sound.play('pickup');
    } else if (row.action === 'resetCards') {
      Seen.reset();
      this.toast('CARDS WILL SHOW AGAIN');
      Sound.play('pickup');
    } else if (row.action === 'classicPU') {
      Config.setPowerups(pu => (pu.isNew ? 'OFF' : 'ANYONE'));
      Sound.play('pickup');
    } else if (row.action === 'allPU') {
      Config.setPowerups(() => 'ANYONE');
      Sound.play('pickup');
    } else if (row.action === 'fitScreen') {
      // one click: field sized to the screen shape, scaled to fill it, fullscreen
      Config.values.fieldW = 'FIT';
      Config.values.fieldH = 13;
      Config.values.scaling = 'FILL';
      Config.save();
      if (!(document.fullscreenElement || document.webkitFullscreenElement)) toggleFullscreen();
      this.applyLayout();
      Config.apply();
      Sound.play('pickup');
    } else if (row.action === 'keys') {
      this.toKeys();
    } else if (row.action === 'ranks') {
      this.setState('ranks');
    } else if (row.action === 'fullscreen') {
      toggleFullscreen();
    } else if (row.action === 'back') {
      this.leaveSettings();
    }
  },

  leaveSettings() {
    this.toTitle();
    this.titleY = 0;
    this.menuIdx = this.titleMenu().findIndex(it => it.label === 'SETTINGS');
  },

  updateSettings() {
    const m = Input.menu(), st = this.st;
    const tapped = m.up ? 0 : m.right ? 1 : m.down ? 2 : m.left ? 3 : -1;
    let d = -1;
    if (tapped >= 0) { d = tapped; st.rep = 16; }
    else {
      const held = Input.heldDir();
      if (held >= 0 && --st.rep <= 0) { d = held; st.rep = 4; }
    }
    const item = this.settingsItem();
    if (d === 0) { this.settingsMove(-1); Sound.play('select'); }
    if (d === 2) { this.settingsMove(1); Sound.play('select'); }
    if (d === 1 || d === 3) {
      if (item.key) this.settingsActivate(d === 1 ? 1 : -1);
      else if (item.node && tapped === 1) this.settingsActivate(1);   // right opens a page,
      else if (tapped === 3 && this.st.stack.length > 1) this.settingsBack();   // left goes back
    }
    if (m.ok) this.settingsActivate(1);
    else if (m.alt) { if (item.key) this.settingsActivate(-1); }
    else if (m.back) this.settingsBack();
  },

  renderSettings(ctx) {
    const st = this.st, f = this.settingsPage(), items = f.node.items, top = st.stack.length === 1;
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, SW, SH);
    if (top) {
      Font.drawCenter(ctx, 'SETTINGS', SW / 2, 8, COL.red);
      Font.drawRight(ctx, 'V' + APP_VERSION, 250, 8, '#505050');
    } else {
      // where you are: the page title, with the way back
      Font.draw(ctx, '<', 6, 8, '#505050');
      Font.drawCenter(ctx, f.node.title, SW / 2, 8, COL.orange);
      if (f.node.enemy !== undefined) ctx.drawImage(Sprites.tank('e' + f.node.enemy, (this.t >> 3) & 1, 1, ENEMY[f.node.enemy].pal || 'silver'), 232, 4);
      if (f.node.title === 'WHO CAN COLLECT') Font.drawRight(ctx, '*NEW', 250, 8, COL.gold);
    }
    for (let r = 0; r < SETTINGS_ROWS; r++) {
      const i = f.scroll + r, row = items[i];
      if (!row) break;
      const y = SETTINGS_TOP + r * SETTINGS_ROW_H, sel = i === f.idx;
      if (sel) {
        ctx.fillStyle = '#20206C';
        ctx.fillRect(4, y - 2, SW - 8, 11);
      }
      if (row.node) {
        // a page: its name, a picture for enemy types, and an arrow
        Font.draw(ctx, row.label, 16, y, COL.white);
        if (row.enemy !== undefined) ctx.drawImage(Sprites.tank('e' + row.enemy, 0, 3, ENEMY[row.enemy].pal || 'silver'), 216, y - 4);
        Font.draw(ctx, '>', 241, y, sel ? COL.white : '#505050');
        continue;
      }
      if (row.action) {
        Font.draw(ctx, row.label, 16, y, row.action === 'reset' ? COL.red : row.action === 'back' || row.action === 'up' ? COL.white : COL.gold);
        continue;
      }
      Font.draw(ctx, row.label, 16, y, COL.white);
      const val = Config.format(row.key);
      Font.drawRight(ctx, val, 238, y, Config.isDefault(row.key) ? COL.lgrey : COL.gold);
      if (sel) {
        Font.draw(ctx, '<', 238 - val.length * 8 - 9, y, COL.white);
        Font.draw(ctx, '>', 241, y, COL.white);
      }
      if (row.color) {
        const c = TANK_COLORS[Config.get(row.key)];
        c.forEach((col, k) => { ctx.fillStyle = col; ctx.fillRect(160 - 18 + k * 5, y, 5, 7); });
      }
    }
    // scroll hints
    ctx.fillStyle = COL.lgrey;
    if (f.scroll > 0) for (let k = 0; k < 4; k++) ctx.fillRect(SW / 2 - k, 19 + k - 3, 1 + 2 * k, 1);
    if (f.scroll + SETTINGS_ROWS < items.length) for (let k = 0; k < 4; k++) ctx.fillRect(SW / 2 - 3 + k, 205 + k, 7 - 2 * k, 1);
    // footer: what the selected power-up / enemy does, otherwise the controls
    const cur = items[f.idx];
    if (cur.powerup !== undefined) {
      drawPowerup(ctx, { type: cur.powerup }, 8, 207);
      Font.draw(ctx, POWERUPS[cur.powerup].desc, 28, 212, COL.white);
    } else if (cur.enemy !== undefined && ENEMY[cur.enemy].desc) {
      ctx.drawImage(Sprites.tank('e' + cur.enemy, (this.t >> 3) & 1, 1, ENEMY[cur.enemy].pal || 'silver'), 8, 207);
      Font.draw(ctx, ENEMY[cur.enemy].desc, 28, 212, COL.white);
    } else if (cur.key === 'aiStyle' || cur.key === 'aiMarks') {
      ['RUSH', 'HUNT', 'SNIPE'].forEach((w, i) => {
        ctx.fillStyle = AI_MARK[i + 1];
        ctx.fillRect(24 + i * 72, 213, 5, 5);
        Font.draw(ctx, w, 34 + i * 72, 212, COL.white);
      });
    } else {
      Font.drawCenter(ctx, cur.node ? 'ENTER OPEN   ESC BACK' : '<> CHANGE   ESC BACK', SW / 2, 212, COL.lgrey);
    }
  },

  // ---------------------------------------------------------------- ranks and perks (from settings)
  updateRanks() {
    const m = Input.menu();
    if (this.t > 5 && (m.ok || m.back || m.alt)) { Sound.play('select'); this.setState('settings'); }
  },

  renderRanks(ctx) {
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, SW, SH);
    Font.drawCenter(ctx, 'RANKS AND PERKS', SW / 2, 4, COL.red);
    const perks = Config.get('perks') === 'ON', pal = Config.playerPal(0);
    RANKS.forEach((rk, i) => {
      const y = 21 + i * 20;
      ctx.drawImage(Sprites.rankTank('p0', (this.t >> 3) & 1, 0, pal, i + 1, true), 8, y - 2);
      if (i === 9 && (this.t & 31) < 20) ctx.drawImage(Sprites.outline(Sprites.rankTank('p0', (this.t >> 3) & 1, 0, pal, 10, true), COL.gold), 7, y - 3);
      Font.draw(ctx, (i + 1) + ' ' + rk.name, 32, y, COL.white);
      Font.drawRight(ctx, rk.xp + ' XP', 250, y, COL.gold);
      Font.draw(ctx, rk.perk, 48, y + 9, perks ? COL.lgrey : '#505050');
    });
    if (!Config.xpOn()) Font.drawCenter(ctx, 'XP AND LEVELS ARE OFF', SW / 2, 215, COL.orange);
    else if (!perks) Font.drawCenter(ctx, 'PERKS OFF: LOOKS ONLY', SW / 2, 215, COL.orange);
  },

  // mouse / touch on the canvas (in screen pixels)
  pointer(x, y) {
    Sound.unlock();
    if (this.state === 'ranks') { this.setState('settings'); return; }
    if (this.state === 'construct') { this.constructPointer(x, y, false); return; }
    if (this.state === 'title' || this.state === 'settings' || this.state === 'shop') { x -= menuOX(); y -= menuOY(); }
    if (this.state === 'shop') {
      const r = Math.floor((y - SHOP_TOP + 4) / SHOP_ROW_H), i = this.shop.scroll + r;
      if (r < 0 || r >= SHOP_ROWS || !SHOP_ITEMS[i]) return;
      if (i === this.shop.idx) this.shopBuy();
      else { this.shop.idx = i; Sound.play('select'); }
      return;
    }
    if (this.state === 'title' && this.titleY === 0) {
      const i = Math.floor((y - this.titleMenuY() + 4) / this.titleStep());
      if (i >= 0 && i < this.titleMenu().length && x > 56 && x < 200) {
        if (i === this.menuIdx) this.chooseMenu(i);
        else { this.menuIdx = i; Sound.play('select'); }
      }
    } else if (this.state === 'settings') {
      const f = this.settingsPage(), r = Math.floor((y - SETTINGS_TOP + 2) / SETTINGS_ROW_H);
      if (y < 20) { if (x < 40 && this.st.stack.length > 1) this.settingsBack(); else this.settingsMove(-1); return; }
      if (y > 204) { this.settingsMove(1); return; }
      const i = f.scroll + r, row = f.node.items[i];
      if (r < 0 || r >= SETTINGS_ROWS || !row) return;
      if (i !== f.idx && row.key) { f.idx = i; Sound.play('select'); return; }
      f.idx = i;
      if (row.key) this.settingsActivate(x < 196 ? -1 : 1);
      else this.settingsActivate(1);
    }
  },

  wheel(dy) {
    if (this.state === 'settings') this.settingsMove(dy > 0 ? 1 : -1);
    if (this.state === 'shop') this.shopMove(dy > 0 ? 1 : -1);
  },

  // ---------------------------------------------------------------- dispatch
  update() {
    if (Net.role === 'client') { this.t++; Net.clientUpdate(); return; }
    this.t++;
    switch (this.state) {
      case 'title': this.updateTitle(); break;
      case 'curtain': this.updateCurtain(); break;
      case 'play': this.updatePlay(); break;
      case 'score': this.updateScore(); break;
      case 'bigover': this.updateBigOver(); break;
      case 'construct': this.updateConstruct(); break;
      case 'settings': this.updateSettings(); break;
      case 'shop': this.updateShop(); break;
      case 'keys': this.updateKeys(); break;
      case 'ranks': this.updateRanks(); break;
      case 'dailyResult': this.updateDailyResult(); break;
      case 'vsResult': this.updateVsResult(); break;
      case 'modeResult': this.updateModeResult(); break;
      case 'modeIntro': this.updateModeIntro(); break;
    }
  },

  render(ctx) {
    // the canvas follows the field size; menus sit in a centred 256x224 frame
    const c = ctx.canvas;
    if (c.width !== SCREEN_W || c.height !== SCREEN_H) {
      c.width = SCREEN_W;
      c.height = SCREEN_H;
      ctx.imageSmoothingEnabled = false;
      Sprites.brickPattern = null;
      if (this.onResize) this.onResize();
    }
    const full = this.state === 'play' || this.state === 'curtain' || this.state === 'construct';
    if (!full) {
      ctx.fillStyle = COL.black;
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
      ctx.save();
      ctx.translate(menuOX(), menuOY());
    }
    this.renderState(ctx);
    if (!full) ctx.restore();
    if (this.musicFrame) this.musicFrame();
    if (this.toastT > 0) {
      this.toastT--;
      const w = this.toastText.length * 8 + 12, x = (SCREEN_W - w) >> 1;
      ctx.fillStyle = COL.black;
      ctx.fillRect(x, 2, w, 12);
      Font.draw(ctx, this.toastText, x + 6, 4, COL.gold);
    }
  },

  renderState(ctx) {
    switch (this.state) {
      case 'title': this.renderTitle(ctx); break;
      case 'curtain': this.renderCurtain(ctx); break;
      case 'play': this.renderPlay(ctx); break;
      case 'score': this.renderScore(ctx); break;
      case 'bigover': this.renderBigOver(ctx); break;
      case 'construct': this.renderConstruct(ctx); break;
      case 'settings': this.renderSettings(ctx); break;
      case 'shop': this.renderShop(ctx); break;
      case 'keys': this.renderKeys(ctx); break;
      case 'ranks': this.renderRanks(ctx); break;
      case 'dailyResult': this.renderDailyResult(ctx); break;
      case 'vsResult': this.renderVsResult(ctx); break;
      case 'modeResult': this.renderModeResult(ctx); break;
      case 'netwait': this.renderNetWait(ctx); break;
      case 'modeIntro': this.renderModeIntro(ctx); break;
    }
  },
};

function toggleFullscreen() {
  const el = document.getElementById('wrap');
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (fsEl) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const r = req && req.call(el);
      if (r && r.catch) r.catch(() => {});
    }
  } catch (e) { /* fullscreen not available here */ }
}

// =====================================================================
//  Boot & main loop (fixed 60 Hz simulation)
// =====================================================================
(function boot() {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  document.title = APP_TITLE;
  Sprites.init();
  Config.init();
  Keymap.load();
  Input.init();
  window.addEventListener('gamepadconnected', e => Game.toast('GAMEPAD ' + (e.gamepad.index + 1) + ' CONNECTED'));
  window.addEventListener('gamepaddisconnected', e => Game.toast('GAMEPAD ' + (e.gamepad.index + 1) + ' DISCONNECTED'));
  Input.updateHelp();
  Game.init();

  const toScreen = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
  };
  canvas.addEventListener('pointerdown', e => { const [x, y] = toScreen(e); Game.pointer(x, y); });
  // drag to paint in the editor
  canvas.addEventListener('pointermove', e => { if ((e.buttons & 1) && Game.state === 'construct') { const [x, y] = toScreen(e); Game.constructPointer(x, y, true); } });
  canvas.addEventListener('wheel', e => {
    if (Game.state !== 'settings' && Game.state !== 'shop') return;
    e.preventDefault();
    Game.wheel(e.deltaY);
  }, { passive: false });

  // SHARP scales by whole pixels; FILL uses all the space it can
  function resize() {
    const wrap = document.getElementById('wrap');
    const cs = getComputedStyle(wrap);
    const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let s = Math.min(w / canvas.width, h / canvas.height);
    if (s >= 1 && Config.get('scaling') === 'SHARP') s = Math.floor(s);
    s = Math.max(0.25, s);
    canvas.style.width = Math.round(canvas.width * s) + 'px';
    canvas.style.height = Math.round(canvas.height * s) + 'px';
  }
  Game.onResize = resize;
  const relayout = () => {
    // outside a game, FIT field sizes follow the window shape
    if (Game.state === 'title' || Game.state === 'settings') Game.applyLayout();
    resize();
  };
  window.addEventListener('resize', relayout);
  document.addEventListener('fullscreenchange', relayout);
  document.addEventListener('webkitfullscreenchange', relayout);
  canvas.addEventListener('dblclick', toggleFullscreen);
  resize();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.state === 'play' && !Game.paused && !Game.stage.over) {
      Game.paused = true;
      Game.pauseIdx = 0;
      Sound.setEngine(0);
    }
  });

  const BASE_STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    acc += now - last;
    last = now;
    if (acc > 200) acc = 200;
    // FORTRESS can be fast-forwarded (pause menu -> SPEED)
    const STEP = BASE_STEP / Config.scale('gameSpeed') / (Game.state === 'play' && Game.mode === 'fortress' && !Game.paused ? Config.get('tdSpeed') : 1);
    while (acc >= STEP) {
      Input.poll();
      if (!Net.panelOpen || Net.role === 'host') Game.update();
      Net.hostTick();
      Input.endFrame();
      acc -= STEP;
    }
    Game.render(ctx);
  }
  requestAnimationFrame(frame);
})();

  <script>
'use strict';
// =====================================================================
//  Construction: the level editor, and the levels you make with it.
//    8 save slots, each a level and its season (AUTO: whatever the stage would have); every change is saved at once.
//    A tile palette on the right (every terrain: brick, steel, water, trees, ice, mud, bridges, belts, teleporters),
//    and a random level generator: a symmetric map like the classic ones, checked so every entry point and both
//    players can reach the eagle.
//    CUSTOM LEVELS (on the title screen's MODE row) plays the slots you've filled, one after another, as a normal game
//    with tally, shop and all.
//  Keys: arrows move · A / Space place (again on the same spot: the next tile) · B place the previous tile
//        Q / E pick a tile · R random level · T season · 1-8 or PgUp / PgDn slot · Del clear · H help
//        Enter play it · Esc back. Mouse / touch: tap the palette, tap or drag on the field; tap RND, the season or the
//        slot on the side panel.
// =====================================================================

const CUSTOM_KEY = 'tank1990_customs', CUSTOM_SLOTS = 8;
const EDIT_THEMES = ['auto', 'classic'].concat(THEME_ORDER);
const EDIT_THEME_TAGS = { auto: 'ANY', classic: 'BLK', spring: 'SPR', summer: 'SUM', autumn: 'AUT', winter: 'WIN', nuclear: 'NUC', desert: 'DES' };

// the palette: the 14 patterns of the original editor (as 2x2 blocks), then the newer terrain
const CONSTRUCT_PATS = [
  ['.#', '.#'], ['..', '##'], ['#.', '#.'], ['##', '..'], ['##', '##'],
  ['.@', '.@'], ['..', '@@'], ['@.', '@.'], ['@@', '..'], ['@@', '@@'],
  ['~~', '~~'], ['%%', '%%'], ['__', '__'],
  // mud, a bridge, conveyor belts (up, right, down, left) and a teleporter pad (pads pair up in the order placed)
  ['mm', 'mm'], ['==', '=='], ['^^', '^^'], ['>>', '>>'], ['vv', 'vv'], ['<<', '<<'], ['TT', 'TT'],
  ['..', '..'],
];
const PAT_BRICK = 4;

// the saved levels
const Customs = {
  data: null,
  load() {
    if (this.data) return this.data;
    let d = STORE.get(CUSTOM_KEY, null);
    if (!d || !Array.isArray(d.levels)) {
      d = { slot: 0, levels: [] };
      const old = STORE.get('tank1990_custom', null);   // the single level of older versions goes into slot 1
      if (Array.isArray(old) && old.length === 26) d.levels[0] = { blocks: old, theme: 'auto' };
    }
    for (let i = 0; i < CUSTOM_SLOTS; i++) {
      const l = d.levels[i];
      if (!l || !Array.isArray(l.blocks) || l.blocks.length !== 26) d.levels[i] = { blocks: defaultCustomMap(), theme: 'auto' };
      else if (!EDIT_THEMES.includes(l.theme)) l.theme = 'auto';
    }
    if (!(d.slot >= 0 && d.slot < CUSTOM_SLOTS)) d.slot = 0;
    this.data = d;
    return d;
  },
  save() { STORE.set(CUSTOM_KEY, this.data); },
  level(i) { return this.load().levels[i]; },
  // slots with something in them
  used() {
    const blank = defaultCustomMap().join('');
    return this.load().levels.map((l, i) => i).filter(i => this.data.levels[i].blocks.join('') !== blank);
  },
};

// ------------------------------------------------------------------ random levels
// tiles a tank can't get through (brick can be shot away)
const LEVEL_WALL = { '@': 1, '~': 1 };

// can a tank get from every entry point and both player starts to the eagle? (2x2-block footprint, 1 block steps)
function levelReachable(g) {
  const ok = (x, y) => x >= 0 && y >= 0 && x < 25 && y < 25 && !LEVEL_WALL[g[y][x]] && !LEVEL_WALL[g[y][x + 1]] && !LEVEL_WALL[g[y + 1][x]] && !LEVEL_WALL[g[y + 1][x + 1]];
  const seen = new Uint8Array(25 * 25), q = [[12, 24]];
  seen[24 * 25 + 12] = 1;
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of DXY) {
      const nx = x + dx, ny = y + dy;
      if (!ok(nx, ny) || seen[ny * 25 + nx]) continue;
      seen[ny * 25 + nx] = 1;
      q.push([nx, ny]);
    }
  }
  return [[0, 0], [12, 0], [24, 0], [8, 24], [16, 24]].every(([x, y]) => seen[y * 25 + x]);
}

// a random level: built on the left half and mirrored, like the classic maps
function randomLevel(rnd01 = Math.random) {
  const ri = n => Math.floor(rnd01() * n);
  for (let attempt = 0; attempt < 60; attempt++) {
    const g = Array.from({ length: 26 }, () => Array(26).fill('.'));
    const put = (bx, by, c) => { if (bx >= 0 && by >= 0 && bx < 13 && by < 26) g[by][bx] = c; };
    // a rectangle in 16px tiles (tx 0-6: the left half and the middle column)
    const rect = (tx, ty, tw, th, c) => { for (let y = ty * 2; y < (ty + th) * 2; y++) for (let x = tx * 2; x < (tx + tw) * 2; x++) put(x, y, c); };
    const dens = 0.7 + rnd01() * 0.8;
    // walls: brick mostly, some steel; full tiles or half-thick lines
    for (let k = 0, n = 5 + ri(6 * dens); k < n; k++) {
      const tx = ri(7), ty = 1 + ri(10), horiz = rnd01() < 0.5, len = 1 + ri(4), mat = rnd01() < 0.82 ? '#' : '@';
      const half = rnd01() < 0.35 ? ri(2) : -1;
      for (let i = 0; i < len; i++) {
        const x = horiz ? tx + i : tx, y = horiz ? ty : ty + i;
        if (x > 6 || y > 11) break;
        for (let by = y * 2; by < y * 2 + 2; by++) for (let bx = x * 2; bx < x * 2 + 2; bx++) {
          if (half >= 0 && (horiz ? by - y * 2 : bx - x * 2) !== half) continue;
          put(bx, by, mat);
        }
      }
    }
    // ponds, trees, ice and the odd patch of mud
    if (rnd01() < 0.7) for (let k = 0, n = 1 + ri(3); k < n; k++) rect(ri(6), 2 + ri(8), 1 + ri(3), 1 + ri(2), '~');
    for (let k = 0, n = 1 + ri(3); k < n; k++) rect(ri(7), 1 + ri(10), 1 + ri(3), 1 + ri(3), '%');
    if (rnd01() < 0.4) rect(ri(6), 2 + ri(8), 1 + ri(3), 1 + ri(2), '_');
    if (rnd01() < 0.35) rect(ri(6), 2 + ri(8), 1 + ri(2), 1 + ri(2), 'm');
    // a bridge across a pond now and then
    if (rnd01() < 0.25) { const tx = ri(6), ty = 2 + ri(8); rect(tx, ty, 2, 1, '~'); rect(tx + ri(2), ty, 1, 1, '='); }
    // a conveyor belt, a teleporter pair (its twin comes from the mirror)
    if (rnd01() < 0.25) {
      const horiz = rnd01() < 0.5, tx = ri(5), ty = 2 + ri(8), len = 2 + ri(3), c = horiz ? (rnd01() < 0.5 ? '>' : '<') : (rnd01() < 0.5 ? '^' : 'v');
      for (let i = 0; i < len; i++) rect(horiz ? Math.min(6, tx + i) : tx, horiz ? ty : Math.min(10, ty + i), 1, 1, c);
    }
    if (rnd01() < 0.25) rect(ri(5), 2 + ri(8), 1, 1, 'T');
    // the right half mirrors the left (belts turn round too)
    const flip = { '<': '>', '>': '<' };
    for (let by = 0; by < 26; by++) for (let bx = 0; bx < 13; bx++) g[by][25 - bx] = flip[g[by][bx]] || g[by][bx];
    // entry points, player starts and the eagle stay clear; the fortress goes round the eagle
    const clear = (x0, y0, w, h) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) g[y][x] = '.'; };
    clear(0, 0, 2, 2); clear(12, 0, 2, 2); clear(24, 0, 2, 2);
    clear(8, 24, 2, 2); clear(16, 24, 2, 2); clear(10, 21, 6, 5);
    for (const [bx, by] of [[11, 23], [12, 23], [13, 23], [14, 23], [11, 24], [14, 24], [11, 25], [14, 25]]) g[by][bx] = '#';
    if (levelReachable(g)) return g.map(r => r.join(''));
  }
  return defaultCustomMap();
}

// a pattern drawn small (palette) or large (preview): s = size of one block
function drawPattern(ctx, p, x, y, s, theme) {
  const tex = themeTex(theme || 'classic');
  const src = { '#': tex.brick, '@': tex.steel, '~': tex.water0, '%': tex.forest, '_': tex.ice, m: Sprites.mudTex, '=': Sprites.bridgeTex };
  ctx.fillStyle = COL.black;
  ctx.fillRect(x, y, s * 2, s * 2);
  for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
    const c = p[j][i], im = src[c];
    if (im) ctx.drawImage(im, 0, 0, 8, 8, x + i * s, y + j * s, s, s);
  }
  const arrow = { '^': [0, -1], '>': [1, 0], v: [0, 1], '<': [-1, 0] }[p[0][0]];
  if (arrow) {
    ctx.fillStyle = '#383838'; ctx.fillRect(x, y, s * 2, s * 2);
    ctx.fillStyle = '#9C9C9C';
    const cx = x + s, cy = y + s;
    for (let k = -1; k <= 1; k++) ctx.fillRect(cx + arrow[0] * k * s / 3 - 1, cy + arrow[1] * k * s / 3 - 1, 2, 2);
    ctx.fillRect(cx + arrow[0] * s * 0.6 - 1, cy + arrow[1] * s * 0.6 - 1, 2, 2);
  }
  if (p[0][0] === 'T') { ctx.strokeStyle = PAD_COLORS[0]; ctx.strokeRect(x + s * 0.3 + 0.5, y + s * 0.3 + 0.5, s * 1.4 - 1, s * 1.4 - 1); }
}

// side panel layout (screen coordinates)
const ED_PANEL_X = () => FX + VIEW_W + 4;
const ED_PAL_Y = 6, ED_PAL_STEP = 10;
const ED_ROWS = { rnd: 122, theme: 136, slot: 150, help: 192, go: 206 };

Object.assign(Game, {
  toConstruct() {
    this.applyLayout(13, 13);   // the editor works on the classic 13x13 field
    const d = Customs.load();
    this.ed = { tx: 6, ty: 6, pat: PAT_BRICK, last: null, rep: 0, help: !STORE.get('tank1990_edhelp', false) };
    STORE.set('tank1990_edhelp', true);
    this.loadSlot(d.slot);
    this.setState('construct');
  },

  loadSlot(i) {
    const d = Customs.load();
    d.slot = i;
    Customs.save();
    const lv = d.levels[i];
    this.custom = lv.blocks.slice();
    this.customTheme = lv.theme;
    this.rebuildEdStage();
  },

  rebuildEdStage() {
    const th = this.customTheme === 'auto' ? 'classic' : this.customTheme;
    this.ed.stage = new Stage(1, this.custom, [], { custom: true, theme: th, editor: true });
  },

  saveSlot() {
    const lv = Customs.level(Customs.load().slot);
    lv.blocks = this.custom.slice();
    lv.theme = this.customTheme;
    Customs.save();
    STORE.set('tank1990_custom', this.custom);   // older versions' single level
  },

  editTile(tx, ty, patIdx) {
    if (tx === 6 && ty === 12) return; // the eagle itself
    const p = CONSTRUCT_PATS[patIdx];
    const rows = this.custom.map(r => r.split(''));
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
      const bx = tx * 2 + x, by = ty * 2 + y;
      rows[by][bx] = p[y][x];
      this.ed.stage.setBlock(bx, by, BLOCK_TYPE[p[y][x]]);
    }
    this.custom = rows.map(r => r.join(''));
    this.ed.stage.pads = padsFromBlocks(this.custom);
    this.saveSlot();
    Sound.play('build');
  },

  edRandom() {
    this.custom = randomLevel();
    this.saveSlot();
    this.rebuildEdStage();
    Sound.play('pickup');
  },

  edTheme(dir) {
    const i = EDIT_THEMES.indexOf(this.customTheme);
    this.customTheme = EDIT_THEMES[(i + dir + EDIT_THEMES.length) % EDIT_THEMES.length];
    this.saveSlot();
    this.rebuildEdStage();
    Sound.play('select');
  },

  edSlot(i) {
    this.saveSlot();
    this.loadSlot((i + CUSTOM_SLOTS) % CUSTOM_SLOTS);
    Sound.play('select');
  },

  edPick(dir) {
    const n = CONSTRUCT_PATS.length;
    this.ed.pat = (this.ed.pat + dir + n) % n;
    this.ed.last = null;
    Sound.play('select');
  },

  updateConstruct() {
    const ed = this.ed, m = Input.menu(), just = k => Input.just.has(k);
    if (ed.help) { if (m.ok || m.back || m.fire || just('KeyH')) { ed.help = false; Sound.play('select'); } return; }
    const moveCursor = d => {
      ed.tx = Math.max(0, Math.min(12, ed.tx + DXY[d][0]));
      ed.ty = Math.max(0, Math.min(12, ed.ty + DXY[d][1]));
    };
    const tapped = m.up ? 0 : m.right ? 1 : m.down ? 2 : m.left ? 3 : -1;
    if (tapped >= 0) {
      moveCursor(tapped);
      ed.rep = 14; // auto-repeat after a short delay
    } else {
      const held = Input.heldDir();
      if (held >= 0 && --ed.rep <= 0) { moveCursor(held); ed.rep = 5; }
    }
    const here = ed.tx + ',' + ed.ty;
    if (m.fire && !m.start) {
      if (ed.last === here) ed.pat = (ed.pat + 1) % CONSTRUCT_PATS.length;   // again on the same spot: the next tile
      ed.last = here;
      this.editTile(ed.tx, ed.ty, ed.pat);
    } else if (m.alt) {
      ed.pat = (ed.pat + CONSTRUCT_PATS.length - 1) % CONSTRUCT_PATS.length;
      ed.last = here;
      this.editTile(ed.tx, ed.ty, ed.pat);
    }
    if (just('KeyQ') || just('BracketLeft')) this.edPick(-1);
    if (just('KeyE') || just('BracketRight')) this.edPick(1);
    if (just('KeyR')) this.edRandom();
    if (just('KeyT')) this.edTheme(1);
    if (just('KeyH')) { ed.help = true; Sound.play('select'); }
    if (just('PageUp')) this.edSlot(Customs.load().slot - 1);
    if (just('PageDown')) this.edSlot(Customs.load().slot + 1);
    for (let k = 1; k <= CUSTOM_SLOTS; k++) if (just('Digit' + k)) this.edSlot(k - 1);
    if (m.start) { this.saveSlot(); this.newGame(1, true); }
    else if (m.back) { this.saveSlot(); this.toTitle(); }
    else if (just('Delete')) { this.custom = defaultCustomMap(); this.saveSlot(); this.rebuildEdStage(); Sound.play('steel'); }
  },

  // mouse / touch: the palette, the side panel's buttons, or paint on the field (drag: true while moving)
  constructPointer(x, y, drag) {
    const ed = this.ed, px = ED_PANEL_X();
    if (ed.help) { if (!drag) ed.help = false; return; }
    if (x >= FX && y >= FY && x < FX + 208 && y < FY + 208) {
      const tx = Math.floor((x - FX) / 16), ty = Math.floor((y - FY) / 16);
      if (drag && ed.tx === tx && ed.ty === ty) return;
      ed.tx = tx; ed.ty = ty; ed.last = tx + ',' + ty;
      this.editTile(tx, ty, ed.pat);
      return;
    }
    if (drag || x < px - 2) return;
    const i = Math.floor((y - ED_PAL_Y) / ED_PAL_STEP) * 2 + (x >= px + 12 ? 1 : 0);
    if (y >= ED_PAL_Y && i >= 0 && i < CONSTRUCT_PATS.length) { ed.pat = i; ed.last = null; Sound.play('select'); return; }
    const near = r => Math.abs(y - (r + 3)) <= 6;
    if (near(ED_ROWS.rnd)) this.edRandom();
    else if (near(ED_ROWS.theme)) this.edTheme(1);
    else if (near(ED_ROWS.slot)) this.edSlot(Customs.load().slot + 1);
    else if (near(ED_ROWS.help)) { ed.help = true; Sound.play('select'); }
    else if (near(ED_ROWS.go)) { this.saveSlot(); this.newGame(1, true); }
  },

  renderConstruct(ctx) {
    const ed = this.ed, st = ed.stage, th = st.theme;
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, SW, SH);
    if (st.dirty) st.buildLayers();
    ctx.save();
    ctx.translate(FX, FY);
    ctx.drawImage(st.groundLayer(), 0, 0);
    ctx.drawImage(st.bgLayer, 0, 0);
    const wt = themeTex(th).water0;
    for (const i of st.waterCells) {
      const cx = i % GW, cy = (i / GW) | 0;
      ctx.drawImage(wt, (cx & 1) * 4, (cy & 1) * 4, 4, 4, cx * 4, cy * 4, 4, 4);
    }
    st.frame = this.t;
    st.renderBelts(ctx);
    st.renderPads(ctx);
    ctx.drawImage(Sprites.eagle, BASE_X, BASE_Y);
    ctx.drawImage(st.forestLayer, 0, 0);
    if (((this.t >> 3) & 1) === 0) ctx.drawImage(Sprites.tank('p0', 0, 0, Config.playerPal(0)), ed.tx * 16, ed.ty * 16);
    ctx.restore();
    // the side panel: palette, then RND, the season, the slot, help and play
    const px = ED_PANEL_X();
    CONSTRUCT_PATS.forEach((p, i) => {
      const x = px + (i & 1) * 12, y = ED_PAL_Y + (i >> 1) * ED_PAL_STEP;
      drawPattern(ctx, p, x, y, 4, th);
      if (i === ed.pat) { ctx.strokeStyle = (this.t >> 3) & 1 ? COL.white : COL.gold; ctx.strokeRect(x - 0.5, y - 0.5, 9, 9); }
    });
    Font.draw(ctx, 'RND', px, ED_ROWS.rnd, COL.gold);
    const tt = THEMES[this.customTheme] || {};
    Font.draw(ctx, EDIT_THEME_TAGS[this.customTheme], px, ED_ROWS.theme, this.customTheme === 'auto' ? COL.black : tt.color || COL.white);
    Font.draw(ctx, 'S' + (Customs.load().slot + 1), px, ED_ROWS.slot, COL.black);
    Font.draw(ctx, 'H?', px + 4, ED_ROWS.help, COL.black);
    Font.draw(ctx, 'GO', px + 4, ED_ROWS.go, COL.black);
    if (ed.help) this.renderConstructHelp(ctx);
  },

  renderConstructHelp(ctx) {
    const x = FX + 4, y = FY + 4, w = 200, lines = [
      ['ARROWS', 'MOVE'], ['A SPACE', 'PLACE TILE'], ['', 'AGAIN: NEXT ONE'], ['B', 'PREVIOUS TILE'], ['Q E', 'PICK A TILE'],
      ['R', 'RANDOM LEVEL'], ['T', 'SEASON'], ['1-8', 'SAVE SLOT'], ['DEL', 'CLEAR'], ['ENTER', 'PLAY IT'], ['ESC', 'BACK'],
      ['MOUSE', 'PICK, PAINT'],
    ];
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(x, y, w, 200);
    Font.drawCenter(ctx, 'CONSTRUCTION', x + w / 2, y + 6, COL.orange);
    lines.forEach(([k, v], i) => { Font.draw(ctx, k, x + 6, y + 22 + i * 13, COL.gold); Font.draw(ctx, v, x + 70, y + 22 + i * 13, COL.white); });
    Font.drawCenter(ctx, 'SAVED AS YOU GO', x + w / 2, y + 186, '#7C7C7C');
  },
});

  <script>
'use strict';
// =====================================================================
//  Mode title screens: when a game starts, its mode shows a pixel-art picture of its own before the first stage,
//  with the mode's name, what it is about, and the tune that goes with it (music.js plays it, in the version for
//  your skill). Enter or fire moves on, Escape goes back to the title, and after a few seconds it moves on by itself.
//  Not shown for the daily challenge or when testing a level from the editor. Settings -> GAME -> MODE TITLE SCREENS.
//  The pictures are drawn at 112x64 and shown at double size, so every pixel is a chunky 2x2 block.
// =====================================================================

const INTRO_W = 112, INTRO_H = 64, INTRO_X = 16, INTRO_Y = 38, INTRO_TIME = 480, MUSIC_DELAY = 150;

// little drawing helpers (in the picture's own 112x64 pixels)
const Pix = {
  rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); },
  // a filled circle, row by row
  disc(c, cx, cy, r, col) {
    c.fillStyle = col;
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.3);
      c.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
    }
  },
  line(c, x0, y0, x1, y1, col, w = 1) {
    c.fillStyle = col;
    const n = Math.max(1, Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let k = 0; k <= n; k++) c.fillRect(Math.round(x0 + (x1 - x0) * k / n), Math.round(y0 + (y1 - y0) * k / n), w, w);
  },
  // a texture (8x8) tiled over a rectangle
  tiles(c, tex, x, y, w, h) {
    for (let yy = 0; yy < h; yy += 8) for (let xx = 0; xx < w; xx += 8) {
      const tw = Math.min(8, w - xx), th = Math.min(8, h - yy);
      c.drawImage(tex, 0, 0, tw, th, x + xx, y + yy, tw, th);
    }
  },
  spr(c, img, x, y, flip) {
    if (!flip) { c.drawImage(img, Math.round(x), Math.round(y)); return; }
    c.save(); c.translate(Math.round(x) + img.width, Math.round(y)); c.scale(-1, 1); c.drawImage(img, 0, 0); c.restore();
  },
  // horizontal colour bands with a dithered seam between them (an NES sky)
  bands(c, y, h, cols) {
    const bh = h / cols.length;
    cols.forEach((col, i) => {
      Pix.rect(c, 0, y + Math.round(i * bh), INTRO_W, Math.ceil(bh), col);
      if (i) { c.fillStyle = cols[i - 1]; for (let x = i % 2; x < INTRO_W; x += 2) c.fillRect(x, y + Math.round(i * bh), 1, 1); }
    });
  },
  stars(c, n, seed, t, h) {
    const r = seeded(seed);
    for (let k = 0; k < n; k++) {
      const x = Math.floor(r() * INTRO_W), y = Math.floor(r() * h), ph = Math.floor(r() * 64);
      if ((t + ph) % 64 < 6) continue;
      Pix.rect(c, x, y, 1, 1, (t + ph) % 64 < 12 ? '#7C7C7C' : '#F8F8F8');
    }
  },
  // a pixel grid ('.' empty, other characters looked up in pal)
  grid(c, rows, x, y, pal, s = 1) {
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (pal[row[i]]) Pix.rect(c, x + i * s, y + j * s, s, s, pal[row[i]]); });
  },
  boom(c, x, y, f) {
    const e = f < 4 ? Sprites.smallExp[Math.min(Sprites.smallExp.length - 1, f)] : Sprites.bigExp[Math.min(Sprites.bigExp.length - 1, (f - 4) >> 1)];
    c.drawImage(e, Math.round(x + 8 - e.width / 2), Math.round(y + 8 - e.height / 2));
  },
};

const SKULL = ['....XXXXXXXX....', '..XXXXXXXXXXXX..', '.XXXXXXXXXXXXXX.', '.XXXXXXXXXXXXXX.', 'XXX...XXXX...XXX', 'XX.....XX.....XX',

const TROPHY = ['YYYYYYYYYYYY', 'yYYWYYYYYYYy', 'y.YWYYYYYY.y', 'y.YYYYYYYY.y', '.yYYYYYYYYy.', '..YYYYYYYY..', '...YYYYYY...', '....YYYY....',
  '.....YY.....', '.....YY.....', '....dddd....', '...dddddd...'];

// the maze picture's maze (made once): 18 x 10 cells, a block to a pixel
let introMazeCache = null;
function introMaze() {
  if (introMazeCache) return introMazeCache;
  const m = mazeLayout(18, 10, seeded(1987)), r = seeded(42);
  m.patrol = [];
  for (let k = 0; k < 7; k++) m.patrol.push([1 + Math.floor(r() * 16), Math.floor(r() * 9)]);
  introMazeCache = m;
  return m;
}

// the bigmaps world (made once): value noise turned into water, forest, bricks and steel
let introWorld = null;
function introWorldMap() {
  if (introWorld) return introWorld;
  const W = 224, H = 64, r = seeded(1990), g = [];
  for (let k = 0; k < (W / 8 + 2) * (H / 8 + 2); k++) g.push(r());
  const at = (i, j) => g[j * (W / 8 + 2) + i];
  const noise = (x, y) => {
    const i = Math.floor(x / 8), j = Math.floor(y / 8), fx = (x % 8) / 8, fy = (y % 8) / 8;
    return at(i, j) * (1 - fx) * (1 - fy) + at(i + 1, j) * fx * (1 - fy) + at(i, j + 1) * (1 - fx) * fy + at(i + 1, j + 1) * fx * fy;
  };
  const c = makeCanvas(W, H), x = c.getContext('2d');
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const n = noise(xx, yy), q = r();
    x.fillStyle = n < 0.28 ? (q < 0.15 ? '#3C64F8' : '#2038C8') : n > 0.72 ? (q < 0.3 ? '#005800' : '#00A800')
      : n > 0.6 && q < 0.4 ? '#A44400' : n > 0.4 && n < 0.44 && q < 0.5 ? '#BCBCBC' : q < 0.03 ? '#1C1C1C' : '#000000';
    x.fillRect(xx, yy, 1, 1);
  }
  introWorld = c;
  return c;
}

    Pix.rect(c, 0, 0, INTRO_W, 18, '#0C1C3C');
    Pix.stars(c, 10, 21, t, 18);
    Pix.grid(c, TROPHY, 50, 2, { Y: '#F8B800', y: '#C07000', W: '#F8F8F8', d: '#7C4C00' }, 1);
    // waving flags beside the cup
    for (const [fx, flip] of [[16, false], [80, true]]) {
      Pix.rect(c, fx + (flip ? 16 : 0), 1, 1, 17, '#ADADAD');
      for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
        const x = flip ? fx + 12 - i * 4 : fx + 1 + i * 4, y = 2 + j * 4 + Math.round(Math.sin(t / 6 + i) * 1.2);
        Pix.rect(c, x, y, 4, 4, (i + j) & 1 ? '#000000' : '#F8F8F8');
      }
    }
    const cyc = t % 200, speeds = [0.27, 0.25, 0.29, 0.23];
    for (let i = 0; i < 4; i++) {
      const y = Math.max(22, 48 - cyc * speeds[(i + Math.floor(t / 200)) % 4]);
      c.drawImage(Sprites.tank('p' + i, (t >> 1) & 1, 0, Config.playerPal(i)), 4 + i * 28, y);
      if (y <= 22 && (t >> 3) & 1) Pix.rect(c, 4 + i * 28 + 6, 44, 4, 4, COL.gold);
    }
  },

  // eagle against eagle, lightning between them
  eagles(c, t) {
    const p1 = PALS[Config.playerPal(0)], p2 = PALS[Config.playerPal(1)];
    Pix.bands(c, 0, 44, ['#000000', '#08081C', '#101030']);
    Pix.stars(c, 20, 9, t, 40);
    Pix.bands(c, 44, 20, ['#1C1C1C', '#0C0C0C']);
    for (const [x, pal, flip] of [[4, p1, false], [76, p2, true]]) {
      Pix.rect(c, x, 8, 32, 40, pal[3]);
      Pix.rect(c, x + 2, 10, 28, 36, '#000000');
      c.save(); c.translate(x + 16, 28); c.scale(flip ? -2 : 2, 2); c.drawImage(Sprites.eagle, -8, -8); c.restore();
      Pix.tiles(c, Sprites.tex.brick, x, 48, 32, 8);
    }
    // lightning: a new crooked bolt every few frames
    if ((t >> 1) % 6 < 4) {
      const r = seeded(Math.floor(t / 4) + 5);
      let x = 38, y = 26 + Math.floor(r() * 6);
      const col = (t >> 1) & 1 ? '#F8F8F8' : '#F8D878';
      while (x < 74) {
        const nx = Math.min(74, x + 4 + Math.floor(r() * 5)), ny = 20 + Math.floor(r() * 16);
        Pix.line(c, x, y, nx, ny, col, 2);
        x = nx; y = ny;
      }
    }
    Font.draw(c, 'VS', 49, 50, (t >> 4) & 1 ? COL.gold : COL.red);
  },

  // no mercy: a skull, crossed cannons, a tank in every corner firing
  dm(c, t) {
    Pix.bands(c, 0, INTRO_H, ['#180000', '#280000', '#380000', '#280000', '#180000']);
    Pix.line(c, 26, 6, 86, 58, '#3C3C3C', 5); Pix.line(c, 86, 6, 26, 58, '#3C3C3C', 5);
    Pix.line(c, 26, 6, 86, 58, '#7C7C7C', 2); Pix.line(c, 86, 6, 26, 58, '#7C7C7C', 2);
    Pix.grid(c, SKULL, 40, 4, { X: '#F8F8F8', r: (t >> 3) & 1 ? '#F83800' : '#000000' }, 2);
    const corners = [[2, 2, 1], [94, 2, 3], [2, 46, 1], [94, 46, 3]];
    corners.forEach(([x, y, dir], i) => {
      c.drawImage(Sprites.tank('p' + i, (t >> 3) & 1, dir, Config.playerPal(i)), x, y);
      const ph = (t + i * 20) % 80;
      if (ph < 3) Pix.disc(c, dir === 1 ? x + 17 : x - 2, y + 7, 2, COL.gold);
      if (ph < 24) c.drawImage(Sprites.bullet[dir], dir === 1 ? x + 17 + ph * 1.5 : x - 5 - ph * 1.5, y + 6);
      else if (ph < 32) Pix.boom(c, dir === 1 ? x + 10 + 36 : x - 36 - 10, y, (ph - 24) >> 1);
    });
  },

  // capture the flag: a tank runs the enemy flag home, the other gives chase
  ctf(c, t) {
    Pix.rect(c, 0, 0, INTRO_W, INTRO_H, '#1C3C10');
    const r = seeded(17);
    for (let k = 0; k < 60; k++) Pix.rect(c, Math.floor(r() * INTRO_W), Math.floor(r() * INTRO_H), 1, 2, r() < 0.5 ? '#2C5C18' : '#102808');
    Pix.rect(c, 0, 30, INTRO_W, 12, '#4C3C1C');
    for (let x = 0; x < INTRO_W; x += 8) Pix.rect(c, x + 2, 35, 4, 1, '#6C5428');
    const pal1 = Config.playerPal(0), pal2 = Config.playerPal(1), cyc = t % 240, carry = cyc < 180;
    const caps = Math.floor(t / 240) % 4;
    // the two bases
    Pix.tiles(c, Sprites.tex.steel, 0, 8, 20, 4); Pix.tiles(c, Sprites.tex.steel, 92, 8, 20, 4);
    c.drawImage(Sprites.vsFlag(pal1), 2, 12 + ((t >> 4) & 1));
    if (!carry) c.drawImage(Sprites.vsFlag(pal2), 94, 12 + ((t >> 4) & 1));
    // the runner, with their flag, and the chaser behind
    const x = carry ? 86 - cyc * 0.42 : 10;
    c.drawImage(Sprites.tank('p0', (t >> 2) & 1, 3, pal1), x, 28);
    if (carry) c.drawImage(Sprites.vsFlag(pal2), x + 4, 14 + ((t >> 3) & 1));
    else if ((t >> 3) & 1) Font.draw(c, 'CAPTURE!', 26, 50, COL.gold);
    if (carry) c.drawImage(Sprites.tank('p1', (t >> 2) & 1, 3, pal2), Math.min(96, x + 30 + Math.sin(t / 20) * 4), 28);
    Pix.rect(c, 40, 0, 32, 10, '#000000');
    Font.draw(c, caps + (carry ? 0 : 1) + '-0', 44, 1, '#F8F8F8');
  },

  // the computer: an old monitor with a face, the enemy HQ outlined in red
  cpu(c, t) {
    Pix.rect(c, 0, 0, INTRO_W, INTRO_H, '#0C0C1C');
    for (let y = 0; y < INTRO_H; y += 4) Pix.rect(c, 0, y, INTRO_W, 1, '#141428');
    // the monitor
    Pix.rect(c, 6, 4, 54, 44, '#C8B890'); Pix.rect(c, 6, 4, 54, 1, '#E8D8B0'); Pix.rect(c, 59, 4, 1, 44, '#887850');
    Pix.rect(c, 10, 8, 46, 32, '#081808');
    for (let y = 8; y < 40; y += 2) Pix.rect(c, 10, y, 46, 1, '#0C240C');
    const r = seeded(Math.floor(t / 6));
    for (let k = 0; k < 10; k++) Pix.rect(c, 12 + Math.floor(r() * 42), 10 + Math.floor(r() * 28), 1, 1, '#1C501C');
    const blink = t % 100 > 94, g = '#38F838';
    for (const ex of [20, 38]) Pix.rect(c, ex, blink ? 19 : 16, 7, blink ? 1 : 5, g);
    const mw = 10 + Math.round(Math.abs(Math.sin(t / 5)) * 8);
    Pix.rect(c, 33 - mw / 2, 30, mw, 2, g);
    Pix.rect(c, 50, 43, 3, 2, (t >> 4) & 1 ? '#F83800' : '#500000');
    Pix.rect(c, 14, 43, 20, 2, '#887850');
    Pix.rect(c, 24, 48, 18, 4, '#A89870'); Pix.rect(c, 16, 52, 34, 4, '#C8B890');
    Font.draw(c, 'VS', 64, 26, (t >> 4) & 1 ? COL.gold : '#F8F8F8');
    // the enemy HQ
    Pix.tiles(c, Sprites.tex.steel, 82, 16, 28, 4); Pix.tiles(c, Sprites.tex.steel, 82, 40, 28, 4);
    Pix.tiles(c, Sprites.tex.steel, 82, 20, 4, 20); Pix.tiles(c, Sprites.tex.steel, 106, 20, 4, 20);
    c.drawImage(Sprites.eagle, 88, 22);
    c.drawImage(Sprites.outline(Sprites.eagle, (t >> 3) & 1 ? '#F83800' : '#A80000'), 87, 21);
  },
};

Object.assign(Game, {
  // newGame: the mode's title screen, then the curtain it would have shown
  introWanted(custom) {
    return Config.on('modeIntro') && !custom && !this.daily && Net.role !== 'client' && !!INTRO_SCENES[this.mode];
  },

  toModeIntro() {
    this.introNext = this.curtain;
    this.setState('modeIntro');
  },

  updateModeIntro() {
    const m = Input.menu();
    if (m.back) { this.toTitle(); return; }
    if (this.t >= INTRO_TIME || (this.t > 20 && m.ok)) {
      if (m.ok) Sound.play('select');
      this.curtain = Object.assign(this.introNext || { selectable: false }, { h: SCREEN_H / 2, phase: 'show' });
      this.setState('curtain');
    }
  },

  renderModeIntro(ctx) {
    const mode = this.mode, info = modeInfo(mode), t = this.t;
    if (!this.introCanvas) this.introCanvas = makeCanvas(INTRO_W, INTRO_H);
    const pc = this.introCanvas, c = pc.getContext('2d');
    c.save();
    c.imageSmoothingEnabled = false;
    (INTRO_SCENES[mode] || INTRO_SCENES.classic)(c, t);
    c.restore();
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, SW, SH);
    // the name, in bricks, as big as fits
    const name = info.name;
    let s = 3;
    while (s > 1 && Font.bigWidth(name, s) > SW - 16) s--;
    Font.big(ctx, name, (SW - Font.bigWidth(name, s)) >> 1, 18 - (7 * s >> 1), s, Sprites.bricks(ctx));
    // the picture in a double frame
    ctx.fillStyle = '#F8F8F8'; ctx.fillRect(INTRO_X - 4, INTRO_Y - 4, INTRO_W * 2 + 8, INTRO_H * 2 + 8);
    ctx.fillStyle = COL.black; ctx.fillRect(INTRO_X - 3, INTRO_Y - 3, INTRO_W * 2 + 6, INTRO_H * 2 + 6);
    ctx.fillStyle = '#7C7C7C'; ctx.fillRect(INTRO_X - 2, INTRO_Y - 2, INTRO_W * 2 + 4, INTRO_H * 2 + 4);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pc, INTRO_X, INTRO_Y, INTRO_W * 2, INTRO_H * 2);
    // fade in, NES style (in steps)
    if (t < 16) { ctx.fillStyle = 'rgba(0,0,0,' + [0.75, 0.5, 0.25, 0][t >> 2] + ')'; ctx.fillRect(INTRO_X, INTRO_Y, INTRO_W * 2, INTRO_H * 2); }
    const y = INTRO_Y + INTRO_H * 2 + 8;
    Font.drawCenter(ctx, info.desc, SW / 2, y, '#F8F8F8');
    const lv = Music.skillLevel(), song = SONGS[mode] || SONGS.classic;
    Font.drawCenter(ctx, 'MUSIC: ' + song.name, SW / 2, y + 11, SKILL_TAGS[lv][1]);
    if ((t >> 4) & 1 || t < 20) Font.drawCenter(ctx, 'PRESS ENTER', SW / 2, y + 23, COL.red);
  },

  // what should be playing right now (every frame, also for online guests): the mode's tune on its title screen
  // and during a stage (once the start jingle is over), nothing anywhere else
  musicFrame() {
    const st = this.stage, s = this.state;
    let mode = null;
    if (s === 'modeIntro') mode = this.mode;
    else if (st && st.bossDefeated && (s === 'play' || s === 'score')) mode = 'victory';   // a boss beaten: celebrate
    else if (s === 'play' && st && !st.over && st.frame > MUSIC_DELAY) mode = this.mode;
    // paused: the music pauses too, except while you're setting its volume in the pause menu (so you can hear it)
    const tuning = s === 'play' && this.paused && ['MUSIC', 'MUSIC VOL'].includes(pauseMenu()[this.pauseIdx]);
    Music.want(mode, Music.skillLevel(), s === 'play' && this.paused && !tuning);
  },
});

</script>
