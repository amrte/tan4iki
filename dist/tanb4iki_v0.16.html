  <script>
'use strict';
// =====================================================================
//  Enemy personalities and path finding
//  In the original every enemy wanders at random. Here each tank gets a personality when it appears:
//    WANDER - the classic random drive
//    RUSH   - heads for the eagle along the cheapest route, shooting through bricks on the way
//    HUNT   - chases the nearest player
//    SNIPE  - keeps its distance, lines up with a player (or the eagle) and shells from range
// =====================================================================

const AI = { WANDER: 0, RUSH: 1, HUNT: 2, SNIPE: 3 };
const AI_MARK = [null, '#F83800', '#F8B800', '#3CBCFC'];   // "SHOW AI TYPE": rush, hunt, snipe
const SNIPE_MIN = 40, SNIPE_MAX = 136;                    // preferred shelling range in pixels

function pickPersonality(type, stageNum) {
  const mode = Config.get('aiStyle');
  if (mode === 'CLASSIC') return AI.WANDER;
  if (mode !== 'MIXED') return AI[mode];
  const w = ENEMY[type].ai.slice();
  // later stages bring fewer aimless tanks; the first few stages go easy on rushing and hunting
  w[0] *= Math.max(0.35, 1 - (stageNum - 1) * 0.03);
  const ramp = Math.min(1, 0.4 + stageNum * 0.12) * Config.skill().aggr;
  w[1] *= ramp; w[2] *= ramp; w[3] *= Config.skill().aggr;
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 4; i++) { if (r < w[i]) return i; r -= w[i]; }
  return AI.WANDER;
}

// small binary heap of [priority, node]
class NavHeap {
  constructor() { this.a = []; }
  push(p, n) {
    const a = this.a;
    a.push([p, n]);
    let i = a.length - 1;
    while (i > 0) {
      const j = (i - 1) >> 1;
      if (a[j][0] <= a[i][0]) break;
      [a[i], a[j]] = [a[j], a[i]];
      i = j;
    }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = i * 2 + 1, r = l + 1;
        let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break;
        [a[i], a[m]] = [a[m], a[i]];
        i = m;
      }
    }
    return top;
  }
  get size() { return this.a.length; }
}

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ navigation grid
  // Nodes are tank positions on the 8px grid. Entering a node costs 1, plus extra for every brick cell
  // under the tank (it has to shoot its way through); steel, water and the eagle can't be entered.
  navCosts(mode = '') {
    const cache = this.navCost || (this.navCost = {});
    if (cache[mode] && cache[mode].ver === this.terrainVer) return cache[mode].c;
    const NX = COLS * 2 - 1, NY = ROWS * 2 - 1, c = new Float32Array(NX * NY);
    for (let by = 0; by < NY; by++) for (let bx = 0; bx < NX; bx++) {
      let cost = 1;
      for (let cy = by * 2; cy < by * 2 + 4 && cost > 0; cy++) for (let cx = bx * 2; cx < bx * 2 + 4; cx++) {
        const t = this.get(cx, cy);
        if (t === T_STEEL || (t === T_WATER && mode !== 'hover')) { cost = -1; break; }
        if (t === T_BRICK && mode !== 'slither') cost += 0.6;
        if (t === T_MUD && mode !== 'hover') cost += 0.25;
      }
      if (overlap(bx * 8, by * 8, 16, 16, BASE_X, BASE_Y, 16, 16)) cost = -1;
      c[by * NX + bx] = cost;
    }
    cache[mode] = { c, ver: this.terrainVer };
    return c;
  },

  // distance (in moves) from every node to the nearest seed node
  navField(seeds, mode = '') {
    const NX = COLS * 2 - 1, cost = this.navCosts(mode), dist = new Float64Array(cost.length).fill(Infinity);
    const h = new NavHeap();
    for (const n of seeds) if (n >= 0 && n < dist.length) { dist[n] = 0; h.push(0, n); }
    while (h.size) {
      const [d, v] = h.pop();
      if (d > dist[v]) continue;
      const vx = v % NX, vy = (v / NX) | 0, step = Math.max(1, cost[v]);
      for (const [dx, dy] of DXY) {
        const ux = vx + dx, uy = vy + dy;
        if (ux < 0 || uy < 0 || ux >= NX || uy * NX >= dist.length) continue;
        const u = uy * NX + ux;
        if (cost[u] < 0) continue;
        const nd = d + step;
        if (nd < dist[u]) { dist[u] = nd; h.push(nd, u); }
      }
    }
    return dist;
  },

  // route to the eagle: any spot right next to it (rebuilt as the bricks change, at most twice a second)
  navBase(mode = '') {
    const all = this.navBaseF || (this.navBaseF = {}), f = all[mode];
    if (f && (f.ver === this.terrainVer || this.frame - f.at < 30)) return f.dist;
    // every eagle they may go for (a decoy eagle fools them; big maps add outposts)
    const NX = COLS * 2 - 1, NY = ROWS * 2 - 1, seeds = [], goals = this.baseGoals();
    for (let by = 0; by < NY; by++) for (let bx = 0; bx < NX; bx++) {
      const x = bx * 8, y = by * 8;
      if (goals.some(g => overlap(x, y, 16, 16, g.x - 8, g.y - 8, 32, 32) && !overlap(x, y, 16, 16, g.x, g.y, 16, 16))) seeds.push(by * NX + bx);
    }
    all[mode] = { dist: this.navField(seeds, mode), at: this.frame, ver: this.terrainVer };
    return all[mode].dist;
  },

  // route to a player's tank (rebuilt three times a second)
  navPlayer(pt, mode = '') {
    const cache = this.navPlayerF || (this.navPlayerF = new Map());
    const key = mode ? pt.player.i + mode : pt, f = cache.get(key);
    if (f && this.frame - f.at < 20) return f.dist;
    const NX = COLS * 2 - 1, NY = ROWS * 2 - 1;
    const bx = Math.max(0, Math.min(NX - 1, Math.round(pt.x / 8))), by = Math.max(0, Math.min(NY - 1, Math.round(pt.y / 8)));
    const dist = this.navField([by * NX + bx], mode);
    cache.set(key, { dist, at: this.frame });
    return dist;
  },

  nearestPlayer(t) {
    let best = null, bd = Infinity;
    for (const o of this.tanks) {
      if (!o.isPlayer || !o.alive || o.boost.smoke) continue;   // smoke hides you
      const d = Math.abs(o.x - t.x) + Math.abs(o.y - t.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  // no steel or water between two points on one row/column (bricks are fine: shells break them)
  clearLine(x0, y0, x1, y1) {
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / 4);
    for (let i = 1; i < n; i++) {
      const t = this.get(Math.floor((x0 + (x1 - x0) * i / n) / 4), Math.floor((y0 + (y1 - y0) * i / n) / 4));
      if (t === T_STEEL) return false;
    }
    return true;
  },

  // step down the distance field from the tank's node; ties keep the current direction
  followField(t, dist, blocked) {
    const NX = COLS * 2 - 1, bx = t.x >> 3, by = t.y >> 3;
    let best = -1, bd = Infinity;
    for (let d = 0; d < 4; d++) {
      if (blocked && d === t.dir) continue;
      const ux = bx + DXY[d][0], uy = by + DXY[d][1];
      if (ux < 0 || uy < 0 || ux >= NX || uy * NX >= dist.length) continue;
      const v = dist[uy * NX + ux] + (d === t.dir ? -0.01 : 0);
      if (v < bd) { bd = v; best = d; }
    }
    if (best < 0 || bd === Infinity) { this.chooseDir(t, blocked); return; }
    this.turn(t, best);
  },

  faceTarget(t, tx, ty) {
    const dx = tx - (t.x + 8), dy = ty - (t.y + 8);
    this.turn(t, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  },

  // decide where to go next (called on the 8px grid, or when stuck)
  aiChoose(t, blocked) {
    // now and then do something unexpected, so tanks don't drive in single file
    if (!blocked && Math.random() < 0.06) { this.chooseDir(t, false); return; }
    const pt = this.nearestPlayer(t), mode = t.hover ? 'hover' : t.slither ? 'slither' : '';
    // a spotter's mark sends everyone (but spotters) after the marked player
    const marked = this.markedTank(t);
    if (marked) { this.followField(t, this.navPlayer(marked, mode), blocked); return; }
    switch (t.ai) {
      case AI.RUSH:
        if (!blocked && this.navBase(mode)[(t.y >> 3) * (COLS * 2 - 1) + (t.x >> 3)] === 0) { const b = this.baseTarget(t); this.faceTarget(t, b.x + 8, b.y + 8); return; }
        this.followField(t, this.navBase(mode), blocked);
        return;
      case AI.HUNT:
        this.followField(t, pt ? this.navPlayer(pt, mode) : this.navBase(mode), blocked);
        return;
      case AI.SNIPE: {
        const target = t.aiBase || !pt ? this.baseTarget(t) : pt;
        const tx = target.x + 8, ty = target.y + 8, cx = t.x + 8, cy = t.y + 8;
        const dx = tx - cx, dy = ty - cy, d = Math.abs(dx) + Math.abs(dy);
        const lined = (Math.abs(dx) < 6 || Math.abs(dy) < 6) && d >= SNIPE_MIN && d <= SNIPE_MAX && this.clearLine(cx, cy, tx, ty);
        if (lined && !blocked) {
          // in position: stop, aim and shell
          this.faceTarget(t, tx, ty);
          t.hold = 40 + rnd(50);
          return;
        }
        if (pt && Math.abs(pt.x - t.x) + Math.abs(pt.y - t.y) < SNIPE_MIN && !t.aiBase) {
          // too close: back off along the main axis
          const away = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 0 : 2);
          if (!(blocked && away === t.dir) && this.canStep(t, away)) { this.turn(t, away); return; }
        }
        this.followField(t, t.aiBase || !pt ? this.navBase(mode) : this.navPlayer(pt, mode), blocked);
        return;
      }
      default:
        this.chooseDir(t, blocked);
    }
  },

  // is there brick right in front of the tank? (worth a shot)
  brickAhead(t) {
    const [x0, y0, x1, y1] = [[t.x, t.y - 4, t.x + 15, t.y - 1], [t.x + 16, t.y, t.x + 19, t.y + 15],
      [t.x, t.y + 16, t.x + 15, t.y + 19], [t.x - 4, t.y, t.x - 1, t.y + 15]][t.dir];
    for (let cy = y0 >> 2; cy <= y1 >> 2; cy++) for (let cx = x0 >> 2; cx <= x1 >> 2; cx++) if (this.get(cx, cy) === T_BRICK) return true;
    return false;
  },
});

  <script>
'use strict';
// =====================================================================
//  Abilities of the enemies from the new-enemies design canvas
//    MASON    rebuilds bricks that were shot away (one 8px block every 3 s)
//    MORTAR   stops and lobs a shell over walls at a player; a crosshair marks the spot 1.5 s before impact
//    SKIMMER  glides over water (see canStep and the 'hover' path map)
//    FLAMER   a 2-tile flame jet instead of shells: burns trees, can't be shot down, hurts every tank it touches
//    SPLITTER on its last hit splits into two fast minis that rush the eagle (a blast destroys it whole)
//    MEDIC    repairs one hit on a damaged enemy nearby every 4 s; tanks appearing near it get a shield
//    JAMMER   inside its 3-tile field your shells fly at half speed and timed power-ups stop counting down
//    SPOTTER  marks a player it can see; while marked, every enemy hunts that player and fires more
//    SNAKE    fast, never shoots, slithers through brick; 10 hits on the head (its body stops shells);
//             it eats a player tank it reaches (a shield or armour plate makes it recoil) and grows longer
// =====================================================================

const SNAKE_GAP = 9, SNAKE_MAX = 12;

const BUILD_EVERY = 180, BUILD_RANGE = 96;
const HEAL_EVERY = 240, HEAL_RANGE = 96;
const JAM_RADIUS = 48;
const FLAME_LEN = 32, FLAME_TIME = 40;
const MORTAR_MIN = 48, MORTAR_MAX = 208, MORTAR_FLIGHT = 90, MORTAR_RADIUS = 12;
const MARK_TIME = 300, SPOT_RANGE = 176;

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ spawning and splitting
  enemySpawned(t) {
    t.maxHp = t.hp;
    t.cd = 60 + rnd(90);
    // a medic shields tanks that appear near it
    if (this.tanks.some(m => m.alive && m !== t && kindOf(m) === 'medic' && Math.abs(m.x - t.x) + Math.abs(m.y - t.y) < 64)) t.shield = 120;
  },

  split(t) {
    const st = Config.enemy(16);
    for (const dir of [3, 1]) {
      const m = new Tank({ x: t.x, y: t.y, dir, type: 16, hp: st.hp, speed: st.speed, bulletSpeed: st.bullet, maxBullets: 1, ai: AI.RUSH });
      m.maxHp = m.hp;
      this.tanks.push(m);
    }
    Sound.play('split');
  },

  // the player tank a spotter has marked (not for spotters themselves)
  markedTank(t) {
    const m = this.mark;
    if (!m || (t && kindOf(t) === 'spotter')) return null;
    if (m.p.tank && m.p.tank.alive) return m.p.tank;
    return this.tanks.find(o => o.isPlayer && o.alive && o.player === m.p) || null;   // (online guests)
  },

  jammed(x, y) {
    for (const j of this.jamList || []) if (Math.hypot(j.x + 8 - x, j.y + 8 - y) < JAM_RADIUS) return true;
    return false;
  },

  // ------------------------------------------------------------ flamer and mortar (instead of shells)
  flamerAct(t) {
    if (t.cool > 0 || this.flames.some(f => f.owner === t)) return;
    const pt = this.nearestPlayer(t);
    let go = false;
    if (pt) {
      const dx = pt.x - t.x, dy = pt.y - t.y;
      const ahead = [-dy, dx, dy, -dx][t.dir], side = Math.abs((t.dir & 1) ? dy : dx);
      go = ahead > 0 && ahead < FLAME_LEN + 16 && side < 12;
    }
    // now and then it scorches whatever is in front anyway (trees, other routes)
    if (!go && Math.random() < 0.004) go = true;
    if (!go) return;
    this.flames.push({ owner: t, age: 0, hit: new Set(), x: 0, y: 0, w: 0, h: 0 });
    t.hold = FLAME_TIME;
    t.cool = 100;
    t.reveal = 60;
    Sound.play('flame');
  },

  mortarAct(t) {
    if (--t.cd > 0) return;
    const pt = this.nearestPlayer(t);
    if (!pt) { t.cd = 60; return; }
    const tx = pt.x + 8, ty = pt.y + 8, d = Math.hypot(tx - t.x - 8, ty - t.y - 8);
    if (d < MORTAR_MIN || d > MORTAR_MAX) { t.cd = 30; return; }
    this.faceTarget(t, tx, ty);
    t.hold = 50;
    t.cd = Math.round((220 + rnd(120)) / Config.scale('enemyFire') / Config.skill().fire);
    this.shells.push({ x: tx, y: ty, t: MORTAR_FLIGHT, owner: t });
    Sound.play('mortar');
  },

  // ------------------------------------------------------------ snake
  // body segment centres along the path the head has taken
  snakeSegs(t) {
    t.segs = [];
    const tr = t.trail || [];
    for (let k = 1; k <= t.segN; k++) {
      const p = tr[Math.min(tr.length - 1, k * SNAKE_GAP)];
      if (!p || k * SNAKE_GAP >= tr.length + SNAKE_GAP) break;
      t.segs.push(p);
    }
  },

  snakeAct(t) {
    if (t.hold > 0) return;
    for (const o of this.tanks) {
      if (!o.isPlayer || !o.alive || !overlap(t.x - 3, t.y - 3, 22, 22, o.x, o.y, 16, 16)) continue;
      const shielded = o.shield > 0 || o.plates > 0 || o.ship;
      this.hitPlayer(o);
      if (!o.alive) {
        this.popups.push({ x: o.x + 8, y: o.y, text: 'CHOMP!', label: true, color: '#B8F818', t: 0, delay: 0 });
        Sound.play('chomp');
        t.segN = Math.min(SNAKE_MAX, t.segN + 1);
        t.hold = 45;   // digesting
      } else if (shielded) {
        // it bit on armour: recoil
        this.turn(t, (t.dir + 2) % 4);
        t.hold = 20;
      }
      return;
    }
  },

  // player shells that hit the body stop there (only the head can be hurt)
  bulletSnakeBody(b) {
    for (const s of this.snakeList) {
      for (const [x, y] of s.segs || []) {
        if (!overlap(b.x, b.y, 4, 4, x - 5, y - 5, 10, 10) || overlap(b.x, b.y, 4, 4, s.x, s.y, 16, 16)) continue;
        this.killBullet(b, true);
        Sound.play('steel');
        return true;
      }
    }
    return false;
  },

  drawSnake(ctx, t, pal) {
    const hit = t.reveal > 80 && (this.frame >> 1) & 1;
    const segs = t.segs || [];
    for (let k = segs.length - 1; k >= 0; k--) {
      const tail = k === segs.length - 1 && segs.length > 1, img = (hit ? Sprites.snakeSegHit : Sprites.snakeSeg)[tail ? 1 : 0];
      ctx.drawImage(img, Math.round(segs[k][0] - img.width / 2), Math.round(segs[k][1] - img.height / 2));
    }
    ctx.drawImage(Sprites.tank('e17', (this.frame >> 3) & 1, t.dir, hit ? 'silver' : pal), t.x, t.y);
    ctx.globalAlpha = 1;
  },

  // ------------------------------------------------------------ every frame
  updateSpecials() {
    this.jamList = this.tanks.filter(t => t.alive && kindOf(t) === 'jammer');
    this.snakeList = this.tanks.filter(t => t.alive && kindOf(t) === 'snake');
    for (const s of this.snakeList) this.snakeSegs(s);
    for (const t of this.tanks) {
      if (!t.alive || t.isPlayer || this.freezeE > 0) continue;
      const kind = kindOf(t);
      if (kind === 'mason' && --t.cd <= 0) { t.cd = BUILD_EVERY; this.masonBuild(t); }
      if (kind === 'medic' && --t.cd <= 0) { t.cd = HEAL_EVERY; this.medicHeal(t); }
      if (kind === 'spotter') this.spotterLook(t);
    }
    this.updateFlames();
    // mortar shells in flight
    for (const s of this.shells) {
      if (--s.t > 0) continue;
      this.blast(s.x, s.y, MORTAR_RADIUS, false, s.owner, false);
    }
    this.shells = this.shells.filter(s => s.t > 0);
    for (const h of this.heals) h.t--;
    this.heals = this.heals.filter(h => h.t > 0);
    // the mark fades when no spotter has seen the player for a while, or the spotters are gone
    if (this.mark) {
      const spotters = this.tanks.some(t => t.alive && kindOf(t) === 'spotter');
      if (--this.mark.t <= 0 || !spotters || !this.markedTank(null)) this.mark = null;
    }
  },

  masonBuild(t) {
    const orig = this.origTerrain;
    if (!orig) return;
    const cx = t.x + 8, cy = t.y + 8;
    let best = null, bd = BUILD_RANGE;
    // 8px blocks that were brick when the stage began and have been shot away
    for (let by = Math.max(0, (cy - BUILD_RANGE) >> 3); by <= Math.min(GH / 2 - 1, (cy + BUILD_RANGE) >> 3); by++) {
      for (let bx = Math.max(0, (cx - BUILD_RANGE) >> 3); bx <= Math.min(GW / 2 - 1, (cx + BUILD_RANGE) >> 3); bx++) {
        let missing = false;
        for (let k = 0; k < 4; k++) {
          const i = (by * 2 + (k >> 1)) * GW + bx * 2 + (k & 1);
          if (orig[i] === T_BRICK && this.terrain[i] === T_EMPTY) missing = true;
        }
        if (!missing) continue;
        const d = Math.hypot(bx * 8 + 4 - cx, by * 8 + 4 - cy);
        if (d >= bd) continue;
        // never wall a tank in
        if (this.tanks.some(o => o.alive && overlap(o.x, o.y, 16, 16, bx * 8, by * 8, 8, 8))) continue;
        best = [bx, by]; bd = d;
      }
    }
    if (!best) return;
    const [bx, by] = best;
    for (let k = 0; k < 4; k++) {
      const x = bx * 2 + (k & 1), y = by * 2 + (k >> 1), i = y * GW + x;
      if (orig[i] === T_BRICK && this.terrain[i] === T_EMPTY) this.set(x, y, T_BRICK);
    }
    this.addFx(bx * 8 + 4, by * 8 + 4, [Sprites.sparkle[0], Sprites.sparkle[1]], 4);
    this.heals.push({ x1: cx, y1: cy, x2: bx * 8 + 4, y2: by * 8 + 4, t: 16, build: true });
    Sound.play('build');
  },

  medicHeal(t) {
    let best = null, bd = HEAL_RANGE;
    for (const o of this.tanks) {
      if (!o.alive || o.isPlayer || o === t || o.hp >= (o.maxHp || o.hp)) continue;
      const d = Math.abs(o.x - t.x) + Math.abs(o.y - t.y);
      if (d < bd) { bd = d; best = o; }
    }
    if (!best) return;
    best.hp++;
    this.heals.push({ x1: t.x + 8, y1: t.y + 8, x2: best.x + 8, y2: best.y + 8, t: 24 });
    Sound.play('heal');
  },

  // a spotter sees along its row or column, until steel, brick or trees block the view
  spotterLook(t) {
    if (this.base && this.base.radar >= 3) return;   // radar 3: spotters can't mark you
    for (const o of this.tanks) {
      if (!o.isPlayer || !o.alive || o.boost.smoke) continue;
      const dx = o.x - t.x, dy = o.y - t.y;
      if ((Math.abs(dx) >= 8 && Math.abs(dy) >= 8) || Math.abs(dx) + Math.abs(dy) > SPOT_RANGE) continue;
      if (!this.sightLine(t.x + 8, t.y + 8, o.x + 8, o.y + 8)) continue;
      if (!this.mark || this.mark.p !== o.player) Sound.play('mark');
      this.mark = { p: o.player, t: MARK_TIME };
      return;
    }
  },

  sightLine(x0, y0, x1, y1) {
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / 4);
    for (let i = 1; i < n; i++) {
      const v = this.get(Math.floor((x0 + (x1 - x0) * i / n) / 4), Math.floor((y0 + (y1 - y0) * i / n) / 4));
      if (v === T_STEEL || v === T_BRICK || v === T_FOREST) return false;
    }
    return true;
  },

  updateFlames() {
    for (const f of this.flames) {
      const t = f.owner;
      f.age++;
      if (!t.alive || f.age > FLAME_TIME) { f.done = true; continue; }
      const len = Math.min(FLAME_LEN, f.age * 4), w = 12;
      [f.x, f.y, f.w, f.h] = [[t.x + 2, t.y - len, w, len], [t.x + 16, t.y + 2, len, w], [t.x + 2, t.y + 16, w, len], [t.x - len, t.y + 2, len, w]][t.dir];
      // burn the trees
      for (let cy = Math.max(0, f.y >> 2); cy <= (f.y + f.h - 1) >> 2; cy++) {
        for (let cx = Math.max(0, f.x >> 2); cx <= (f.x + f.w - 1) >> 2; cx++) if (this.get(cx, cy) === T_FOREST) this.set(cx, cy, T_EMPTY);
      }
      // and every tank in reach, its own side too (once per jet)
      for (const o of this.tanks.slice()) {
        if (!o.alive || o === t || f.hit.has(o) || !overlap(o.x, o.y, 16, 16, f.x, f.y, f.w, f.h)) continue;
        f.hit.add(o);
        if (o.isPlayer) this.hitPlayer(o); else this.hitEnemy(o, null);
      }
    }
    this.flames = this.flames.filter(f => !f.done);
  },

  // ------------------------------------------------------------ drawing
  // under the tanks: jammer fields
  renderSpecialsUnder(ctx) {
    for (const j of this.tanks) {
      if (!j.alive || kindOf(j) !== 'jammer') continue;
      const cx = j.x + 8, cy = j.y + 8, r = JAM_RADIUS - 2 + ((this.frame >> 3) & 3);
      ctx.fillStyle = (this.frame >> 4) & 1 ? '#686878' : '#3C3C50';
      for (let a = 0; a < 40; a++) {
        const ang = (a / 40) * Math.PI * 2 + this.frame * 0.01;
        ctx.fillRect(Math.round(cx + Math.cos(ang) * r), Math.round(cy + Math.sin(ang) * r), 2, 2);
      }
    }
  },

  // over the tanks: flames, repair beams, mortar crosshairs, the spotter's mark
  renderSpecialsOver(ctx) {
    const fire = ['#F8F8F8', '#F8D878', '#F87830', '#D82800'];
    for (const f of this.flames) {
      for (let k = 0; k < 18; k++) {
        const px = f.x + ((k * 37 + this.frame * 13) % Math.max(1, f.w)), py = f.y + ((k * 53 + this.frame * 7) % Math.max(1, f.h));
        ctx.fillStyle = fire[(k + (this.frame >> 1)) & 3];
        ctx.fillRect(px - 1, py - 1, 3, 3);
      }
    }
    for (const h of this.heals) {
      ctx.fillStyle = h.build ? '#F8B800' : ((h.t >> 1) & 1 ? '#F8F8F8' : '#D82800');
      const n = Math.max(1, Math.round(Math.hypot(h.x2 - h.x1, h.y2 - h.y1) / 3));
      for (let i = 0; i <= n; i += 1) {
        if ((i + (h.t >> 1)) % 2) continue;
        ctx.fillRect(Math.round(h.x1 + (h.x2 - h.x1) * i / n) - 1, Math.round(h.y1 + (h.y2 - h.y1) * i / n) - 1, 2, 2);
      }
    }
    for (const s of this.shells) {
      if ((s.t >> 2) & 1 && s.t > 20) continue;
      const r = 4 + Math.round(s.t / 10);
      ctx.fillStyle = s.t < 20 ? '#F83800' : '#F8F8F8';
      ctx.fillRect(s.x - r, s.y, r * 2 + 1, 1);
      ctx.fillRect(s.x, s.y - r, 1, r * 2 + 1);
      ctx.fillRect(s.x - 1, s.y - 1, 3, 3);
    }
    const mt = this.markedTank(null);
    if (mt && (this.frame >> 3) & 1) {
      ctx.fillStyle = '#F83800';
      for (const [x, y, w, h] of [[-2, -2, 5, 1], [-2, -2, 1, 5], [13, -2, 5, 1], [17, -2, 1, 5], [-2, 17, 5, 1], [-2, 13, 1, 5], [13, 17, 5, 1], [17, 13, 1, 5]]) {
        ctx.fillRect(mt.x + x, mt.y + y, w, h);
      }
    }
  },
});

'use strict';
// =====================================================================
//  Base upgrades: bought in the shop between stages, shared by the whole team and kept from stage to stage
//  until the game is over (and in saves). Most have 5 levels.
//    WALLS    extra brick ring · steel inner corners · steel inner ring · steel outer corners · all-steel fortress
//    ARMOR    the eagle survives 1-5 hits per stage

//    GUN      the eagle shoots enemies lined up with it; faster and further each level, steel-breaking shells at 4,
//             exploding shells at 5
//    FIELD    2-10 armed mines in front of the fortress at the start of every stage
//    TESLA    zaps every enemy within 2-4 tiles of the eagle, every 3 s down to every second
//    TRAPS    tank traps: enemies near the eagle crawl (30%-70% slower, over 2.5-4.5 tiles)
//    SUPPLY   a power-up is dropped by the fortress every 60 s down to every 20 s
//    RADAR    1 stealth tanks always show · 2 see which tank is about to appear at each entry point
//             3 spotters can't mark you
// =====================================================================

const BASE_UPGRADES = [
  { key: 'walls', name: 'BASE WALLS', prices: [4000, 7000, 10000, 14000, 18000],
    descs: ['EXTRA BRICK RING', 'STEEL INNER CORNERS', 'STEEL INNER RING', 'STEEL OUTER CORNERS', 'ALL-STEEL FORTRESS'] },
  { key: 'armor', name: 'EAGLE ARMOR', prices: [3000, 5000, 8000, 11000, 15000],
    descs: [1, 2, 3, 4, 5].map(n => 'EAGLE SURVIVES ' + n + (n > 1 ? ' HITS' : ' HIT')) },
  { key: 'repair', name: 'REPAIR CREW', prices: [2500, 4000, 6000, 8000, 10000],
    descs: [10, 7, 5, 3, 2].map(n => 'REBUILDS WALLS EVERY ' + n + ' S') },
  { key: 'gun', name: 'EAGLE GUN', prices: [5000, 7000, 9000, 12000, 16000],
    descs: ['SHOOTS TANKS IN LINE', 'FASTER, LONGER RANGE', 'FASTER STILL', 'SHELLS BREAK STEEL', 'EXPLODING SHELLS'] },
  { key: 'field', name: 'MINEFIELD', prices: [2000, 3000, 4000, 5000, 6000],
    descs: [2, 4, 6, 8, 10].map(n => n + ' MINES BEFORE THE EAGLE') },
  { key: 'tesla', name: 'TESLA COIL', prices: [6000, 8000, 10000, 13000, 16000],
    descs: ['ZAP 2 TILES, EVERY 3 S', 'ZAP 2.5 TILES, EVERY 2.5 S', 'ZAP 3 TILES, EVERY 2 S', 'ZAP 3.5 TILES, EVERY 1.5 S', 'ZAP 4 TILES, EVERY 1 S'] },
  { key: 'traps', name: 'TANK TRAPS', prices: [2500, 4000, 5500, 7000, 9000],
    descs: [30, 40, 50, 60, 70].map(n => 'ENEMIES ' + n + '% SLOWER NEAR') },
  { key: 'supply', name: 'SUPPLY DROP', prices: [4000, 6000, 8000, 10000, 12000],
    descs: [60, 45, 35, 25, 20].map(n => 'POWER-UP EVERY ' + n + ' S') },
  { key: 'radar', name: 'RADAR', prices: [3000, 5000, 7000],
    descs: ['STEALTH TANKS SHOW', 'SEE WHO SPAWNS WHERE', 'SPOTTERS CAN\'T MARK YOU'] },
];
const newBase = () => Object.fromEntries(BASE_UPGRADES.map(u => [u.key, 0]));
const REPAIR_EVERY = [0, 600, 420, 300, 180, 120];
const GUN_EVERY = [0, 110, 80, 60, 45, 35], GUN_RANGE = [0, 96, 128, 160, 192, 240];
const TESLA_EVERY = [0, 180, 150, 120, 90, 60], TESLA_RANGE = [0, 32, 40, 48, 56, 64];
const TRAP_SLOW = [1, 0.7, 0.6, 0.5, 0.4, 0.3], TRAP_RANGE = [0, 40, 48, 56, 64, 72];
const SUPPLY_EVERY = [0, 3600, 2700, 2100, 1500, 1200];
const EAGLE_GUN = { isPlayer: false, bullets: 0, eagle: true };   // owner of the eagle's shells and zaps (no points)

Object.assign(Stage.prototype, {
  // at stage start (before the stage's terrain is remembered for masons)
  applyBase(base) {
    this.base = Object.assign(newBase(), base || {});
    this.eagleArmor = this.base.armor + Config.skill().eagle;   // easy skills: free eagle armour
    this.eagleInv = 0;
    this.eagleFlash = 0;
    this.repairT = 0;
    this.gunT = 60;
    this.gunDir = 0;
    this.teslaT = 60;
    this.zaps = [];
    this.supplyT = Math.min(1200, SUPPLY_EVERY[this.base.supply] || 0);   // the first drop comes sooner
    if (this.base.walls >= 1) for (const [x, y] of this.outerRing()) this.setBlock(x, y, this.outerWallType(x, y));
    if (this.base.walls >= 2) this.setBaseWalls(T_BRICK);
    this.placeMinefield(this.base.field * 2);
  },

  // the extra ring of blocks around the classic fortress
  outerRing() {
    const bx = BASE_X / 8, by = BASE_Y / 8, out = [];
    for (let y = by - 2; y <= by + 1; y++) for (let x = bx - 2; x <= bx + 3; x++) {
      if ((x === bx - 2 || x === bx + 3 || y === by - 2) && x >= 0 && x < COLS * 2 && y >= 0) out.push([x, y]);
    }
    return out;
  },

  // the outer ring: brick, steel corners at level 4, all steel at level 5
  outerWallType(x, y) {
    const w = this.base ? this.base.walls : 0, bx = BASE_X / 8, by = BASE_Y / 8;
    if (w >= 5) return T_STEEL;
    if (w >= 4 && y === by - 2 && (x === bx - 2 || x === bx + 3)) return T_STEEL;
    return T_BRICK;
  },

  // what a fortress block is made of with the WALLS upgrade (i = index in BASE_WALL)
  baseWallType(i) {
    const w = this.base ? this.base.walls : 0;
    if (w >= 3) return T_STEEL;
    if (w >= 2) {
      const [x, y] = BASE_WALL[i], bx = BASE_X / 8, by = BASE_Y / 8;
      if ((x === bx - 1 || x === bx + 2) && (y === by - 1 || y === by + 1)) return T_STEEL;
    }
    return T_BRICK;
  },

  placeMinefield(n) {
    const spots = [];
    for (const dy of [48, 72]) for (const dx of [0, -24, 24, -48, 48, -72, 72]) spots.push([BASE_X + 8 + dx, BASE_Y + 8 - dy]);
    for (const [x, y] of spots) {
      if (n <= 0) break;
      if (x < 8 || x > FW - 8 || y < 8) continue;
      const t = this.get(x >> 2, y >> 2);
      if (t !== T_EMPTY && t !== T_FOREST) continue;
      if (PLAYER_SPAWN.some(([sx, sy]) => overlap(x - 4, y - 4, 8, 8, sx, sy, 16, 16))) continue;
      this.mines.push({ x, y, byPlayer: true, owner: null, t: MINE_ARM_TIME });
      n--;
    }
  },

  // every frame
  updateBase() {
    if (!this.base || !this.baseAlive || this.over) return;
    if (this.eagleInv > 0) this.eagleInv--;
    if (this.eagleFlash > 0) this.eagleFlash--;
    const r = this.base.repair;
    if (r && this.shovel <= 0 && ++this.repairT >= REPAIR_EVERY[r]) { this.repairT = 0; this.repairFortress(); }
    const g = this.base.gun;
    if (g && this.freezeP <= 0 && --this.gunT <= 0) this.eagleShoot(g);
    const z = this.base.tesla;
    if (z && --this.teslaT <= 0) this.teslaZap(z);
    for (const zp of this.zaps) zp.t--;
    this.zaps = this.zaps.filter(zp => zp.t > 0);
    const sp = this.base.supply;
    if (sp && !this.powerup && --this.supplyT <= 0) { this.supplyT = SUPPLY_EVERY[sp]; this.supplyDrop(); }
  },

  // the tesla coil: lightning to every enemy close to the eagle
  teslaZap(z) {
    this.teslaT = 20;
    const ex = BASE_X + 8, ey = BASE_Y + 8;
    const hit = this.tanks.filter(t => t.alive && !t.isPlayer && Math.hypot(t.x + 8 - ex, t.y + 8 - ey) < TESLA_RANGE[z] + 8);
    if (!hit.length) return;
    for (const t of hit) {
      this.zaps.push({ x: t.x + 8, y: t.y + 8, t: 10 });
      this.hitEnemy(t, EAGLE_GUN, true);
    }
    this.teslaT = TESLA_EVERY[z];
    Sound.play('zap');
  },

  // tank traps: how fast an enemy may move here
  trapFactor(t) {
    const lv = this.base ? this.base.traps : 0;
    if (!lv || t.isPlayer) return 1;
    return Math.hypot(t.x + 8 - BASE_X - 8, t.y + 8 - BASE_Y - 8) < TRAP_RANGE[lv] ? TRAP_SLOW[lv] : 1;
  },

  // supply drop: a power-up lands on a free spot just in front of the fortress
  supplyDrop() {
    this.spawnPowerup();
    if (!this.powerup) return;
    for (const dy of [-40, -56, -32, -72]) for (const dx of [0, -24, 24, -48, 48]) {
      const x = BASE_X + dx, y = BASE_Y + dy;
      if (x < 0 || y < 0 || x > FW - 16) continue;
      let bad = false;
      for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
        const v = this.get(cx, cy);
        if (v === T_STEEL || v === T_WATER || v === T_BRICK) bad = true;
      }
      if (bad) continue;
      this.powerup.x = x; this.powerup.y = y;
      this.popups.push({ x: x + 8, y, text: 'SUPPLY!', label: true, color: COL.gold, t: 0, delay: 0 });

    }
  },

  // put back one missing block of the fortress
  repairFortress() {
    const want = BASE_WALL.map((b, i) => [b[0], b[1], this.baseWallType(i)]);

    for (const [x, y, type] of want) {
      let missing = false;
      for (let k = 0; k < 4; k++) if (this.get(x * 2 + (k & 1), y * 2 + (k >> 1)) === T_EMPTY) missing = true;
      if (!missing || this.tanks.some(o => o.alive && overlap(o.x, o.y, 16, 16, x * 8, y * 8, 8, 8))) continue;
      for (let k = 0; k < 4; k++) {
        const cx = x * 2 + (k & 1), cy = y * 2 + (k >> 1);
        if (this.get(cx, cy) === T_EMPTY) this.set(cx, cy, type);
      }
      this.addFx(x * 8 + 4, y * 8 + 4, [Sprites.sparkle[0], Sprites.sparkle[1]], 4);
      Sound.play('build');

    }
  },

  // the eagle fires at the nearest enemy lined up with it (up, left or right)
  eagleShoot(g) {
    this.gunT = 12;
    const ex = BASE_X + 8, ey = BASE_Y + 8;
    let best = null, bd = GUN_RANGE[g];
    for (const t of this.tanks) {
      if (!t.alive || t.isPlayer) continue;
      const dx = t.x + 8 - ex, dy = t.y + 8 - ey;
      let dir = -1;
      if (Math.abs(dx) < 8 && dy < 0) dir = 0;
      else if (Math.abs(dy) < 8) dir = dx > 0 ? 1 : 3;
      const d = Math.abs(dx) + Math.abs(dy);
      if (dir >= 0 && d < bd) { bd = d; best = dir; }
    }
    if (best === null) return;
    // the shell starts outside the fortress so it never breaks its own walls
    const off = 8 + (this.base.walls >= 1 ? 16 : 8) + 2;
    this.bullets.push({
      x: ex - 2 + DXY[best][0] * off, y: ey - 2 + DXY[best][1] * off, dir: best, speed: 4, owner: EAGLE_GUN, free: true,
      isPlayer: true, eagle: true, power: g >= 4, cutter: false, alive: true, pierce: false, rocket: g >= 5,
    });
    this.gunDir = best;
    this.gunT = GUN_EVERY[g];
    Sound.play('shot');
  },

  // a hit on the eagle: armor soaks it if there is any left
  eagleArmorHit() {
    if (this.eagleInv > 0) return true;
    if (this.eagleArmor <= 0) return false;
    this.eagleArmor--;
    this.eagleInv = 40;
    this.eagleFlash = 30;
    this.addFx(BASE_X + 8, BASE_Y + 8, Sprites.smallExp, 3);
    Sound.play('armor');
    return true;
  },

  // under the tanks: the tank-trap zone and the tesla coil's reach
  renderBaseZones(ctx) {
    const b = this.base;
    if (!b || !this.baseAlive) return;
    const ex = BASE_X + 8, ey = BASE_Y + 8;
    const ring = (r, color, n) => {
      ctx.fillStyle = color;
      for (let a = 0; a < n; a++) {
        const ang = Math.PI + (a / (n - 1)) * Math.PI;   // the half circle above the eagle
        ctx.fillRect(Math.round(ex + Math.cos(ang) * r), Math.round(ey + Math.sin(ang) * r), 1, 1);
      }
    };
    if (b.traps) ring(TRAP_RANGE[b.traps], '#7C5800', 28);
    if (b.tesla && this.teslaT < 12) ring(TESLA_RANGE[b.tesla] + 8, '#58F8F8', 24);
  },

  renderEagle(ctx) {
    // tesla lightning
    for (const zp of this.zaps) {
      ctx.fillStyle = (zp.t >> 1) & 1 ? '#F8F8F8' : '#58F8F8';
      const x0 = BASE_X + 8, y0 = BASE_Y + 2, n = 8;
      for (let i = 0; i <= n; i++) {
        const j = i === 0 || i === n ? 0 : ((i * 7 + zp.t) % 5) - 2;
        ctx.fillRect(Math.round(x0 + (zp.x - x0) * i / n) + j, Math.round(y0 + (zp.y - y0) * i / n) - j, 2, 2);
      }
    }
    if (!this.baseAlive) { ctx.drawImage(Sprites.eagleDead, BASE_X, BASE_Y); return; }
    if (this.eagleArmor > 0 || this.eagleFlash > 0) {
      const c = this.eagleFlash > 0 && (this.eagleFlash >> 2) & 1 ? COL.white : this.eagleArmor >= 3 ? COL.gold : '#3CBCFC';
      ctx.drawImage(Sprites.outline(Sprites.eagle, c), BASE_X - 1, BASE_Y - 1);
    }
    ctx.drawImage(Sprites.eagle, BASE_X, BASE_Y);
    if (this.base && this.base.tesla) {
      // the coil: a little copper post with a glowing tip beside the eagle
      ctx.fillStyle = '#B87000'; ctx.fillRect(BASE_X + 13, BASE_Y + 9, 2, 6);
      ctx.fillStyle = this.teslaT < 12 ? '#F8F8F8' : '#58F8F8'; ctx.fillRect(BASE_X + 12, BASE_Y + 7, 4, 3);
    }
    if (this.base && this.base.gun) {
      // a small turret on the eagle's head
      const cx = BASE_X + 8, cy = BASE_Y + 5;
      ctx.fillStyle = '#505050';
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      ctx.fillStyle = this.base.gun >= 5 ? '#F87830' : this.base.gun >= 4 ? COL.gold : '#ADADAD';
      ctx.fillRect(cx - 1, cy - 1, 2, 2);
      const [dx, dy] = DXY[this.gunDir || 0];
      ctx.fillStyle = '#505050';
      for (let k = 2; k <= 4; k++) ctx.fillRect(cx - (dx ? 0 : 1) + dx * k - (dx < 0 ? 1 : 0), cy - (dy ? 0 : 1) + dy * k - (dy < 0 ? 1 : 0), dx ? 1 : 2, dy ? 1 : 2);
    }
  },
});

  <script>
'use strict';
// =====================================================================
//  Turrets, Claude, airstrikes and revival
//    TURRET    placed anywhere (B button with turrets carried, or the TURRET power-up drops one); turns towards
//              the nearest enemy and shoots once lined up. 3 hits. An enemy that grabs the power-up gets a red one.
//    CLAUDE    the orange Claude sparkle wanders the field for a while, chirping, and eats every enemy tank
//              (and enemy shell) it bumps into. It nibbles bosses. It won't work for the enemy.
//    AIRSTRIKE a plane flies along the row with the most enemies, bombing it (an enemy's plane bombs yours).
//    REVIVE    a fallen player comes back: the REVIVE power-up, FIRE during play (costs points), or the shop.
// =====================================================================

const TURRET_RANGE = 128, TURRET_HP = 3, TURRET_MAX = 3;
const CLAUDE_SPEED = 1, CLAUDE_EXTRA = 300;   // Claude stays for the new-power-up time + 5 s
const REVIVE_WAIT = 300;                      // all players out: 5 s to pay for a revival before GAME OVER

const reviveCost = () => (Config.get('reviveCost') === 'OFF' ? 0 : Config.get('reviveCost'));
// who gets the points for a turret's / Claude's / a plane's kills
const gunner = p => ({ isPlayer: !!p, player: p, bullets: 0, alive: true });

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ turrets
  placeTurret(x, y, owner, enemy) {
    x = Math.max(0, Math.min(FW - 16, Math.round(x / 8) * 8));
    y = Math.max(0, Math.min(FH - 16, Math.round(y / 8) * 8));
    // a player keeps at most 3 on the field: the oldest goes
    const mine = this.turrets.filter(t => t.owner === owner && t.enemy === enemy);
    if (mine.length >= TURRET_MAX) this.turrets.splice(this.turrets.indexOf(mine[0]), 1);
    this.turrets.push({ x, y, dir: 0, want: 0, hp: TURRET_HP, owner, enemy: !!enemy, cd: 40, turn: 0 });
    Sound.play('build');
  },

  turretAt(x, y, w, h) { return this.turrets.find(t => overlap(x, y, w, h, t.x, t.y, 16, 16)); },

  updateTurrets() {
    for (const tu of this.turrets) {
      if (tu.cd > 0) tu.cd--;
      if ((tu.enemy ? this.freezeE : this.freezeP) > 0) continue;
      const cx = tu.x + 8, cy = tu.y + 8;
      // nearest target in range
      let best = null, bd = TURRET_RANGE;
      for (const t of this.tanks) {
        if (!t.alive || t.isPlayer !== tu.enemy || t.boost.smoke) continue;
        const d = Math.abs(t.x + 8 - cx) + Math.abs(t.y + 8 - cy);
        if (d < bd) { bd = d; best = t; }
      }
      if (!best) continue;
      const dx = best.x + 8 - cx, dy = best.y + 8 - cy;
      tu.want = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
      // swing round one quarter-turn at a time
      if (tu.dir !== tu.want) {
        if (++tu.turn >= 8) { tu.turn = 0; tu.dir = (tu.want - tu.dir + 4) % 4 === 3 ? (tu.dir + 3) % 4 : (tu.dir + 1) % 4; }
        continue;
      }
      const lined = (tu.dir & 1) ? Math.abs(dy) < 6 : Math.abs(dx) < 6;
      if (!lined || tu.cd > 0) continue;
      // a friendly turret never shoots towards its own eagle
      if (!tu.enemy && this.eagleInLine(cx, cy, best.x + 8, best.y + 8)) continue;
      const [ox, oy] = DXY[tu.dir];
      this.bullets.push({
        x: cx - 2 + ox * 10, y: cy - 2 + oy * 10, dir: tu.dir, speed: 4, owner: tu.enemy ? { isPlayer: false, bullets: 0 } : gunner(tu.owner),
        free: true, isPlayer: !tu.enemy, passPlayers: !tu.enemy, power: false, cutter: false, alive: true, pierce: false, rocket: false,
      });
      tu.cd = 50;
      if (!tu.enemy) Sound.play('shot');
    }
  },

  eagleInLine(x0, y0, x1, y1) {
    const ex = BASE_X + 8, ey = BASE_Y + 8;
    if (Math.abs(y1 - y0) < 6) return Math.abs(ey - y0) < 12 && (ex - x0) * (ex - x1) < 0;
    return Math.abs(ex - x0) < 12 && (ey - y0) * (ey - y1) < 0;
  },

  // a shell meets a turret (returns true if it stopped there)
  bulletTurret(b) {
    const tu = this.turretAt(b.x, b.y, 4, 4);
    if (!tu) return false;
    if (b.isPlayer !== tu.enemy) return false;   // shells fly over turrets on their own side
    this.killBullet(b, true);
    if (--tu.hp <= 0) {
      this.turrets.splice(this.turrets.indexOf(tu), 1);
      this.addFx(tu.x + 8, tu.y + 8, BIG_EXPLOSION(), 4);
      Sound.play('explode');
    } else Sound.play('armor');
    return true;
  },

  // ------------------------------------------------------------ Claude
  summonClaude(x, y, p) {
    this.claudes.push({ x: Math.round(x / 8) * 8, y: Math.round(y / 8) * 8, dir: 0, t: Config.frames('newTime') + CLAUDE_EXTRA, p, chirp: 30, nibble: 0, acc: 0 });
    this.popups.push({ x: x + 8, y, text: 'HI!', label: true, color: '#F0A080', t: 0, delay: 0 });
    Sound.play('claude');
  },

  updateClaudes() {
    for (const c of this.claudes) {
      c.t--;
      if (--c.chirp <= 0) { c.chirp = 70 + rnd(110); Sound.play('claude'); }
      // wander towards the nearest enemy (tank or boss); Claude floats over walls and water
      if ((c.x & 7) === 0 && (c.y & 7) === 0) {
        let best = null, bd = Infinity;
        for (const t of this.tanks) {
          if (!t.alive || t.isPlayer) continue;
          const d = Math.abs(t.x - c.x) + Math.abs(t.y - c.y);
          if (d < bd) { bd = d; best = [t.x, t.y]; }
        }
        for (const bo of this.bosses) if (bo.alive) { const d = Math.abs(bo.x - c.x) + Math.abs(bo.y - c.y); if (d < bd) { bd = d; best = [bo.x + bo.w / 2 - 8, bo.y + bo.h / 2 - 8]; } }
        if (best && Math.random() > 0.15) {
          const dx = best[0] - c.x, dy = best[1] - c.y;
          c.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
        } else if (Math.random() < 0.3) c.dir = rnd(4);
      }
      c.acc += CLAUDE_SPEED;
      while (c.acc >= 1) {
        c.acc--;
        const nx = c.x + DXY[c.dir][0], ny = c.y + DXY[c.dir][1];
        if (nx < 0 || ny < 0 || nx > FW - 16 || ny > FH - 16) { c.dir = (c.dir + 2) % 4; break; }
        c.x = nx; c.y = ny;
      }
      // munch
      for (const t of this.tanks) {
        if (!t.alive || t.isPlayer || !overlap(t.x + 2, t.y + 2, 12, 12, c.x + 2, c.y + 2, 12, 12)) continue;
        this.killEnemy(t, gunner(c.p), true, true);
        this.popups.push({ x: t.x + 8, y: t.y, text: 'NOM!', label: true, color: '#F0A080', t: 0, delay: 0 });
        Sound.play('nom');
      }
      for (const b of this.bullets) {
        if (b.alive && !b.isPlayer && overlap(b.x, b.y, 4, 4, c.x + 2, c.y + 2, 12, 12)) { this.killBullet(b, false); Sound.play('nom'); }
      }
      if (--c.nibble <= 0) {
        for (const bo of this.bosses) {
          if (bo.alive && this.bossTangible(bo) && overlap(c.x, c.y, 16, 16, bo.x, bo.y, bo.w, bo.h)) {
            this.bossHit(bo, 1, gunner(c.p), c.x + 8);
            c.nibble = 30;
            Sound.play('nom');
          }
        }
      }
      if (c.t <= 0) {
        this.addFx(c.x + 8, c.y + 8, [Sprites.sparkle[3], Sprites.sparkle[2], Sprites.sparkle[1], Sprites.sparkle[0]], 4);
        this.popups.push({ x: c.x + 8, y: c.y, text: 'BYE!', label: true, color: '#F0A080', t: 0, delay: 0 });
        Sound.play('claudeBye');
      }
    }
    this.claudes = this.claudes.filter(c => c.t > 0);
  },

  // ------------------------------------------------------------ airstrikes
  // a plane flies along the busiest row (never the rows by the eagle), dropping bombs
  callAirstrike(byPlayer, owner) {
    const targets = this.tanks.filter(t => t.alive && t.isPlayer !== byPlayer);
    let y = -1, bestN = 0, bestOff = Infinity;
    for (let row = 0; row <= FH - 16; row += 8) {
      if (row > BASE_Y - 40) break;
      const hit = targets.filter(t => Math.abs(t.y - row) < 12);
      const off = hit.reduce((a, t) => a + Math.abs(t.y - row), 0);   // ties: the row they sit on exactly
      if (hit.length > bestN || (hit.length === bestN && hit.length && off < bestOff)) { bestN = hit.length; bestOff = off; y = row; }
    }
    if (y < 0) y = Math.min(BASE_Y - 48, 32 + rnd(Math.max(1, (FH >> 1) - 32)));
    const dir = Math.random() < 0.5 ? 1 : 3;
    this.strikes.push({ x: dir === 1 ? -24 : FW + 8, y, dir, byPlayer, owner, drop: 0 });
    Sound.play('plane');
  },

  updateStrikes() {
    for (const s of this.strikes) {
      s.x += s.dir === 1 ? 3 : -3;
      s.drop += 3;
      if (s.drop >= 24 && s.x > 0 && s.x < FW - 16) {
        s.drop = 0;
        this.blast(s.x + 8, s.y + 8, 12, s.byPlayer, s.owner, false);
      }
      if (s.x < -32 || s.x > FW + 16) s.done = true;
    }
    this.strikes = this.strikes.filter(s => !s.done);
  },

  // ------------------------------------------------------------ revival
  revive(p, payer) {
    if (payer) payer.score -= reviveCost();
    p.out = false;
    p.lives = 0;
    this.spawnPlayer(p, 0);
    this.reviveWait = 0;
    this.popups.push({ x: PLAYER_SPAWN[p.i][0] + 8, y: PLAYER_SPAWN[p.i][1], text: 'REVIVED!', label: true, color: COL.gold, t: 0, delay: 0, life: 90 });
    Sound.play('life');
  },

  // someone who can pay for p (p first, then the richest teammate)
  revivePayer(p) {
    const cost = reviveCost();
    if (!cost) return null;
    if (p.score >= cost) return p;
    const rich = this.players.filter(q => q !== p && q.score >= cost).sort((a, b) => b.score - a.score);
    return rich[0] || null;
  },

  // fallen players press FIRE to come back
  updateRevival() {
    for (const p of this.players) {
      if (!p.out) continue;
      const payer = this.revivePayer(p);
      if (payer && Input.player(p.i).firePressed) this.revive(p, payer);
    }
    if (this.reviveWait > 0 && --this.reviveWait <= 0 && this.players.every(q => q.out)) this.startOver();
  },

  // ------------------------------------------------------------ drawing
  renderTurrets(ctx) {
    for (const tu of this.turrets) {
      ctx.drawImage(Sprites.turretBase, tu.x, tu.y);
      ctx.drawImage(Sprites.turretGun(tu.dir, tu.enemy ? 'red' : Config.playerPal(tu.owner ? tu.owner.i : 0)), tu.x, tu.y);
      for (let k = 0; k < tu.hp; k++) { ctx.fillStyle = tu.enemy ? '#F83800' : '#58D854'; ctx.fillRect(tu.x + 5 + k * 2, tu.y + 14, 1, 1); }
    }
  },

  renderClaudes(ctx) {
    for (const c of this.claudes) {
      if (c.t < 60 && (c.t >> 2) & 1) continue;
      ctx.drawImage(Sprites.claude[(c.x + c.y) >> 3 & 1], c.x, c.y);
    }
  },

  renderStrikes(ctx) {
    for (const s of this.strikes) {
      ctx.globalAlpha = 0.35;
      ctx.drawImage(Sprites.plane[s.dir], s.x + 6, s.y + 10);   // shadow
      ctx.globalAlpha = 1;
      ctx.drawImage(Sprites.plane[s.dir], s.x, s.y);
    }
  },

  renderRevival(ctx) {
    const cost = reviveCost();
    if (!cost) return;
    const lines = [];
    for (const p of this.players) {
      if (!p.out || !this.revivePayer(p)) continue;
      lines.push((this.players.length > 1 ? ROMAN[p.i] + ': ' : '') + 'FIRE = REVIVE ' + cost);
    }
    if (!lines.length || !((this.frame >> 4) & 1)) return;
    if (this.reviveWait > 0) lines.unshift('LAST CHANCE ' + Math.ceil(this.reviveWait / 60));
    lines.forEach((l, i) => Font.drawCenter(ctx, l, VIEW_W / 2, VIEW_H - 28 - (lines.length - 1 - i) * 10, COL.gold));
  },
});

// =====================================================================
//  Wingman, decoy eagle, smoke screen and bridge kit
//    WINGMAN  (shop) an AI ally tank joins you: it hunts the nearest enemy and shoots; 2 hits; its kills score for you
//    DECOY    (shop) a fake eagle stands in the middle of the field; rushing enemies go for it first (2 hits)
//    SMOKE    (power-up or shop) enemies lose track of you for a while; an enemy that grabs it fades into smoke
//    BRIDGE   (power-up or shop) carried bridge kits: drive into water and a bridge is laid across it
// =====================================================================

const BRIDGE_MAX = 40;   // cells (4px) a single bridge may span

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ wingman
  spawnWingman(p) {
    // a free player entry point if there is one, else beside its owner
    const used = new Set(this.players.map(q => q.i));
    let at = PLAYER_SPAWN.find((s, i) => !used.has(i));
    if (!at) at = [Math.min(FW - 16, PLAYER_SPAWN[p.i][0] + 16), PLAYER_SPAWN[p.i][1]];
    this.spawns.push({ x: at[0], y: at[1], t: SPARKLE_TIME, ally: p });
  },

  makeWingman(s) {
    const t = new Tank({ x: s.x, y: s.y, dir: 0, isPlayer: true, ally: true, player: s.ally, hp: 2, shield: 120,
      speed: 0.75 * Config.scale('pSpeed'), bulletSpeed: 4.5 * Config.scale('pShell'), maxBullets: 1 });
    this.tanks.push(t);
    this.popups.push({ x: s.x + 8, y: s.y, text: 'WINGMAN', label: true, color: COL.white, t: 0, delay: 0 });
  },

  nearestEnemy(t) {
    let best = null, bd = Infinity;
    for (const o of this.tanks) {
      if (!o.alive || o.isPlayer) continue;
      const d = Math.abs(o.x - t.x) + Math.abs(o.y - t.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  updateAlly(t) {
    if (t.shield > 0) t.shield--;
    if (t.cool > 0) t.cool--;
    if (t.frozen > 0) { t.frozen--; t.moving = false; return; }
    if (this.over || this.freezeP > 0) { t.moving = false; return; }
    const foe = this.nearestEnemy(t);
    if (!foe) { t.moving = false; return; }
    // path to the target (rebuilt three times a second)
    if (!t.nav || this.frame - t.nav.at >= 20 || t.nav.foe !== foe) {
      const NX = COLS * 2 - 1, NY = ROWS * 2 - 1;
      const bx = Math.max(0, Math.min(NX - 1, Math.round(foe.x / 8))), by = Math.max(0, Math.min(NY - 1, Math.round(foe.y / 8)));
      t.nav = { dist: this.navField([by * NX + bx]), at: this.frame, foe };
    }
    const dx = foe.x - t.x, dy = foe.y - t.y;
    const lined = Math.abs(dx) < 6 || Math.abs(dy) < 6;
    if (lined && this.clearLine(t.x + 8, t.y + 8, foe.x + 8, foe.y + 8)) {
      // lined up: turn and fire (never across the eagle)
      this.faceTarget(t, foe.x + 8, foe.y + 8);
      t.moving = false;
      if (t.cool === 0 && !this.eagleInLine(t.x + 8, t.y + 8, foe.x + 8, foe.y + 8) && this.fire(t)) t.cool = 20;
      return;
    }
    const ok = this.move(t, t.dir);
    t.moving = ok;
    if (!ok) {
      if (this.brickAhead(t) && t.cool === 0 && !this.eagleInLine(t.x + 8, t.y + 8, t.x + 8 + DXY[t.dir][0] * 64, t.y + 8 + DXY[t.dir][1] * 64)) {
        if (this.fire(t)) t.cool = 20;
      } else if (++t.blocked > 8) { this.followField(t, t.nav.dist, true); t.blocked = 0; }
    } else {
      t.blocked = 0;
      if ((t.x & 7) === 0 && (t.y & 7) === 0) this.followField(t, t.nav.dist, false);
    }
  },

  hitAlly(t) {
    if (!t.alive || t.shield > 0) return;
    if (--t.hp > 0) { t.shield = 60; Sound.play('armor'); return; }
    t.alive = false;
    this.addFx(t.x + 8, t.y + 8, BIG_EXPLOSION(), 5);
    Sound.play('explode');
  },

  // ------------------------------------------------------------ decoy eagle
  placeDecoy() {
    // the free 16px spot nearest the middle of the field
    const cx = ((FW >> 1) - 8) >> 3, cy = Math.round(FH * 0.42 / 8);
    for (let r = 0; r < 14; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = (cx + dx) * 8, y = (cy + dy) * 8;
        if (x < 0 || y < 40 || x > FW - 16 || y > FH - 64) continue;
        let bad = false;
        for (let yy = y >> 2; yy < (y + 16) >> 2; yy++) for (let xx = x >> 2; xx < (x + 16) >> 2; xx++) if (this.get(xx, yy) !== T_EMPTY) bad = true;
        if (bad || this.tanks.some(o => o.alive && overlap(o.x, o.y, 16, 16, x, y, 16, 16))) continue;
        this.decoy = { x, y, hp: 2, flash: 0 };
        this.navBaseF = {};
        this.popups.push({ x: x + 8, y, text: 'DECOY', label: true, color: '#C8A850', t: 0, delay: 0 });
        return;
      }
    }
  },

  // where the enemies think the eagle is
  // (big maps: the nearest eagle still standing to tank t)
  baseTarget(t) {
    const goals = this.baseGoals();
    if (!goals.length) return { x: BASE_X, y: BASE_Y };
    if (!t || goals.length === 1) return goals[0];
    return goals.reduce((a, g) => (Math.abs(g.x - t.x) + Math.abs(g.y - t.y) < Math.abs(a.x - t.x) + Math.abs(a.y - t.y) ? g : a));
  },

  hitDecoy() {
    const d = this.decoy;
    d.flash = 20;
    if (--d.hp > 0) { Sound.play('armor'); return; }
    this.addFx(d.x + 8, d.y + 8, BIG_EXPLOSION(), 6);
    this.decoy = null;
    this.navBaseF = {};
    Sound.play('explode');
  },

  // ------------------------------------------------------------ bridges
  // a player tank stuck at water with a bridge kit lays a bridge straight across
  layBridge(t) {
    const d = t.dir, cells = [];
    const across = (d & 1) ? [t.y >> 2, (t.y + 15) >> 2] : [t.x >> 2, (t.x + 15) >> 2];
    let along = [(t.y >> 2) - 1, (t.x + 16) >> 2, (t.y + 16) >> 2, (t.x >> 2) - 1][d];
    const step = d === 0 || d === 3 ? -1 : 1;
    for (let n = 0; n < BRIDGE_MAX; n++, along += step) {
      let water = false;
      for (let a = across[0]; a <= across[1]; a++) {
        const [cx, cy] = (d & 1) ? [along, a] : [a, along];
        if (this.get(cx, cy) === T_WATER) { water = true; cells.push([cx, cy]); }
      }
      if (!water) break;
    }
    if (!cells.length) return false;
    for (const [cx, cy] of cells) this.set(cx, cy, T_BRIDGE);
    Sound.play('build');
    return true;
  },

  waterAhead(t) {
    const [x0, y0, x1, y1] = [[t.x, t.y - 4, t.x + 15, t.y - 1], [t.x + 16, t.y, t.x + 19, t.y + 15],
      [t.x, t.y + 16, t.x + 15, t.y + 19], [t.x - 4, t.y, t.x - 1, t.y + 15]][t.dir];
    for (let cy = y0 >> 2; cy <= y1 >> 2; cy++) for (let cx = x0 >> 2; cx <= x1 >> 2; cx++) if (this.get(cx, cy) === T_WATER) return true;
    return false;
  },

  // ------------------------------------------------------------ drawing
  renderDecoy(ctx) {
    const d = this.decoy;
    if (!d) return;
    if (d.flash > 0) d.flash--;
    ctx.drawImage(Sprites.outline(Sprites.eagle, d.flash > 0 && (d.flash >> 2) & 1 ? COL.white : '#C8A850'), d.x - 1, d.y - 1);
    ctx.drawImage(Sprites.eagle, d.x, d.y);
  },

  renderSmoke(ctx, t) {
    ctx.fillStyle = 'rgba(200,200,200,0.35)';
    for (let k = 0; k < 6; k++) {
      const a = k * 1.05 + this.frame * 0.05, r = 7 + ((k * 3 + (this.frame >> 3)) % 4);
      const x = t.x + 8 + Math.cos(a) * r, y = t.y + 8 + Math.sin(a) * r;
      ctx.fillRect(Math.round(x) - 3, Math.round(y) - 3, 6, 6);
    }
  },
});

</script>
  <script>
'use strict';
// =====================================================================
//  More terrain, and dark stages
//    MUD        tanks crawl at half speed (shells pass over it)
//    BELTS      conveyor belts push any tank along their arrow
//    PADS       teleporter pads in linked pairs: a tank or shell entering one comes out of its twin
//    NIGHT/FOG  some stages are dark: you see only what your tanks, the eagle, shots and explosions light up
//  They appear in the normal stages (mud from stage 3, teleporters from 5, belts from 8), placed the same way each
//  time a stage is played, and can be painted in CONSTRUCTION.
// =====================================================================

const PAD_COLORS = ['#3CBCFC', '#F878F8', '#58D854', '#F8B800'];
const BELT_SPEED = 0.6, MUD_SLOW = 0.5;
const isBelt = t => t >= T_BELT && t < T_BELT + 4;

// teleporter pads painted in construction ('T' in a 26x26 block map: the top-left block of each 2x2 tile)
function padsFromBlocks(blocks) {
  const pads = [];
  for (let by = 0; by < blocks.length; by += 2) for (let bx = 0; bx < blocks[by].length; bx += 2) {
    if (blocks[by][bx] === 'T') pads.push({ x: bx * 8, y: by * 8 });
  }
  pads.forEach((p, i) => { p.pair = i ^ 1; p.color = PAD_COLORS[(i >> 1) % PAD_COLORS.length]; });
  if (pads.length & 1) pads.pop();   // an odd pad out has no twin
  return pads;
}

// night, fog or neither for a stage number
function stageWeather(num, boss) {
  const mode = Config.get('darkStages');
  if (mode === 'OFF' || boss) return null;
  if (mode === 'ALWAYS NIGHT') return 'night';
  if (mode === 'ALWAYS FOG') return 'fog';
  if (num >= 6 && num % 6 === 0) return 'night';
  if (num >= 9 && num % 6 === 3) return 'fog';
  return null;
}

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ generated features for the normal stages
  addTerrainExtras(num) {
    const r = seeded(num * 131 + 7), area = (COLS * ROWS) / 169;
    const tileFree = (tx, ty) => {
      const x = tx * 16, y = ty * 16;
      if (y < 32 || y > FH - 48) return false;   // keep the entry rows and the bottom row clear
      if (Math.hypot(x + 8 - BASE_X - 8, y + 8 - BASE_Y - 8) < 56) return false;
      if (PLAYER_SPAWN.some(([sx, sy]) => overlap(x, y, 16, 16, sx - 8, sy - 8, 32, 32))) return false;
      for (let cy = ty * 4; cy < ty * 4 + 4; cy++) for (let cx = tx * 4; cx < tx * 4 + 4; cx++) if (this.get(cx, cy) !== T_EMPTY) return false;
      return true;
    };
    const pickFree = () => {
      for (let k = 0; k < 80; k++) {
        const tx = Math.floor(r() * COLS), ty = Math.floor(r() * ROWS);
        if (tileFree(tx, ty)) return [tx, ty];
      }
      return null;
    };
    // mud: a few round patches
    if (num >= 3) {
      const n = Math.round((2 + (num > 10 ? 1 : 0)) * area);
      for (let k = 0; k < n; k++) {
        const t = pickFree();
        if (!t) break;
        const cx = t[0] * 4 + 2, cy = t[1] * 4 + 2, rad = 3 + r() * 2;
        for (let y = Math.floor(cy - rad); y <= cy + rad; y++) for (let x = Math.floor(cx - rad); x <= cx + rad; x++) {
          if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) > rad || this.get(x, y) !== T_EMPTY) continue;
          if (Math.hypot(x * 4 - BASE_X - 8, y * 4 - BASE_Y - 8) < 40 || y < 8) continue;
          this.set(x, y, T_MUD);
        }
      }
    }
    // a teleporter pair: one pad on each side of the field
    if (num >= 5 && r() < 0.65) {
      const pairs = area > 2 ? 2 : 1;
      for (let k = 0; k < pairs; k++) {
        let a = null, b = null;
        for (let i = 0; i < 80 && !(a && b); i++) {
          const tx = Math.floor(r() * COLS), ty = Math.floor(r() * ROWS);
          if (!tileFree(tx, ty)) continue;
          if (!a && tx < COLS / 2 - 1) a = [tx, ty];
          else if (!b && tx > COLS / 2) b = [tx, ty];
        }
        if (a && b) {
          const i = this.pads.length;
          this.pads.push({ x: a[0] * 16, y: a[1] * 16, pair: i + 1, color: PAD_COLORS[(i >> 1) % 4] },
            { x: b[0] * 16, y: b[1] * 16, pair: i, color: PAD_COLORS[(i >> 1) % 4] });
        }
      }
    }
    // a conveyor belt: a straight run of free tiles, horizontal or vertical
    if (num >= 8 && r() < 0.6) {
      const n = Math.max(1, Math.round(area));
      for (let k = 0; k < n; k++) {
        const vertical = r() < 0.35, len = 4 + Math.floor(r() * 4);
        for (let tries = 0; tries < 60; tries++) {
          const tx = Math.floor(r() * COLS), ty = Math.floor(r() * ROWS);
          const tiles = [];
          for (let i = 0; i < len; i++) tiles.push(vertical ? [tx, ty + i] : [tx + i, ty]);
          if (!tiles.every(([x, y]) => x < COLS && y < ROWS && tileFree(x, y) && !this.pads.some(p => p.x === x * 16 && p.y === y * 16))) continue;
          const dir = vertical ? (r() < 0.5 ? 0 : 2) : (r() < 0.5 ? 1 : 3);
          for (const [x, y] of tiles) for (let cy = y * 4; cy < y * 4 + 4; cy++) for (let cx = x * 4; cx < x * 4 + 4; cx++) this.set(cx, cy, T_BELT + dir);
          break;
        }
      }
    }
  },

  // ------------------------------------------------------------ every frame
  cellUnder(t) { return this.get((t.x + 8) >> 2, (t.y + 8) >> 2); },

  mudFactor(t) { return this.cellUnder(t) === T_MUD && !t.hover && !t.boost.ghost ? MUD_SLOW : 1; },

  updateTerrainFx() {
    for (const t of this.tanks) {
      if (!t.alive) continue;
      // conveyor belts carry tanks along (frozen ones too)
      const c = this.cellUnder(t);
      if (isBelt(c) && !t.hover) {
        const d = c - T_BELT;
        t.beltAcc = (t.beltAcc || 0) + BELT_SPEED;
        while (t.beltAcc >= 1) {
          t.beltAcc--;
          if (!this.canStep(t, d)) { t.beltAcc = 0; break; }
          t.x += DXY[d][0]; t.y += DXY[d][1];
          if (t.trail) t.trail.unshift([t.x + 8, t.y + 8]);
        }
      } else t.beltAcc = 0;
      // teleporter pads
      if (t.tpCool > 0) { t.tpCool--; continue; }
      for (const p of this.pads) {
        if (Math.abs(t.x - p.x) > 2 || Math.abs(t.y - p.y) > 2) continue;
        const q = this.pads[p.pair];
        if (!q || this.tanks.some(o => o !== t && o.alive && overlap(o.x, o.y, 16, 16, q.x, q.y, 16, 16))) break;
        this.addFx(t.x + 8, t.y + 8, [Sprites.sparkle[3], Sprites.sparkle[2], Sprites.sparkle[1]], 3);
        t.x = q.x; t.y = q.y; t.acc = 0;
        if (t.trail) t.trail.length = 0;
        t.tpCool = 90;
        this.addFx(t.x + 8, t.y + 8, [Sprites.sparkle[1], Sprites.sparkle[2], Sprites.sparkle[3]], 3);
        Sound.play('teleport');
        break;
      }
    }
  },

  // a shell entering a pad comes out of its twin, once
  bulletPad(b) {
    if (b.tp || !this.pads.length) return;
    for (const p of this.pads) {
      if (!overlap(b.x, b.y, 4, 4, p.x + 4, p.y + 4, 8, 8)) continue;
      const q = this.pads[p.pair];
      if (!q) return;
      b.x = q.x + 6 + DXY[b.dir][0] * 6; b.y = q.y + 6 + DXY[b.dir][1] * 6;
      b.tp = true;
      return;
    }
  },

  // ------------------------------------------------------------ drawing
  renderBelts(ctx) {
    if (!this.beltCells || !this.beltCells.length) return;
    const ph = (this.frame >> 2) & 3;
    for (const i of this.beltCells) {
      const cx = i % GW, cy = (i / GW) | 0, d = this.terrain[i] - T_BELT, x = cx * 4, y = cy * 4;
      ctx.fillStyle = '#383838';
      ctx.fillRect(x, y, 4, 4);
      ctx.fillStyle = '#9C9C9C';
      // a moving stripe across each cell, travelling with the belt

  renderDarkness(ctx) {

  <script>
'use strict';
// =====================================================================
//  Game modes (picked on the title screen's MODE row)
//    CLASSIC      the game as always
//    SURVIVAL     endless waves on one map, each bigger and stronger; a breather between waves
//    TIME ATTACK  clear stages 1-5 as fast as you can (the clock runs from the first stage)
//    BIG MAPS     every stage is a big scrolling map with outposts to hold or factories to destroy (bigmap.js)
//    VS EAGLES    2-4 players, each with an eagle: defend yours, destroy theirs; best of 3 rounds
//    DEATHMATCH   2-4 players, no eagles: first to 10 kills, or the most kills after 3 minutes
//    FLAGS        capture the flag: bring another player's flag home to your own; first to 3
// =====================================================================

const MODES = [
  { key: 'classic', name: 'CLASSIC', desc: 'THE GAME AS ALWAYS' },
  { key: 'survival', name: 'SURVIVAL', desc: 'ENDLESS WAVES, HOW LONG?' },
  { key: 'timeattack', name: 'TIME ATTACK', desc: 'CLEAR 5 STAGES FAST' },
  { key: 'bigmaps', name: 'BIG MAPS', desc: 'HUGE SCROLLING BATTLEFIELDS' },
  { key: 'eagles', name: 'VS EAGLES', vs: true, desc: 'GUARD YOURS, HIT THEIRS' },
  { key: 'dm', name: 'DEATHMATCH', vs: true, desc: 'FIRST TO 10 KILLS' },
  { key: 'ctf', name: 'FLAGS', vs: true, desc: 'BRING THEIR FLAG HOME' },
];
const modeInfo = key => MODES.find(m => m.key === key) || MODES[0];
const TA_STAGES = 5, VS_ROUNDS = 2, DM_FRAGS = 10, DM_TIME = 3 * 60 * 60, CTF_CAPS = 3;
const VS_RESPAWN = 90, VS_PU_EVERY = 900, WAVE_BREAK = 240;
// power-ups that make sense between players
const VS_POWERUPS = [PU.HELMET, PU.STAR, PU.SHIP, PU.TURBO, PU.RAPID, PU.SPREAD, PU.PIERCE, PU.ROCKET, PU.MINES, PU.GHOST, PU.SMOKE, PU.GUN];

// survival: what wave w brings
function waveQueue(w) {
  return buildQueue(Math.min(60, w * 2), Math.min(60, 6 + w * 2));
}

Object.assign(Stage.prototype, {
  // ------------------------------------------------------------ survival
  setupSurvival() {
    this.survival = true;
    this.wave = 1;
    this.queue = waveQueue(1);
    this.total = this.queue.length;
    this.waveBreak = 0;
  },

  // called instead of "stage clear" when a wave is beaten
  nextWave() {
    if (this.waveBreak > 0) {
      if (--this.waveBreak === 0) {
        this.wave++;
        this.queue = waveQueue(this.wave);
        this.total += this.queue.length;
        this.spawnTimer = 0;
      }
      return;
    }
    this.waveBreak = WAVE_BREAK;
    // a breather: the fortress is patched, every 5 waves a tank for everyone
    this.setBaseWalls(T_BRICK);
    if ((this.wave + 1) % 5 === 0) for (const p of this.players) if (!p.out && !Config.infiniteLives()) p.lives++;
    for (const p of this.players) if (!p.out) this.addXp(p, 10 + this.wave * 2);
    Sound.play('bonus');
  },

  // ------------------------------------------------------------ versus
  setupVersus(kind) {
    this.vs = kind;
    this.queue = [];
    this.total = 0;
    this.noBase = true;
    const midY = Math.round((FH / 2 - 8) / 16) * 16;
    const homes = [[BASE_X, BASE_Y], [BASE_X, 0], [0, midY], [FW - 16, midY]];
    this.vsSpawn = kind === 'dm'
      ? [[0, FH - 16], [FW - 16, 0], [0, 0], [FW - 16, FH - 16]]
      : [[BASE_X - 32, BASE_Y], [BASE_X + 32, 0], [0, midY - 32], [FW - 16, midY + 32]];
    // clear room around everyone's home and entry point; the classic fortress goes (rebuilt below if needed)
    this.setBaseWalls(T_EMPTY);
    const clear = (x, y, r) => {
      for (let cy = (y >> 2) - r; cy < (y >> 2) + 4 + r; cy++) for (let cx = (x >> 2) - r; cx < (x >> 2) + 4 + r; cx++) {
        const t = this.get(cx, cy);
        if (t !== -1 && t !== T_EMPTY) this.set(cx, cy, T_EMPTY);
      }
    };
    this.players.forEach((p, i) => { clear(...this.vsSpawn[i], 1); if (kind !== 'dm') clear(...homes[i], 3); });
    this.pads = this.pads.filter(pd => !this.players.some((p, i) => overlap(pd.x, pd.y, 16, 16, this.vsSpawn[i][0] - 8, this.vsSpawn[i][1] - 8, 32, 32)));
    if (kind === 'eagles') {
      this.vsEagles = this.players.map((p, i) => ({ x: homes[i][0], y: homes[i][1], i, alive: true }));
      for (const e of this.vsEagles) this.fortressAround(e.x, e.y);
    }
    if (kind === 'ctf') {
      this.flags = this.players.map((p, i) => ({ i, hx: homes[i][0], hy: homes[i][1], x: homes[i][0], y: homes[i][1], carrier: null }));
    }
    for (const p of this.players) { p.vsKills = p.vsKills || 0; p.caps = 0; p.out = false; }
    this.vsTime = 0;
    this.vsPu = VS_PU_EVERY / 2;
    this.vsEnd = 0;
  },

  // a ring of 8px brick blocks around a 16px eagle (inside the field)
  fortressAround(x, y) {
    const bx = x / 8, by = y / 8;
    for (let yy = by - 1; yy <= by + 2; yy++) for (let xx = bx - 1; xx <= bx + 2; xx++) {
      const inside = xx >= bx && xx <= bx + 1 && yy >= by && yy <= by + 1;
      if (!inside && xx >= 0 && yy >= 0 && xx < COLS * 2 && yy < ROWS * 2) this.setBlock(xx, yy, T_BRICK);
    }
  },

  vsPlayerOf(tank) { return tank && tank.player ? tank.player : null; },

  // a player tank was destroyed in a versus game
  vsDeath(t, by) {
    const p = t.player, killer = this.vsPlayerOf(by);
    if (killer && killer !== p) {
      killer.vsKills++;
      this.addScore(killer, 100);
      this.popups.push({ x: t.x + 8, y: t.y, text: ROMAN[killer.i] + ' +1', label: true, color: PALS[Config.playerPal(killer.i)][2], t: 0, delay: 0 });
    }
    // a flag carrier drops the flag where it fell
    for (const f of this.flags || []) if (f.carrier === p) { f.carrier = null; f.x = t.x; f.y = t.y; }
    const eagleGone = this.vs === 'eagles' && !this.vsEagles[p.i].alive;
    if (eagleGone) p.out = true; else this.spawnPlayer(p, VS_RESPAWN);
  },

  // a shell meets an eagle (true if it stopped there)
  vsBulletEagle(b) {
    for (const e of this.vsEagles || []) {
      if (!e.alive || !overlap(b.x, b.y, 4, 4, e.x, e.y, 16, 16)) continue;
      this.killBullet(b, true);
      const owner = this.vsPlayerOf(b.owner);
      if (!owner || owner.i !== e.i) this.vsEagleDown(e);   // your own shells can't hurt your eagle
      return true;
    }
    return false;
  },

  vsEagleDown(e) {
    if (!e.alive) return;
    e.alive = false;
    this.addFx(e.x + 8, e.y + 8, BIG_EXPLOSION(), 6);
    Sound.play('baseDie');
    const p = this.players[e.i];
    p.out = true;
    if (p.tank) { p.tank.alive = false; this.addFx(p.tank.x + 8, p.tank.y + 8, BIG_EXPLOSION(), 5); p.tank = null; }
    this.spawns = this.spawns.filter(s => s.player !== p);
    this.popups.push({ x: e.x + 8, y: e.y, text: ROMAN[e.i] + ' IS OUT', label: true, color: COL.red, t: 0, delay: 0, life: 120 });
  },

  updateVersus() {
    this.vsTime++;
    // power-ups drop now and then (no bonus tanks here)
    if (!this.powerup && --this.vsPu <= 0) {
      this.vsPu = VS_PU_EVERY;
      this.spawnPowerup(VS_POWERUPS);
    }
    if (this.vs === 'ctf') this.updateFlags();
    if (this.vsEnd > 0) { if (--this.vsEnd === 0) this.result = 'vsRound'; return; }
    // has anyone won?
    let winner = null;
    if (this.vs === 'eagles') {
      const alive = this.vsEagles.filter(e => e.alive);
      if (alive.length <= 1) winner = alive.length ? alive[0].i : -1;
    } else if (this.vs === 'dm') {
      const top = this.players.find(p => p.vsKills >= DM_FRAGS);
      if (top) winner = top.i;
      else if (this.vsTime >= DM_TIME) winner = this.leader(p => p.vsKills);
    } else if (this.vs === 'ctf') {
      const top = this.players.find(p => p.caps >= CTF_CAPS);
      if (top) winner = top.i;
    }
    if (winner !== null) { this.vsWinner = winner; this.vsEnd = 150; Sound.play(winner >= 0 ? 'bonus' : 'gameover'); }
  },

  // the single best player by some count, or -1 on a tie
  leader(f) {

  },

  updateFlags() {

        const t = f.carrier.tank;
        if (t) { f.x = t.x; f.y = t.y; }

      }
      for (const t of this.tanks) {
        if (!t.alive || !t.isPlayer || t.ally || !overlap(t.x + 2, t.y + 2, 12, 12, f.x + 2, f.y + 2, 12, 12)) continue;
        const p = t.player;
        if (p.i === f.i) {
          // your own flag: a dropped one goes home; at home, bring a captured flag to it
          if (f.x !== f.hx || f.y !== f.hy) { f.x = f.hx; f.y = f.hy; Sound.play('pickup'); }
          const carried = this.flags.find(g => g.carrier === p);
          if (carried) {
            carried.carrier = null; carried.x = carried.hx; carried.y = carried.hy;
            p.caps++;
            this.addScore(p, 500);
            this.popups.push({ x: t.x + 8, y: t.y, text: 'CAPTURE!', label: true, color: COL.gold, t: 0, delay: 0, life: 90 });
            Sound.play('life');
          }
        } else if (!this.flags.some(g => g.carrier === p)) {
          f.carrier = p;   // grabbed someone else's flag
          Sound.play('bonus');
        }
        break;
      }
    }
  },

  // ------------------------------------------------------------ drawing
  renderVs(ctx) {
    for (const e of this.vsEagles || []) {
      if (!e.alive) { ctx.drawImage(Sprites.eagleDead, e.x, e.y); continue; }
      ctx.drawImage(Sprites.outline(Sprites.eagle, PALS[Config.playerPal(e.i)][2]), e.x - 1, e.y - 1);
      ctx.drawImage(Sprites.eagle, e.x, e.y);
    }
    for (const f of this.flags || []) {
      // home marker, then the flag itself in its owner's colour
      ctx.strokeStyle = PALS[Config.playerPal(f.i)][2];
      ctx.strokeRect(f.hx + 0.5, f.hy + 0.5, 15, 15);
      ctx.drawImage(Sprites.vsFlag(Config.playerPal(f.i)), f.x, f.y - (f.carrier ? 6 : 0));
    }
  },

  renderVsHud(ctx, H) {
    const val = p => (this.vs === 'eagles' ? (Game.vsWins[p.i] || 0) : this.vs === 'dm' ? p.vsKills : p.caps);
    Font.draw(ctx, this.vs === 'eagles' ? 'WIN' : this.vs === 'dm' ? 'KIL' : 'CAP', H - 4, 24, COL.black);
    this.players.forEach((p, i) => {
      const y = 40 + i * 20;
      ctx.drawImage(Sprites.playerIcon(Config.playerPal(i)), H, y);
      Font.draw(ctx, String(Math.min(99, val(p))), H + 8, y, p.out ? '#3C3C3C' : COL.black);
      if (this.vs === 'eagles' && !this.vsEagles[i].alive) { ctx.fillStyle = COL.red; ctx.fillRect(H, y + 3, 16, 1); }

      Font.drawCenter(ctx, Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'), H + 8, 130, COL.black);
    }
  },

  renderModeBanner(ctx) {
    if (this.survival && this.waveBreak > 0 && (this.waveBreak >> 4) & 1) {
      Font.drawCenter(ctx, 'WAVE ' + (this.wave + 1), VIEW_W / 2, VIEW_H / 2 - 4, COL.gold);
    }
    if (this.vs && this.vsEnd > 0) {
      const w = this.vsWinner;
      Font.drawCenter(ctx, w >= 0 ? ROMAN[w] + '-PLAYER WINS!' : 'DRAW!', VIEW_W / 2, VIEW_H / 2 - 4, COL.gold);
