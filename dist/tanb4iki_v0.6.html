      if (t === T_WATER) return 'water';
      if (t === T_BRICK) { if (!crush) return 'brick'; bricks.push([cx, cy]); }
    }
    for (const o of this.bosses) {
      if (o !== b && this.bossTangible(o) && overlap(nx, ny, b.w, b.h, o.x, o.y, o.w, o.h) && !overlap(b.x, b.y, b.w, b.h, o.x, o.y, o.w, o.h)) return 'tank';
    }
    for (const t of this.tanks) {
      if (!t.alive || !overlap(nx, ny, b.w, b.h, t.x, t.y, 16, 16) || overlap(b.x, b.y, b.w, b.h, t.x, t.y, 16, 16)) continue;
      if (!crush) return 'tank';
      if (t.isPlayer) { this.hitPlayer(t); if (t.alive) return 'tank'; }
      else this.killEnemy(t, null, false);
    }
    for (const [cx, cy] of bricks) this.set(cx, cy, T_EMPTY);
    if (bricks.length && this.frame % 6 === 0) Sound.play('brick');
    b.x = nx; b.y = ny;
    b.animTick++;
    return null;
  },

  bossMove(b, d, speed, crush) {
    b.acc += speed * b.speedMul;
    while (b.acc >= 1) {
      b.acc -= 1;
      const r = this.bossStep(b, d, crush);
      if (r) { b.acc = 0; return r; }
    }
    return null;
  },

  // wander like a tank, drifting toward a target
  bossRoam(b, speed, bias = 0.6) {
    const r = this.bossMove(b, b.dir, speed, false);
    if (r || ((b.x & 7) === 0 && (b.y & 7) === 0 && Math.random() < 1 / 40)) {
      const [cx, cy] = this.bossCenter(b), [tx, ty] = this.bossTarget(b);
      let d = Math.random() < bias ? this.dirToward(cx, cy, tx, ty) : rnd(4);
      if (r && d === b.dir) d = (d + 1 + rnd(3)) % 4;
      b.dir = d;
    }
  },

  summonEscort(type) {
    if (this.tanks.filter(t => !t.isPlayer).length + this.spawns.filter(s => s.enemy).length >= this.maxEnemies + 2) return;
    const free = ENEMY_SPAWN_X.filter(x => !this.bossBlocksSpawn(x));
    if (!free.length) return;
    this.spawns.push({ x: free[rnd(free.length)], y: 0, t: SPARKLE_TIME, enemy: { type, bonus: false } });
  },

  addBeam(x, y0, warn = 50) {
    // runs down the column until steel (the eagle itself is never hit)
    let y1 = FH;
    for (let y = Math.max(0, y0); y < FH; y += 4) {
      let blocked = false;
      for (let cx = (x - 4) >> 2; cx <= (x + 3) >> 2; cx++) if (this.get(cx, y >> 2) === T_STEEL) blocked = true;
      if (blocked) { y1 = y; break; }
    }
    if (x + 4 > BASE_X && x - 4 < BASE_X + 16) y1 = Math.min(y1, BASE_Y);
    this.beams.push({ x, y0, y1, t: 0, warn, dur: 22 });
    Sound.play('charge');
  },

  // ------------------------------------------------------------ per-frame update
  updateBosses() {
    if (!this.bosses.length) return;
    if (this.bossBanner > 0) this.bossBanner--;
    for (const b of this.bosses) { if (b.flash > 0) b.flash--; if (b.visibleT > 0) b.visibleT--; }
    for (const tr of this.tracks) tr.t--;
    this.tracks = this.tracks.filter(tr => tr.t > 0);
    for (const d of this.dust) d.t--;
    this.dust = this.dust.filter(d => d.t > 0);
    if (this.freezeE > 0 || this.over) return;
    for (const b of this.bosses.slice()) if (b.alive) BOSS_AI[b.kind].call(this, b);
    this.bosses = this.bosses.filter(b => b.alive || b.main);
    // laser beams: warning line, then a short deadly burst
    for (const bm of this.beams) {
      bm.t++;
      if (bm.t === bm.warn) Sound.play('laser');
      if (bm.t < bm.warn || bm.t >= bm.warn + bm.dur) continue;
      for (const t of this.tanks) {
        if (t.isPlayer && t.alive && overlap(t.x, t.y, 16, 16, bm.x - 4, bm.y0, 8, bm.y1 - bm.y0)) this.hitPlayer(t);
      }
      for (let y = bm.y0 >> 2; y < bm.y1 >> 2; y++) for (let cx = (bm.x - 4) >> 2; cx <= (bm.x + 3) >> 2; cx++) {
        if (this.get(cx, y) === T_BRICK) this.set(cx, y, T_EMPTY);
      }
    }
    this.beams = this.beams.filter(bm => bm.t < bm.warn + bm.dur);
  },

  // ------------------------------------------------------------ rendering
  renderBossUnder(ctx) {
    if (!this.bosses.length) return;
    ctx.fillStyle = '#707088';
    for (const tr of this.tracks) { ctx.globalAlpha = Math.min(1, tr.t / 120); ctx.fillRect(tr.x, tr.y, 2, 2); }
    ctx.fillStyle = '#A07848';
    for (const d of this.dust) { ctx.globalAlpha = Math.min(1, d.t / 30); ctx.fillRect(d.x, d.y, 2, 2); }
    ctx.globalAlpha = 1;
  },

  renderBosses(ctx) {
    for (const b of this.bosses) {
      if (!b.alive) continue;
      const kind = b.kind === 'decoy' ? 'phantom' : b.kind;
      let variant = 'n';
      if (b.flash > 0 && (b.flash & 2)) variant = 'f';
      else if ((b.mode === 'windup' || (kind === 'dread' && b.flash > 6)) && (this.frame >> 2) & 1) variant = 'r';
      const frame = kind === 'mole' ? (this.frame >> 2) & 1 : (b.animTick >> 1) & 1;
      if (kind === 'mole' && (b.mode === 'under' || b.mode === 'emerge')) {
        if (b.mode === 'emerge') {
          // swirling dust where it will surface
          ctx.fillStyle = (this.frame >> 2) & 1 ? '#C89858' : '#806040';
          for (let i = 0; i < 10; i++) {
            const a = this.frame * 0.25 + i * Math.PI / 5, r = 6 + (b.t % 20) / 2;
            ctx.fillRect(Math.round(b.x + 16 + Math.cos(a) * r), Math.round(b.y + 16 + Math.sin(a) * r), 3, 3);
          }
        }
        continue;
      }
      if (kind === 'phantom') {
        ctx.globalAlpha = b.mode === 'vanish' ? ((b.t >> 1) & 1 ? 0.6 : 0.1) : (b.visibleT > 0 || b.flash > 0 ? 1 : 0.13 + ((this.frame >> 3) & 1) * 0.05);
      }
      if (kind === 'mole' && b.mode === 'burrow') ctx.globalAlpha = Math.max(0.15, 1 - b.t / 30);
      if (kind === 'hydra') {
        ctx.drawImage(BossGfx.get('hydra', frame, 2, variant), b.x, b.y);
        b.turrets.forEach((tur, k) => ctx.drawImage(BossGfx.get('turret' + (tur.hp > 0 ? k : 3), 0, 2, tur.hp > 0 ? variant : 'n'), b.x + k * 16, b.y + 2));
        if (b.turrets.every(t => t.hp === 0)) {
          // exposed core glows
          ctx.fillStyle = (this.frame >> 2) & 1 ? '#F83800' : '#F8D800';
          ctx.fillRect(b.x + 21, b.y + 23, 6, 4);
        }
      } else {
        ctx.drawImage(BossGfx.get(kind, frame, kind === 'dread' ? 2 : b.dir, variant), b.x, b.y);
      }
      ctx.globalAlpha = 1;
      if (b.mode === 'dazed') {
        ctx.fillStyle = '#F8D800';
        for (let i = 0; i < 3; i++) {
          const a = this.frame * 0.2 + i * 2.09;
          ctx.fillRect(Math.round(b.x + b.w / 2 + Math.cos(a) * 12), Math.round(b.y - 2 + Math.sin(a) * 4), 2, 2);
        }
      }
    }
  },

  renderBeams(ctx) {
    for (const bm of this.beams) {
      if (bm.t < bm.warn) {
        if ((bm.t >> 2) & 1) { ctx.fillStyle = '#F83800'; ctx.fillRect(bm.x - 1, bm.y0, 2, bm.y1 - bm.y0); }
      } else {
        ctx.fillStyle = (bm.t >> 1) & 1 ? '#F83800' : '#F87858';
        ctx.fillRect(bm.x - 4, bm.y0, 8, bm.y1 - bm.y0);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(bm.x - 1, bm.y0, 2, bm.y1 - bm.y0);
      }
    }
  },

  renderBossBanner(ctx) {
    if (!this.bossBanner || this.bossIdx === undefined) return;
    const y = (FH >> 1) - 20;
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, y - 4, FW, 32);
    if ((this.bossBanner >> 3) & 1) Font.drawCenter(ctx, 'WARNING', FW / 2, y, COL.red);
    Font.drawCenter(ctx, 'BOSS: ' + BOSSES[this.bossIdx].name, FW / 2, y + 13, COL.white);
  },

  renderBossHud(ctx, H) {
    const b = this.mainBoss();
    // HP bar
    ctx.fillStyle = COL.black;
    ctx.fillRect(H + 2, 20, 12, 92);
    const frac = b && b.alive ? Math.max(0, b.hp) / b.maxHp : 0;
    const hgt = Math.round(88 * frac);
    ctx.fillStyle = b && b.enraged && (this.frame >> 3) & 1 ? '#F87858' : '#E04030';
    ctx.fillRect(H + 4, 22 + 88 - hgt, 8, hgt);
    // escorts still to come
    ctx.drawImage(Sprites.enemyIcon, H, 118);
    Font.draw(ctx, String(Math.min(99, this.queue.length)), H + 8, 118, COL.black);
  },
});

// ------------------------------------------------------------------ boss behaviour (this = Stage)
const BOSS_AI = {
  // IRON BEAR: roams firing 3-shell volleys; flashes red, then charges in a line crushing bricks.
  // Dazed (double damage) after a charge, longer if it slammed into steel.
  bear(b) {
    b.t++;
    switch (b.mode) {
      case 'roam': {
        this.bossRoam(b, b.enraged ? 0.6 : 0.5);
        if (--b.cd <= 0) {
          for (const off of [-10, 0, 10]) { const [x, y] = this.bossMuzzle(b, b.dir, off); this.bossFire(b, x, y, b.dir); }
          b.cd = b.enraged ? 55 : 80;
        }
        if (b.t >= (b.enraged ? 240 : 360)) {
          const [cx, cy] = this.bossCenter(b), [tx, ty] = this.bossTarget(b);
          b.dir = this.dirToward(cx, cy, tx, ty);
          b.mode = 'windup'; b.t = 0;
          Sound.play('bossWarn');
        }
        break;
      }
      case 'windup':
        if (b.t >= (b.enraged ? 40 : 60)) {
          b.mode = 'charge'; b.t = 0;
          if (b.enraged) { this.summonEscort(0); this.summonEscort(0); }
        }
        break;
      case 'charge': {
        const r = this.bossMove(b, b.dir, b.enraged ? 4 : 3, true);
        if (b.t % 8 === 0) Sound.play('charge');
        if (r || b.t > 240) {
          b.mode = 'dazed'; b.t = 0; b.dazeLen = r === 'steel' ? 180 : 120;
          Sound.play('explode');
        }
        break;
      }
      case 'dazed':
        if (b.t >= b.dazeLen) { b.mode = 'roam'; b.t = 0; }
        break;
    }
  },

  // MOLE: travels underground (only a dust trail), surfaces near a player or the eagle with a dust swirl
  // warning, fires a cross of 8 shells, then burrows again. Only hittable while up or burrowing.
  mole(b) {
    b.t++;
    switch (b.mode) {
      case 'under': {
        if (!b.target) b.target = this.moleTarget(b, b.second);
        const sp = (b.enraged ? 1.6 : 1.2) * b.speedMul;
        const dx = b.target[0] - b.x, dy = b.target[1] - b.y, d = Math.hypot(dx, dy);
        if (d > sp) { b.x += dx / d * sp; b.y += dy / d * sp; }
        if (b.t % 3 === 0) this.dust.push({ x: b.x + 12 + rnd(8), y: b.y + 12 + rnd(8), t: 40 });
        if (d <= sp || b.t > 260) {
          b.x = Math.round(b.target[0] / 4) * 4; b.y = Math.round(b.target[1] / 4) * 4;
          b.mode = 'emerge'; b.t = 0;
          Sound.play('burrow');
        }
        break;
      }
      case 'emerge':
        if (b.t >= 60) {
          // bursts out of the ground: bricks and steel break, tanks underneath are hit
          for (let cy = b.y >> 2; cy < (b.y + b.h) >> 2; cy++) for (let cx = b.x >> 2; cx < (b.x + b.w) >> 2; cx++) {
            const t = this.get(cx, cy);
            if (t === T_BRICK || t === T_STEEL) this.set(cx, cy, T_EMPTY);
          }
          for (const t of this.tanks) {
            if (!t.alive || !overlap(t.x, t.y, 16, 16, b.x, b.y, b.w, b.h)) continue;
            if (t.isPlayer) this.hitPlayer(t); else this.killEnemy(t, null, false);
          }
          this.addFx(b.x + 16, b.y + 16, Sprites.bigExp, 4);
          Sound.play('explode');
          b.mode = 'up'; b.t = 0;
          this.moleVolley(b);
        }
        break;
      case 'up':
        if (b.enraged && b.t === 90) this.moleVolley(b);
        if (b.t >= 180) { b.mode = 'burrow'; b.t = 0; }
        break;
      case 'burrow':
        if (b.t >= 30) {
          if (b.enraged) this.mines.push({ x: b.x + 16, y: b.y + 16, byPlayer: false, owner: b, t: 0 });
          b.second = b.enraged && !b.second; // enraged: pops up twice in a row
          b.mode = 'under'; b.t = 0; b.target = null;
          Sound.play('burrow');
        }
        break;
    }
  },

  // HYDRA: drifts on its island. Left turret fires gatling bursts, right turret rockets, centre turret a
  // laser beam down the screen. Turrets are destroyed one by one; then the core is exposed.
  hydra(b) {
    b.t++;
    // slow drift left and right around its starting spot
    if (b.t % 4 === 0) {
      const r = this.bossStep(b, b.drift > 0 ? 1 : 3, false);
      if (r || Math.abs(b.x - b.home) >= 16) b.drift = -b.drift;
    }
    const [tx, ty] = this.bossTarget(b);
    const fast = b.enraged ? 0.5 : 1;
    b.turrets.forEach((tur, k) => {
      if (tur.hp <= 0) return;
      const cx = b.x + k * 16 + 8, cy = b.y + 14;
      tur.cd--;
      if (k === 0) {
        if (tur.cd <= 0) { tur.burst = 4; tur.cd = Math.round(120 * fast); }
        if (tur.burst > 0 && b.t % 8 === 0) {
          tur.burst--;
          const d = this.dirToward(cx, cy, tx, ty);
          this.bossFire(b, cx + DXY[d][0] * 10, cy + DXY[d][1] * 22, d, { speed: 3 });
        }
      } else if (k === 2) {
        if (tur.cd <= 0) {
          const d = this.dirToward(cx, cy, tx, ty);
          this.bossFire(b, cx + DXY[d][0] * 10, cy + DXY[d][1] * 22, d, { speed: 2, rocket: true });
          tur.cd = Math.round(140 * fast);
        }
      } else if (tur.cd <= 0) {
        this.addBeam(cx, b.y + b.h);
        tur.cd = Math.round(240 * fast);
      }
    });
    if (b.turrets.every(t => t.hp === 0) && --b.cd <= 0) {
      const [cx, cy] = this.bossCenter(b);
      for (const d of [1, 2, 3]) this.bossFire(b, cx + DXY[d][0] * 26, cy + DXY[d][1] * 18, d);
      b.cd = b.enraged ? 50 : 80;
    }
  },

  // PHANTOM: nearly invisible; shows itself only when it fires. Teleports every few seconds and leaves
  // decoys behind. On ice it leaves tracks; decoys don't.
  phantom(b) {
    b.t++;
    if (b.mode === 'vanish') {
      if (b.t >= 24) this.phantomTeleport(b);
      return;
    }
    this.bossRoam(b, b.enraged ? 1.1 : 0.9, 0.5);
    this.phantomTracks(b);
    if (--b.cd <= 0) {
      const [x, y] = this.bossMuzzle(b, b.dir);
      this.bossFire(b, x, y, b.dir, { speed: 3 });
      b.visibleT = 30;
      b.cd = b.enraged ? 45 : 60;
    }
    if (++b.tele >= (b.enraged ? 220 : 300)) {
      b.mode = 'vanish'; b.t = 0; b.tele = 0;
      for (const o of this.bosses) if (o.kind === 'decoy' && o.alive) { o.alive = false; this.addFx(o.x + 16, o.y + 16, Sprites.smallExp, 3); }
      Sound.play('teleport');
    }
  },

  decoy(b) {
    b.t++;
    this.bossRoam(b, 0.9, 0.5);
    const main = this.mainBoss();
    if (main && main.enraged && --b.cd <= 0) {
      const [x, y] = this.bossMuzzle(b, b.dir);
      this.bossFire(b, x, y, b.dir, { speed: 3 });
      b.visibleT = 30;
      b.cd = 70 + rnd(30);
    }
  },

  // DREADNOUGHT: phase 1 cannons + hatch releasing armor tanks; phase 2 mine lines and spread volleys;
  // phase 3 crawls toward the eagle crushing bricks and sweeps laser beams down the screen.
  dread(b) {
    b.t++;
    const frac = b.hp / b.maxHp, phase = frac > 2 / 3 ? 1 : frac > 1 / 3 ? 2 : 3;
    if (phase !== b.phase) { b.phase = phase; b.flash = 20; Sound.play('bossWarn'); }
    const [tx, ty] = this.bossTarget(b);
    if (--b.cd <= 0) {
      b.cannon ^= 1;
      const cx = b.x + (b.cannon ? 36 : 12), cy = b.y + b.h - 4;
      const d = Math.abs(ty - cy) < 12 ? (tx > cx ? 1 : 3) : 2;
      this.bossFire(b, cx + DXY[d][0] * 16, cy + DXY[d][1] * 4, d, { speed: 3, power: true });
      b.cd = phase === 1 ? 45 : phase === 2 ? 70 : 60;
    }
    if (phase <= 2 && ++b.hatchT >= (phase === 1 ? 600 : 900)) {
      b.hatchT = 0;
      this.summonEscort(3);
      Sound.play('burrow');
    }
    if (phase === 2) {
      if (++b.mineT >= 420) {
        b.mineT = 0;
        // across the most open row in the middle third of the field
        const open = (x, y) => [T_EMPTY, T_ICE, T_FOREST].includes(this.get(x >> 2, y >> 2));
        let best = null, bestN = -1;
        for (let y = Math.round(FH * 0.35 / 16) * 16 + 8; y <= FH * 0.65; y += 16) {
          let n = 0;
          for (let x = 24; x < FW - 8; x += 32) if (open(x, y)) n++;
          if (n > bestN || (n === bestN && Math.random() < 0.5)) { bestN = n; best = y; }
        }
        for (let x = 24; x < FW - 8; x += 32) if (open(x, best)) this.mines.push({ x, y: best, byPlayer: false, owner: b, t: -20 });
        Sound.play('build');
      }
      if (++b.volT >= 90) {
        b.volT = 0;
        const [cx, cy] = this.bossCenter(b);
        for (const d of [1, 2, 3]) this.bossFire(b, cx + DXY[d][0] * 26, cy + DXY[d][1] * 26, d, { speed: 2.5 });
      }
    }
    if (phase === 3) {
      if (b.y + b.h < BASE_Y - 32) this.bossMove(b, 2, 0.25, true);
      if (++b.laserT >= 240) { b.laserT = 0; this.addBeam(Math.round(tx), b.y + b.h); b.laser2 = 45; }
      if (b.laser2 > 0 && --b.laser2 === 0) { const [tx2] = this.bossTarget(b); this.addBeam(Math.round(tx2), b.y + b.h); }
    }
  },
};

Object.assign(Stage.prototype, {
  moleTarget(b, near) {
    let [tx, ty] = near ? [b.x + 16 + rnd(97) - 48, b.y + 16 + rnd(97) - 48]
      : (Math.random() < 0.6 ? this.bossTarget(b) : [BASE_X + 8, BASE_Y - 40]);
    for (let tries = 0; tries < 12; tries++) {
      let x = Math.max(0, Math.min(FW - 32, Math.round((tx - 16) / 8) * 8));
      let y = Math.max(0, Math.min(FH - 32, Math.round((ty - 16) / 8) * 8));
      // never surface on the eagle (stay above its fortress) or in water
      while (y > 0 && overlap(x, y, 32, 32, BASE_X - 16, BASE_Y - 16, 48, 32)) y -= 8;
      let water = false;
      for (let cy = y >> 2; cy < (y + 32) >> 2; cy++) for (let cx = x >> 2; cx < (x + 32) >> 2; cx++) if (this.get(cx, cy) === T_WATER) water = true;
      if (!water) return [x, y];
      tx += rnd(65) - 32; ty -= 16;
    }
    return [b.x, b.y];
  },

  moleVolley(b) {
    const [cx, cy] = this.bossCenter(b);
    for (const d of [0, 1, 2, 3]) {
      for (const off of [-8, 8]) {
        const [x, y] = [cx + DXY[d][0] * 18 + (DXY[d][1] ? off : 0), cy + DXY[d][1] * 18 + (DXY[d][0] ? off : 0)];
        this.bossFire(b, x, y, d, { speed: 2.5 });
      }
    }
  },

  phantomTracks(b) {
    const [cx, cy] = this.bossCenter(b);
    if (b.animTick % 4 === 0 && this.get(cx >> 2, cy >> 2) === T_ICE && b.lastTrack !== b.animTick) {
      b.lastTrack = b.animTick;
      const side = (b.dir & 1) ? [[0, -9], [0, 8]] : [[-9, 0], [8, 0]];
      for (const [dx, dy] of side) this.tracks.push({ x: cx + dx, y: cy + dy, t: 240 });
    }
  },

  // a random free spot in the upper part of the field
  freeSpot(w, h) {
    for (let tries = 0; tries < 40; tries++) {
      const x = rnd((FW - w) / 8 + 1) * 8, y = rnd(Math.max(1, Math.floor((FH * 0.6 - h) / 8))) * 8;
      let ok = true;
      for (let cy = y >> 2; cy < (y + h) >> 2 && ok; cy++) for (let cx = x >> 2; cx < (x + w) >> 2; cx++) {
        const t = this.get(cx, cy);
        if (t === T_BRICK || t === T_STEEL || t === T_WATER) { ok = false; break; }
      }
      if (ok && this.tanks.some(t => overlap(x, y, w, h, t.x - 8, t.y - 8, 32, 32))) ok = false;
      if (ok && this.bosses.some(o => o.alive && overlap(x, y, w, h, o.x, o.y, o.w, o.h))) ok = false;
      if (ok) return [x, y];
    }
    return null;
  },

  phantomTeleport(b) {
    const spot = this.freeSpot(b.w, b.h);
    if (spot) [b.x, b.y] = spot;
    b.mode = 'roam'; b.t = 0; b.cd = 40;
    const n = b.enraged ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const s = this.freeSpot(32, 32);
      if (s) this.bosses.push(new Boss({ kind: 'decoy', main: false, x: s[0], y: s[1], w: 32, h: 32, hp: 1, maxHp: 1, dir: rnd(4), cd: 60 + rnd(40), mode: 'roam' }));
    }
    Sound.play('teleport');
  },
});

  <script>
'use strict';
// =====================================================================
//  Online play: WebRTC peer-to-peer, connection codes swapped by copy-paste.
//  The host runs the game. Guests send their buttons and draw what the host sends
//  (about 30 times a second) with the same rendering code, so it looks identical.
// =====================================================================

const NET_ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
const NET_PREFIX = 'TANB4';
// host settings that change how the guests' screens look
const NET_CFG_KEYS = ['p1Color', 'p2Color', 'p3Color', 'p4Color', 'lives', 'bossRounds', 'bossEvery', 'shopPrices', 'mineCount'];
// sounds are forwarded to guests only from these screens
const NET_SOUND_STATES = new Set(['play', 'curtain', 'score', 'shop', 'bigover']);

const Net = {
  role: null,         // null | 'host' | 'client'
  // host
  slots: ['local'],   // lobby: 'local' (this keyboard) or 'online' per player
  peers: {},          // slot -> { pc, ch, status, invite }
  sndQueue: [],
  frameN: 0,
  stageId: 0,
  lastStage: null,
  inGame: false,
  // client
  pc: null,
  ch: null,
  slot: -1,
  counters: { fp: 0, ap: 0, cu: 0, cd: 0, cl: 0, cr: 0, ok: 0, bk: 0, stt: 0 },
  lastSent: '',
  keep: 0,
  cfgBackup: null,
  panelOpen: false,

  // the claude.ai playable link blocks peer-to-peer connections
  supported() { return typeof RTCPeerConnection !== 'undefined' && !/claude/i.test(location.hostname); },

  // ------------------------------------------------------------ codes
  async encode(obj) {
    let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
    if (window.CompressionStream) {
      try {
        const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        bytes = new Uint8Array(await new Response(s).arrayBuffer());
        z = 1;
      } catch (e) { /* send uncompressed */ }
    }
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return NET_PREFIX + '-' + z + ':' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },

  async decode(code) {
    const m = String(code).replace(/\s+/g, '').match(/^TANB4-([01]):([A-Za-z0-9_-]+)$/);
    if (!m) throw new Error("That doesn't look like a TANЬ4IKI code. Copy the whole code, starting with TANB4.");
    let b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    let bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    if (m[1] === '1') {
      const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(s).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  },

  // wait until the browser has found its network addresses (or give up after a few seconds)
  waitIce(pc) {
    return new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); resolve(); } };
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(resolve, 3500);
    });
  },

  versionError(v) {
    return new Error('Different game versions: the host has v' + v + ', this game is v' + APP_VERSION + '. Use the same file on both computers.');
  },

  // ------------------------------------------------------------ host
  startHosting() {
    this.role = 'host';
    if (!this.slots.length) this.slots = ['local'];
  },

  async createInvite(slot) {
    const old = this.peers[slot];
    if (old) { try { old.pc.close(); } catch (e) { /* already closed */ } }
    const pc = new RTCPeerConnection({ iceServers: NET_ICE });
    const ch = pc.createDataChannel('game', { ordered: true });
    const peer = { pc, ch, status: 'invite', invite: '' };
    this.peers[slot] = peer;
    this.wireHost(slot, peer);
    await pc.setLocalDescription(await pc.createOffer());
    await this.waitIce(pc);
    peer.invite = await this.encode({ v: APP_VERSION, slot, sdp: pc.localDescription.sdp });
    return peer.invite;
  },

  async acceptReply(slot, code) {
    const peer = this.peers[slot];
    if (!peer) throw new Error('Create an invite code for this player first.');
    const d = await this.decode(code);
    if (d.v !== APP_VERSION) throw this.versionError(d.v);
    if (d.kind !== 'reply') throw new Error('That is an invite code. Paste the reply code your friend sends back.');
    await peer.pc.setRemoteDescription({ type: 'answer', sdp: d.sdp });
    peer.status = 'connecting';
  },

  wireHost(slot, peer) {
    const { pc, ch } = peer;
    ch.onopen = () => {
      peer.status = 'connected';
      peer.needFull = true;
      const cfg = {};
      for (const k of NET_CFG_KEYS) cfg[k] = Config.get(k);
      ch.send(JSON.stringify({ t: 'welcome', slot, v: APP_VERSION, cfg }));
      if (this.inGame) Input.remote[slot] = Input.remote[slot] || Net.idleInput();
      Game.toast(ROMAN[slot] + '-PLAYER CONNECTED');
      this.refreshPanel();
    };
    ch.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.t === 'in' && this.inGame && Input.remote[slot]) Object.assign(Input.remote[slot], msg);
    };
    const lost = () => {
      if (peer.status === 'lost' || this.peers[slot] !== peer) return;
      peer.status = 'lost';
      if (Input.remote[slot]) Object.assign(Input.remote[slot], Net.idleInput());
      Game.toast(ROMAN[slot] + '-PLAYER DISCONNECTED');
      this.refreshPanel();
    };
    ch.onclose = lost;
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') {
        if (peer.status === 'connecting') peer.error = "Couldn't connect. One of the networks blocks direct connections (see README).";
        lost();
      }
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'closed') lost();
    };
  },

  idleInput() { return { d: -1, f: 0, a: 0 }; },

  // the lobby's slots become the game's players
  applySlots() {
    Input.remote = {};
    this.slots.forEach((s, i) => { if (s === 'online') Input.remote[i] = Net.idleInput(); });
    this.inGame = true;
    this.lastStage = null;
  },

  hangUp() {
    for (const k in this.peers) { try { this.peers[k].pc.close(); } catch (e) { /* closed */ } }
    this.peers = {};
    this.slots = ['local'];
    this.role = null;
    this.inGame = false;
    Input.remote = {};
  },

  openPeers() {
    return Object.values(this.peers).filter(p => p.status === 'connected' && p.ch.readyState === 'open');
  },

  // called once per game frame on the host
  hostTick() {
    if (this.role !== 'host') return;
    const st = Game.stage;
    if (st !== this.lastStage) {
      this.lastStage = st;
      if (st) st.netId = ++this.stageId;
      for (const p of Object.values(this.peers)) p.needFull = true;
    }
    if (++this.frameN % 2) return;
    const open = this.openPeers();
    if (!open.length) { if (st) st.netDiff = []; this.sndQueue = []; return; }
    const full = open.some(p => p.needFull);
    const msg = JSON.stringify(this.buildView(full));
    for (const p of open) {
      if (p.ch.bufferedAmount > 1e6) continue; // a slow guest skips frames instead of lagging behind
      try { p.ch.send(msg); p.needFull = false; } catch (e) { /* closing */ }
    }
  },

  buildView(full) {
    const G = Game, v = { t: 'v', s: G.state, gt: G.t, c: COLS, r: ROWS, stn: G.stageNum, hi: G.hi, eng: Sound.engineState };
    if (!this.inGame || !['play', 'curtain', 'score', 'shop', 'bigover'].includes(G.state)) v.s = 'wait';
    v.pl = G.players.map(p => ({
      i: p.i, score: p.score, lives: p.lives, level: p.level, mines: p.mines, kills: p.kills, out: p.out,
      ship: p.ship, cutter: p.cutter, kit: p.kit, shopShovel: p.shopShovel,
    }));
    v.snd = this.sndQueue.splice(0);
    if (G.toastT > 0) v.toast = [G.toastText, G.toastT];
    const st = G.stage;
    const needStage = v.s === 'play' || (v.s === 'curtain' && G.curtain && G.curtain.phase === 'close');
    if (st && needStage) v.st = this.stageView(st, full);
    else if (st) st.netDiff = [];
    if (v.s === 'play') v.pa = { paused: G.paused, pauseIdx: G.pauseIdx, pauseMsg: G.pauseMsg, pauseMsgT: G.pauseMsgT, openH: G.openH };
    if (v.s === 'curtain') v.cu = G.curtain;
    if (v.s === 'score') v.sc = G.sc;
    if (v.s === 'shop') {
      const sh = G.shop;
      v.sh = { order: sh.order.map(p => p.i), turn: sh.turn, idx: sh.idx, scroll: sh.scroll, msg: sh.msg, msgT: sh.msgT };
      v.disc = !!G.shopDiscount;
    }
    return v;
  },

  stageView(st, full) {
    const r = n => Math.round(n * 10) / 10;
    const fxKind = f => (f.frames.length === 3 ? 's' : f.frames.length === 2 ? 'b' : 'B');
    const sv = {
      id: st.netId, num: st.num, fr: st.frame, ov: st.over, ot: st.overTimer, ba: st.baseAlive, q: st.queue.length,
      df: st.netDiff || [],
      tk: st.tanks.filter(t => t.alive).map(t => [t.x, t.y, t.dir, t.isPlayer ? 1 : 0, t.player ? t.player.i : -1, t.type, t.hp,
        t.bonus ? 1 : 0, t.shield > 0 ? 1 : 0, t.frozen > 0 ? 1 : 0, t.ship ? 1 : 0, t.anim, t.boost.ghost ? 1 : 0]),
      bu: st.bullets.filter(b => b.alive).map(b => [r(b.x), r(b.y), b.dir, b.rocket ? 1 : 0, b.pierce ? 1 : 0]),
      fx: st.fx.map(f => [r(f.x), r(f.y), fxKind(f), f.per, f.tick]),
      pp: st.popups,
      pu: st.powerup,
      mi: st.mines.map(m => [m.x, m.y, m.t]),
      sp: st.spawns.map(s => [s.x, s.y, s.t]),
    };
    st.netDiff = [];
    if (full) sv.tf = Array.from(st.terrain).join('');
    if (st.bosses.length) {
      sv.bo = st.bosses.map(b => { const o = Object.assign({}, b); delete o.bullets; return o; });
      sv.bm = st.beams;
      sv.tr = st.tracks.map(t => [t.x, t.y, t.t]);
      sv.du = st.dust.map(d => [d.x, d.y, d.t]);
    }
    if (st.bossIdx !== undefined) { sv.bi = st.bossIdx; sv.bl = st.bossLoop; sv.bb = st.bossBanner; }
    return sv;
  },

  // ------------------------------------------------------------ client
  async join(code) {
    const d = await this.decode(code);
    if (d.v !== APP_VERSION) throw this.versionError(d.v);
    if (d.slot === undefined) throw new Error('That is a reply code. Paste the invite code the host sent you.');
    this.leave(true);
    const pc = new RTCPeerConnection({ iceServers: NET_ICE });
    this.pc = pc;
    this.slot = d.slot;
    this.status = 'connecting';
    pc.ondatachannel = e => this.wireClient(e.channel);
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') { this.status = 'failed'; this.refreshPanel(); }
    };
    await pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await this.waitIce(pc);
    return this.encode({ v: APP_VERSION, kind: 'reply', sdp: pc.localDescription.sdp });
  },

  wireClient(ch) {
    this.ch = ch;
    ch.onopen = () => {
      this.role = 'client';
      this.status = 'connected';
      Input.numPlayers = 1;
      Input.remote = {};
      Game.state = 'netwait';
      Game.t = 0;
      this.refreshPanel();
      setTimeout(() => { if (this.role === 'client' && this.panelMode === 'join') this.closePanel(); }, 1500);
    };
    ch.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.t === 'welcome') {
        this.slot = msg.slot;
        // show the host's colours, lives display and boss/shop rules (not saved)
        if (!this.cfgBackup) this.cfgBackup = Object.assign({}, Config.values);
        Object.assign(Config.values, msg.cfg);
        Config.apply();
      } else if (msg.t === 'v') this.applyView(msg);
    };
    ch.onclose = () => {
      if (this.role !== 'client') return;
      this.leave();
      Game.toast('THE HOST LEFT THE GAME');
    };
  },

  // leave the online game and go back to the title screen
  leave(silent) {
    if (this.pc) { try { this.pc.close(); } catch (e) { /* closed */ } }
    const wasClient = this.role === 'client';
    this.pc = null; this.ch = null;
    if (this.cfgBackup) { Config.values = this.cfgBackup; this.cfgBackup = null; Config.apply(); }
    if (this.role === 'client') this.role = null;
    if (wasClient && !silent) { Game.stage = null; Game.players = []; Game.toTitle(); }
  },

  clientUpdate() {
    const inp = Input.player(0), m = Input.menu(), c = this.counters;
    if (Input.anyJust(['Escape']) && Game.state !== 'shop') { this.openClientMenu(); return; }
    if (inp.firePressed) c.fp++;
    if (inp.altPressed) c.ap++;
    if (m.up) c.cu++;
    if (m.down) c.cd++;
    if (m.left) c.cl++;
    if (m.right) c.cr++;
    if (m.ok) c.ok++;
    if (m.back) c.bk++;
    if (m.start) c.stt++;
    const msg = JSON.stringify(Object.assign({ t: 'in', d: inp.dir, f: inp.fire ? 1 : 0, a: inp.alt ? 1 : 0 }, c));
    if (this.ch && this.ch.readyState === 'open' && (msg !== this.lastSent || ++this.keep > 30)) {
      try { this.ch.send(msg); } catch (e) { /* closing */ }
      this.lastSent = msg;
      this.keep = 0;
    }
  },

  applyView(v) {
    const G = Game;
    if (v.c !== COLS || v.r !== ROWS) setFieldSize(v.c, v.r);
    G.players = v.pl.map((o, k) => Object.assign(G.players[k] && G.players[k].i === o.i ? G.players[k] : newPlayer(o.i), o, { tank: null }));
    G.twoP = G.players.length > 1;
    G.stageNum = v.stn;
    G.hi = v.hi;
    G.t = v.gt;
    if (v.st) this.applyStage(v.st);
    G.state = v.s === 'wait' ? 'netwait' : v.s;
    if (v.cu) G.curtain = v.cu;
    if (v.sc) G.sc = v.sc;
    if (v.sh) {
      G.shop = Object.assign({}, v.sh, { order: v.sh.order.map(i => G.players.find(p => p.i === i)), rep: 0 });
      G.shopDiscount = v.disc;
    }
    if (v.pa) Object.assign(G, v.pa);
    for (const s of v.snd || []) Sound.play(s);
    Sound.setEngine(v.eng || 0);
    if (v.toast) { G.toastText = v.toast[0]; G.toastT = v.toast[1]; }
  },

  applyStage(sv) {
    const G = Game;
    let st = G.stage;
    if (!st || st.netId !== sv.id) {
      st = new Stage(sv.num, LEVELS[0], [], {});
      st.netId = sv.id;
      G.stage = st;
    }
    if (sv.tf) for (let i = 0; i < st.terrain.length; i++) st.terrain[i] = sv.tf.charCodeAt(i) - 48;
    for (let k = 0; k < sv.df.length; k += 2) st.terrain[sv.df[k]] = sv.df[k + 1];
    if (sv.tf || sv.df.length) st.dirty = true;
    st.num = sv.num;
    st.players = G.players;
    st.twoP = G.players.length > 1;
    st.frame = sv.fr; st.over = sv.ov; st.overTimer = sv.ot; st.baseAlive = sv.ba;
    st.queue = new Array(sv.q).fill(0);
    st.tanks = sv.tk.map(a => new Tank({
      x: a[0], y: a[1], dir: a[2], isPlayer: !!a[3], player: a[4] >= 0 ? G.players.find(p => p.i === a[4]) : null,
      type: a[5], hp: a[6], bonus: !!a[7], shield: a[8], frozen: a[9], ship: !!a[10], anim: a[11], boost: a[12] ? { ghost: 1 } : {},
    }));
    st.bullets = sv.bu.map(a => ({ x: a[0], y: a[1], dir: a[2], rocket: !!a[3], pierce: !!a[4], alive: true }));
    const FX = { s: () => Sprites.smallExp, b: () => Sprites.bigExp, B: BIG_EXPLOSION };
    st.fx = sv.fx.map(a => ({ x: a[0], y: a[1], frames: FX[a[2]](), per: a[3], tick: a[4] }));
    st.popups = sv.pp;
    st.powerup = sv.pu;
    st.mines = sv.mi.map(a => ({ x: a[0], y: a[1], t: a[2] }));
    st.spawns = sv.sp.map(a => ({ x: a[0], y: a[1], t: a[2] }));
    st.bosses = (sv.bo || []).map(o => new Boss(o));
    st.beams = sv.bm || [];
    st.tracks = (sv.tr || []).map(a => ({ x: a[0], y: a[1], t: a[2] }));
    st.dust = (sv.du || []).map(a => ({ x: a[0], y: a[1], t: a[2] }));
    st.bossIdx = sv.bi === undefined ? undefined : sv.bi;
    st.bossLoop = sv.bl || 0;
    st.bossBanner = sv.bb || 0;
  },

  // ------------------------------------------------------------ panels (HTML, for copy and paste)
  el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'on') for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]);
      else if (k === 'text') e.textContent = attrs.text;
      else e.setAttribute(k, attrs[k]);
    }
    for (const kid of kids) if (kid) e.append(kid);
    return e;
  },

  panel() {
    let p = document.getElementById('netPanel');
    if (!p) {
      p = this.el('div', { id: 'netPanel', role: 'dialog', 'aria-modal': 'true' });
      document.body.append(p);
    }
    return p;
  },

  openPanel(mode) {
    this.panelMode = mode;
    this.panelOpen = true;
    Input.down.clear();
    this.panel().hidden = false;
    this.refreshPanel();
  },

  closePanel() {
    this.panelOpen = false;
    const p = document.getElementById('netPanel');
    if (p) p.hidden = true;
    if (this.panelMode === 'lobby' && !this.inGame && this.role === 'host' && !Object.keys(this.peers).length) this.hangUp();
  },

  copyButton(getText) {
    const b = this.el('button', { type: 'button', text: 'Copy' });
    b.addEventListener('click', () => {
      const text = getText();
      const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); };
      const fallback = () => {
        const ta = b.parentElement.querySelector('textarea[readonly]');
        if (ta) { ta.focus(); ta.select(); }
        b.textContent = 'Press ⌘C / Ctrl+C';
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });
    return b;
  },

  refreshPanel() {
    if (!this.panelOpen) return;
    const p = this.panel();
    p.textContent = '';
    const box = this.el('div', { class: 'netBox' });
    p.append(box);
    if (!this.supported()) {
      box.append(this.el('h2', { text: 'Online play' }),
        this.el('p', { text: "Online play can't start here. Open the downloaded game file (tanb4iki_v" + APP_VERSION + '.html) or the GitHub Pages copy in Chrome, Safari, Firefox or Edge.' }),
        this.el('div', { class: 'netRow' }, this.el('button', { type: 'button', text: 'Close', on: { click: () => this.closePanel() } })));
      return;
    }
    if (this.panelMode === 'lobby' || this.panelMode === 'ingame') this.renderHostPanel(box);
    else if (this.panelMode === 'join') this.renderJoinPanel(box);
    else this.renderClientMenu(box);
  },

  renderHostPanel(box) {
    const lobby = this.panelMode === 'lobby';
    box.append(this.el('h2', { text: lobby ? 'Online game · host' : 'Online players' }));
    box.append(this.el('p', { class: 'hint', text: 'For each friend: create an invite code, send it to them, then paste the reply code they send back. Friends need the same game file (v' + APP_VERSION + ').' }));
    const list = this.el('ol', { class: 'netSlots' });
    this.slots.forEach((kind, i) => {
      const li = this.el('li');
      const head = this.el('div', { class: 'netSlotHead' }, this.el('b', { text: ROMAN[i] + '-player' }));
      if (kind === 'local') {
        head.append(this.el('span', { text: i === 0 ? ' · you, on this computer' : ' · on this computer' }));
        li.append(head);
      } else {
        const peer = this.peers[i];
        const status = !peer ? 'no invite yet' : peer.status === 'connected' ? 'connected ✓' : peer.status === 'lost' ? 'disconnected' : peer.status === 'connecting' ? 'connecting…' : 'waiting for reply';
        head.append(this.el('span', { class: 'netStatus ' + (peer ? peer.status : ''), text: ' · online friend · ' + status }));
        li.append(head);
        if (!peer || peer.status === 'lost' || peer.status === 'invite' || peer.status === 'connecting') {
          if (!peer || peer.status === 'lost') {
            li.append(this.el('button', { type: 'button', text: peer ? 'New invite code' : 'Create invite code', on: { click: async e => {
              e.target.disabled = true; e.target.textContent = 'Creating…';
              try { await this.createInvite(i); } catch (err) { this.peers[i] = { status: 'lost', error: String(err.message || err), pc: { close() {} } }; }
              this.refreshPanel();
            } } }));
          } else {
            const inv = this.el('textarea', { readonly: '', rows: '3', 'aria-label': 'Invite code' });
            inv.value = peer.invite;
            const reply = this.el('textarea', { rows: '3', placeholder: 'Paste the reply code here', 'aria-label': 'Reply code' });
            const err = this.el('p', { class: 'netError' });
            li.append(this.el('label', { text: '1. Send this invite code' }), inv, this.el('div', { class: 'netRow' }, this.copyButton(() => peer.invite)),
              this.el('label', { text: '2. Paste the reply code' }), reply,
              this.el('div', { class: 'netRow' }, this.el('button', { type: 'button', class: 'primary', text: 'Connect', on: { click: async () => {
                err.textContent = '';
                try { await this.acceptReply(i, reply.value); this.refreshPanel(); } catch (e2) { err.textContent = String(e2.message || e2); }
              } } })), err);
          }
        }
        if (peer && peer.error) li.append(this.el('p', { class: 'netError', text: peer.error }));
      }
      if (lobby && i > 0 && i === this.slots.length - 1) {
        li.append(this.el('div', { class: 'netRow' }, this.el('button', { type: 'button', text: 'Remove', on: { click: () => {
          const peer = this.peers[i];
          if (peer) { try { peer.pc.close(); } catch (e) { /* closed */ } delete this.peers[i]; }
          this.slots.pop();
          this.refreshPanel();
        } } })));
      }
      list.append(li);
    });
    box.append(list);
    if (lobby) {
      if (this.slots.length < 4) {
        box.append(this.el('div', { class: 'netRow' },
          this.el('button', { type: 'button', text: '+ Online friend', on: { click: () => { this.slots.push('online'); this.refreshPanel(); } } }),
          this.el('button', { type: 'button', text: '+ Player on this keyboard', on: { click: () => { this.slots.push('local'); this.refreshPanel(); } } })));
      }
      box.append(this.el('div', { class: 'netRow end' },
        this.el('button', { type: 'button', text: 'Cancel', on: { click: () => { this.hangUp(); this.closePanel(); } } }),
        this.el('button', { type: 'button', class: 'primary', text: 'Start game', on: { click: () => this.startGame() } })));
    } else {
      box.append(this.el('div', { class: 'netRow end' }, this.el('button', { type: 'button', class: 'primary', text: 'Back to game', on: { click: () => this.closePanel() } })));
    }
  },

  startGame() {
    this.closePanel();
    Game.newGame(this.slots.length, false, true);
    this.applySlots();
  },

  renderJoinPanel(box) {
    box.append(this.el('h2', { text: 'Online game · join' }));
    const inv = this.el('textarea', { rows: '4', placeholder: "Paste the host's invite code here", 'aria-label': 'Invite code' });
    inv.value = this.inviteText || '';
    box.append(this.el('label', { text: "1. Paste the host's invite code" }), inv);
    const go = this.el('button', { type: 'button', class: 'primary', text: 'Create reply code', on: { click: async () => {
      go.disabled = true; go.textContent = 'Creating…';
      this.inviteText = inv.value;
      this.joinError = '';
      try { this.replyCode = await this.join(inv.value); } catch (e) { this.joinError = String(e.message || e); this.replyCode = ''; }
      this.refreshPanel();
    } } });
    box.append(this.el('div', { class: 'netRow' }, go), this.el('p', { class: 'netError', text: this.joinError || '' }));
    if (this.replyCode) {
      const rep = this.el('textarea', { readonly: '', rows: '3', 'aria-label': 'Reply code' });
      rep.value = this.replyCode;
      box.append(this.el('label', { text: '2. Send this reply code back to the host' }), rep, this.el('div', { class: 'netRow' }, this.copyButton(() => this.replyCode)));
      const text = this.status === 'connected' ? 'Connected as ' + ROMAN[this.slot] + '-player. Waiting for the host…'
        : this.status === 'failed' ? "Couldn't connect. One of the networks blocks direct connections (see README)."
          : 'Waiting for the host to paste your reply code…';
      box.append(this.el('p', { class: 'netStatusLine ' + (this.status || ''), text }));
    }
    box.append(this.el('div', { class: 'netRow end' }, this.el('button', { type: 'button', text: this.status === 'connected' ? 'Close' : 'Cancel', on: { click: () => {
      if (this.status !== 'connected') { this.leave(true); this.replyCode = ''; this.status = ''; }
      this.closePanel();
    } } })));
  },

  openClientMenu() { this.openPanel('client'); },

  renderClientMenu(box) {
    box.append(this.el('h2', { text: 'Online game' }),
      this.el('p', { text: "You're playing as " + ROMAN[this.slot] + '-player. The host controls stages, pausing and saving.' }),
      this.el('div', { class: 'netRow end' },
        this.el('button', { type: 'button', text: 'Leave game', on: { click: () => { this.closePanel(); this.leave(); this.replyCode = ''; this.status = ''; } } }),
        this.el('button', { type: 'button', class: 'primary', text: 'Back to game', on: { click: () => this.closePanel() } })));
  },
};

// forward the host's game sounds to the guests
(() => {
