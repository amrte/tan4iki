<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>tanb4iki_v0.6</title>
  <style>
:root {
  --bg: #000;
  --fg: #9a9a9a;
  --btn: #2a2a2a;
  --btn-on: #555;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  flex-direction: column;
}

#wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}

#wrap:fullscreen { padding: 0; background: #000; }
#wrap:-webkit-full-screen { padding: 0; background: #000; }

#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
}

#help {
  text-align: center;
  padding: 4px 16px 8px;
  font-size: 11px;
}

#help b { color: #ddd; font-weight: normal; }

/* ---------- touch controls ---------- */
#touch { display: none; }

body.touch #help { display: none; }

body.touch #touch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 20px 20px;
  gap: 16px;
}

#dpad {
  position: relative;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #151515;
  border: 2px solid #333;
  touch-action: none;
}

#dpad span {
  position: absolute;
  width: 46px;
  height: 46px;
  background: var(--btn);
  border-radius: 6px;
}
#dpad .u { left: 50px; top: 6px; }
#dpad .d { left: 50px; bottom: 6px; }
#dpad .l { left: 6px; top: 50px; }
#dpad .r { right: 6px; top: 50px; }
#dpad[data-dir="0"] .u, #dpad[data-dir="1"] .r, #dpad[data-dir="2"] .d, #dpad[data-dir="3"] .l { background: var(--btn-on); }

.btns {
  display: flex;
  align-items: center;
  gap: 14px;
}

.btns button {
  font: inherit;
  color: #ddd;
  background: var(--btn);
  border: 2px solid #444;
  touch-action: none;
}

.btns .fire {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  font-size: 22px;
  background: #7a1a10;
  border-color: #a33;
}
.btns .fire.b { width: 58px; height: 58px; font-size: 16px; background: #4a1410; }

.btns .small {
  padding: 6px 10px;
  border-radius: 12px;
  font-size: 11px;
}

.btns button.on { filter: brightness(1.6); }

@media (orientation: landscape) and (max-height: 500px) {
  body.touch { flex-direction: row; }
  body.touch #touch {
    position: fixed;
    inset: auto 0 0 0;
    pointer-events: none;
    padding: 12px;
  }
  body.touch #touch > * { pointer-events: auto; opacity: 0.75; }
}

/* ---------- online panel (copy/paste of connection codes) ---------- */
#netPanel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.72);
  font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace;
  color: #e8e8e8;
}
#netPanel[hidden] { display: none; }
#netPanel .netBox {
  width: min(600px, 100%);
  max-height: 100%;
  overflow: auto;
  background: #101018;
  border: 2px solid #636363;
  padding: 18px 20px;
}
#netPanel h2 { margin: 0 0 8px; font-size: 16px; color: #e45c10; letter-spacing: 0.06em; text-transform: uppercase; }
#netPanel .hint { margin: 0 0 12px; color: #a8a8b8; }
#netPanel label { display: block; margin: 10px 0 4px; color: #f0bc3c; }
#netPanel textarea {
  width: 100%;
  min-width: 0;
  font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
  background: #000;
  color: #e8e8e8;
  border: 1px solid #505060;
  padding: 6px;
  resize: vertical;
  word-break: break-all;
}
#netPanel button {
  font: inherit;
  color: #fff;
  background: #2a2a3a;
  border: 1px solid #636373;
  padding: 6px 12px;
  cursor: pointer;
}
#netPanel button.primary { background: #a02810; border-color: #e45c10; }
#netPanel button:focus-visible, #netPanel textarea:focus-visible { outline: 2px solid #f0bc3c; outline-offset: 1px; }
#netPanel button:disabled { opacity: 0.6; cursor: default; }
#netPanel .netRow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#netPanel .netRow.end { justify-content: flex-end; margin-top: 16px; }
#netPanel .netSlots { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
#netPanel .netSlots li { border: 1px solid #303040; padding: 10px; }
#netPanel .netStatus.connected, #netPanel .netStatusLine.connected { color: #58d854; }
#netPanel .netStatus.lost, #netPanel .netError, #netPanel .netStatusLine.failed { color: #f87858; }
#netPanel .netError:empty { display: none; }

</style>
</head>

// Enemy line-up per stage: counts of [basic, fast, power, armor] (always 20)
function enemyMix(stage) {
  if (stage === 1) return [18, 2, 0, 0];
  const s = ((stage - 1) % LEVELS.length) + 1;
  const loop = Math.floor((stage - 1) / LEVELS.length);
  const armor = Math.min(8, Math.round((s - 1) * 0.3) + loop * 2);
  const power = Math.min(6, 1 + Math.floor(s / 5) + loop);
  const fast = Math.min(6, 2 + (s % 3) + Math.floor(s / 9));
  const basic = Math.max(0, 20 - armor - power - fast);
  return [basic, fast, power, 20 - basic - fast - power];
}

'use strict';
// =====================================================================
//  Graphics: procedural NES-style pixel art, font, sprite caches
// =====================================================================

const COL = {
  bg: '#636363',
  black: '#000000',
  white: '#FFFFFF',
  red: '#D82800',
  orange: '#E45C10',
  gold: '#F0BC3C',
  lgrey: '#ADADAD',
};

// tank palettes (light, mid, dark) as on the NES
const PALS = {
  p1: [null, '#E8F860', '#F8A848', '#708800'],
  p2: [null, '#B8F8D8', '#00A844', '#005800'],
  silver: [null, '#F8F8F8', '#C0C0C0', '#007880'],
  red: [null, '#F8F8F8', '#E04030', '#B00088'],
  green: [null, '#66FFE1', '#00B56E', '#008E06'],
  gold: [null, '#EAFC66', '#FEAC4E', '#778900'],
};

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function paintRows(rows, cmap) {
  const h = rows.length, w = rows[0].length;
  const c = makeCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const col = cmap[rows[j][i]];
      if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); }
    }
  }
  return c;
}

function gridCanvas(grid, pal) {
  const h = grid.length, w = grid[0].length;
  const c = makeCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const v = grid[j][i];
      if (v && pal[v]) { x.fillStyle = pal[v]; x.fillRect(i, j, 1, 1); }
    }
  }
  return c;
}

function newGrid(n) {
  const g = [];
  for (let y = 0; y < n; y++) g.push(new Array(n).fill(0));
  return g;
}

// rotate square grid 90° clockwise
function rotGrid(g) {
  const n = g.length, r = newGrid(n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) r[y][x] = g[n - 1 - x][y];
  return r;
}

// ------------------------------------------------------------------ font
const Font = {
  bits: {},
  cache: {},
  init() {
    for (const ch in FONT_SRC) {
      this.bits[ch] = FONT_SRC[ch].map(r => {
        let v = 0;
        for (let i = 0; i < 5; i++) if (r[i] !== '.') v |= 1 << (4 - i);
        return (v << 1) | v; // bold
      });
    }
  },
  glyph(ch, color) {
    const k = ch + color;
    let c = this.cache[k];
    if (!c) {
      c = makeCanvas(8, 8);
      const x = c.getContext('2d');
      x.fillStyle = color;
      const b = this.bits[ch];
      for (let r = 0; r < 7; r++) for (let i = 0; i < 6; i++) if (b[r] & (1 << (5 - i))) x.fillRect(i, r, 1, 1);
      this.cache[k] = c;
    }
    return c;
  },
  draw(ctx, s, x, y, color) {
    s = String(s).toUpperCase();
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (this.bits[ch]) ctx.drawImage(this.glyph(ch, color), x + i * 8, y);
    }
  },
  drawRight(ctx, s, xRight, y, color) {
    s = String(s);
    this.draw(ctx, s, xRight - s.length * 8, y, color);
  },
  drawCenter(ctx, s, cx, y, color) {
    s = String(s);
    this.draw(ctx, s, Math.round(cx - (s.length * 8 - 2) / 2), y, color);
  },
  // huge letters made of bricks (title / game over)
  big(ctx, s, x, y, scale, fill) {
    s = String(s).toUpperCase();
    ctx.fillStyle = fill;
    for (let i = 0; i < s.length; i++) {
      const b = this.bits[s[i]];
      if (!b) continue;
      const ox = x + i * 8 * scale;
      for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) {
        if (b[r] & (1 << (5 - c))) ctx.fillRect(ox + c * scale, y + r * scale, scale, scale);
      }
    }
  },
  bigWidth(s, scale) { return s.length * 8 * scale - 2 * scale; },
};


// ------------------------------------------------------------------ bitmap helpers
// rows of palette-index characters ('1'..'9', '.' transparent) -> numeric grid
function parseGrid(rows) {
  return rows.map(r => r.split('').map(ch => (ch === '.' ? 0 : +ch)));
}

function rotatedCanvas(rows, dir, pal) {
  let g = parseGrid(rows);
  for (let i = 0; i < dir; i++) g = rotGrid(g);
  return gridCanvas(g, pal);
}

function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// build a framed 16x16 power-up icon from a 12x11 shape mask
function framedIcon(mask) {
  const inside = (x, y) => y >= 0 && y < 11 && x >= 0 && x < 12 && mask[y][x] === 'X';
  const rows = ['................', '.11111111111112.', '1.............13'];
  for (let y = 0; y < 11; y++) {
    let r = '';
    for (let x = 0; x < 12; x++) {
      if (inside(x, y)) r += (inside(x + 1, y) && inside(x, y + 1)) ? '1' : '2';
      else r += inside(x - 1, y - 1) || inside(x - 1, y) || inside(x, y - 1) ? '.' : '3';
    }
    rows.push('1.' + r + '13');
  }
  rows.push('2111111111111123', '.33333333333333.');
  return rows;
}
const EXPLOSION_PAL = [null, '#F8F8F8', '#E04030', '#B00088'];
const POWERUP_PAL = [null, '#F8F8F8', '#C0C0C0', '#007880'];

function genHull(dir) {
  let g = newGrid(16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const px = x + 0.5, py = y + 0.5;
    const w = py < 5 ? (py * 1.6) : 8;
    if (Math.abs(px - 8) <= w && py <= 15.5) {
      const edge = Math.abs(px - 8) > w - 1.2 || py > 14.5;
      g[y][x] = edge ? 1 : 2;
    }
  }
  for (let i = 0; i < dir; i++) g = rotGrid(g);
  return gridCanvas(g, [null, '#E8F0FF', '#2C48F0']);
}

function genBullet(dir, color = '#C6C6C6') {
  return rotatedCanvas(['..1.', '.111', '.111', '.111'], dir, [null, color]);
}

// ------------------------------------------------------------------ sprite registry
const Sprites = {
  cache: new Map(),
  tex: {},
  init() {
    Font.init();
    for (const k in TEX_SRC) this.tex[k] = paintRows(TEX_SRC[k].rows, TEX_SRC[k].colors);
    const g = (rows, pal) => gridCanvas(parseGrid(rows), pal);
    this.eagle = g(EAGLE_GRID, [null, '#808080', '#BB1C0E']);
    this.eagleDead = g(EAGLE_DEAD_GRID, [null, '#808080', '#B76506']);
    this.sparkle = SPARKLE_GRIDS.map(r => g(r, [null, '#F8F8F8']));
    this.shield = SHIELD_GRIDS.map(r => g(r, [null, '#F8F8F8']));
    this.smallExp = EXPLOSION_GRIDS.map(r => g(r, EXPLOSION_PAL));
    this.bigExp = BIG_EXPLOSION_GRIDS.map(r => g(r, EXPLOSION_PAL));
    this.powerups = POWERUP_GRIDS.concat(NEW_POWERUP_MASKS.map(framedIcon)).map(r => g(r, POWERUP_PAL));
    this.mine = [g(MINE_GRID, [null, '#ADADAD', '#505050', '#E04030']), g(MINE_GRID, [null, '#ADADAD', '#505050', '#600000'])];
    this.hull = [0, 1, 2, 3].map(genHull);
    this.bullet = [0, 1, 2, 3].map(d => genBullet(d));
    this.bulletPierce = [0, 1, 2, 3].map(d => genBullet(d, '#58F8F8'));
    this.bulletRocket = [0, 1, 2, 3].map(d => genBullet(d, '#F87830'));
    this.enemyIcon = g(ENEMY_ICON_GRID, [null, '#000000']);
    this.lifeIcon = g(LIFE_ICON_GRID, [null, '#B76506']);
    this.flag = g(FLAG_GRID, [null, '#B76506', '#000000']);
    this.brickPattern = null;
  },
  tank(spec, frame, dir, pal) {
    const k = spec + frame + dir + pal;
    let c = this.cache.get(k);
    if (!c) {
      c = rotatedCanvas(TANK_GRIDS[spec][frame], dir, PALS[pal]);
      this.cache.set(k, c);
    }
    return c;
  },
  // score pop-up ("100" ... "500")
  mini(text) {
    const k = 'mini' + text;
    let c = this.cache.get(k);
    if (!c) {
      c = makeCanvas(text.length * 5 - 1, 7);
      const x = c.getContext('2d');
      x.fillStyle = '#F8F8F8';
      for (let i = 0; i < text.length; i++) {
        const d = POPUP_DIGITS[text[i]];
        if (!d) continue;
        for (let r = 0; r < 7; r++) for (let q = 0; q < 4; q++) if (d[r][q] === '1') x.fillRect(i * 5 + q, r, 1, 1);
      }
      this.cache.set(k, c);
    }
    return c;
  },
  // small tank icon in a player's colour (side panel with 3-4 players)
  playerIcon(pal) {
    const k = 'picon' + pal;
    let c = this.cache.get(k);
    if (!c) { c = gridCanvas(parseGrid(LIFE_ICON_GRID), [null, PALS[pal][2]]); this.cache.set(k, c); }
    return c;
  },
  bricks(ctx) {
    if (!this.brickPattern) this.brickPattern = ctx.createPattern(this.tex.brick, 'repeat');
    return this.brickPattern;
  },
};

const Config = {
  values: {},
  defs: {},

  init() {
    for (const d of SETTINGS_DEF) if (d.key) this.defs[d.key] = d;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('tank1990_settings') || '{}') || {}; } catch (e) { saved = {}; }
    this.reset(false);
    for (const k in saved) if (this.defs[k] && this.defs[k].values.includes(saved[k])) this.values[k] = saved[k];
    this.apply();
  },

  get(k) { return this.values[k]; },
  on(k) { return this.values[k] === 'ON'; },

  // step a setting forward/back through its value list
  step(k, dir) {
    const d = this.defs[k], i = d.values.indexOf(this.values[k]);
    const n = d.values.length;
    this.values[k] = d.values[(i + dir + n) % n];
    this.save();
    this.apply();
  },

  reset(save = true) {
    for (const k in this.defs) this.values[k] = this.defs[k].def;
    if (save) { this.save(); this.apply(); }
  },

  // power-up rules: can this kind of tank pick it up?
  canCollect(i, isPlayer) {
    const v = this.values['pu' + i];
    return v === 'ANYONE' || (isPlayer && v === 'PLAYER');
  },
  setPowerups(fn) {
    POWERUPS.forEach((pu, i) => { this.values['pu' + i] = fn(pu); });
    this.save();
  },

  isDefault(k) { return this.values[k] === this.defs[k].def; },

  format(k) {
    const d = this.defs[k], v = this.values[k];
    return d.fmt ? d.fmt(v) : String(v);
  },

  save() {
    try { localStorage.setItem('tank1990_settings', JSON.stringify(this.values)); } catch (e) { /* storage unavailable */ }
  },

  // push settings that live outside the game rules (palettes, audio)
  apply() {
    for (const name in TANK_COLORS) PALS['c_' + name] = [null].concat(TANK_COLORS[name]);
    if (typeof Sound !== 'undefined') Sound.applyVolume();
    if (typeof Game !== 'undefined' && Game.onResize) Game.onResize();
    if (typeof Input !== 'undefined' && Input.updateHelp) Input.updateHelp();
  },

  // ---- helpers used by the game rules
  playerPal(i) { return 'c_' + this.values['p' + (i + 1) + 'Color']; },
  startLives() { const v = this.values.lives; return v === 'INF' ? 2 : v - 1; },
  infiniteLives() { return this.values.lives === 'INF'; },
  frames(k) { return Math.round(this.values[k] * 60); },
  scale(k) { return this.values[k] / 100; },
  enemy(type) {
    const base = ENEMY[type];
    return {
      speed: base.speed * this.scale('e' + type + 'Speed'),
      bullet: base.bullet * this.scale('e' + type + 'Shell'),
      hp: this.values['e' + type + 'Hits'],
      pts: base.pts,
    };
  },
};

  <script>
'use strict';
// =====================================================================
//  Sound: NES-style synth on Web Audio.
//  Pulse channels are band-limited square waves, the noise channel is
//  1-bit sample-and-hold noise clocked at different rates (like the
//  2A03's noise period register). Timings and pitches follow the
//  original Battle City / Tank 1990 effects.
// =====================================================================

const Sound = {
  ctx: null,
  master: null,
  muted: false,
  noiseCache: {},
  waves: {},
  engine: null,
  engineState: 0,
  engineHoldUntil: 0,

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.applyVolume();
      this.master.connect(this.ctx.destination);
      this.waves.p50 = this.pulseWave(0.5);
      this.waves.p25 = this.pulseWave(0.25);
      this.waves.p12 = this.pulseWave(0.125);
      this.initEngine();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },

  toggleMute() {
    this.muted = !this.muted;
    this.applyVolume();
    return this.muted;
  },

  applyVolume() {
    if (!this.master) return;
    const vol = typeof Config !== 'undefined' && Config.values.volume !== undefined ? Config.values.volume / 100 : 1;
    this.master.gain.value = this.muted ? 0 : 0.3 * vol;
    if (this.engine) this.applyEngine();
  },

  midi(n) { return 440 * Math.pow(2, (n - 69) / 12); },

  pulseWave(duty) {
    const n = 64, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return this.ctx.createPeriodicWave(re, im);
  },

  // 1-bit noise held for sampleRate/rate samples (NES noise channel look-alike)
  noiseBuffer(rate) {
    const key = Math.round(rate);
    if (this.noiseCache[key]) return this.noiseCache[key];
    const sr = this.ctx.sampleRate, len = sr;
    const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const hold = Math.max(1, sr / rate);
    let reg = 1, v = 1, acc = 0;
    for (let i = 0; i < len; i++) {
      acc += 1;
      if (acc >= hold) {
        acc -= hold;
        const bit = (reg ^ (reg >> 1)) & 1; // 15-bit LFSR, as on the 2A03
        reg = (reg >> 1) | (bit << 14);
        v = (reg & 1) ? 1 : -1;
      }
      d[i] = v;
    }
    this.noiseCache[key] = buf;
    return buf;
  },

  // pulse note with NES-like volume decay
  note(midi, start, dur, opts = {}) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    const vol = opts.vol ?? 0.2, wave = opts.wave || 'p50';
    if (wave === 'tri') o.type = 'triangle'; else o.setPeriodicWave(this.waves[wave]);
    o.frequency.setValueAtTime(typeof midi === 'number' && midi < 200 ? this.midi(midi) : midi, start);
    if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(opts.slideTo, start + dur);
    const end = start + dur;
    g.gain.setValueAtTime(vol, start);
    if (opts.flat) g.gain.setValueAtTime(vol, end - 0.008);
    else g.gain.exponentialRampToValueAtTime(Math.max(0.0005, vol * (opts.decayTo ?? 0.2)), end - 0.004);
    g.gain.linearRampToValueAtTime(0, end);
    o.connect(g); g.connect(this.master);
    o.start(start); o.stop(end + 0.01);
  },

  // burst of noise; env: [[time, gain], ...] relative to start
  noise(rate, start, env, rateEnd) {
    const c = this.ctx, s = c.createBufferSource(), g = c.createGain();
    s.buffer = this.noiseBuffer(rate);
    s.loop = true;
    if (rateEnd) {
      const dur = env[env.length - 1][0];
      s.playbackRate.setValueAtTime(1, start);
      s.playbackRate.exponentialRampToValueAtTime(rateEnd / rate, start + dur);
    }
    g.gain.setValueAtTime(env[0][1], start);
    for (let i = 1; i < env.length; i++) g.gain.linearRampToValueAtTime(env[i][1], start + env[i][0]);
    s.connect(g); g.connect(this.master);
    const end = start + env[env.length - 1][0];
    s.start(start, Math.random() * 0.5);
    s.stop(end + 0.01);
  },

  seq(notes, step, t0, opts) {
    let t = t0;
    for (const n of notes) {
      if (n) this.note(n, t, step, opts);
      t += step;
    }
    return t;
  },

  play(name) {
    if (!this.ctx || this.muted || this.master.gain.value === 0) return;
    const t = this.ctx.currentTime + 0.005;
    switch (name) {
      case 'start': this.stageStart(t); break;
      case 'gameover': this.gameOver(t); break;

      case 'shot': // short flat low noise thump
        this.noise(6800, t, [[0, 0.5], [0.085, 0.45], [0.1, 0]]);
        break;
      case 'brick': // deep crunch
        this.noise(1500, t, [[0, 0.55], [0.06, 0.45], [0.075, 0]]);
        break;
      case 'steel': // shell bounces off steel / the field edge: C6 -> C7 ting
        this.note(84, t, 0.04, { vol: 0.09, flat: true });
        this.note(96, t + 0.04, 0.045, { vol: 0.09, decayTo: 0.4 });
        break;
      case 'armor': // armored enemy absorbs a hit
        this.note(84, t, 0.035, { vol: 0.1, flat: true, wave: 'p25' });
        this.note(91, t + 0.035, 0.05, { vol: 0.1, decayTo: 0.3, wave: 'p25' });
        this.noise(9000, t, [[0, 0.15], [0.05, 0]]);
        break;
      case 'explode': // enemy tank
        this.noise(1150, t, [[0, 0.55], [0.26, 0.45], [0.3, 0]]);
        break;
      case 'playerDie':
      case 'baseDie': // big explosion
        this.noise(3400, t, [[0, 0.6], [0.12, 0.6], [0.45, 0.35], [0.52, 0]], 1800);
        break;
      case 'tick': // score tally click
        this.noise(13000, t, [[0, 0.5], [0.02, 0.15], [0.04, 0]]);
        break;
      case 'pause':
        this.seq([72, 74, 76, 84, 86, 88], 0.064, t, { vol: 0.16, decayTo: 0.55 });
        this.note(79, t + 0.384, 0.2, { vol: 0.16, decayTo: 0.12 });
        break;
      case 'puAppear': {
        // quick warbling run, then A4 B4 C5
        const run = [64, 63, 63, 68, 67, 68, 83, 80, 69, 71, 66, 67, 67, 68];
        run.forEach((n, i) => this.note(n, t + i * 0.016, 0.016, { vol: 0.12, flat: true, wave: 'p25' }));
        this.seq([69, 71, 72], 0.064, t + 0.27, { vol: 0.16, decayTo: 0.15 });
        break;
      }
      case 'pickup':
        this.seq([67, 72, 76, 79, 66, 71, 75, 78, 72, 76, 79, 84, 88], 0.05, t, { vol: 0.15, decayTo: 0.45 });
        break;
      case 'enemyPickup':
        this.seq([79, 75, 72, 67, 63], 0.05, t, { vol: 0.14, decayTo: 0.45, wave: 'p25' });
        break;
      case 'life':
        this.seq([76, 79, 84, 88, 0, 76, 79, 84, 88, 91], 0.055, t, { vol: 0.15, decayTo: 0.5 });
        break;
      case 'bonus':
        this.seq([72, 76, 79, 84, 79, 84, 88], 0.07, t, { vol: 0.15, decayTo: 0.45 });
        break;
      case 'skid': // sliding on ice
        this.noise(16000, t, [[0, 0.1], [0.2, 0.06], [0.24, 0]]);
        break;
      case 'bossWarn': // siren
        for (let i = 0; i < 3; i++) {
          this.note(81, t + i * 0.24, 0.12, { vol: 0.15, flat: true, wave: 'p25' });
          this.note(76, t + i * 0.24 + 0.12, 0.12, { vol: 0.15, flat: true, wave: 'p25' });
        }
        break;
      case 'charge':
        this.noise(700, t, [[0, 0.35], [0.12, 0]]);
        break;
      case 'laser':
        this.note(2200, t, 0.35, { vol: 0.12, slideTo: 300, flat: true, wave: 'p12' });
        this.noise(12000, t, [[0, 0.2], [0.35, 0]]);
        break;
      case 'burrow':
        this.noise(500, t, [[0, 0.45], [0.4, 0.3], [0.55, 0]], 300);
        break;
      case 'teleport':
        this.seq([72, 79, 84, 91, 96], 0.035, t, { vol: 0.12, decayTo: 0.4, wave: 'p25' });
        break;
      case 'bossDie':
        this.noise(2000, t, [[0, 0.7], [0.5, 0.6], [1.6, 0]], 120);
        this.seq([72, 67, 64, 60, 55, 48], 0.12, t + 0.2, { vol: 0.15, decayTo: 0.5 });
        break;
      case 'select':
        this.noise(13000, t, [[0, 0.35], [0.03, 0]]);
        break;
      case 'build':
        this.noise(4000, t, [[0, 0.35], [0.04, 0]]);
        break;
    }
  },

  // Stage start fanfare: triplet runs climbing through Cm, Eb, F, Ab-Bb, ending on C major.
  stageStart(t0) {
    const G = 0.4, S = G / 3;
    const lead = [[72, 74, 75], [72, 74, 75], [75, 77, 79], [75, 77, 79], [77, 79, 81], [77, 79, 81], [80, 82, 84], [80, 82, 84]];
    const chords = [[55, 48], [55, 48], [58, 51], [58, 51], [60, 53], [60, 53], [63, 56], [65, 58]];
    const fullHarmony = [false, true, false, true, false, true, true, true];
    for (let g = 0; g < 8; g++) {
      for (let k = 0; k < 3; k++) {
        const t = t0 + g * G + k * S;
        this.note(lead[g][k], t, S * 0.95, { vol: 0.22, decayTo: 0.25 });
        if (k === 0 || fullHarmony[g]) {
          this.note(chords[g][0], t, S * 0.95, { vol: 0.1, decayTo: 0.2 });
          this.note(chords[g][1], t, S * 0.95, { vol: 0.3, wave: 'tri', flat: true });
        }
      }
    }
    const end = t0 + 8 * G;
    this.note(84, end, 0.16, { vol: 0.17, decayTo: 0.15 });
    this.note(64, end, 0.16, { vol: 0.1, decayTo: 0.2 });
    this.note(55, end, 0.16, { vol: 0.3, wave: 'tri', flat: true });
    [0.4, 0.54, 0.67, 0.8].forEach((dt, i) => {
      const len = i === 3 ? 0.16 : 0.12;
      this.note(84, end + dt, len, { vol: 0.17, decayTo: 0.15 });
      this.note(64, end + dt, len, { vol: 0.1, decayTo: 0.2 });
      this.note(55, end + dt, len, { vol: 0.3, wave: 'tri', flat: true });
    });
    // the engine stays quiet while the fanfare plays, as in the original
    this.engineHoldUntil = t0 + 4.3;
    this.applyEngine();
  },

  gameOver(t0) {
    const stab = (t, top, len, decay) => {
      this.note(top, t, len, { vol: 0.15, decayTo: decay });
      this.note(67, t, len, { vol: 0.1, decayTo: decay });
      this.note(63, t, len, { vol: 0.15, wave: 'tri', decayTo: 0.5 });
    };
    stab(t0 + 0.04, 72, 0.1, 0.4);
    stab(t0 + 0.14, 70, 0.12, 0.4);
    stab(t0 + 0.26, 72, 0.2, 0.3);
    const run = [[0.64, 63, 79, 0.14], [0.78, 62, 77, 0.12], [0.9, 61, 76, 0.05], [0.95, 59, 75, 0.13]];
    for (const [dt, lo, hi, len] of run) {
      this.note(lo, t0 + dt, len, { vol: 0.2, wave: 'p25', decayTo: 0.4 });
      this.note(hi, t0 + dt, len, { vol: 0.08, decayTo: 0.4 });
    }
    [1.08, 1.2, 1.33, 1.47].forEach((dt, i) => {
      const len = i === 3 ? 0.2 : 0.12;
      this.note(60, t0 + dt, len, { vol: 0.22, wave: 'p25', decayTo: i === 3 ? 0.05 : 0.35 });
      this.note(72, t0 + dt, len, { vol: 0.06, decayTo: 0.3 });
      this.note(54, t0 + dt, len, { vol: 0.2, wave: 'tri', flat: true });
    });
  },

  // ---------------------------------------------------------------- engine
  // Two-tone pulse rumble: a slow low throb when idle, a faster higher buzz when moving.
  initEngine() {
    const c = this.ctx;
    const o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    o.setPeriodicWave(this.waves.p25);
    o.frequency.value = 55;
    lfo.type = 'square';
    lfo.frequency.value = 15;
    lg.gain.value = 6;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.value = 0;
    o.connect(g); g.connect(this.master);
    o.start(); lfo.start();
    this.engine = { o, g, lfo, lg };
  },

  // 0 = off, 1 = idle, 2 = moving
  setEngine(state) {
    if (state === this.engineState) return;
    this.engineState = state;
    this.applyEngine();
  },

  applyEngine() {
    if (!this.engine) return;
    const t = this.ctx.currentTime, e = this.engine;
    const state = typeof Config !== 'undefined' && Config.values.engineSound === 'OFF' ? 0 : this.engineState;
    e.g.gain.cancelScheduledValues(t);
    if (state === 0) { e.g.gain.setTargetAtTime(0, t, 0.01); return; }
    const vol = state === 1 ? 0.06 : 0.07;
    const from = Math.max(t, this.engineHoldUntil);
    if (from > t) e.g.gain.setTargetAtTime(0, t, 0.01);
    e.g.gain.setTargetAtTime(vol, from, 0.01);
    e.o.frequency.setTargetAtTime(state === 2 ? 98 : 49, t, 0.01);
    e.lg.gain.setTargetAtTime(state === 2 ? 10 : 7, t, 0.01);
    e.lfo.frequency.setTargetAtTime(state === 2 ? 30 : 15, t, 0.01);
  },
};

    1: ['ArrowRight', 'KeyD', 'TRight'],

const Keymap = {
  players: [null, null, null, null],
  pad: null,
  load() {

    const pm = JSON.parse(JSON.stringify(this.padMap()));

    this.save();

// short names for the key setup screen (the NES font has capitals, digits and a few symbols)
function keyLabel(code) {

  heldDir() {

        if (this.down.has(code) && this.stamp[code] > bestStamp) { best = d; bestStamp = this.stamp[code]; }
      }

  },

    const root = document.getElementById('touch');
    if (!root) return;
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (coarse || 'ontouchstart' in window) document.body.classList.add('touch');

      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
    }
  },

  { speed: 0.5, bullet: 2.5, hp: 1, pts: 100 },
  { speed: 1.25, bullet: 2.5, hp: 1, pts: 200 },
  { speed: 0.75, bullet: 4.5, hp: 1, pts: 300 },

  HELMET: 0, CLOCK: 1, SHOVEL: 2, STAR: 3, GRENADE: 4, TANK: 5, GUN: 6, SHIP: 7,
  // additions that were not in the original game
  TURBO: 8, RAPID: 9, SPREAD: 10, PIERCE: 11, ROCKET: 12, MINES: 13, GHOST: 14, COIN: 15,
};

const TIMED_BOOSTS = { [PU.TURBO]: 'turbo', [PU.RAPID]: 'rapid', [PU.SPREAD]: 'spread', [PU.PIERCE]: 'pierce', [PU.ROCKET]: 'rocket', [PU.GHOST]: 'ghost' };

function setFieldSize(cols, rows) {
  COLS = cols; ROWS = rows;
  FW = cols * 16; FH = rows * 16;

  const at = i => Math.round(i * (cols - 1) / (n - 1)) * 16;
  ENEMY_SPAWN_X = [at(mid)];
  for (let k = 1; k <= mid; k++) ENEMY_SPAWN_X.push(at(mid + k), at(mid - k));
}

// Fit a 26x26-block stage into the current field: the original sits at the bottom centre
// (so the eagle lines up) and is mirrored outwards to fill any extra width and height.
function expandBlocks(blocks) {
  const TW = COLS * 2, TH = ROWS * 2;
  if (TW === 26 && TH === 26) return blocks;
  const offX = 2 * Math.floor((COLS - 13) / 2), offY = TH - 26;
  const mirror = (i, n) => { const p = 2 * n, m = ((i % p) + p) % p; return m < n ? m : p - 1 - m; };
  const out = [];
  for (let y = 0; y < TH; y++) {
    let row = '';
    const sy = mirror(y - offY, 26);
    for (let x = 0; x < TW; x++) row += blocks[sy][mirror(x - offX, 26)];
    out.push(row);
  }
  return out;
}
const SPARKLE_TIME = 60;
const BIG_EXPLOSION = () => [Sprites.smallExp[0], Sprites.smallExp[1], Sprites.smallExp[2], Sprites.bigExp[0], Sprites.bigExp[1]];

function rnd(n) { return Math.floor(Math.random() * n); }
function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && bx < ax + aw && ay < by + bh && by < ay + ah; }

// 13x13 tile map or 26x26 block map -> 26 strings of block chars
function mapToBlocks(map) {
  if (map.length === 26) return map.slice();
  const out = new Array(26).fill('');
  for (let ty = 0; ty < 13; ty++) {
    for (let tx = 0; tx < 13; tx++) {
      const p = TILE_PAT[map[ty][tx]] || TILE_PAT['.'];
      out[ty * 2] += p[0];
      out[ty * 2 + 1] += p[1];
    }
  }
  return out;
}

// 4th, 11th, 18th ... enemy carries a power-up
const isBonusSlot = i => i % 7 === 3;

function buildQueue(stageNum) {
  const mix = enemyMix(stageNum);
  const list = [];
  mix.forEach((n, type) => { for (let i = 0; i < n; i++) list.push(type); });
  // deterministic shuffle per stage, but keep the weakest tanks mostly up front
  const r = seeded(stageNum * 7919 + 13);
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.max(0, i - 1 - Math.floor(r() * 6));
    [list[i], list[j]] = [list[j], list[i]];
  }
  // stretch or shrink the 20-tank line-up to the configured count
  const count = Config.get('enemyCount'), bonus = Config.on('bonusTanks');
  const out = [];
  for (let i = 0; i < count; i++) out.push({ type: list[Math.floor(i * list.length / count)], bonus: bonus && isBonusSlot(i) });
  return out;
}

// extra lives for crossing 20,000 points (once, or every 20,000)
function checkExtraLife(p) {
  const mode = Config.get('extraLife');
  if (mode === 'OFF') return false;
  if (mode === 'ONCE') {
    if (p.extraGiven || p.score < 20000) return false;
    p.extraGiven = true;
    p.lives++;
    return true;
  }
  const n = Math.floor(p.score / 20000), had = p.extraCount || 0;
  if (n <= had) return false;
  p.lives += n - had;
  p.extraCount = n;
  return true;
}

class Tank {
  constructor(o) {
    this.x = 0; this.y = 0; this.dir = 0; this.acc = 0; this.animTick = 0; this.anim = 0;
    this.shield = 0; this.frozen = 0; this.bullets = 0; this.cool = 0; this.slide = 0;
    this.moving = false; this.alive = true; this.ship = false; this.cutter = false; this.power = false;
    this.blocked = 0; this.isPlayer = false; this.player = null; this.type = 0; this.hp = 1; this.bonus = false;
    this.speed = 0.75; this.bulletSpeed = 2.5; this.maxBullets = 1;
    this.boost = {};   // active timed power-ups: name -> frames left
    this.mines = 0;    // mines carried by an enemy tank
    Object.assign(this, o);
  }
  applyLevel() {
    const p = this.player, lv = p.level;
    this.speed = 0.75 * Config.scale('pSpeed');
    this.bulletSpeed = (lv >= 1 ? 4.5 : 2.5) * Config.scale('pShell');
    this.maxBullets = lv >= 2 ? 2 : 1;
    this.power = lv >= 3;
    this.cutter = p.cutter;
    this.ship = p.ship;
  }
}

class Stage {
  constructor(num, map, players, opts = {}) {
    this.num = num;
    this.players = players;
    this.twoP = players.length > 1;
    this.extraPlayers = Math.max(0, players.length - 1);
    this.terrain = new Uint8Array(GW * GH);
    const classic = COLS === 13 && ROWS === 13;
    this.load(expandBlocks(mapToBlocks(map)), !opts.custom || !classic);
    this.tanks = [];
    this.bullets = [];
    this.fx = [];
    this.popups = [];
    this.spawns = [];
    this.powerup = null;
    this.mines = [];
    this.bosses = []; this.beams = []; this.tracks = []; this.dust = [];
    this.lastBrickSound = -1;
    this.queue = buildQueue(num);
    this.total = this.queue.length;
    this.killed = 0;
    this.spawnTimer = 0;
    this.spawnPos = 0;
    this.spawnInterval = Math.round(Math.max(70, 190 - ((num - 1) % 35) * 4 - (this.twoP ? 20 : 0)) / Config.scale('spawnRate'));
    this.maxEnemies = Config.get('maxOnScreen') + [0, 2, 3, 4][this.extraPlayers];
    this.freezeE = 0;
    this.freezeP = 0;
    this.shovel = 0;
    this.baseAlive = true;
    this.over = false;
    this.overTimer = 0;
    this.clearTimer = 0;
    this.result = null;
    this.frame = 0;
    this.dirty = true;
    for (const p of players) {
      p.kills = [0, 0, 0, 0];
      p.tank = null;
      if (!p.out && !opts.snapshot) this.spawnPlayer(p, 0);
      // a shovel charge bought in the shop fortifies the eagle from the start
      if (p.shopShovel) {
        p.shopShovel = false;
        this.shovel = Config.frames('shovelTime');
        this.setBaseWalls(T_STEEL);
      }
    }
    if (opts.boss) this.initBoss(opts.boss);
    if (opts.snapshot) this.restore(opts.snapshot);
  }

  // ------------------------------------------------------------ save / load
  // Everything needed to resume this stage later (shells in flight and effects are dropped).
  snapshot() {
    const tankKeys = ['x', 'y', 'dir', 'isPlayer', 'type', 'hp', 'bonus', 'shield', 'frozen', 'ship', 'cutter', 'power',
      'speed', 'bulletSpeed', 'maxBullets', 'boost', 'mines'];
    return {
      cols: COLS, rows: ROWS,
      terrain: Array.from(this.terrain).join(''),
      queue: this.spawns.filter(s => s.enemy).map(s => s.enemy).concat(this.queue),
      total: this.total, killed: this.killed, spawnTimer: this.spawnTimer, spawnPos: this.spawnPos,
      spawnInterval: this.spawnInterval, maxEnemies: this.maxEnemies,
      freezeE: this.freezeE, freezeP: this.freezeP, shovel: this.shovel, baseAlive: this.baseAlive, frame: this.frame,
      powerup: this.powerup,
      mines: this.mines.map(m => ({ x: m.x, y: m.y, byPlayer: m.byPlayer, t: m.t, pi: m.owner && m.owner.player ? m.owner.player.i : -1 })),
      tanks: this.tanks.filter(t => t.alive).map(t => {
        const o = {};
        for (const k of tankKeys) o[k] = t[k];
        o.pi = t.player ? t.player.i : -1;
        return o;
      }),
      kills: this.players.map(p => p.kills.slice()),
      boss: this.bossIdx === undefined ? null : {
        idx: this.bossIdx, loop: this.bossLoop, dropAt: this.bossDropAt, defeated: !!this.bossDefeated,
        bosses: this.bosses.map(b => Object.assign({}, b, { bullets: 0 })),
      },
    };
  }

  restore(sn) {
    for (let i = 0; i < this.terrain.length; i++) this.terrain[i] = sn.terrain.charCodeAt(i) - 48;
    this.dirty = true;
    for (const k of ['queue', 'total', 'killed', 'spawnTimer', 'spawnPos', 'spawnInterval', 'maxEnemies', 'freezeE', 'freezeP', 'shovel', 'baseAlive', 'frame', 'powerup']) this[k] = sn[k];
    this.spawns = [];
    for (const p of this.players) { p.tank = null; p.kills = sn.kills[p.i] || [0, 0, 0, 0]; }
    this.tanks = sn.tanks.map(o => {
      const t = new Tank(Object.assign({}, o, { boost: Object.assign({}, o.boost) }));
      delete t.pi;
      if (o.pi >= 0) { t.player = this.players[o.pi]; t.player.tank = t; }
      return t;
    });
    // players who were waiting to respawn come back at their spawn point
    for (const p of this.players) if (!p.out && !p.tank) this.spawnPlayer(p, 0);
    this.mines = sn.mines.map(m => Object.assign({}, m, { owner: m.byPlayer && this.players[m.pi] ? { isPlayer: true, player: this.players[m.pi] } : null }));
    if (sn.boss) {
      this.bossIdx = sn.boss.idx;
      this.bossLoop = sn.boss.loop;
      this.bossDropAt = sn.boss.dropAt;
      this.bossDefeated = sn.boss.defeated;
      this.bossBanner = 0;
      this.bosses = sn.boss.bosses.map(o => new Boss(o));
    }
  }

  // ------------------------------------------------------------ terrain
  load(blocks, forceBase) {
    for (let by = 0; by < ROWS * 2; by++) {
      for (let bx = 0; bx < COLS * 2; bx++) {
        this.setBlock(bx, by, BLOCK_TYPE[blocks[by][bx]] || T_EMPTY);
      }
    }
    // keep spawn points free of solid terrain
    const clearSolid = (bx, by) => {
      for (let y = by; y < by + 2; y++) for (let x = bx; x < bx + 2; x++) {
        const t = this.get(x * 2, y * 2);
        if (t === T_BRICK || t === T_STEEL || t === T_WATER) this.setBlock(x, y, T_EMPTY);
      }
    };
    ENEMY_SPAWN_X.forEach(x => clearSolid(x / 8, 0));
    PLAYER_SPAWN.forEach(([x, y]) => clearSolid(x / 8, y / 8));
    // the eagle and its fortress
    for (let y = BASE_Y / 8; y < BASE_Y / 8 + 2; y++) for (let x = BASE_X / 8; x < BASE_X / 8 + 2; x++) this.setBlock(x, y, T_EMPTY);
    if (forceBase) this.setBaseWalls(T_BRICK);
  }
  get(cx, cy) {
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return -1;
    return this.terrain[cy * GW + cx];
  }
  set(cx, cy, t) {
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return;
    this.terrain[cy * GW + cx] = t;
    // the online host sends terrain changes to guests
    if (Net.role === 'host') (this.netDiff || (this.netDiff = [])).push(cy * GW + cx, t);
    this.dirty = true;
  }
  setBlock(bx, by, t) {
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) this.set(bx * 2 + x, by * 2 + y, t);
  }
  clearGroup(cx, cy, type) {
    const bx = cx & ~1, by = cy & ~1;
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) if (this.get(bx + x, by + y) === type) this.set(bx + x, by + y, T_EMPTY);
  }
  setBaseWalls(t) {
    for (const [bx, by] of BASE_WALL) this.setBlock(bx, by, t);
  }
  onIce(t) {
    return this.get((t.x + 8) >> 2, (t.y + 8) >> 2) === T_ICE;
  }

  // ------------------------------------------------------------ spawning
  spawnPlayer(p, delay) {
    const [x, y] = PLAYER_SPAWN[p.i];
    this.spawns.push({ x, y, t: SPARKLE_TIME + delay, player: p });
  }

  updateSpawning() {
    if (this.queue.length === 0) return;
    if (this.spawnTimer > 0) { this.spawnTimer--; return; }
    const onField = this.tanks.filter(t => !t.isPlayer).length + this.spawns.filter(s => s.enemy).length;
    if (onField >= this.maxEnemies) return;
    // pick the next entry point that no boss is sitting on
    let x = -1;
    for (let k = 0; k < ENEMY_SPAWN_X.length && x < 0; k++) {
      const cand = ENEMY_SPAWN_X[this.spawnPos++ % ENEMY_SPAWN_X.length];
      if (!this.bossBlocksSpawn(cand)) x = cand;
    }
    if (x < 0) return;
    const item = this.queue.shift();
    this.spawns.push({ x, y: 0, t: SPARKLE_TIME, enemy: item });
    if (item.bonus) this.powerup = null;
    this.spawnTimer = this.spawnInterval;
  }

  updateSpawns() {
    for (const s of this.spawns) {
      s.t--;
      if (s.t > 0) continue;
      if (s.enemy) {
        if (this.tanks.some(t => overlap(t.x, t.y, 16, 16, s.x, s.y, 16, 16)) || this.bossBlocksTank({ x: -99, y: -99 }, s.x, s.y)) { s.t = 1; continue; }
        const st = Config.enemy(s.enemy.type);
        this.tanks.push(new Tank({
          x: s.x, y: s.y, dir: 2, type: s.enemy.type, hp: st.hp, bonus: s.enemy.bonus,
          speed: st.speed, bulletSpeed: st.bullet, maxBullets: 1,
        }));
      } else {
        const p = s.player;
        const t = new Tank({ x: s.x, y: s.y, dir: 0, isPlayer: true, player: p, shield: Config.frames('spawnShield') });
        t.applyLevel();
        p.tank = t;
        // items bought in the shop take effect on the first spawn of the stage
        if (p.kit) {
          if (p.kit.helmet) t.shield = Math.max(t.shield, Config.frames('helmetTime'));
          for (const k of ['turbo', 'rapid', 'rocket', 'pierce', 'spread', 'ghost']) if (p.kit[k]) t.boost[k] = Config.frames('newTime');
          p.kit = null;
        }
        this.tanks.push(t);
      }
      s.done = true;
    }
    this.spawns = this.spawns.filter(s => !s.done);
  }

  // ------------------------------------------------------------ main update
  update() {
    this.frame++;
    if (this.freezeE > 0) this.freezeE--;
    if (this.freezeP > 0) this.freezeP--;
    this.updateShovel();
    if (!this.over) this.updateSpawning();
    this.updateSpawns();
    for (const t of this.tanks) {
      if (!t.alive) continue;
      for (const k in t.boost) if (--t.boost[k] <= 0) delete t.boost[k];
      if (t.isPlayer) this.updatePlayer(t); else this.updateEnemy(t);
    }
    this.updateBosses();
    this.updateBullets();
    this.updateMines();
    this.tanks = this.tanks.filter(t => t.alive);
    this.checkPickups();
    if (this.powerup) this.powerup.t++;
    for (const f of this.fx) f.tick++;
    this.fx = this.fx.filter(f => f.tick < f.frames.length * f.per); // negative tick = delayed
    for (const p of this.popups) p.t++;
    this.popups = this.popups.filter(p => p.t < p.delay + 48);

    // engine hum
    const pt = this.tanks.filter(t => t.isPlayer);
    Sound.setEngine(pt.length === 0 ? 0 : (pt.some(t => t.moving || t.slide > 0) ? 2 : 1));

    // stage end
    if (this.over) {
      this.overTimer++;
      if (this.overTimer >= 320) this.result = 'gameover';
    } else if (this.queue.length === 0 && !this.spawns.some(s => s.enemy) && !this.tanks.some(t => !t.isPlayer) && !this.bossAlive()) {
      this.clearTimer++;
      if (this.clearTimer >= 190) this.result = 'clear';
    }
  }

  updateShovel() {
    if (this.shovel <= 0) return;
    this.shovel--;
    if (this.shovel === 0) this.setBaseWalls(T_BRICK);
    else if (this.shovel <= 240) {
      const ph = this.shovel % 32;
      if (ph === 0) this.setBaseWalls(T_STEEL);
      else if (ph === 16) this.setBaseWalls(T_BRICK);
    }
  }

  // ------------------------------------------------------------ tanks
  updatePlayer(t) {
    const p = t.player;
    if (t.shield > 0) t.shield--;
    if (t.cool > 0) t.cool--;
    if (t.frozen > 0) { t.frozen--; t.moving = false; return; }
    if (this.over || this.freezeP > 0) { t.moving = false; t.slide = 0; return; }
    const inp = Input.player(p.i);
    if (inp.dir >= 0) {
      this.turn(t, inp.dir);
      this.move(t, t.dir);
      t.moving = true;
      t.slide = 0;
    } else {
      if (t.moving && this.onIce(t)) { t.slide = 28; Sound.play('skid'); }
      t.moving = false;
      if (t.slide > 0) {
        t.slide--;
        if (!this.move(t, t.dir)) t.slide = 0;
      }
    }
    // B drops a mine while you carry some; otherwise it fires like A
    const hasMines = p.mines > 0;
    if (hasMines && inp.altPressed) { this.dropMine(t); p.mines--; }
    const firePressed = inp.firePressed || (!hasMines && inp.altPressed);
    const fireHeld = inp.fire || (!hasMines && inp.alt);
    if (firePressed || (fireHeld && t.cool === 0)) {
      if (this.fire(t)) t.cool = t.boost.rapid ? 5 : 14;
    }
  }

  updateEnemy(t) {
    if (t.shield > 0) t.shield--;
    if (this.freezeE > 0) return;
    if (t.cool > 0) t.cool--;
    const ok = this.move(t, t.dir);
    if (!ok) {
      t.blocked++;
      if (t.blocked >= 6 && Math.random() < 0.3) { this.chooseDir(t, true); t.blocked = 0; }
    } else {
      t.blocked = 0;
      if ((t.x & 7) === 0 && (t.y & 7) === 0 && Math.random() < 1 / 20) this.chooseDir(t, false);
    }
    if (t.mines > 0 && ok && Math.random() < 1 / 180) { this.dropMine(t); t.mines--; }
    if (t.bullets < (t.boost.rapid ? 3 : 1) && t.cool === 0) {
      let chance = ok ? 0.022 : 0.07;
      if (this.targetInSight(t)) chance = 0.15;
      chance *= Config.scale('enemyFire') * (t.boost.rapid ? 3 : 1);
      if (Math.random() < chance) { this.fire(t); t.cool = 16; }
    }
  }

  targetInSight(t) {
    const targets = [{ x: BASE_X, y: BASE_Y }].concat(this.tanks.filter(o => o.isPlayer));
    for (const o of targets) {
      const dx = o.x - t.x, dy = o.y - t.y;
      if (Math.abs(dx) < 8 && ((t.dir === 0 && dy < 0) || (t.dir === 2 && dy > 0))) return true;
      if (Math.abs(dy) < 8 && ((t.dir === 3 && dx < 0) || (t.dir === 1 && dx > 0))) return true;
    }
    return false;
  }

  chooseDir(t, blocked) {
    const r = Math.random();
    const pBase = Math.min(0.8, Math.min(0.5, 0.25 + this.num * 0.008) * Config.scale('enemyAim'));
    let target = null;
    if (r < pBase) target = { x: BASE_X, y: BASE_Y };
    else if (r < pBase + 0.2) {
      const ps = this.tanks.filter(o => o.isPlayer);
      if (ps.length) target = ps[rnd(ps.length)];
    }
    let d;
    if (target) {
      const dx = target.x - t.x, dy = target.y - t.y;
      if (Math.abs(dx) < 4) d = dy > 0 ? 2 : 0;
      else if (Math.abs(dy) < 4) d = dx > 0 ? 1 : 3;
      else d = Math.random() < Math.abs(dx) / (Math.abs(dx) + Math.abs(dy)) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    } else {
      d = rnd(4);
    }
    if (blocked && d === t.dir) d = Math.random() < 0.5 ? (d + 1) % 4 : (d + 3) % 4;
    this.turn(t, d);
  }

  turn(t, d) {
    if (d === t.dir) return;
    if ((d & 1) !== (t.dir & 1)) {
      // turning 90°: snap to the 8px grid like the original
      if (d & 1) t.y = Math.round(t.y / 8) * 8;
      else t.x = Math.round(t.x / 8) * 8;
    }
    t.dir = d;
  }

  move(t, d) {
    t.acc += t.speed * (t.boost.turbo ? TURBO_MULT : 1);
    let ok = true;
    while (t.acc >= 1) {
      t.acc -= 1;
      if (this.canStep(t, d)) {
        t.x += DXY[d][0];
        t.y += DXY[d][1];
        t.animTick++;
      } else {
        ok = false;
        t.acc = 0;
        break;
      }
    }
    t.anim = (t.animTick >> 1) & 1;
    return ok;
  }

  canStep(t, d) {
    const nx = t.x + DXY[d][0], ny = t.y + DXY[d][1];
    if (nx < 0 || ny < 0 || nx > FW - 16 || ny > FH - 16) return false;
    // only the leading edge is tested, so a tank that was snapped into a wall can still back out
    let x0, x1, y0, y1;
    switch (d) {
      case 0: x0 = nx; x1 = nx + 15; y0 = y1 = ny; break;
      case 2: x0 = nx; x1 = nx + 15; y0 = y1 = ny + 15; break;
      case 1: y0 = ny; y1 = ny + 15; x0 = x1 = nx + 15; break;
      default: y0 = ny; y1 = ny + 15; x0 = x1 = nx; break;
    }
    for (let cy = y0 >> 2; cy <= y1 >> 2; cy++) {
      for (let cx = x0 >> 2; cx <= x1 >> 2; cx++) {
        const tt = this.get(cx, cy);
        if (tt === T_STEEL || (tt === T_BRICK && !t.boost.ghost)) return false;
        if (tt === T_WATER && !t.ship && !t.boost.ghost) return false;
      }
    }
    if (overlap(nx, ny, 16, 16, BASE_X, BASE_Y, 16, 16)) return false;
    if (this.bosses.length && this.bossBlocksTank(t, nx, ny)) return false;
    for (const o of this.tanks) {
      if (o === t || !o.alive) continue;
      if (overlap(nx, ny, 16, 16, o.x, o.y, 16, 16) && !overlap(t.x, t.y, 16, 16, o.x, o.y, 16, 16)) return false;
    }
    return true;
  }

  fire(t) {
    if (t.bullets >= (t.boost.rapid ? Math.max(4, t.maxBullets) : t.maxBullets)) return false;
    const shell = (x, y, dir, free) => this.bullets.push({
      x, y, dir, speed: t.bulletSpeed, owner: t, free,
      isPlayer: t.isPlayer, power: t.power, cutter: t.cutter, alive: true,
      pierce: !!t.boost.pierce, rocket: !!t.boost.rocket,
    });
    const pos = [[t.x + 6, t.y], [t.x + 12, t.y + 6], [t.x + 6, t.y + 12], [t.x, t.y + 6]][t.dir];
    shell(pos[0], pos[1], t.dir, false);
    t.bullets++;
    if (t.boost.spread) {
      // side shells don't count against the shell limit
      shell(t.x + 6, t.y + 6, (t.dir + 1) % 4, true);
      shell(t.x + 6, t.y + 6, (t.dir + 3) % 4, true);
    }
    if (t.isPlayer) Sound.play('shot');
    return true;
  }

  // ------------------------------------------------------------ bullets
  updateBullets() {
    const SUB = 4;
    const bs = this.bullets;
    for (let s = 0; s < SUB; s++) {
      for (const b of bs) if (b.alive) this.stepBullet(b, b.speed / SUB);
      for (let i = 0; i < bs.length; i++) {
        const a = bs[i];
        if (!a.alive) continue;
        for (let j = i + 1; j < bs.length; j++) {
          const c = bs[j];
          if (!c.alive || a.isPlayer === c.isPlayer) continue;
          if (overlap(a.x, a.y, 4, 4, c.x, c.y, 4, 4)) {
            // piercing shells plough through ordinary ones
            if (!a.pierce || c.pierce) this.killBullet(a, a.rocket);
            if (!c.pierce || a.pierce) this.killBullet(c, c.rocket);
            if (!a.alive) break;
          }
        }
      }
    }
    this.bullets = bs.filter(b => b.alive);
  }

  killBullet(b, fx, exclude, excludeBoss) {
    if (!b.alive) return;
    b.alive = false;
    if (!b.free) b.owner.bullets = Math.max(0, b.owner.bullets - 1);
    if (fx && b.rocket) this.blast(b.x + 2, b.y + 2, ROCKET_RADIUS, b.isPlayer, b.owner, b.power, exclude, excludeBoss);
    else if (fx) this.addFx(b.x + 2, b.y + 2, Sprites.smallExp, 3);
  }

  stepBullet(b, dist) {
    b.x += DXY[b.dir][0] * dist;
    b.y += DXY[b.dir][1] * dist;
    if (b.x < 0 || b.y < 0 || b.x > FW - 4 || b.y > FH - 4) {
      b.x = Math.max(0, Math.min(FW - 4, b.x));
      b.y = Math.max(0, Math.min(FH - 4, b.y));
      this.killBullet(b, true);
      if (b.isPlayer) Sound.play('steel');
      return;
    }
    if (this.bulletTerrain(b)) return;
    if (this.bosses.length && this.bossShell(b) === 'stop') return;
    if (overlap(b.x, b.y, 4, 4, BASE_X, BASE_Y, 16, 16)) {
      this.killBullet(b, true);
      if (this.baseAlive) this.destroyBase();
      return;
    }
    for (const t of this.tanks) {
      if (!t.alive || t === b.owner) continue;
      if (!overlap(b.x, b.y, 4, 4, t.x, t.y, 16, 16)) continue;
      if (b.pierce) {
        // piercing shells damage each tank once and keep flying
        if (b.isPlayer === t.isPlayer && (!b.isPlayer || Config.get('friendlyFire') === 'OFF')) continue;
        b.hits = b.hits || new Set();
        if (b.hits.has(t)) continue;
        b.hits.add(t);
        if (b.isPlayer && t.isPlayer) { if (t.shield <= 0) t.frozen = 180; }
        else if (b.isPlayer) this.hitEnemy(t, b.owner);
        else this.hitPlayer(t);
        continue;
      }
      if (b.isPlayer) {
        if (t.isPlayer) {
          // friendly fire freezes the other player for a few seconds
          if (Config.get('friendlyFire') === 'OFF') continue;
          this.killBullet(b, false);
          if (t.shield <= 0) t.frozen = 180;
          return;
        }
        this.hitEnemy(t, b.owner);
        this.killBullet(b, true, t);
        return;
      }
      if (!t.isPlayer) continue;
      this.hitPlayer(t);
      this.killBullet(b, true, t);
      return;
    }
  }

  bulletTerrain(b) {
    const x0 = Math.floor(b.x / 4), x1 = Math.floor((b.x + 3.99) / 4);
    const y0 = Math.floor(b.y / 4), y1 = Math.floor((b.y + 3.99) / 4);
    const vert = (b.dir & 1) === 0;
    let hitRow = -1, hitCol = -1;
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const t = this.get(cx, cy);
        if (t === T_BRICK || t === T_STEEL || (t === T_FOREST && b.cutter)) {
          if (vert) { if (hitRow < 0 || (b.dir === 0 ? cy > hitRow : cy < hitRow)) hitRow = cy; }
          else if (hitCol < 0 || (b.dir === 3 ? cx > hitCol : cx < hitCol)) hitCol = cx;
        }
      }
    }
    if (hitRow < 0 && hitCol < 0) return false;

    // piercing shells tunnel through bricks (and trees for cutters), stopping only at steel they can't break
    if (b.pierce) {
      let blocked = false;
      for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (this.get(cx, cy) === T_STEEL && !b.power) blocked = true;
      if (!blocked) {
        const lo = vert ? Math.floor((b.x + 2 - 8) / 4) : Math.floor((b.y + 2 - 8) / 4);
        const hi = vert ? Math.floor((b.x + 2 + 7.99) / 4) : Math.floor((b.y + 2 + 7.99) / 4);
        for (let k = lo; k <= hi; k++) {
          const cx = vert ? k : hitCol, cy = vert ? hitRow : k, t = this.get(cx, cy);
          if (t === T_BRICK) this.set(cx, cy, T_EMPTY);
          else if (t === T_STEEL) this.clearGroup(cx, cy, T_STEEL);
          else if (t === T_FOREST && b.cutter) this.clearGroup(cx, cy, T_FOREST);
        }
        if (b.isPlayer && this.lastBrickSound < this.frame - 3) { Sound.play('brick'); this.lastBrickSound = this.frame; }
        return false;
      }
    }

    // a shell blasts a 16px-wide strip; power shells (star level 3) dig twice as deep and break steel
    const depth = b.power ? 2 : 1;
    const step = (b.dir === 0 || b.dir === 3) ? -1 : 1;
    let broke = false;
    const hitCell = (cx, cy) => {
      const t = this.get(cx, cy);
      if (t === T_BRICK) { this.set(cx, cy, T_EMPTY); broke = true; }
      else if (t === T_STEEL && b.power) { this.clearGroup(cx, cy, T_STEEL); broke = true; }
      else if (t === T_FOREST && b.cutter) { this.clearGroup(cx, cy, T_FOREST); broke = true; }
    };
    if (vert) {
      const mx = b.x + 2, c0 = Math.floor((mx - 8) / 4), c1 = Math.floor((mx + 7.99) / 4);
      for (let k = 0; k < depth; k++) for (let c = c0; c <= c1; c++) hitCell(c, hitRow + k * step);
    } else {
      const my = b.y + 2, r0 = Math.floor((my - 8) / 4), r1 = Math.floor((my + 7.99) / 4);
      for (let k = 0; k < depth; k++) for (let r = r0; r <= r1; r++) hitCell(hitCol + k * step, r);
    }
    this.killBullet(b, true);
    if (b.isPlayer) Sound.play(broke ? 'brick' : 'steel');
    return true;
  }

  // ------------------------------------------------------------ blasts and mines
  // explosion that breaks bricks (steel with power) and damages the other side's tanks
  blast(cx, cy, r, byPlayer, owner, power, exclude, excludeBoss) {
    for (let y = Math.floor((cy - r) / 4); y <= Math.floor((cy + r) / 4); y++) {
      for (let x = Math.floor((cx - r) / 4); x <= Math.floor((cx + r) / 4); x++) {
        if (Math.hypot(x * 4 + 2 - cx, y * 4 + 2 - cy) > r) continue;
        const t = this.get(x, y);
        if (t === T_BRICK) this.set(x, y, T_EMPTY);
        else if (t === T_STEEL && power) this.clearGroup(x, y, T_STEEL);
      }
    }
    const reaches = (x, y, w, h) => Math.hypot(Math.max(x, Math.min(cx, x + w)) - cx, Math.max(y, Math.min(cy, y + h)) - cy) < r - 2;
    for (const t of this.tanks) {
      if (!t.alive || t === exclude || !reaches(t.x, t.y, 16, 16)) continue;
      if (byPlayer && !t.isPlayer) this.hitEnemy(t, owner);
      else if (!byPlayer && t.isPlayer) this.hitPlayer(t);
    }
    if (!byPlayer && this.baseAlive && reaches(BASE_X, BASE_Y, 16, 16)) this.destroyBase();
    if (byPlayer) {
      for (const bo of this.bosses.slice()) {
        if (bo !== excludeBoss && this.bossTangible(bo) && reaches(bo.x, bo.y, bo.w, bo.h)) this.bossHit(bo, 2, owner, cx);
      }
    }
    this.addFx(cx, cy, Sprites.bigExp, 5);
    Sound.play('explode');
  }

  dropMine(t) {
    if (this.mines.length >= MAX_MINES) return;
    this.mines.push({ x: t.x + 8, y: t.y + 8, byPlayer: t.isPlayer, owner: t, t: 0 });
    Sound.play('build');
  }

  updateMines() {
    for (const m of this.mines) {
      m.t++;
      if (m.t < MINE_ARM_TIME) continue;
      const victim = this.tanks.find(t => t.alive && t.isPlayer !== m.byPlayer && overlap(t.x, t.y, 16, 16, m.x - 4, m.y - 4, 8, 8));
      if (victim) {
        m.done = true;
        this.blast(m.x, m.y, MINE_RADIUS, m.byPlayer, m.owner, false);
      }
    }
    this.mines = this.mines.filter(m => !m.done);
  }

  // ------------------------------------------------------------ damage
  hitEnemy(t, by) {
    if (t.bonus) { t.bonus = false; this.spawnPowerup(); }
    if (t.shield > 0) { Sound.play('steel'); return; }
    t.hp--;
    if (t.hp > 0) { Sound.play('armor'); return; }
    this.killEnemy(t, by, true);
  }

  killEnemy(t, by, award, silent) {
    if (!t.alive) return;
    t.alive = false;
    this.killed++;
    this.addFx(t.x + 8, t.y + 8, BIG_EXPLOSION(), 5);
    if (!silent) Sound.play('explode');
    if (award && by && by.isPlayer) {
      const p = by.player, pts = ENEMY[t.type].pts;
      p.kills[t.type]++;
      this.addScore(p, pts);
      this.popups.push({ x: t.x + 8, y: t.y + 8, text: String(pts), t: 0, delay: 25 });
    }
  }

  hitPlayer(t) {
    if (!t.alive || t.shield > 0) return;
    const p = t.player;
    if (t.ship) {
      // the boat soaks one hit
      t.ship = false;
      p.ship = false;
      t.shield = 60;
      Sound.play('armor');
      Input.rumble(p.i, 0.4, 120);
      return;
    }
    t.alive = false;
    this.addFx(t.x + 8, t.y + 8, BIG_EXPLOSION(), 5);
    Sound.play('playerDie');
    Input.rumble(p.i, 1, 400);
    if (!Config.on('keepStars')) {
      p.level = Config.get('startStars');
      p.cutter = false;
    }
    p.tank = null;
    if (Config.infiniteLives()) {
      this.spawnPlayer(p, 30);
    } else if (p.lives > 0) {
      p.lives--;
      this.spawnPlayer(p, 30);
    } else {
      p.out = true;
      if (this.players.every(q => q.out)) this.startOver();
    }
  }

  destroyBase() {
    this.baseAlive = false;
    this.addFx(BASE_X + 8, BASE_Y + 8, BIG_EXPLOSION(), 6);
    Sound.play('baseDie');
    this.startOver();
  }

  startOver() {
    if (!this.over) { this.over = true; this.overTimer = 0; }
  }

  addScore(p, n) {
    p.score += n;
    if (checkExtraLife(p)) Sound.play('life');
  }

  addFx(x, y, frames, per) {
    this.fx.push({ x, y, frames, per, tick: 0 });
  }

  // ------------------------------------------------------------ power-ups
  spawnPowerup() {
    // only power-ups enabled in the settings can appear
    const weights = POWERUPS.map((pu, i) => (Config.get('pu' + i) === 'OFF' ? 0 : pu.weight));
    const total = weights.reduce((a, b) => a + b, 0);
    if (total === 0) return;
    let r = rnd(total), type = 0;
    while (r >= weights[type]) { r -= weights[type]; type++; }
    let x = 0, y = 0;
    for (let tries = 0; tries < 60; tries++) {
      x = rnd((FW - 16) / 8 + 1) * 8; y = rnd((FH - 16) / 8 + 1) * 8;
      if (overlap(x, y, 16, 16, BASE_X - 16, BASE_Y - 16, 48, 32)) continue;
      let bad = 0;
      for (let cy = y >> 2; cy < (y + 16) >> 2; cy++) for (let cx = x >> 2; cx < (x + 16) >> 2; cx++) {
        const t = this.get(cx, cy);
        if (t === T_STEEL || t === T_WATER) bad++;
      }
      if (bad <= 4) break;
    }
    this.powerup = { type, x, y, t: 0 };
    Sound.play('puAppear');
  }

  checkPickups() {
    const pu = this.powerup;
    if (!pu) return;
    const order = this.tanks.filter(t => t.isPlayer).concat(this.tanks.filter(t => !t.isPlayer));
    for (const t of order) {
      if (t.alive && Config.canCollect(pu.type, t.isPlayer) && overlap(t.x, t.y, 16, 16, pu.x + 2, pu.y + 2, 12, 12)) {
        this.powerup = null;
        this.applyPowerup(t, pu);
        return;
      }
    }
  }

  applyPowerup(t, pu) {
    const enemies = this.tanks.filter(e => !e.isPlayer && e.alive);
    if (t.isPlayer) {
      const p = t.player;
      let snd = 'pickup';
      this.addScore(p, 500);
      if (POWERUPS[pu.type].isNew) this.popups.push({ x: pu.x + 8, y: pu.y + 8, text: POWERUPS[pu.type].name, label: true, color: COL.white, t: 0, delay: 0 });
      else this.popups.push({ x: pu.x + 8, y: pu.y + 8, text: '500', t: 0, delay: 0 });
      if (TIMED_BOOSTS[pu.type]) t.boost[TIMED_BOOSTS[pu.type]] = Config.frames('newTime');
      switch (pu.type) {
        case PU.HELMET: t.shield = Config.frames('helmetTime'); break;
        case PU.CLOCK: this.freezeE = Config.frames('clockTime'); snd = 'freeze'; break;
        case PU.SHOVEL: this.shovel = Config.frames('shovelTime'); this.setBaseWalls(T_STEEL); break;
        case PU.STAR:
          if (p.level < 3) p.level++; else p.cutter = true;
          t.applyLevel();
          break;
        case PU.GRENADE:
          enemies.forEach(e => this.killEnemy(e, null, false, true));
          // bosses take a heavy hit instead (decoys pop)
          for (const bo of this.bosses.slice()) {
            if (!this.bossTangible(bo)) continue;
            const live = bo.turrets ? bo.turrets.findIndex(tu => tu.hp > 0) : -1;
            this.bossHit(bo, 5, t, bo.x + (live >= 0 ? live * 16 + 8 : 24));
          }
          if (enemies.length) Sound.play('explode');
          break;
        case PU.TANK: p.lives++; snd = 'life'; break;
        case PU.GUN: p.level = 3; p.cutter = true; t.applyLevel(); break;
        case PU.SHIP: p.ship = true; t.ship = true; break;
        case PU.MINES: p.mines = (p.mines || 0) + Config.get('mineCount'); break;
        case PU.COIN: this.addScore(p, 1000); snd = 'bonus'; break;
      }
      Sound.play(snd);
    } else {
      // Tank 1990 rule: enemies can grab bonuses too
      Sound.play('enemyPickup');
      switch (pu.type) {
        case PU.HELMET: enemies.forEach(e => { e.shield = Config.frames('helmetTime'); }); break;
        case PU.CLOCK: this.freezeP = Config.frames('clockTime'); break;
        case PU.SHOVEL: this.shovel = 0; this.setBaseWalls(T_EMPTY); break;
        case PU.STAR: enemies.forEach(e => { e.hp = Math.min(Math.max(4, Config.enemy(e.type).hp), e.hp + 1); e.bulletSpeed = 4.5; }); break;
        case PU.GRENADE: this.tanks.filter(o => o.isPlayer).forEach(o => this.hitPlayer(o)); break;
        case PU.TANK: t.hp = Math.max(t.hp, 4); break;
        case PU.GUN: t.power = true; t.bulletSpeed = 4.5; break;
        case PU.SHIP: t.ship = true; break;
        case PU.MINES: t.mines += Config.get('mineCount'); break;
        case PU.COIN: // the enemy steals points
          for (const q of this.players) q.score = Math.max(0, q.score - 1000);
          this.popups.push({ x: pu.x + 8, y: pu.y + 8, text: '-1000', label: true, color: COL.red, t: 0, delay: 0 });
          break;
      }
      if (TIMED_BOOSTS[pu.type]) t.boost[TIMED_BOOSTS[pu.type]] = Config.frames('newTime');
    }
  }

  // ------------------------------------------------------------ rendering
  buildLayers() {
    if (!this.bgLayer) {
      this.bgLayer = makeCanvas(FW, FH);
      this.forestLayer = makeCanvas(FW, FH);
    }
    const bg = this.bgLayer.getContext('2d'), fo = this.forestLayer.getContext('2d'), tex = Sprites.tex;
    bg.clearRect(0, 0, FW, FH);
    fo.clearRect(0, 0, FW, FH);
    this.waterCells = [];
    for (let cy = 0; cy < GH; cy++) {
      for (let cx = 0; cx < GW; cx++) {
        const t = this.terrain[cy * GW + cx];
        if (!t) continue;
        const sx = (cx & 1) * 4, sy = (cy & 1) * 4, dx = cx * 4, dy = cy * 4;
        if (t === T_BRICK) bg.drawImage(tex.brick, sx, sy, 4, 4, dx, dy, 4, 4);
        else if (t === T_STEEL) bg.drawImage(tex.steel, sx, sy, 4, 4, dx, dy, 4, 4);
        else if (t === T_ICE) bg.drawImage(tex.ice, sx, sy, 4, 4, dx, dy, 4, 4);
        else if (t === T_FOREST) fo.drawImage(tex.forest, sx, sy, 4, 4, dx, dy, 4, 4);
        else if (t === T_WATER) this.waterCells.push(cy * GW + cx);
      }
    }
    this.dirty = false;
  }

  drawTank(ctx, t) {
    if (t.isPlayer && t.frozen > 0 && ((this.frame >> 2) & 1)) return;
    if (t.ship) ctx.drawImage(Sprites.hull[t.dir], t.x, t.y);
    let spec, pal;
    if (t.isPlayer) {
      spec = 'p' + t.player.level;
      pal = Config.playerPal(t.player.i);
    } else {
      spec = 'e' + t.type;
      if (t.bonus && ((this.frame >> 3) & 1)) pal = 'red';
      // armor tanks start green and fade to silver as they take hits
      else if (t.hp >= 4) pal = 'green';
      else if (t.hp === 3) pal = 'gold';
      else if (t.hp === 2) pal = (this.frame >> 2) & 1 ? 'gold' : 'silver';
      else pal = 'silver';
    }
    if (t.boost.ghost) ctx.globalAlpha = (this.frame >> 2) & 1 ? 0.35 : 0.6;
    ctx.drawImage(Sprites.tank(spec, t.anim, t.dir, pal), t.x, t.y);
    ctx.globalAlpha = 1;
    if (t.shield > 0) ctx.drawImage(Sprites.shield[(this.frame >> 1) & 1], t.x, t.y);
  }

  render(ctx) {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.fillStyle = COL.black;
    ctx.fillRect(FX, FY, FW, FH);
    if (this.dirty) this.buildLayers();

    ctx.save();
    ctx.translate(FX, FY);
    ctx.beginPath();
    ctx.rect(0, 0, FW, FH);
    ctx.clip();

    ctx.drawImage(this.bgLayer, 0, 0);
    const wt = Sprites.tex[(this.frame >> 5) & 1 ? 'water1' : 'water0'];
    for (const i of this.waterCells) {
      const cx = i % GW, cy = (i / GW) | 0;
      ctx.drawImage(wt, (cx & 1) * 4, (cy & 1) * 4, 4, 4, cx * 4, cy * 4, 4, 4);
    }
    ctx.drawImage(this.baseAlive ? Sprites.eagle : Sprites.eagleDead, BASE_X, BASE_Y);

    for (const m of this.mines) ctx.drawImage(Sprites.mine[m.t < MINE_ARM_TIME || ((this.frame >> 3) & 1) ? 1 : 0], m.x - 4, m.y - 4);
    this.renderBossUnder(ctx);
    for (const t of this.tanks) this.drawTank(ctx, t);
    this.renderBosses(ctx);
    for (const s of this.spawns) {
      if (s.t > SPARKLE_TIME) continue;
      const k = Math.floor((SPARKLE_TIME - s.t) / 4) % 6;
      ctx.drawImage(Sprites.sparkle[[0, 1, 2, 3, 2, 1][k]], s.x, s.y);
    }
    for (const b of this.bullets) {
      const spr = b.rocket ? Sprites.bulletRocket : b.pierce ? Sprites.bulletPierce : Sprites.bullet;
      ctx.drawImage(spr[b.dir], Math.round(b.x), Math.round(b.y));
    }

    this.renderBeams(ctx);
    ctx.drawImage(this.forestLayer, 0, 0);

    if (this.powerup && ((this.powerup.t >> 3) & 1) === 0) {
      ctx.drawImage(Sprites.powerups[this.powerup.type], this.powerup.x, this.powerup.y);
    }
    for (const f of this.fx) {
      if (f.tick < 0) continue;
      const fr = f.frames[Math.min(f.frames.length - 1, Math.floor(f.tick / f.per))];
      ctx.drawImage(fr, Math.round(f.x - fr.width / 2), Math.round(f.y - fr.height / 2));
    }
    for (const p of this.popups) {
      if (p.t < p.delay) continue;
      if (p.label) {
        const half = p.text.length * 4;
        Font.drawCenter(ctx, p.text, Math.max(half, Math.min(FW - half, p.x)), Math.max(0, Math.round(p.y - 4 - p.t / 6)), p.color);
        continue;
      }
      const c = Sprites.mini(p.text);
      ctx.drawImage(c, Math.round(p.x - c.width / 2), Math.round(p.y - 3));
    }
    if (this.over) {
      const y = Math.max(FH / 2 - 8, FH - this.overTimer * 1.3);
      Font.draw(ctx, 'GAME', FW / 2 - 15, y, COL.red);
      Font.draw(ctx, 'OVER', FW / 2 - 15, y + 9, COL.red);
    }
    this.renderBossBanner(ctx);
    ctx.restore();
    this.renderHud(ctx);
  }

  renderHud(ctx) {
    const H = HUD_X, n = this.bossIdx === undefined ? Math.min(20, this.queue.length) : 0;
    if (this.bossIdx !== undefined) this.renderBossHud(ctx, H);
    for (let i = 0; i < n; i++) ctx.drawImage(Sprites.enemyIcon, H + (i % 2) * 8, 24 + (i >> 1) * 8);
    // more than 20 waiting: show how many in total
    if (n && this.queue.length > 20) Font.drawCenter(ctx, String(this.queue.length), H + 8, 106, COL.black);
    const lives = p => (Config.infiniteLives() ? '~' : String(Math.min(99, p.lives)));
    if (this.players.length > 2) {
      // 3-4 players: one compact row each, the tank icon in the player's colour
      this.players.forEach((p, i) => {
        const y = 128 + i * 14;
        ctx.drawImage(Sprites.playerIcon(Config.playerPal(i)), H, y);
        Font.draw(ctx, lives(p), H + 8, y, COL.black);
        if (p.mines) { ctx.fillStyle = '#505050'; for (let k = 0; k < Math.min(3, p.mines); k++) ctx.fillRect(H + 1 + k * 3, y + 9, 2, 2); }
      });
      ctx.drawImage(Sprites.flag, H, 184);
      Font.drawRight(ctx, String(this.num), H + 16, 200, COL.black);
      return;
    }

    rect(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) P.px(x, y, c); },

const BossGfx = {

  get(kind, frame, dir, variant = 'n') {

// ------------------------------------------------------------------ stage integration
Object.assign(Stage.prototype, {
  initBoss(info) {
    const def = BOSSES[info.idx];
    const mult = Config.scale('bossHp') * (1 + 0.5 * this.extraPlayers) * (1 + 0.5 * info.loop);
    const hp = n => Math.max(1, Math.round(n * mult));
    this.bossIdx = info.idx;
    this.bossLoop = info.loop;
    this.bossDropAt = [0.75, 0.5, 0.25];
    this.bossBanner = 180;
    const b = new Boss({ kind: def.kind, w: def.w, h: def.h, x: Math.round((FW - def.w) / 16) * 8, y: 0, speedMul: 1 + 0.15 * info.loop });
    if (def.kind === 'hydra') {
      b.y = 16;
      b.turrets = [0, 1, 2].map(() => ({ hp: hp(def.turretHp), max: hp(def.turretHp), cd: 90, burst: 0 }));
      b.core = hp(def.coreHp);

      b.home = b.x;
      b.drift = 1;

    if (def.kind === 'phantom') { b.tele = 0; }
    this.bosses = [b];
    // escorts replace the normal line-up: 40% of "tanks per stage" (8 by default)
    const n = Math.max(4, Math.round(Config.get('enemyCount') * 0.4));
    this.queue = [];
    for (let i = 0; i < n; i++) this.queue.push({ type: def.escorts[i % def.escorts.length], bonus: false });
    this.total = n;
    this.maxEnemies = Math.min(this.maxEnemies, 3 + Math.min(2, this.extraPlayers));
  },

  mainBoss() { return this.bosses.find(b => b.main); },
  bossAlive() { return this.bosses.some(b => b.main && b.alive); },

  bossTangible(b) {
    if (!b.alive) return false;
    if (b.kind === 'mole') return b.mode === 'up' || b.mode === 'burrow';
    return true;
  },

  // used by the spawner: keep entry points free of bosses (and the column above them)
  bossBlocksSpawn(x) {
    return this.bosses.some(b => b.alive && this.bossTangible(b) && overlap(x, 0, 16, 16, b.x, 0, b.w, b.y + b.h));
  },

  bossBlocksTank(t, nx, ny) {
    for (const b of this.bosses) {
      if (!this.bossTangible(b)) continue;
      if (overlap(nx, ny, 16, 16, b.x, b.y, b.w, b.h) && !overlap(t.x, t.y, 16, 16, b.x, b.y, b.w, b.h)) return true;
    }
    return false;
  },

  // a shell reaches a boss; returns 'stop', 'pass' or null (no boss there)
  bossShell(b) {
    for (const bo of this.bosses) {
      if (bo === b.owner || !this.bossTangible(bo)) continue;
      if (!overlap(b.x, b.y, 4, 4, bo.x, bo.y, bo.w, bo.h)) continue;
      if (!b.isPlayer) continue; // enemy shells fly through bosses
      if (b.pierce) {
        b.hits = b.hits || new Set();
        if (b.hits.has(bo)) continue;
        b.hits.add(bo);
        this.bossHit(bo, 1, b.owner, b.x + 2);
        return 'pass';
      }
      this.bossHit(bo, 1, b.owner, b.x + 2);
      this.killBullet(b, true, null, bo);
      return 'stop';
    }
    return null;
  },

  bossHit(bo, dmg, by, hx) {
    if (!this.bossTangible(bo)) return;
    if (bo.kind === 'decoy') {
      bo.alive = false;
      this.addFx(bo.x + 16, bo.y + 16, Sprites.smallExp, 4);
      Sound.play('steel');
      return;
    }
    if (bo.kind === 'hydra') {
      const zone = Math.max(0, Math.min(2, Math.floor(((hx === undefined ? bo.x + 24 : hx) - bo.x) / 16)));
      // the centre column is the laser turret (index 1); left gatling (0), right rocket (2)
      const tur = bo.turrets[zone];
      if (tur.hp > 0) {
        tur.hp = Math.max(0, tur.hp - dmg);
        if (tur.hp === 0) {
          this.addFx(bo.x + zone * 16 + 8, bo.y + 8, BIG_EXPLOSION(), 5);
          Sound.play('explode');
        }
      } else if (bo.turrets.every(t => t.hp === 0)) {
        bo.core = Math.max(0, bo.core - dmg);
      } else {
        // armour between live turrets: no damage
        Sound.play('steel');
        return;
      }
      bo.hp = bo.turrets.reduce((a, t) => a + t.hp, 0) + bo.core;
    } else {
      bo.hp -= dmg * (bo.mode === 'dazed' ? 2 : 1);
    }
    bo.flash = 6;
    if (by && by.isPlayer) this.lastBossHitter = by.player;
    Sound.play('armor');
    const frac = Math.max(0, bo.hp) / bo.maxHp;
    while (this.bossDropAt.length && frac <= this.bossDropAt[0]) { this.bossDropAt.shift(); this.spawnPowerup(); }
    if (!bo.enraged && frac <= 0.5) { bo.enraged = true; Sound.play('bossWarn'); }
    if (bo.hp <= 0) this.killBoss(bo);
  },

  killBoss(bo) {
    bo.alive = false;
    this.bossDefeated = true;
    // a chain of explosions over the hull
    for (let i = 0; i < 8; i++) {
      this.fx.push({ x: bo.x + 4 + Math.random() * (bo.w - 8), y: bo.y + 4 + Math.random() * (bo.h - 8), frames: BIG_EXPLOSION(), per: 5, tick: -i * 8 });
    }
    Sound.play('bossDie');
    const def = BOSSES[this.bossIdx];
    const p = this.lastBossHitter || this.players.find(q => !q.out) || this.players[0];
    const pts = def.pts * (1 + this.bossLoop);
    this.addScore(p, pts);
    this.popups.push({ x: bo.x + bo.w / 2, y: bo.y + bo.h / 2, text: String(pts), t: 0, delay: 50 });

    for (const t of this.tanks) if (!t.isPlayer && t.alive) this.killEnemy(t, null, false, true);
    for (const o of this.bosses) o.alive = false;
    this.queue = [];
    this.spawns = this.spawns.filter(s => !s.enemy);
    this.beams = [];
    this.mines = this.mines.filter(m => m.byPlayer);
  },

  // ------------------------------------------------------------ boss helpers
  bossCenter(b) { return [b.x + b.w / 2, b.y + b.h / 2]; },

  bossTarget(b) {
    const [cx, cy] = this.bossCenter(b);
    let best = null, bd = 1e9;
    for (const t of this.tanks) {
      if (!t.isPlayer || !t.alive) continue;
      const d = Math.hypot(t.x + 8 - cx, t.y + 8 - cy);
      if (d < bd) { bd = d; best = [t.x + 8, t.y + 8]; }
    }
    return best || [BASE_X + 8, BASE_Y + 8];
  },

  dirToward(fx, fy, tx, ty) {
    const dx = tx - fx, dy = ty - fy;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  },

  bossFire(b, cx, cy, dir, opts = {}) {
    this.bullets.push(Object.assign({
      x: cx - 2, y: cy - 2, dir, speed: 2.5, owner: b, free: true, isPlayer: false,
      power: false, cutter: false, alive: true, pierce: false, rocket: false,
    }, opts));
  },

  // the point just outside the boss on side `dir`, offset along that side
  bossMuzzle(b, dir, off = 0) {
    const [cx, cy] = this.bossCenter(b);
    const [dx, dy] = DXY[dir];
    return [cx + dx * (b.w / 2 + 2) + (dy ? off : 0), cy + dy * (b.h / 2 + 2) + (dx ? off : 0)];
  },

  // one pixel step; crush: break bricks and run over tanks
  bossStep(b, d, crush) {
    const nx = b.x + DXY[d][0], ny = b.y + DXY[d][1];
    if (nx < 0 || ny < 0 || nx + b.w > FW || ny + b.h > FH) return 'edge';
    if (overlap(nx, ny, b.w, b.h, BASE_X, BASE_Y, 16, 16)) return 'eagle';
    let x0, x1, y0, y1;
    switch (d) {
      case 0: x0 = nx; x1 = nx + b.w - 1; y0 = y1 = ny; break;
      case 2: x0 = nx; x1 = nx + b.w - 1; y0 = y1 = ny + b.h - 1; break;
      case 1: y0 = ny; y1 = ny + b.h - 1; x0 = x1 = nx + b.w - 1; break;
      default: y0 = ny; y1 = ny + b.h - 1; x0 = x1 = nx; break;
    }
